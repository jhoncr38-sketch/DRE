    background:transparent; border:0; border-radius:var(--r-2); color:var(--lat-mut); font:500 12.5px/1 var(--sans); cursor:pointer}
  .lat-voltar:hover{background:var(--lat-2); color:var(--lat-ink)}
  .gemp{display:grid; grid-template-columns:minmax(0,2.2fr) minmax(0,1.15fr) minmax(0,1fr) minmax(0,.65fr) minmax(0,1.25fr) minmax(0,1.35fr) 12px;
    gap:12px; align-items:center; width:100%; padding:12px 8px; margin:0 -8px; border-top:1px solid var(--line);
    background:transparent; border-left:0; border-right:0; border-bottom:0; font:inherit; text-align:left; color:var(--ink); cursor:pointer; min-width:940px}
  .gemp.gh{padding:0 8px 8px; border-top:0; border-bottom:1px solid #CFC9BF; cursor:default; font-size:10.5px;
    font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .gemp:not(.gh):hover{background:var(--hover-linha)}
  .gemp.ganha{background:#F7FBF8}
  .gemp.tot{cursor:default; font-weight:600; background:var(--surface-2)}
  .gemp.tot > span:nth-child(n+2){font-size:13px}
  .ge-nome{display:flex; align-items:center; gap:11px; min-width:0}
  .ge-ini{display:flex; align-items:center; justify-content:center; width:32px; height:32px; flex:0 0 32px;
    border-radius:8px; background:#DDEAEB; color:#3F6E73; font-size:11.5px; font-weight:600}
  .ge-ini.ok{background:#E8F3ED; color:var(--ok)}
  .ge-txt{min-width:0; display:flex; flex-direction:column; gap:2px}
  .ge-txt b{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ge-txt small, .ge-res small, .ge-reg small, .ge-sit small{display:block; font-size:12px; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ge-rec, .ge-res, .ge-ef{text-align:right; font-weight:600}
  .ge-rec{display:flex; flex-direction:column; align-items:flex-end; gap:5px}
  .ge-res, .ge-ef{font-weight:500}
  .ge-spark{display:flex; align-items:flex-end; gap:2px; height:18px}
  .ge-b{width:4px; border-radius:1px; background:#E4E0D9; height:6px}
  .ge-b.atual{background:#3F6E73}
  .ge-b.atual.ok{background:var(--ok)}
  .ge-b.vazia{height:18px; border:1px dashed var(--line-3); background:transparent; border-radius:2px}
  .ge-tag{display:inline-block; padding:3px 8px; border-radius:5px; background:#E3EEEF; color:#3F6E73; font-size:11.5px; font-weight:600}
  .ge-tag.hib{background:var(--ok); color:#fff}
  .ge-calc{font-size:12.5px; color:var(--muted-2)}
  .ge-sit{display:flex; align-items:flex-start; gap:8px; min-width:0}
  .ge-pt{width:7px; height:7px; border-radius:50%; flex:0 0 7px; margin-top:5px; background:var(--ink-2)}
  .ge-pt.pend{background:var(--disabled)}
  .ge-seta{color:var(--muted-2)}
  .gemp-eco{color:var(--ok)}
  .carteira-chip[aria-pressed="false"]{background:transparent; border-color:var(--line-2); color:var(--muted)}
  .cart-mes{display:flex; align-items:center; gap:7px; padding:6px 10px; border:1px solid var(--line-2); border-radius:var(--r)}
  .cart-mes .cap{color:var(--muted)}
  .cart-mes .lat-seta{color:var(--muted)}
  .cart-mes .lat-seta:hover:not(:disabled){background:var(--surface-2); color:var(--ink)}
  .ge-reg small{white-space:normal; line-height:1.3}
  /* v3: faixa de totais do ano, antes da tabela */
  .ano-faixa{display:flex; gap:12px; flex-wrap:wrap; margin:0 0 18px}
  .ano-faixa > div{flex:1 1 150px; background:var(--surface-2); border-radius:var(--r); padding:12px 14px}
  .ano-faixa .af-v{display:block; margin-top:4px; font-size:17px; font-weight:600; letter-spacing:-.01em}
  .ano-faixa .af-falta{background:#FBF2DE; color:#96701A}
  .ano-faixa .af-falta .cap{color:inherit}
  /* mês sem competência salva: linha clicável que leva para o Lançamento */
  .gano.vazio{background:transparent; border:0; border-top:1px solid var(--line); font:inherit; text-align:left;
    color:var(--muted-2); cursor:pointer; width:100%; padding:7px 0}
  .gano.vazio > span:not(:first-child){text-align:left}
  .gano.vazio:hover{background:var(--hover-linha); color:var(--ink-2)}
  .gano-lanc{color:#96701A; font-size:12.5px}
  /* v3: o resumo do cadastro — número grande, frase, barra de 100% e a lista com o peso de cada categoria */
  .rc{margin:4px 0 20px; flex:1 1 100%; width:100%}
  .rc-topo{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
  .rc-num{font-size:34px; font-weight:600; letter-spacing:-.02em; line-height:1}
  .rc-frase{font-size:14px; color:var(--ink-2); max-width:46ch; text-wrap:pretty}
  .rc-explica{margin:6px 0 0; font-size:12.5px; color:var(--muted); max-width:62ch; text-wrap:pretty}
  .rc-barra{display:flex; gap:2px; height:10px; margin:14px 0 12px}
  .rc-barra > span{border-radius:3px; min-width:4px}    /* ponta quase reta: a pílula arredondava demais */
  .rc-lista{display:flex; flex-direction:column}
  .rc-linha{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px}
  .rc-linha:last-child{border-bottom:0}
  .rc-ponto{width:8px; height:8px; border-radius:2px; flex:0 0 8px}
  .rc-nome{flex:1; min-width:0; color:var(--ink-2); display:flex; flex-direction:column; gap:2px}
  .rc-nome small{font-size:11.5px; color:var(--muted-2)}
  .rc-n{color:var(--muted-2)}
  .rc-v{font-weight:600; min-width:96px; text-align:right}
  .rc-p{color:var(--muted-2); min-width:52px; text-align:right}
  .rc-rot{display:block; margin-bottom:8px}
  /* tabela nota a nota */
  .gnf{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,1fr) 84px minmax(0,1fr); gap:14px;
    align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px; min-width:700px}
  .gnf.gh{padding:0 0 8px; border-bottom:1px solid #CFC9BF; font-size:10.5px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .gnf > span:nth-child(n+3){text-align:right}
  .gnf.gh > span:nth-child(2){text-align:left}   /* a regra geral de .gh joga tudo à direita; o fornecedor é texto */
  .gnf.gh > span:nth-child(n+3){text-align:right}
  .gnf-forn{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .gnf-sem{color:var(--muted-2); font-size:12px}
  .gnf-sem.pend{color:#96701A}                       /* sem regime cadastrado: é pendência, não informação */
  .gnf-pe{padding:12px 0 0; font-size:12.5px; color:var(--muted)}
  .cad-ctl{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
  .cad-alt{display:flex; gap:6px; background:var(--alt); padding:4px; border-radius:var(--r)}
  .cad-aba{display:flex; align-items:center; gap:6px; padding:6px 12px; font:500 12px/1 var(--sans); border:0; border-radius:var(--r-2); background:transparent; color:var(--muted); cursor:pointer}
  .cad-aba[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line-2)}
  .cad-aba .m{opacity:.6}
  .cad-grafico{display:flex; align-items:flex-start; gap:24px 32px; flex-wrap:wrap; margin-bottom:22px}
  .cg-linhas{flex:1 1 280px; max-width:520px; min-width:0}
  .cg-pizza{display:flex; align-items:center; gap:16px; flex:0 1 auto}
  /* pizza cheia (o anel foi testado e recusado). O filete segura as fatias claras da rampa, que sozinhas
     somem no cartão branco; a legenda ao lado carrega o nome e o percentual de cada faixa */
  .cg-disco{width:108px; height:108px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px var(--line)}
  /* uma categoria só: no lugar do gráfico, a proporção como chapéu, a faixa em destaque e a leitura embaixo */
  .cg-solo{display:flex; flex-direction:column; gap:5px; padding-left:20px; border-left:1px solid var(--line);
    align-self:stretch; justify-content:center; min-width:0}
  .cg-solo-c{color:var(--muted-2)}
  .cg-solo-s{font-size:13px; color:var(--ink-3)}
  .cg-linha{display:flex; flex-direction:column; gap:4px; margin-bottom:10px}
  .cg-linha .bar-h > span:first-child{color:var(--ink-3)}
  .cg-linha .bar-h > span:last-child{font-family:var(--mono)}
  .cg-trilho{display:flex; height:8px; background:var(--canvas); border-radius:2px; overflow:hidden}
  .cg-trilho > span{display:block; height:100%}
  .cg-sim, .cg-q.cg-sim{background:var(--cad-sim)}
  .cg-parcial, .cg-q.cg-parcial{background:var(--cad-parcial)}
  .cg-nao, .cg-q.cg-nao{background:var(--cad-nao)}
  .cg-legenda{display:flex; flex-direction:column; gap:8px; min-width:150px; font-size:11px; color:var(--muted-2)}
  .cg-item{display:flex; align-items:center; gap:7px; width:100%}
  .cg-pct{margin-left:auto; padding-left:12px; font-family:var(--mono); color:var(--ink-3)}
  .cg-q{width:9px; height:9px; flex:none; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ink) 12%, transparent)}
  .cg-q.cg-def{box-shadow:inset 0 0 0 1px var(--line-3)}
  .cad-alerta{display:flex; align-items:baseline; gap:4px 10px; flex-wrap:wrap; padding:10px 14px; margin-bottom:14px; background:var(--brand-wash); border-left:3px solid var(--brand)}
  .cad-alerta strong{font-size:13px; font-weight:600; color:var(--brand)}
  .cad-alerta span{font-size:12px; color:var(--muted)}
  .cad-vazio{padding:var(--e6) var(--e5) var(--e5); text-align:center; border-top:1px solid var(--line)}
  .cad-vazio-t{font-size:15px; font-weight:500; color:var(--ink-2); margin-bottom:6px}
  .cad-vazio p{margin:0 auto 16px; font-size:12px; color:var(--muted); max-width:46ch; line-height:1.55}
  .cad-vazio .btn.prim{padding:8px 16px; font-size:13px}
  .cad-pe{display:flex; align-items:baseline; justify-content:space-between; gap:8px 20px; flex-wrap:wrap; padding-top:12px}
  .cad-pe span{font-size:11px; color:var(--muted-2); line-height:1.5; max-width:62ch}
  .cad-mais{padding:0; border:0; background:transparent; font:500 13px/1 var(--sans); color:var(--brand); cursor:pointer}
  .cad-mais:hover{text-decoration:underline}
  /* tabela: os campos parecem texto e só mostram o traço ao passar o mouse ou editar */
  .cad-row{display:grid; grid-template-columns:200px minmax(0,1fr) 170px 130px 28px; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px}
  .cad-row:not(.gh):hover{background:var(--hover-linha)}
  /* produtos e serviços: as duas alíquotas saem calculadas, por isso são texto e não campo */
  .gprod{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.15fr) 20px;
    gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px}
  /* sem isto o tamanho natural do <input> segura a coluna e sobram dois pixels de rolagem */
  .gprod > *, .gprod .in, .gprod .sel-wrap, .gprod .sel{min-width:0; max-width:100%}
  .gprod:not(.gh):hover{background:var(--hover-linha)}
  .gprod.gh{padding:0 0 7px; border-bottom-color:var(--ink)}
  .gprod.gh > span{text-align:left}

  .gprod > .mut{color:var(--muted-2)}
  /* com notas importadas, o movimento do mês fica embaixo do nome: nenhuma coluna sai da tela */
  .pr-nome{display:flex; flex-direction:column; gap:7px; min-width:0}
  .pr-sub{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .sel-wrap.mini .sel{font-size:11.5px; padding:2px 16px 2px 0; color:var(--muted)}
  .pr-cbs{display:flex; flex-direction:column; gap:3px; min-width:0}
  .pr-aliq{font-size:11.5px; color:var(--muted)}
  .pr-mes{display:flex; align-items:center; gap:8px}
  .pr-v{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  .pr-mes .nf-barra{height:4px; flex:1; min-width:36px; max-width:80px}
  .pr-p{font-family:var(--mono); font-size:11.5px; color:var(--muted-2)}
  .cad-row.gh{padding:0 0 7px; border-bottom-color:var(--ink); font-size:10px}
  .cad-row.gh > span{text-align:left}
  .cad-row .in{text-align:left}
  .cad-cnpj{display:flex; align-items:center; gap:7px; min-width:0}
  .cad-cnpj .ponto{width:5px; height:5px; border-radius:50%; background:var(--line-2); flex:none}
  .cad-row .in:placeholder-shown::placeholder, .gprod .in:placeholder-shown::placeholder{color:#B09256}
  .sel.sel-vazio{color:#96701A}
  .cad-cnpj.inv .ponto{background:var(--brand)}
  .cad-cnpj.inv .in{color:var(--brand)}
  .sel-wrap{position:relative; display:flex; align-items:center; min-width:0}
  .sel{appearance:none; -webkit-appearance:none; width:100%; min-width:0; font:inherit; font-size:13px; color:var(--ink); background:transparent; border:0; border-bottom:1px solid transparent; border-radius:0; padding:2px 16px 2px 0; outline:none; cursor:pointer; text-overflow:ellipsis}
  .sel:hover{border-bottom-color:var(--line-3)}
  .sel:focus{border-bottom-color:var(--brand)}
  .sel:has(option[value=""]:checked){color:var(--muted-2)}
  .sel option{color:var(--ink)}
  .sel-wrap::after{content:"▾"; position:absolute; right:2px; font-size:10px; color:var(--muted-2); pointer-events:none; opacity:0; transition:opacity .15s}
  .cad-row:hover .sel-wrap::after, .sel-wrap:focus-within::after{opacity:1}
  .regime .sel{color:var(--muted)}
  .cred.sim .sel{color:var(--ink)}
  .cred.parcial .sel{color:var(--brand); font-weight:600}            /* o vermelho marca o parcial, como no gráfico */
  .cred.nao .sel{color:var(--ink-3)}
  .cad-x{width:22px; height:22px; display:flex; align-items:center; justify-content:center; border:0; border-radius:var(--r); background:transparent; color:var(--line-3); cursor:pointer; font-size:15px; line-height:1; padding:0}
  .cad-x:hover{color:var(--brand); background:var(--brand-wash)}
  @media (hover:none){ .sel-wrap::after{opacity:1} }
  .present .sel{pointer-events:none}
  .present .sel-wrap::after, .present .cad-x, .present .cad-mais, .present .cad-vazio .btn{display:none}
  .present .cad-row .in::placeholder{color:transparent}
  .hint.deb-hint{margin:-8px 0 16px; font-size:12px; color:var(--ink-3)}

  /* Resumo do cliente e bloco anual */
  .cli{background:var(--surface); padding:40px 44px 36px; min-width:0; border-radius:var(--r)}
  .cli h2{font-size:22px; letter-spacing:-.02em; margin-bottom:6px}
  .cli .sub{margin:0 0 30px; font-size:14px; max-width:60ch}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr)); gap:1px}
  .kc{padding:var(--e5) var(--e4); border-radius:var(--r); display:flex; flex-direction:column; gap:6px; box-shadow:0 0 0 1px var(--line-2); container-type:inline-size; min-width:0}
  .kc .cap{color:var(--muted-2); letter-spacing:.1em}
  .kv{font-family:var(--mono); font-weight:600; letter-spacing:-.02em; white-space:nowrap; font-size:26px; font-size:min(26px, calc(100cqi / 7.8))}
  .kv.brand{color:var(--brand)}
  .kc .note{font-size:12px; color:var(--muted); line-height:1.45}
  .obs{font-size:13px; color:var(--ink-3); line-height:1.65}
  .obs h4{line-height:1.45}
  .obs p{margin:0 0 8px}

  footer.foot{display:flex; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; color:var(--muted-2); padding-top:4px}
  .toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,16px); background:var(--fill); color:var(--sobre-fill); padding:10px 16px; border-radius:var(--r); font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:calc(100% - 32px)}
  .toast.show{opacity:1; transform:translate(-50%,0)}

  /* Movimento. Só recebe .entra o que não estava na tela antes do render() — ver animarNovos().
     O preenchimento é "backwards": terminado o efeito, quem manda é o estilo normal (o esmaecido da troca de mês,
     por exemplo); com "both" a opacidade final ficaria presa em 1 */
  @keyframes entra{from{opacity:0; transform:translateY(6px)}}
  @keyframes cai{from{opacity:0; transform:translateY(-4px)}}
  @keyframes esmaece{from{opacity:0}}
  .entra{animation:entra .24s cubic-bezier(.2,.7,.2,1) backwards}
  /* a barra se revela da esquerda para a direita quando o bloco entra. É a faixa inteira que vai sendo
     descoberta (clip-path), e não cada pedaço esticando: assim as partes empilhadas não se desencontram.
     O atraso segue o do bloco (--i herda do pai), para a barra entrar logo depois do texto dele */
  @keyframes revela{from{clip-path:inset(0 100% 0 0)}}
  .entra .track, .entra .sb-track, .entra .cmp-bar2{animation:revela .5s cubic-bezier(.2,.7,.2,1) backwards;
    animation-delay:calc(min(var(--i, 0), 6) * 35ms + 140ms)}
  .conteudo > .entra, .lanc-col > .entra{animation-delay:calc(min(var(--i, 0), 6) * 35ms)}   /* os blocos da seção entram em cascata */
  .menu.entra{animation:cai .14s ease-out backwards}
  .modal-fundo{animation:esmaece .16s ease-out backwards}
  .modal-caixa{animation:entra .2s cubic-bezier(.2,.7,.2,1) backwards}
  /* troca de mês ou de empresa: o conteúdo esmaece e uma barra corre no topo enquanto o banco responde */
  .conteudo > *{transition:opacity .15s ease}
  body.trocando .conteudo > *{pointer-events:none}
  /* Enquanto o mês chega do banco: os rótulos ficam e os números viram barras cinza, do tamanho que tinham.
     Antes a tela inteira esmaecia e uma barra vermelha corria no topo — parecia erro, e escondia o que não ia mudar */
  @keyframes esqueleto{to{background-position:-200% 0}}
  body.trocando :is(.v, .val, .kv, .ind-v, .ind-s, .fsn-v, .lado-v, .frr-num, .p, .sb-v, .cr-v, .pct-s, .m, .in, .sel, .cmp-parte b){
    color:transparent !important; border-radius:var(--r-2);
    background-image:linear-gradient(90deg, var(--line) 0 40%, var(--line-2) 50%, var(--line) 60%);
    background-size:200% 100%; animation:esqueleto 1.15s linear infinite}
  body.trocando .fill{background:var(--line)}
  /* Barra compacta ao rolar: abas e Salvar à mão sem voltar ao topo numa aba Resultado longa. Fica fora do
     fluxo e desce quando a barra de seleção (no modo local, o aviso) sai da tela — ver marcarRolagem() */
  html{scroll-padding-top:64px}                                   /* campo focado não fica escondido atrás dela */
  .fixo{position:fixed; top:0; left:0; right:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line-2);
        transform:translateY(-100%); visibility:hidden; transition:transform .2s ease, visibility 0s linear .2s}
  body.rolou .fixo{transform:none; visibility:visible; transition:transform .2s ease, visibility 0s}
  .fixo-in{max-width:1140px; margin:0 auto; padding:8px 24px; display:flex; align-items:center; gap:10px 18px}
  .fixo-id{display:flex; align-items:baseline; gap:10px; min-width:0; padding:4px 0; border:0; background:none; cursor:pointer; text-align:left}
  .fixo-id b{font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .fixo-id span{font-family:var(--mono); font-size:11px; letter-spacing:.02em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
  .fixo-id:hover b{text-decoration:underline}
  .fixo-abas{display:flex; gap:4px; margin-left:auto; padding:3px; background:var(--rail); border-radius:var(--r); overflow-x:auto; scrollbar-width:none}
  .tabf{padding:6px 11px; font:500 12px/1 var(--sans); border:0; border-radius:var(--r-2); background:transparent; color:var(--ink-3); cursor:pointer; white-space:nowrap; transition:background-color .15s ease, color .15s ease}
  .tabf:hover{background:var(--hover-rail); color:var(--ink)}
  .tabf[aria-current="page"]{background:var(--fill); color:var(--sobre-fill)}
  .fixo-acao{display:flex; align-items:center; gap:12px}
  .fixo-acao .bstatus{margin-left:0}
  .fixo-acao .btn{padding:7px 13px}
  .present .fixo-acao{display:none}                                /* apresentação não salva */

  /* Comparação com o último mês salvo, ao lado do rótulo (receita, resultado, DAS) */
  .var{margin-left:8px; font-family:var(--mono); font-size:11px; font-weight:400; letter-spacing:0; color:var(--muted); white-space:nowrap}
  .hero-row .var{display:inline-block}

  html.tema-trocando *{transition:background-color .22s ease, color .22s ease, border-color .22s ease,
    box-shadow .22s ease, fill .22s ease !important}

  /* Modo apresentação */
  /* letra 15% maior para TV e projetor: o conteúdo inteiro cresce e a largura máxima encolhe na mesma proporção */
  @keyframes abrePresent{from{opacity:0}}
  body.present #app{animation:abrePresent .26s ease-out backwards}
  @media screen and (min-width:900px){
    body.present .page{zoom:1.15}
    body.present .conteudo, body.present .cab-in{max-width:calc(1240px / 1.15)}   /* o zoom de 1,15 encolhe a área útil */
  }
  /* projetor clareia as cores: cinzas de rótulo e de linha ficam mais escuros */
  html:not([data-tema="escuro"]) body.present{--muted:#55585E; --muted-2:#65686F; --muted-3:#85888F; --line:#D8D6D0; --line-2:#C8C6C0}
  html[data-tema="escuro"] body.present{--muted:#B3B7BD; --muted-2:#A3A7AE; --muted-3:#83878E; --line:#3A3D43; --line-2:#474A51}
  /* menos texto de apoio: subtítulos que explicam a tela, notas de método e as premissas do Presumido */
  .present .card-h .sub, .present .nota, .present .lp-prem{display:none}
  .present .dasauto .so-tela{display:none}                        /* "digitar" altera o mês: não existe na apresentação */
  .present .sel{border-bottom-color:transparent !important}      /* seletor vira texto, como os campos */
  /* apontador: clicar numa linha apaga as outras, para falar de um número só na TV */
  /* a linha em foco cresce para ser lida de longe: 6% a partir do centro, com sombra leve — assim ela parece
     levantada do cartão, e não desalinhada quando passa do recuo. Sobe de camada para cobrir as vizinhas */
  .present .realce{background:var(--alt); transform:scale(1.06); position:relative; z-index:2; box-shadow:0 2px 14px rgba(20,22,26,.14)}
  /* passar o mouse acende a linha. O fundo avança 12px para os lados por duas sombras sem borrão — assim ele
     respira sobre o recuo do cartão sem empurrar nada e sem invadir a linha de cima nem a de baixo */
  @media (hover:hover){
    .dl:not(.res):hover, .sn-l:not(.sn-fim):hover, .gano:not(.gh):not(.tot):hover, .gpres:not(.gh):not(.tot):not(.dif):hover,
    .cr:not(.gh):hover, .gr:not(.gh):hover{background:var(--hover-linha);
      box-shadow:var(--e3) 0 0 var(--hover-linha), calc(var(--e3) * -1) 0 0 var(--hover-linha)}
    .hero-row:hover{background:var(--hover-linha)}
  }
  .dl, .hero-row, .cmp-row, .sum-bar, .total, .li, .gr, .cr, .gano, .gpres, .sn-l{transition:transform .15s ease}
  .dl, .hero-row, .sn-l, .gano, .gpres, .gr, .cr{transition:background-color .12s ease, box-shadow .12s ease}
  .dl, .hero-row, .cmp-row, .sum-bar, .total, .li, .gr, .cr, .gano, .gpres, .sn-l{transition:opacity .15s ease}
  body.realcando .dl:not(.realce), body.realcando .hero-row:not(.realce), body.realcando .cmp-row:not(.realce),
  body.realcando .sum-bar:not(.realce), body.realcando .total:not(.realce), body.realcando .li:not(.realce),
  body.realcando .gr:not(.realce), body.realcando .cr:not(.realce), body.realcando .gano:not(.realce),
  body.realcando .gpres:not(.realce), body.realcando .sn-l:not(.realce){opacity:.22}
  /* a linha realçada cresce 6% e, dentro de uma área que rola, isso ligava as barras de rolagem: enquanto há
     realce a área não rola, e a linha pode passar um pouco da borda do cartão */
  body.realcando .scroll-x{overflow:visible}
  @media (max-width:640px){
    .fixo-in{padding:6px 16px; gap:8px}
    .fixo-id span, .fixo-acao .bstatus{display:none}
    .fixo-id b{max-width:34vw}
  }
  @media (max-width:480px){                                        /* celular estreito: as três abas dividem a largura */
    .fixo-id{display:none}
    .fixo-abas{flex:1; margin-left:0}
    .tabf{flex:1; padding:7px 6px}
  }
  /* quem pediu ao sistema menos movimento não recebe nenhum destes efeitos */
  @media (prefers-reduced-motion: reduce){
    /* nada de "1ms": isso dava transição de 1ms a toda propriedade de todo elemento, inclusive a cor ao trocar de tema */
    *, *::before, *::after{animation:none !important; transition:none !important}
  }

  @media (max-width:800px){ .cmp2{grid-template-columns:minmax(0,1fr)} }   /* um cartão embaixo do outro */
  @media (max-width:640px){
    .card{padding:var(--e5) var(--e4) var(--e4)}
    .memo{padding:22px 18px}
    .cli{padding:26px 20px 24px}
    .panel{padding:var(--e5) var(--e4)}
    .dl.res{margin:8px -10px 0; padding:14px 10px}
    .total{margin:10px -10px 0; padding:14px 10px 14px 7px}
    .sum-bar{grid-template-columns:minmax(0,1fr) auto}
    .sb-track{grid-column:1 / -1; grid-row:2}
    .sb-leg{grid-column:1 / -1}
    /* grades viram duas linhas: nome em cima, números embaixo */
    /* despesas: nome e regra em cima; valor, alíquota e crédito embaixo */
    .g5{grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr); grid-template-areas:"nome regra regra" "valor aliq cred"; gap:4px 8px}
    .g5 > :nth-child(1){grid-area:nome}
    .g5 > :nth-child(2){grid-area:valor}
    .g5 > :nth-child(3){grid-area:regra; padding-left:0}
    .g5 > :nth-child(4){grid-area:aliq}
    .g5 > :nth-child(5){grid-area:cred}
    .g5.gh{display:none}
    .cmp-card{padding:var(--e4) var(--e3) var(--e3)}
    .cmp-leg{grid-template-columns:minmax(0,1fr); gap:6px}             /* uma fatia por linha: três colunas não cabem */
    .cmp-parte{align-items:center}
    .cmp-parte .cg-q{margin-top:0}
    .cmp-parte > span:last-child{display:flex; align-items:baseline; gap:10px; flex:1; min-width:0}
    .cmp-parte b{margin-left:auto}
    /* receita por tipo: nome e receita; situação no DAS e tipo da CBS; débito embaixo */
    .grec{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"nome receita" "sit cbs" "deb deb"; gap:4px 10px}
    .grec > :nth-child(1){grid-area:nome}
    .grec > :nth-child(2){grid-area:receita}
    .grec > :nth-child(3){grid-area:sit; padding-left:0}
    .grec > :nth-child(4){grid-area:cbs}
    .grec > :nth-child(5){grid-area:deb; text-align:right}
    .grec.gh{display:none}
    .grec.gr > :nth-child(5)::before{content:"Débito CBS "; font:400 11px var(--sans); color:var(--muted-2)}
    .g4{grid-template-columns:minmax(0,1.2fr) 64px minmax(0,1fr); gap:2px 8px}
    .g4 > :first-child{grid-column:1 / -1}
    /* cadeia de crédito: nome em cima; CNPJ e regime; depois o crédito */
    .cad-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px; grid-template-areas:"nome nome x" "cnpj cnpj cnpj" "regime cred cred"; row-gap:6px; padding:8px 0}
    .cad-row > :nth-child(1){grid-area:cnpj}
    .cad-row > :nth-child(2){grid-area:nome}
    .cad-row > :nth-child(3){grid-area:regime}
    .cad-row > :nth-child(4){grid-area:cred}
    .cad-row > :nth-child(5){grid-area:x}
    .cad-row.gh{display:none}
    /* Lucro Presumido: no celular fica só a coluna do ano — com várias colunas a que importa sumia na rolagem */
    .gpres{grid-template-columns:minmax(0,1fr) auto; min-width:0}
    .gpres > span:not(:first-child):not(:last-child){display:none}
  }
  @media (max-width:560px){
    .page{padding:var(--e5) var(--e4) var(--e7)}
    .tab{padding:7px 10px}
    .tl-long{display:none}
    .logo{height:38px}
    .nav{justify-content:flex-start}
  }
  /* Impressão e PDF: folha A4. O rodapé de cada página (empresa, período, "Página x de y") muda com a empresa, então
     as caixas de margem são montadas no beforeprint, em #estilo-folha — ver prepararFolha() */
  @page{size:A4; margin:14mm 12mm 16mm}
  .so-papel{display:none}                                          /* texto que só faz sentido impresso */
  @media print{
    body{background:#fff}
    .page{padding:0}
    /* botão, link e instrução de uso não servem no papel */
    .so-tela, .nav, .panel, .toast, .fixo, .row-ctl, .btn, .lk, .add, .cad-mais, .cad-x, .cad-alt,
    .ano-acoes, .cad-vazio p, .anx:has(option[value=""]:checked){display:none !important}
    footer.foot{display:none}                                     /* o escritório vai no rodapé de toda página */
    .so-papel{display:revert}
    .entra{animation:none}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    /* campo e seletor viram texto: sem traço, sem seta, sem texto de exemplo */
    .in, .sel{border-bottom-color:transparent !important}
    .sel-wrap::after{display:none}
    .sel{padding-right:0}                                          /* a folga era da seta, que não sai no papel */
    .lk-linha .seta{display:none}
    .in::placeholder{color:transparent}
    .scroll-x{overflow:visible}
    .cbscol.dir small{min-height:0}
    /* no papel branco o cartão branco não aparece: o recuo dele cai para 16px, o bastante para as faixas coloridas
       (lucro bruto, resultado, CBS a pagar) avançarem sobre ele — o que passa da área útil da folha o Chrome corta.
       Os blocos viram fluxo comum porque é no fluxo comum que o Chrome respeita "não quebrar aqui" */
    .wrap, .reforma{display:block}
    .conteudo > *{margin-top:18px}
    .conteudo > *:first-child{margin-top:0}
    .cab{position:static; padding:0 16px 12px; border-bottom:1px solid var(--line-3); backdrop-filter:none; background:none}
    .lat, .modo, .cab-comp, .hamburguer{display:none !important}      /* a folha não tem navegação */
    .conteudo{padding:0; max-width:none; gap:0}
    .faixa-escr{border-bottom:0; padding-bottom:4px}               /* no papel basta o risco do próprio cabeçalho */
    .card, .memo, .cli{padding:0 16px}
    .card, .panel, .barra, .kc{box-shadow:none}                    /* no papel o filete vira ruído */
    .card{background:var(--surface)}                               /* e a luz do cartão não se imprime */
    .card, .panel, .memo, .cli, .kc, .cmp-card, .det, .hero-side{border-radius:0}
    .track, .sb-track, .cmp-bar2{animation:none !important; clip-path:none !important}
    .hero-row{padding:12px 16px}
    .card-h{margin-bottom:14px}
    /* campo de texto não quebra linha: no papel o nome vai num texto comum (ver nomesNoPapel) */
    .in-papel{min-width:0; font-size:13px; color:var(--ink); overflow-wrap:anywhere}
    .imp-info{margin-top:3px; font-family:var(--mono); font-size:11px; color:var(--muted)}
    .cmp2{grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}   /* os dois regimes lado a lado, como na tela larga */
    .cmp-card{padding:14px 14px 12px}
    /* tabelas no tamanho da folha, sem a coluna do botão de remover */
    .g5{grid-template-columns:minmax(0,1fr) 96px 130px 96px 90px}
    .grec{grid-template-columns:minmax(0,1fr) 110px 140px 130px 100px}
    .gprod{grid-template-columns:minmax(0,1.6fr) 96px 90px 110px}
    .cad-row{grid-template-columns:150px minmax(0,1fr) 170px 100px}
    /* Presumido e ano: na tela as colunas têm a largura do conteúdo e a área rola de lado; no papel não há
       para onde rolar, então elas encolhem e a tabela cabe na folha */
    .gpres, .gano{min-width:0; font-size:10px; gap:0 6px}
    .gpres{grid-template-columns:minmax(86px,1.25fr) repeat(var(--cols,5), minmax(0,1fr))}
    .gpres > span:not(:first-child){letter-spacing:-.02em}         /* o número em mono não quebra: aperta um fio */
    .gpres > span:first-child small{font-size:8.5px}
    .gpres.gh{font-size:9px}
    .lp-tri .gpres > span:first-child, .lp-tri .gpres > span:last-child{position:static; background:none; box-shadow:none}
    .lp-alt{display:none}                                          /* os controles da tabela não vão ao papel */
    .deitado .gpres{font-size:8px; gap:0 3px; grid-template-columns:minmax(56px,1fr) repeat(var(--cols,5), minmax(0,1fr))}
    .deitado .gpres.gh{font-size:7.5px}
    .deitado .gpres > span:first-child small{font-size:7px}
    .gprod.gh > span:last-child, .cad-row.gh > span:last-child{display:none}
    .gprod.gh{font-size:10px}                                      /* como o cabeçalho da cadeia: no tamanho da linha, quebrava */
    /* quebra de página: o cartão grande pode quebrar (antes pulava inteiro e deixava meia folha em branco);
       linha, gráfico e o quadro dos regimes não; título fica com o que vem embaixo dele */
    .hero, .sn, .memo.fechada, .sum-bar, .comparativo, .cmp-card, .dl, .li, .gr, .cr, .sum, .total, .bar, .prem, .flag, .det-foot,
    .gano, .gpres, .cad-row, .gprod, .cad-grafico, .cad-alerta, .cad-vazio, .obs p, .cmp-eq{break-inside:avoid}
    h2, h3, h4, .card-h, .cad-h, .grp, .det-cap, .gh, .dl:has(+ .det){break-after:avoid}
  }

/* ---------- estado salvo: migração do modelo antigo e mescla profunda ---------- */
const isObj = o => !!o && typeof o === 'object' && !Array.isArray(o);
function mesclar(base, extra){
  if(extra === undefined || extra === null) return base;
  if(isObj(base) && isObj(extra)){
    const out = Object.assign({}, base);
    for(const k in extra) out[k] = mesclar(base[k], extra[k]);
    return out;
  }
  return extra;
}
function migrar(s){
  if(!isObj(s)) return null;
  s = JSON.parse(JSON.stringify(s));
  if((s.v || 1) < 2){
    // v1: tema/cores antigos saem; débitos e créditos ganham o tipo da premissa
    delete s.theme; delete s.ink; delete s.accent; delete s.sub;
    const rf = (s.monthly && s.monthly.reforma) || {};
    const geral = rf.creditoGeralAliq != null ? rf.creditoGeralAliq : 0.08;
    const conv = arr => Array.isArray(arr)
      ? arr.map(r => [r[0], r[1] || 0, r[2] || 0, (r[2] || 0) > 0 && (r[2] || 0) < geral ? 'reduzida' : 'geral'])
      : undefined;
    const debitos = conv(rf.debitos), creditos = conv(rf.creditosCompra);
    if(s.monthly){
      const mm = s.monthly;
      mm.reforma = { aliqGeral: geral,
        cbsSobreEfetiva: rf.cbsSobreEfetiva, debitos, creditos, saldoCredorAnterior: rf.saldoCredorAnterior };
      // v1 guardava estoque em campos soltos; sem eles, a lista fica vazia (não herda os números do padrão)
      mm.estoque = [['Estoque atualizado — custo total', mm.estoqueCusto], ['Estoque atualizado — preço total', mm.estoquePreco],
        ['Pagamento a fornecedor', mm.fornecedor]].filter(r => r[1] != null);
      delete mm.estoqueCusto; delete mm.estoquePreco; delete mm.fornecedor; delete mm.rbt12;
    }
    if(s.logo === LOGO_DEFAULT) s.logo = null;
    s.v = 2;
  }
  if(s.v < 3){
    // antes da v3 não havia crédito direto sobre as compras: começa zerado para não somar em cima dos créditos já lançados
    if(s.monthly && s.monthly.reforma && s.monthly.reforma.aliqCompras == null) s.monthly.reforma.aliqCompras = 0;
    s.v = 3;
  }
  if(s.v < 4){
    // anexo e receita dos 12 meses (v4): arquivo antigo não herda os do cliente de exemplo e segue com a parcela informada
    if(s.anexo == null) s.anexo = '';
    if(s.monthly && s.monthly.rbt12 == null) s.monthly.rbt12 = 0;
    s.v = 4;
  }
  if(s.v < 5){
    // até a v4 uma linha puxava o que sobrava da receita declarada; agora a receita é a soma das linhas
    const mm = s.monthly, rf = mm && mm.reforma;
    if(rf && Array.isArray(rf.debitos)){
      const fixas = rf.debitos.reduce((a, r) => a + (r[4] === 'pgdas' ? 0 : (r[1] || 0)), 0);
      const nPg = rf.debitos.filter(r => r[4] === 'pgdas').length;
      const resto = Math.max(0, (mm.receita || 0) - fixas) / (nPg || 1);
      rf.debitos.forEach(r => { if(r[4] === 'pgdas'){ r[1] = resto; r[4] = null; } });
      if(rf.debitos.length) mm.receita = rf.debitos.reduce((a, r) => a + (r[1] || 0), 0);
    }
    s.v = 5;
  }
  if(s.v < 6){
    // v6: a alíquota da receita deixa de ser campo e passa a sair do tipo. Quem acerta a linha é
    // normalizarLinhas(), aplicado em todo carregamento — inclusive em mês já salvo nesta versão.
    s.v = 6;
  }
  if(s.v < 7){
    // as compras do mês deixam de ser um número só e viram linhas com regra e alíquota. As linhas de
    // crédito atadas a "parte das compras" viram base fixa: as duas coisas modelavam o mesmo crédito.
    const mm = s.monthly, rf = mm && mm.reforma, total = (mm && mm.compraMercadoria) || 0;
    if(mm && !Array.isArray(mm.compras))
      mm.compras = total > 0 ? [['Compra de mercadoria do mês', total, 1, (rf && rf.aliqCompras) || 0]] : [];
    if(rf && Array.isArray(rf.creditos))
      rf.creditos.forEach(r => { if(typeof r[4] === 'number'){ r[1] = total * r[4]; r[4] = null; } });
    if(mm) delete mm.compraMercadoria;
    s.v = 7;
  }
  return s;
}

/* ---------- formatação e leitura de números (pt-BR) ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  t = t.indexOf(',') >= 0 ? t.replace(/\./g, '').replace(',', '.') : t;
  const v = parseFloat(t);

const zero = v => Math.abs(v) < 0.005 ? 0 : v;
const dec = (v, min, max) => zero(v).toLocaleString('pt-BR', {minimumFractionDigits:min, maximumFractionDigits:max});
const brl = v => 'R$ ' + dec(v, 2, 2);
// rótulo curto para o topo da barra: o gráfico não comporta "R$ 133.000,00" em cima de cada coluna
const mil = v => Math.abs(v) >= 1e6 ? dec(v / 1e6, 1, 1) + ' mi' : Math.abs(v) >= 1000 ? dec(v / 1000, 0, 0) + ' mil' : dec(v, 0, 0);
const brlSinal = v => v < -0.004 ? '− ' + brl(-v) : brl(Math.max(0, v));       // negativo de verdade (prejuízo): "− R$ 1.000,00"
// CBS débito − crédito em duas colunas: "a pagar" e "crédito". Cada valor vai numa só e a outra fica com traço — sem sinal
// de menos (crédito não é prejuízo), sem palavra no meio do número e sem cor (testados e recusados pelo usuário)
const cbsPagar = v => v > 0.004 ? brl(v) : '—';
const cbsCredito = v => v < -0.004 ? brl(-v) : '—';
const pct = v => dec(Math.abs(v) < 0.05 ? 0 : v, 1, 1) + '%';          // v em pontos percentuais
const FMT = {                                   // estado -> texto do campo
  brl:  v => brl(+v || 0),
  base: v => dec(+v || 0, 2, 2),
  pct:  v => dec((+v || 0) * 100, 2, 2) + '%',
  pct0: v => dec((+v || 0) * 100, 0, 2) + '%',
  txt:  v => v == null ? '' : String(v),

const PARSE = { brl:num, base:num, pct: s => num(s) / 100, pct0: s => num(s) / 100, txt: s => s, cnpj: s => limpaCnpj(s) };
// CNPJ numérico ou alfanumérico (RFB, a partir de jul/2026): 12 posições A-Z/0-9 + 2 dígitos verificadores
const limpaCnpj = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 14);

    for(let i = base.length - 1; i >= 0; i--){ soma += (base.charCodeAt(i) - 48) * peso; peso = peso === 9 ? 2 : peso + 1; }

function getPath(p){ return p.split('.').reduce((o, k) => o == null ? undefined : o[k], S); }
function setPath(p, v){ const ks = p.split('.'); let o = S; for(let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }
function competencia(lbl){
  const s = String(lbl || '').trim(), ano = (s.match(/\d{4}/) || [''])[0];

const temaEscuro = () => document.documentElement.dataset.tema === 'escuro';
function aplicarTema(t){
  // a troca de tema deixa de ser um corte seco: a transição universal vale só durante o cruzamento (260ms),
  // e é ligada por uma classe para não custar nada no resto do tempo. O tema muda na hora, por baixo dela
  const el = document.documentElement, tinha = el.dataset.tema === 'escuro';

/* ---------- cálculo ---------- */
const soma = arr => (arr || []).reduce((a, r) => a + (+r[1] || 0), 0);
// sem uma linha "Simples Nacional", não há DAS declarado: o painel usa o calculado pela tabela, em vez
// de tomar outra despesa tributária (INSS, FGTS…) por DAS — as listas agora podem ser editadas e removidas
const linhaSimples = trib => (trib || []).find(r => /^simples nacional/i.test(r[0])) || null;
const credLinha = r => (r[1] || 0) * (r[2] || 0) * (r[3] || 0);   // valor × % base × alíquota
// quando a regra reduz a base, a alíquota que de fato incide é menor: 70% × 9% = 6,30%. Vale também na linha
// ainda zerada — é a taxa que valerá quando ela receber valor. Sem redução a efetiva é a própria alíquota
const efetivaCredito = r => { const p = +r[2] || 0, a = +r[3] || 0;
  return p > 0 && p < 1 && a > 0 ? 'efetiva ' + FMT.pct(p * a) : ''; };
const baseLinha = r => (r[1] || 0);
const valorCbs = r => baseLinha(r) * (r[2] || 0);                  // base × alíquota (créditos)
// a receita declarada do mês é a soma das linhas de receita (cada uma com a sua situação no DAS)
const somaDebitos = () => S.monthly.reforma.debitos.reduce((a, r) => a + (+r[1] || 0), 0);
function sincronizarReceita(){ S.monthly.receita = somaDebitos(); }

function calcMes(){
  const m = S.monthly, rf = m.reforma, R = somaDebitos();
  const custos = soma(m.custos), ga = soma(m.ga), vendas = soma(m.vendas), tribLancado = soma(m.tributarias);
  const lucroBruto = R - custos;
  const creditoGeral = m.ga.reduce((a, r) => a + credLinha(r), 0);
  const baseDespesas = m.ga.reduce((a, r) => a + ((r[3] || 0) > 0 ? (r[1] || 0) * (r[2] || 0) : 0), 0);
  const debitoTotal = rf.debitos.reduce((a, r) => a + (+r[1] || 0) * (r[2] || 0), 0);
  const saldoAnterior = rf.saldoCredorAnterior || 0;
  // compras itemizadas: cada linha tem a sua regra e alíquota, igual às despesas gerais
  const compras = m.compras.reduce((a, r) => a + (+r[1] || 0), 0);
  const creditoCompras = m.compras.reduce((a, r) => a + credLinha(r), 0);
  const creditoTotal = rf.creditos.reduce((a, r) => a + valorCbs(r), 0) + creditoGeral + creditoCompras + saldoAnterior;
  const cbsPagar = Math.max(0, debitoTotal - creditoTotal);          // nunca negativo
  const saldoCredor = Math.max(0, creditoTotal - debitoTotal);       // excedente vai para o mês seguinte
  const ls = linhaSimples(m.tributarias), simplesDeclarado = ls ? (ls[1] || 0) : 0;
  // CBS dentro do DAS: pela receita por tipo quando há anexo e receita dos 12 meses; sem eles, a parcela informada
  const seg = segregacao();
  const pelaTabela = !!(seg && !seg.excluida && seg.das > 0.004);
  const parcela = pelaTabela ? seg.cbs / seg.das : (rf.cbsSobreEfetiva || 0);
  // enquanto o DAS declarado estiver zerado, a comparação usa o DAS que sai da receita por tipo
  const dasCalculado = pelaTabela ? seg.das : 0;
  const dasBase = simplesDeclarado > 0.004 ? simplesDeclarado : dasCalculado;
  const semDeclarado = simplesDeclarado <= 0.004 && dasBase > 0.004;
  // o Simples do mês é o declarado ou, enquanto ele não vier, o calculado pela receita por tipo — o quadro
  // de baixo já fazia isso, e a DRE mostrava zero: o lucro do mês aparecia maior do que é
  const simples = dasBase;
  const efetiva = R > 0 ? simples / R * 100 : 0;                     // Simples do mês ÷ receita
  // sem a linha "Simples Nacional" não há onde mostrar o valor na DRE, então ele fica fora do total
  const dasNaDre = semDeclarado && !!ls;
  const trib = tribLancado + (dasNaDre ? dasBase : 0);
  const resultado = lucroBruto - ga - vendas - trib;
  const parcelaCbs = dasBase * parcela;                              // a CBS é uma fatia do DAS
  const simplesSemCbs = dasBase - parcelaCbs;
  const ibs = m.ibs || 0;
  const naTransicao = simplesSemCbs + cbsPagar + ibs;
  // equilíbrio: a CBS por fora empata com hoje quando custa o mesmo que a parcela da CBS no Simples (menos o IBS informado).
  // faltaCredito > 0: falta crédito para empatar; < 0: folga; null: nem com a CBS zerada empata
  const limite = parcelaCbs - ibs;
  const faltaCredito = limite > 0.004 ? (debitoTotal - limite) - creditoTotal : null;
  return {R, custos, ga, vendas, trib, lucroBruto, resultado, creditoGeral, baseDespesas, debitoTotal,
    saldoAnterior, creditoTotal, cbsPagar, saldoCredor, simples, efetiva, seg, pelaTabela, parcela, parcelaCbs, simplesSemCbs, ibs,
    dasCalculado, dasBase, semDeclarado, dasNaDre, simplesDeclarado, naTransicao, delta: naTransicao - dasBase,
    faltaCredito, compras, creditoCompras};
}

// Resumo do mês, gravado junto com o estado: é daqui que o mês seguinte herda o saldo credor e
// que a aba Anual soma o exercício, sem precisar baixar o estado inteiro de cada competência.
function comEstado(st, fn){ const ant = S; S = st; try { return fn(); } finally { S = ant; } }
function resumoDe(st){

    return {receita: c.R, das: c.dasBase, simples: c.simples, cbs: c.cbsPagar, saldoCredor: c.saldoCredor,

const LIMITE_SN = 4800000, TETO_ISS = 0.05;
// alíquotas sobre a receita: total do DAS e as partes de ICMS, ISS, PIS/Cofins (CBS a partir de 2027) e a CBS da simulação
function simplesFaixa(anexo, rbt12, ano){
  const A = ANEXOS[anexo];
  if(!A || !(rbt12 >= 0)) return null;
  if(rbt12 > LIMITE_SN) return {excluida: true};
  const n = A.faixas.findIndex(x => rbt12 <= x[0]), f = A.faixas[n];
  // sem receita acumulada a empresa está na 1ª faixa, onde não há parcela a deduzir: vale a nominal
  const ef = x => rbt12 > 0 ? (rbt12 * x[1] - x[2]) / rbt12 : x[1];
  const fed = ef(f), loc = n < 5 ? f : A.faixas[4], el = ef(loc);          // 6ª faixa: ICMS e ISS seguem calculados pela 5ª
  const icms = el * loc[3], iss = el * loc[4];
  const excesso = A.redist && iss > TETO_ISS ? iss - TETO_ISS : 0;           // ISS acima de 5% vai para os tributos federais
  const extra = excesso * (A.redist || 0);
  return {faixa: n + 1, sexta: n === 5, total: n < 5 ? fed : fed + icms + iss, icms, iss: iss - excesso,
    pc: fed * (ano >= 2027 ? f[6] : f[5]) + extra, cbs: fed * f[6] + extra};
}
// toda linha de receita é a receita declarada no PGDAS: o que diferencia uma da outra é a situação no DAS
const NOME_RECEITA = 'Receita PGDAS';

const SITUACOES =[['', 'Integral'], ['st', 'ICMS-ST'], ['mono', 'Monofásico'], ['stmono', 'ICMS-ST + monofásico'], ['iss', 'ISS retido']];
const anoCompetencia = () => { const p = lerPeriodo(S.mesLabel); return p ? +p.slice(0, 4) : new Date().getFullYear(); };
// alíquota efetiva do DAS conforme a situação: ICMS-ST tira o ICMS, monofásico tira PIS/Cofins
// (a CBS, de 2027 em diante) e ISS retido tira o ISS. Usada nas receitas e no cadastro de produtos.
function aliqSituacao(f, sit){
  const st = sit === 'st' || sit === 'stmono', mono = sit === 'mono' || sit === 'stmono';
  return f.total - (st ? f.icms : 0) - (mono ? f.pc : 0) - (sit === 'iss' ? f.iss : 0);
}
// DAS e CBS dentro do DAS de cada linha de receita (as mesmas linhas do débito da CBS)
// Com a receita dos 12 meses zerada há dois casos, e só quem preenche sabe qual é:
//   • início de atividade: RBT12 proporcionalizado — receita do mês × 12 (LC 123/2006 art. 18 §2º;
//     Resolução CGSN 140/2018 art. 21)
//   • empresa que passou os 12 meses sem movimento: o RBT12 é zero mesmo, e zero é a 1ª faixa
function baseRbt12(){
  const informado = +S.monthly.rbt12 || 0;
  if(informado > 0) return {valor: informado, inicio: false, parado: false};
  const R = somaDebitos();
  if(S.monthly.inicioAtividade && R > 0) return {valor: R * 12, inicio: true, parado: false};
  return {valor: 0, inicio: false, parado: true};
}
// Empresa com mais de uma atividade é tributada em mais de um anexo. A receita dos 12 meses é uma só —
// logo a faixa é a mesma —, mas a alíquota efetiva e a fatia da CBS saem da tabela de cada anexo.
// Linha sem anexo próprio usa o da empresa: mês salvo antes disso continua com os mesmos números.
const anexoLinha = r => (r && ANEXOS[r[6]]) ? r[6] : anexoEmpresa();
function anexoEmpresa(){
  if(ANEXOS[S.anexo]) return S.anexo;
  const r = (S.monthly.reforma.debitos || []).find(x => ANEXOS[x[6]]);   // sem anexo na empresa, vale o da 1ª linha
  return r ? r[6] : '';
}
// com mais de um anexo entre as linhas não existe "o anexo da empresa": cada linha tem o seu, e o campo
// único da empresa passa a mostrar um dos dois como se fosse o de todos
const variosAnexos = () => new Set((S.monthly.reforma.debitos || []).map(anexoLinha)).size > 1;
function segregacao(){
  const base = baseRbt12(), ano = anoCompetencia(), cache = {};
  const faixaDe = a => a in cache ? cache[a] : (cache[a] = simplesFaixa(a, base.valor, ano));
  const ref = faixaDe(anexoEmpresa());
  if(!ref || ref.excluida) return ref;
  ref.inicio = base.inicio; ref.parado = base.parado;
  const efetivas = {};
  const linhas = S.monthly.reforma.debitos.map(r => {
    const a = anexoLinha(r), f = faixaDe(a) || ref;
    const sit = r[5] || '', b = +r[1] || 0, mono = sit === 'mono' || sit === 'stmono';
    if(b > 0.004) efetivas[a] = f.total;                                 // só entra no rótulo o anexo com receita
    return {das: b * aliqSituacao(f, sit), cbs: mono ? 0 : b * f.cbs, anexo: a, efetiva: f.total};
  });
  return Object.assign(ref, {linhas, efetivas,
    das: linhas.reduce((a, x) => a + x.das, 0), cbs: linhas.reduce((a, x) => a + x.cbs, 0)});
}

function valorPorParceiro(lado){

const CORES_CAT = ['#3F6E73', '#557E82', '#6B8E91', '#8FB1B4', '#BDB5A8', '#CFC9BF', '#E2DFD8', '#EFECE6'];
// os regimes presentes na lista, os que mais pesam primeiro e "sem regime" sempre no fim
function catsRegime(lst){
  const nomes = [...new Set(lst.map(r => r[2] || ''))];

  nomes.sort((a, b) => (a === '') - (b === '') || conta(b) - conta(a));

// Monta o resumo: categorias com quantidade e valor, o número grande e a explicação da base.

// número grande — na cadeia a lista é por regime, mas o número continua sendo o do crédito.

function resumoCadastro({lst, cats, chave, doc, lado, rotulo, fraseOk, baseTxt, conta}){

  const vendas = lado === 'vendas';
  // nas vendas, só CNPJ casa com o cadastro: o que foi para CPF já está no grupo do consumidor final

  const presentes = CATEGORIAS.map(([v, rotulo, cor]) => ({v, rotulo, cor, q: conta(lst, v)}))
    .filter(c => c.q > 0);                                         // só aparece o que existe
  let acumulado = 0;
  const fatias = presentes.map(c => {
    const ini = acumulado / n * 100; acumulado += c.q;
    return `${c.cor} ${ini}% ${acumulado / n * 100}%`;
  }).join(', ');
  const parte = q => dec(q / n * 100, 1, 1) + '%';
  const legenda = presentes.map(c => `<span class="cg-item"><span class="cg-q cg-${c.v || 'def'}"></span>` +
    `<span class="cg-rot">${c.rotulo}</span><span class="cg-pct">${parte(c.q)}</span></span>`).join('');
  // com uma categoria só, o lugar do gráfico recebe o número e o que ele quer dizer
  const quem = forn ? 'fornecedores' : 'clientes';
  return `<div class="cg-linhas">${linhas}</div>` + (presentes.length < 2
    ? (n ? `<div class="cg-pizza">${soloCg(presentes[0], quem,
        `${n} ${n === 1 ? quem.slice(0, -1) : quem} ${n === 1 ? 'cadastrado' : 'cadastrados'} · ${presentes[0].rotulo}`)}</div>` : '')
    : `<div class="cg-pizza">
      ${discoCg(presentes, n, fatias)}
      <div class="cg-legenda">${legenda}</div>
    </div>`);
}

// Com uma categoria só não há proporção para mostrar (disco cheio de uma cor e anel com o número foram
// comparados na tela e recusados). No lugar do gráfico entra o número em destaque com o que ele significa —
// a leitura que o gráfico não dava.
function discoCg(grupos, n, fatias) {
  const rotulo = esc(grupos.map(g => `${g.rotulo} ${dec(g.q / n * 100, 1, 1)}%`).join(', '));
  return `<div class="cg-disco" role="img" aria-label="${rotulo}" style="background:conic-gradient(${fatias})"></div>`;
}
function soloCg(g, quem, sub) {
  // a contagem e o nome da faixa já estão na barra ao lado: aqui fica só a proporção (o que o gráfico
  // mostraria) e a leitura que faltava — a alíquota que vale para todos
  return `<div class="cg-solo"><span class="cap cg-solo-c">100% dos ${quem}</span>` +
    (sub ? `<span class="cg-solo-s">${sub}</span>` : '') + `</div>`;
}

/* ---------- produtos e serviços ---------- */
const NATUREZAS = [['', 'Escolha…'], ['produto', 'Produto'], ['servico', 'Serviço']];
// a alíquota cheia é o caso comum e fica no tom mais claro; quanto maior a redução, mais escuro —
// assim a tinta marca a exceção, e não o padrão (um catálogo quase todo cheio não vira um borrão)
// da alíquota cheia (mais forte) à redução de 70% (mais clara); alíquota zero em neutro, com filete na fatia
const COR_TIPO = {geral: 'var(--cbs-6)', red30: 'var(--cbs-5)', red40: 'var(--cbs-4)', red50: 'var(--cbs-3)',
  reduzida: 'var(--cbs-2)', red70: 'var(--cbs-1)', zero: 'var(--cbs-0)'};
function resumoProdutos(lst){
  const n = lst.length;
  if(!n) return '';
  const com = lst.filter(r => (r[1] || 'geral') !== 'geral').length;
  if(n === 1) return com ? 'O único item cadastrado tem redução na CBS.' : 'O único item cadastrado entra pela alíquota cheia da CBS.';
  if(!com) return `Nenhum dos ${n} itens cadastrados tem redução na CBS: todos entram pela alíquota cheia.`;
  if(com === n) return `Todos os ${n} itens cadastrados têm redução na CBS.`;
  const resto = n - com;
  return `${com} dos ${n} itens cadastrados ${com === 1 ? 'tem' : 'têm'} redução na CBS; ` +
    `${resto === 1 ? 'o outro entra' : `os outros ${resto} entram`} pela alíquota cheia.`;
}
// mesmo vocabulário da cadeia de crédito: uma linha por faixa e a pizza com a proporção do total
function graficoProdutos(lst){
  const n = lst.length;
  const grupos = TIPOS.map(([v, rotulo]) => ({v, rotulo, cor: COR_TIPO[v], q: lst.filter(r => (r[1] || 'geral') === v).length}))
    .filter(g => g.q > 0);                                         // só aparece a faixa que existe
  const linhas = grupos.map(g => `<div class="cg-linha"><div class="bar-h"><span>${g.rotulo}</span><span>${g.q}</span></div>` +
    `<div class="cg-trilho" aria-hidden="true"><span style="width:${g.q / n * 100}%;background:${g.cor}"></span></div></div>`).join('');
  // as fatias não se encostam: meio grau da cor do cartão entre elas separa tons vizinhos da mesma rampa
  let acumulado = 0;
  const vao = grupos.length > 1 ? 0.5 : 0;
  const fatias = grupos.map((g, i) => {
    const ini = acumulado / n * 100; acumulado += g.q;
    const fim = acumulado / n * 100;
    return `${g.cor} ${i ? ini + vao : ini}% ${i === grupos.length - 1 ? fim : fim - vao}%` +
      (i === grupos.length - 1 ? '' : `, var(--surface) ${fim - vao}% ${fim + vao}%`);
  }).join(', ');
  const parte = q => dec(q / n * 100, 1, 1) + '%';
  const legenda = grupos.map(g => `<span class="cg-item"><span class="cg-q" style="background:${g.cor}"></span>` +
    `<span class="cg-rot">${g.rotulo}</span><span class="cg-pct">${parte(g.q)}</span></span>`).join('');
  // com uma faixa só, o lugar do gráfico recebe o número e a alíquota que vale para todos eles
  return `<div class="cg-linhas">${linhas}</div>` + (grupos.length < 2
    ? (n ? `<div class="cg-pizza">${soloCg(grupos[0], 'itens',
        `${n} ${n === 1 ? 'item' : 'itens'} · CBS de ${FMT.pct(aliqTipo(grupos[0].v))}`)}</div>` : '')
    : `<div class="cg-pizza">
      ${discoCg(grupos, n, fatias)}
      <div class="cg-legenda">${legenda}</div>
    </div>`);
}

// Quanto de crédito separa os dois regimes, dito no gasto que produz esse crédito — compra e despesa
// creditável servem igual, só que em valores diferentes, porque a alíquota de cada uma é outra.
// O crédito em reais não entra no texto: é o mesmo número da barra logo acima.
function textoEquilibrio(c){
  if(!(c.dasBase > 0.004)) return '';
  if(c.faltaCredito === null) return 'Nem zerando a CBS o híbrido empataria: o IBS informado já passa a CBS que está dentro do DAS.';
  const v = Math.abs(c.faltaCredito);
  if(v < 0.005) return '';
  const rf = S.monthly.reforma, aC = +rf.aliqCompras || 0, aD = +rf.aliqGeral || 0;
  // "despesa" sem qualificar induz a somar folha e retirada, que não geram crédito de CBS
  const emC = a => `${brl(v / a)} em compras (${FMT.pct0(a)})`, emD = a => `${brl(v / a)} em despesas com direito a crédito (${FMT.pct0(a)})`;
  // sem nenhuma alíquota não há conversão possível, e aí só resta dizer o crédito
  const quanto = aC > 0 && aD > 0
    ? (Math.abs(aC - aD) < 1e-9 ? `${brl(v / aC)} em compras ou despesas com direito a crédito (${FMT.pct0(aC)})` : `${emC(aC)} ou ${emD(aD)}`)
    : aC > 0 ? emC(aC) : aD > 0 ? emD(aD) : `${brl(v)} de crédito de CBS`;
  // "no mês" vem antes do valor: no fim ele cairia depois do parêntese da alíquota, longe do verbo
  return c.faltaCredito > 0
    ? `Para o híbrido empatar com o tradicional, faltam no mês ${quanto}.`
    : `O híbrido continua mais barato mesmo perdendo no mês ${quanto}.`;
}
/* ---------- saídas: todo texto calculado da tela, por chave ---------- */
function saidas(){
  const cm = calcMes(), m = S.monthly, rf = m.reforma;
  const O = {}, W = {}, C = {}, V = {}, H = {};                         // H: trechos de HTML sem campos (gráficos)
  const P = (v, R) => pct(R ? v / R * 100 : 0);
  const P2 = (v, R) => dec(R ? v / R * 100 : 0, 2, 2) + '%';          // faixa de indicadores: duas casas
  const larg = (v, max) => (max > 0 ? Math.max(2, Math.max(0, v) / max * 100) : 2) + '%';
  const parte = (v, R) => (R > 0 ? Math.max(0, Math.min(100, v / R * 100)) : 0) + '%';
  const itens = (arr, k, R) => arr.forEach((r, i) => { O[`${k}.${i}.v`] = brl(r[1] || 0); O[`${k}.${i}.p`] = P(r[1] || 0, R); });
  const an = ui.tab === 'anual';

  O.co = S.co || ''; O.footer = S.footer || '';
  // barra lateral e Visão geral (layout v2)
  const anoLat = (banco.ativo && banco.ano && banco.ano.ano) || (String(S.anoLabel || '').match(/\d{4}/) || [])[0];
  O['lat.grupoAno'] = anoLat ? 'Exercício · ' + anoLat : 'Exercício';
  O['lat.grupoMes'] = 'Mês · ' + (banco.ativo && banco.periodo ? mesCurto(banco.periodo) : (S.mesLabel || ''));
  // a logo é do escritório: o CNPJ ao lado do nome deixa claro de quem é a empresa do painel
  const emp = banco.ativo && (banco.empresas || []).find(e => e.id === banco.empresaId);
  O.ctx = 'DRE · ' + (an ? S.anoLabel : S.mesLabel) + (emp && emp.cnpj ? ' · CNPJ ' + fmtCnpj(emp.cnpj) : '');
  O.comp = an ? 'Valores em reais · ' + String(S.anoLabel || '').toLowerCase()
              : 'Valores em reais · competência ' + competencia(S.mesLabel);

  // mês — DRE
  Object.assign(O, {
    'm.receita': brl(cm.R), 'm.receitaP': pct(cm.R ? 100 : 0),
    'm.custos': brl(cm.custos), 'm.custosP': P(cm.custos, cm.R),
    'm.lucroBruto': brl(cm.lucroBruto), 'm.lucroBrutoP': P(cm.lucroBruto, cm.R),
    'm.ga': brl(cm.ga), 'm.gaP': P(cm.ga, cm.R), 'm.vendas': brl(cm.vendas), 'm.vendasP': P(cm.vendas, cm.R),
    'm.trib': brl(cm.trib), 'm.tribP': P(cm.trib, cm.R),
    'm.resultado': brl(cm.resultado), 'm.margem': P(cm.resultado, cm.R),
    'm.simples': brl(cm.simples), 'm.simplesP': P2(cm.simples, cm.R), 'm.cbsPagar': brl(cm.cbsPagar)
  });
  itens(m.custos, 'm.cu', cm.R); itens(m.vendas, 'm.ve', cm.R); itens(m.tributarias, 'm.tr', cm.R);
  // DAS não digitado: a linha do Simples mostra o calculado, e é ele que entra no total e no resultado
  V['m.dasAuto'] = cm.dasNaDre; V['m.dasMan'] = !cm.dasNaDre;
  if(cm.dasNaDre){ const i = m.tributarias.indexOf(linhaSimples(m.tributarias));
    O[`m.tr.${i}.v`] = brl(cm.dasBase); O[`m.tr.${i}.p`] = P(cm.dasBase, cm.R); }
  m.ga.forEach((r, i) => { const c = credLinha(r);
    O[`m.ga.${i}.v`] = brl(r[1] || 0); O[`m.ga.${i}.cr`] = brl(c); O[`m.ga.${i}.ef`] = efetivaCredito(r);
    C[`m.ga.${i}.cr`] = c > 0.004 ? 'var(--ink)' : 'var(--disabled)'; });

  // mês — CBS
  const forn =(S.cadeia && S.cadeia.fornecedores) || [], fq = forn.filter(r => r[3] === 'nao' || r[3] === 'parcial').length;
  Object.assign(O, {
    'm.creditoGeral': brl(cm.creditoGeral), 'm.baseDespesas': brl(cm.baseDespesas),
    'm.debitoTotal': brl(cm.debitoTotal), 'm.creditoTotal': brl(cm.creditoTotal),
    'm.saldoAnt': brl(cm.saldoAnterior), 'm.saldoCredor': brl(cm.saldoCredor),
    'm.linhas': `${linhasComCredito().filter(Boolean).length} de ${m.ga.length} linhas de despesa`,
    // fornecedores da cadeia que não geram crédito cheio: o crédito das compras pode estar alto
    'm.fornCap': forn.length === 1 ? '1 de 1 fornecedor cadastrado não gera crédito cheio — confira a alíquota'
      : `${fq} dos ${forn.length} fornecedores cadastrados não ${fq === 1 ? 'gera' : 'geram'} crédito cheio — confira a alíquota`
  });
  V['m.temFornCap'] = fq > 0;
  V['m.temCredor'] = cm.saldoCredor > 0.004;
  O['m.compraCred'] = brl(cm.creditoCompras);
  m.compras.forEach((r, i) => { const c = credLinha(r);
    O[`m.co.${i}.cr`] = brl(c); O[`m.co.${i}.ef`] = efetivaCredito(r);
    C[`m.co.${i}.cr`] = c > 0.004 ? 'var(--ink)' : 'var(--disabled)'; });
  O['m.compra'] = brl(cm.compras); O['m.compraP'] = P(cm.compras, cm.R);
  // herança do mês novo: de onde veio o saldo credor e quantos meses entraram no RBT12
  const hz = banco.heranca || {};
  V['m.temSaldoDe'] = !!hz.saldoDe;
  O['m.saldoDe'] = hz.saldoDe ? `veio de ${mesCurto(hz.saldoDe)}` : '';
  // somar os 12 meses só faz sentido com histórico: mais de dois meses salvos e algum antes deste
  const salvos = banco.meses || [], antes = salvos.filter(p => p < banco.periodo).length;
  V['r.temRbt'] = !!(banco.ativo && banco.empresaId && salvos.length > 2 && antes > 0);
  O['r.rbtNota'] = hz.rbt12Meses ? `somados ${hz.rbt12Meses} de 12 meses salvos${hz.rbt12Meses < 12 ? ' — confira no PGDAS' : ''}` : '';
  O['r.rbtBt'] = hz.rbt12Meses ? 'atualizar' : 'somar pelos meses salvos';
  (m.estoque || []).forEach((r, i) => { O[`m.es.${i}.v`] = brl(r[1] || 0); });
  // a alíquota da linha aparece na tabela: é fácil confundir a alíquota da CBS com a parcela dela dentro do DAS
  rf.debitos.forEach((r, i) => { O[`m.deb.${i}.val`] = brl((+r[1] || 0) * (r[2] || 0)); O[`m.deb.${i}.aliq`] = FMT.pct(r[2]); });
  rf.creditos.forEach((r, i) => { O[`m.cred.${i}.val`] = brl(valorCbs(r)); O[`m.cred.${i}.aliq`] = FMT.pct(r[2]); });
  // crédito maior que o débito: a CBS vira "CBS Crédito" (verde) com o saldo que vai para o mês seguinte
  const credor = V['m.temCredor'];
  O['m.cbsRotulo'] = credor ? 'CBS Crédito' : 'CBS a pagar';
  O['m.cbsRes'] = brl(credor ? cm.saldoCredor : cm.cbsPagar);
  const maxCbs = Math.max(cm.debitoTotal, cm.creditoTotal, cm.cbsPagar, cm.saldoCredor, 1);
  [['deb', cm.debitoTotal], ['cred', cm.creditoTotal], ['cbs', credor ? cm.saldoCredor : cm.cbsPagar]]
    .forEach(([k, v]) => { O['b.' + k] = brl(v); W['b.' + k] = larg(v, maxCbs); });
  // de onde vem o crédito: a barra do crédito é empilhada por origem (sem mínimo de largura, para somar o total)
  const origens = [['compras', cm.creditoCompras, 'compras'], ['despesas', cm.creditoGeral, 'despesas'],
    ['outras', rf.creditos.reduce((a, r) => a + valorCbs(r), 0), 'outras linhas'], ['saldo', cm.saldoAnterior, 'saldo do mês anterior']];
  origens.forEach(([k, v]) => { W['cr.' + k] = (Math.max(0, v) / maxCbs * 100) + '%'; });
  O['cr.legenda'] = origens.filter(([, v]) => v > 0.004)
    .map(([, v, nome]) => `${nome} ${brl(v)} (${dec(cm.creditoTotal ? v / cm.creditoTotal * 100 : 0, 0, 0)}%)`).join(' · ');
  V['cr.temLegenda'] = O['cr.legenda'] !== '';

  // receita por tipo: faixa do Simples, DAS de cada tipo e conferência com o DAS declarado
  const sg = cm.seg, temTab = !!(sg && !sg.excluida);
  // pelo anexo efetivo, não por S.anexo: com o anexo só nas linhas, o cálculo roda e a tela mandava escolher
  O['r.faixa'] = !ANEXOS[anexoEmpresa()] ? 'escolha o anexo para calcular o DAS de cada tipo'
    : sg && sg.excluida ? 'acima de R$ 4,8 milhões: fora do Simples Nacional'
    : !temTab ? 'informe a receita dos 12 meses ou a do mês para calcular o DAS de cada tipo'
    : `${sg.faixa}ª faixa · ` + (() => {                 // uma efetiva por anexo com receita no mês
        const us = Object.keys(sg.efetivas || {});
        return us.length > 1 ? us.map(a => `${a} ${dec(sg.efetivas[a] * 100, 2, 2)}%`).join(' · ')
                             : `efetiva ${dec((us.length ? sg.efetivas[us[0]] : sg.total) * 100, 2, 2)}%`;
      })() +
      (sg.inicio ? ' · início de atividade: receita do mês × 12' : '') +
      (sg.parado ? ' · sem receita nos 12 meses' : '') +
      (sg.sexta ? ' · ICMS e ISS pela 5ª faixa' : '');
  // o campo "Situação" só existe enquanto não há receita dos 12 meses: por data-v, some na hora em que
  // o valor é digitado (render() só acontece depois, e até lá a tela dizia "sem movimento" com valor)
  V['r.semRbt12'] = !(+m.rbt12 > 0);
  // duas atividades: o anexo passa a ser da linha, e o campo único da empresa sai da tela
  const varios = variosAnexos();
  V['r.umAnexo'] = !varios;
  O['r.snSub'] = varios ? 'A receita dos últimos 12 meses dá a faixa; o anexo de cada linha de receita dá a sua alíquota efetiva.'
    : 'O anexo e a receita dos últimos 12 meses dão a faixa e a alíquota efetiva do mês.';
  const difDas = temTab ? cm.simplesDeclarado - sg.das : 0;
  V['r.temTabela'] = temTab;
  // a conferência só aparece com DAS declarado: em mês em branco não há o que comparar
  V['r.temConf'] = temTab && cm.simplesDeclarado > 0.004;
  V['r.confere'] = V['r.temConf'] && Math.abs(difDas) < 1;
  V['r.naoConfere'] = V['r.temConf'] && !V['r.confere'];
  O['r.dasCalc'] = temTab ? brl(sg.das) : '—';
  O['r.dasDeclarado'] = brl(cm.simplesDeclarado);
  O['r.conferencia'] = !V['r.temConf'] ? '' : V['r.confere'] ? 'Confere com o DAS declarado no PGDAS.'
    : difDas < 0 ? `O DAS pela receita por tipo passa o declarado em ${brl(-difDas)}: separe as receitas com ICMS-ST, monofásico ou ISS retido.`
    : `O DAS pela receita por tipo fica ${brl(difDas)} abaixo do declarado: confira o anexo, a receita dos 12 meses e os tipos.`;
  // as duas CBS têm bases diferentes: a de dentro é uma fatia do DAS; a de fora incide sobre a receita
  O['r.cbsDentro'] = brl(cm.parcelaCbs);
  O['r.cbsBase'] = `${dec(cm.parcela * 100, 2, 2)}% do DAS${cm.semDeclarado ? ' calculado' : ''}`;
  O['r.cbsFora'] = brl(cm.cbsPagar);
  O['r.foraBase'] = cm.saldoCredor > 0.004 ? `os créditos passam o débito em ${brl(cm.saldoCredor)}`
    : cm.creditoTotal > 0.004 ? `débito de ${brl(cm.debitoTotal)} menos créditos de ${brl(cm.creditoTotal)}`
    : `${dec(cm.R > 0 ? cm.debitoTotal / cm.R * 100 : 0, 2, 2)}% da receita`;
  O['r.dasSemCbs'] = brl(cm.simplesSemCbs);
  O['r.totalHib'] = brl(cm.naTransicao);
  O['r.contraHoje'] = `contra ${brl(cm.dasBase)} com a CBS dentro`;
  O['r.decisao'] = Math.abs(cm.delta) < 0.005 ? 'Com a CBS por fora, o mês custa o mesmo'
    : cm.delta > 0 ? `Com a CBS por fora, o mês custa ${brl(cm.delta)} a mais`
    : `Com a CBS por fora, o mês custa ${brl(-cm.delta)} a menos`;
  V['r.manual'] = !cm.pelaTabela;

  // Tradicional × Híbrido: um cartão por regime, com os números e a composição dos tributos do mês
  Object.assign(O, {
    'k.dasConv': brl(cm.dasBase), 'k.cbsConv': brl(cm.parcelaCbs),
    'k.dasHib': brl(cm.simplesSemCbs), 'k.cbsHib': brl(cm.cbsPagar), 'k.ibsHib': brl(cm.ibs), 'k.totHib': brl(cm.naTransicao),
    // o rótulo já diz "por fora": a nota embaixo só aparece quando há o que contar
    'k.cbsHibInfo': credor ? `crédito de ${brl(cm.saldoCredor)} vai para o mês seguinte` : '',
    'k.equilibrio': textoEquilibrio(cm),
    // zero no quadro não explica nada: diga o que falta para o DAS existir

      ? 'Sem o anexo do Simples o painel não calcula o DAS. Escolha o anexo no cartão "Simples Nacional do mês", no topo — ou lance o DAS declarado na linha "Simples Nacional" das despesas tributárias.'
      : cm.R <= 0.004 ? 'Sem receita declarada no mês não há DAS a comparar.'
      : 'DAS zerado: confira a receita dos 12 meses e a situação no DAS de cada linha de receita.',
    // carga tributária do mês em cada regime: todas as despesas tributárias, trocando o DAS pelo par DAS sem CBS + CBS
    'k.cargaConv': `Tributos do mês: ${brl(cm.trib)} · ${P2(cm.trib, cm.R)} da receita`,
    'k.cargaHib': `Tributos do mês: ${brl(cm.trib + cm.delta)} · ${P2(cm.trib + cm.delta, cm.R)} da receita`,
    // alíquota efetiva de cada regime: o que ele custa sobre a receita do mês
    'k.efetConv': P2(cm.dasBase, cm.R),
    'k.efetHib': P2(cm.naTransicao, cm.R)
  });
  const ppt = Math.abs(cm.delta) / (cm.R || 1) * 100;
  const pp = `${dec(ppt, 2, 2)} ${ppt < 2 ? 'ponto percentual' : 'pontos percentuais'}`;
  O['k.variacao'] = !(cm.R > 0.004 && cm.dasBase > 0.004) ? ''

  O['nf.qtd'] = String((((S.monthly.notas || {}).compras) || []).length + (((S.monthly.notas || {}).vendas) || []).length || '');
  prods.forEach((r, i) => { O[`pr.${i}.red`] = FMT.pct(aliqTipo(TIPOS.some(([v]) => v === r[1]) ? r[1] : 'geral')); });
  if(prods.length){ H['pr.resumo3'] = rResumoCad(dadosResumoProdutos()); }

  return {O, W, C, V, H};
}

// Conferência do mês: cada item é uma pergunta que o painel consegue responder sozinho com o que está lançado.
// Verde quando tudo passa; âmbar quando algo pede atenção — nunca impede de entregar, só avisa.
function conferencias(){
  const c = calcMes(), m = S.monthly, lista = [];
  const dif = (a, b) => Math.abs(a - b);
  // 1) a receita da DRE é a mesma que a soma das linhas de receita da memória (o que vai ao PGDAS)
  const somaReceita = soma(m.reforma.debitos);
  lista.push({ok: dif(somaReceita, c.R) <= 1, titulo: 'Receita da DRE bate com as linhas do PGDAS',
    detalhe: dif(somaReceita, c.R) <= 1
      ? `Receita declarada de ${brl(c.R)}, igual à soma das linhas de receita.`
      : `A DRE tem ${brl(c.R)} e as linhas de receita somam ${brl(somaReceita)} — diferença de ${brl(dif(somaReceita, c.R))}.`});
  // 2) o DAS lançado nas despesas confere com o que a tabela do Simples calcula
  const temTabela = c.pelaTabela && c.dasCalculado > 0.004, decl = c.simplesDeclarado;
  lista.push({ok: !temTabela || decl <= 0.004 || dif(decl, c.dasCalculado) <= 1,
    titulo: 'DAS declarado confere com o calculado',
    detalhe: !temTabela ? 'Sem receita por tipo lançada, o painel usa o DAS que você declarou.'
      : decl <= 0.004 ? `Nenhum DAS lançado nas despesas: vale o calculado pela tabela, ${brl(c.dasCalculado)}.`
      : dif(decl, c.dasCalculado) <= 1 ? `Declarado ${brl(decl)}, calculado ${brl(c.dasCalculado)}.`
      : `Declarado ${brl(decl)} e calculado ${brl(c.dasCalculado)} — diferença de ${brl(dif(decl, c.dasCalculado))}.`});
  // 3) crédito de CBS quase zerado diante do débito costuma ser regra de crédito mal marcada
  const quaseSem = c.debitoTotal > 0.004 && c.creditoTotal < c.debitoTotal * 0.02 && (c.compras > 0.004 || c.baseDespesas > 0.004);
  lista.push({ok: !quaseSem, titulo: 'Crédito de CBS compatível com as compras',
    detalhe: quaseSem ? `Crédito de ${brl(c.creditoTotal)} para um débito de ${brl(c.debitoTotal)}: confira a regra de crédito das compras e despesas.`
      : `Crédito de ${brl(c.creditoTotal)} sobre um débito de ${brl(c.debitoTotal)}.`});
  // 4) CNPJ do cadastro: um número errado atrapalha a conversa sobre a cadeia de crédito
  const maus = ['fornecedores', 'clientes'].reduce((n, g) => n + (S.cadeia[g] || []).filter(r => r[0] && !cnpjValido(r[0])).length, 0);
  if(maus || (S.cadeia.fornecedores || []).length || (S.cadeia.clientes || []).length)
    lista.push({ok: !maus, titulo: 'CNPJ dos cadastros confere',
      detalhe: maus ? `${maus} ${maus === 1 ? 'CNPJ não confere' : 'CNPJs não conferem'} no cadastro de fornecedores ou clientes.`
        : 'Todos os CNPJs cadastrados passam na validação.'});
  // 5) Fator R perto do corte: quem vive de serviço muda de anexo por causa dele
  const fr = fatorRLigado() ? calcFatorR() : null;
  if(fr && fr.valor != null){
    const perto = fr.valor >= FATOR_R_CORTE && fr.valor - FATOR_R_CORTE < 0.02;
    lista.push({ok: fr.valor >= FATOR_R_CORTE && !perto, titulo: 'Fator R com folga para o Anexo III',
      detalhe: fr.valor < FATOR_R_CORTE
        ? `Fator R de ${FMT.pct(fr.valor)}: abaixo dos 28%, a tributação é a do Anexo V. Faltam ${brl(fr.faltaFolha)} de folha nos doze meses.`
        : perto ? `Fator R de ${FMT.pct(fr.valor)}: a menos de 2 pontos do corte — um mês de receita alta derruba para o Anexo V.`
        : `Fator R de ${FMT.pct(fr.valor)}, com folga sobre os 28%.`});
  }
  // 6) com banco: o exercício está completo?
  const ano = banco.ano && !banco.ano.carregando && banco.ano.linhas ? banco.ano : null;
  if(ano){
    const falta = mesesFaltando(ano.linhas, ano.ano);
    lista.push({ok: !falta.length, titulo: `Exercício de ${ano.ano} completo`,
      detalhe: falta.length ? `Ainda sem competência salva: ${falta.join(', ')}.` : 'Todos os meses do ano têm competência salva.'});
  }
  return lista;
}

// do cabeçalho — é a mesma verdade, dita no lugar onde se trabalha.
function etapasLanc(){
  const c = calcMes(), conf = conferencias();
  const ok = titulo => { const x = conf.find(y => y.titulo === titulo); return !x || x.ok; };
  return [
    {id: 'sn', n: '01', rot: 'Simples do mês', ok: !!ANEXOS[S.anexo] && (+S.monthly.rbt12 || 0) > 0.004},
    {id: 'dre', n: '02', rot: 'DRE', ok: ok('Receita da DRE bate com as linhas do PGDAS') && ok('DAS declarado confere com o calculado')},
    {id: 'est', n: '03', rot: 'Estoque e compras', ok: c.compras > 0.004 || (S.monthly.estoque || []).length > 0},
    {id: 'cbs', n: '04', rot: 'Memória da CBS', ok: ok('Crédito de CBS compatível com as compras')}
  ];
}
function rTrilho(){
  return `<aside class="trilho" aria-label="Fechamento do mês">
    <div class="trilho-bl">
      <span class="cap">Fechamento do mês</span>
      <div class="trilho-etapas">${etapasLanc().map(e =>
        `<button class="trilho-et" type="button" data-act="ir-secao" data-id="${e.id}">
          <span class="trilho-mk ${e.ok ? 'ok' : 'atencao'}">${e.ok ? '✓' : '!'}</span>
          <span>${e.rot}</span></button>`).join('')}</div>
    </div>
    <div class="trilho-bl">
      <span class="cap">Resultado líquido</span>
      <div class="trilho-res" data-o="m.resultado"></div>
      <div class="trilho-linhas">
        <div><span>DAS <i data-v="m.dasAuto">calculado</i></span><span class="v" data-o="m.tr.0.v"></span></div>
        <div><span data-o="m.cbsRotulo"></span><span class="v" data-o="m.cbsRes"></span></div>
      </div>
    </div>
  </aside>`;
}
function rResultado(){
  const m = S.monthly;
  let h = `<div class="card-h" id="sec-dre"><div><h2><span class="sec-n">02</span>Demonstração de resultado</h2><p class="sub">Valores do mês e participação sobre a receita.</p></div>${btnDetalhe()}</div>`;
  h += linha('rec', 'Receita declarada <span class="tag-src">PGDAS</span>' + varMes('receita'), 'm.receita', 'm.receitaP');
  if(ui.detalhe) h += detReceita();
  if(m.custos.length === 1) h += linha('', '( − ) ' + esc(m.custos[0][0]), 'm.cu.0.v', 'm.cu.0.p', 'monthly.custos.0.1');
  else { h += linha('tot', '( − ) Custos', 'm.custos', 'm.custosP'); if(ui.detalhe) h += lista('monthly.custos', m.custos, 'm.cu'); }
  h += linha('gross', '( = ) Lucro operacional bruto', 'm.lucroBruto', 'm.lucroBrutoP');
  h += linha('tot', '( − ) Despesas gerais e administrativas', 'm.ga', 'm.gaP');
  if(ui.detalhe) h += detDespesas();
  if(m.vendas.length){ h += linha('tot', '( − ) Despesas com vendas', 'm.vendas', 'm.vendasP'); if(ui.detalhe) h += lista('monthly.vendas', m.vendas, 'm.ve'); }
  h += linha('tot', '( − ) Despesas tributárias', 'm.trib', 'm.tribP');
  if(ui.detalhe) h += lista('monthly.tributarias', m.tributarias, 'm.tr');
  h += linha('res', '( = ) Resultado líquido' + varMes('resultado'), 'm.resultado', 'm.margem');
  // na apresentação, a DRE fecha com a leitura em português — é o que o cliente quer ouvir
  if(ui.present) h += `<div class="como-ler"><span class="cap">Como ler</span>
    <p data-o="v.comoLer"></p></div>`;
  const secoes = rSimplesMes() + painel('card', 'resultado', h) + rEstoque() + rReforma();
  // na apresentação não se lança: o trilho (etapas e Salvar) não faz sentido na frente do cliente
  return ui.present ? secoes : `<div class="lanc"><div class="lanc-col">${secoes}</div>${rTrilho()}</div>`;
}
// Compras do mês: mesma tabela das despesas gerais — regra de crédito, alíquota e crédito de CBS por linha
function tabelaCompras(){
  let h = `<div class="det"><div class="scroll-x"><div class="g5 gh"><span>Item</span><span>Valor</span><span class="esq">Regra de crédito</span><span>Alíquota</span><span>Crédito CBS</span></div>`;
  S.monthly.compras.forEach((r, i) => {
    const parte = +r[2] || 0, igual = v => Math.abs(v - parte) < 1e-9, padrao = REGRAS.some(([v]) => igual(v));
    const opcoes = REGRAS.map(([v, l]) => `<option value="${v}"${igual(v) ? ' selected' : ''}>${l}</option>`).join('') +
      (padrao ? '' : `<option value="${parte}" selected>Outra: ${FMT.pct0(parte)} com crédito</option>`) + `<option value="outra">Outra parte…</option>`;
    h += `<div class="g5 gr">
      <span class="nmcol"><span class="nmwrap">${inp(`monthly.compras.${i}.0`, 'txt', `Compra ${i + 1}`, 'txt')}
        <span class="row-ctl"><button class="x" data-act="rm-co" data-i="${i}" aria-label="Remover ${esc(r[0])}" title="Remover compra">×</button></span></span></span>
      <span class="r m">${inp(`monthly.compras.${i}.1`, 'brl', r[0] + ' — valor', 'val')}</span>
      <span class="sel-wrap regra${parte > 0 ? '' : ' sem'}"><select class="sel" data-regra="compras" data-i="${i}" aria-label="Regra de crédito — ${esc(r[0])}"${ui.present ? ' disabled' : ''}>${opcoes}</select></span>
      <span class="cbscol dir">${inp(`monthly.compras.${i}.3`, 'pct', r[0] + ' — alíquota')}<small class="m" data-o="m.co.${i}.ef"></small></span>
      <span class="cr-v" data-o="m.co.${i}.cr" data-oc="m.co.${i}.cr"></span></div>`;
  });
  return h + `</div>
    <button class="add" data-act="add-co">+ adicionar compra</button>
    <div class="det-foot"><span>Crédito de CBS gerado pelas compras</span><span data-o="m.compraCred"></span></div></div>`;
}
function rEstoque(){
  const lst = S.monthly.estoque || [];
  let h = `<div class="card-h" id="sec-est"><div><h2><span class="sec-n">03</span>Estoque e compras</h2><p class="sub">Compras do mês, posição de estoque e pagamentos.</p></div>` +
    `<button class="btn" data-act="estoque" aria-expanded="${ui.estoque}">${ui.estoque ? 'Ocultar detalhamento' : 'Ver detalhamento'}</button></div>`;
  // o total vem da soma das linhas de compra; o detalhamento traz as compras e a posição de estoque
  h += linha('rec', 'Compra de mercadoria do mês', 'm.compra', 'm.compraP');
  if(ui.estoque) h += tabelaCompras() + `<div class="det"><div class="det-cap">Posição de estoque e pagamentos</div>` + lst.map((r, i) => `<div class="li">` +
    `<span class="nm nmwrap">${inp(`monthly.estoque.${i}.0`, 'txt', `Descrição ${i + 1}`, 'txt')}` +
    `<span class="row-ctl"><button class="x" data-act="rm-es" data-i="${i}" aria-label="Remover ${esc(r[0])}" title="Remover linha">×</button></span></span>` +
    `<span class="v">${inp(`monthly.estoque.${i}.1`, 'brl', r[0] || `Valor ${i + 1}`, 'val')}</span></div>`).join('') +
    `<button class="add" data-act="add-es">+ adicionar linha</button></div>`;
  return `<section class="card" aria-label="Estoque e compras">${h}</section>`;
}

function linhasCbs(g){
  const k = g === 'debitos' ? 'deb' : 'cred', cred = g === 'creditos';
  return S.monthly.reforma[g].map((r, i) => {
    // as compras do mês são itemizadas no bloco Estoque e compras: aqui a base é sempre digitada
    const base = inp(`monthly.reforma.${g}.${i}.1`, 'base', r[0] + ' — base');
    const tipo = TIPOS.some(([v]) => v === r[3]) ? r[3] : 'geral';
    const tipoSel = `<select class="chip-sel" data-tipo data-g="${g}" data-i="${i}" aria-label="Tipo de alíquota — ${esc(r[0])}" title="Tipo de alíquota">` +
      TIPOS.map(([v, l]) => `<option value="${v}"${v === tipo ? ' selected' : ''}>${l}</option>`).join('') + `</select>`;
    return `<div class="g4 cr">
    <span class="nmcol"><span class="nmwrap">${cred ? inp(`monthly.reforma.${g}.${i}.0`, 'txt', `Nome da linha ${i + 1}`, 'txt') : `<span class="nm">${NOME_RECEITA}</span>`}
      <span class="row-ctl">${tipoSel}<button class="x" data-act="rm" data-g="${g}" data-i="${i}" aria-label="Remover ${esc(r[0])}" title="Remover linha">×</button></span></span></span>
    ${base}
    <span class="r m" data-o="m.${k}.${i}.aliq"></span>
    <span class="cr-v" data-o="m.${k}.${i}.val"></span></div>`;
  }).join('');
}

      <div class="sum-bar"><span class="sb-l">Débito total</span>
        <span class="sb-track" aria-hidden="true"><span class="fill c-deb" data-w="b.deb"></span></span><span class="sb-v" data-o="m.debitoTotal"></span></div>
      <div class="sum-bar"><span class="sb-l">Crédito total</span>
        <span class="sb-track" aria-hidden="true"><span class="fill cr-compras" data-w="cr.compras"></span><span class="fill cr-despesas" data-w="cr.despesas"></span><span class="fill cr-outras" data-w="cr.outras"></span><span class="fill cr-saldo" data-w="cr.saldo"></span></span>
        <span class="sb-v" data-o="m.creditoTotal"></span><span class="sb-leg" data-v="cr.temLegenda" data-o="cr.legenda"></span></div>
    </div>`;
