      }
      if(!deb.length) deb.push(['Receita PGDAS', 0, S.monthly.reforma.aliqGeral || 0, 'geral', 'pgdas']);
      const i = Math.min(Math.max(0, +destino || 0), deb.length - 1);
      const soma = deb.reduce((a, r) => a + (+r[1] || 0), 0);
      deb[i][1] = x.valor - (soma - (+deb[i][1] || 0));   // a linha escolhida fecha o total
      sincronizarReceita();
    }
    if(x.k === 'das'){
      const trib = S.monthly.tributarias, atual = linhaSimples(trib);
      if(atual) atual[1] = x.valor; else trib.push(['Simples Nacional', x.valor]);
    }
    if(x.k === 'rbt12') S.monthly.rbt12 = x.valor;
    if(x.k === 'anexo'){
      if(x.porAtividade){
        // o anexo mora em cada linha de receita; o da empresa só é preenchido se estiver vazio, com o da
        // receita que mais pesa — é o que o painel usa quando uma linha não tem anexo próprio
        const escolhidos = x.porAtividade.map(a => ({...a, esc: String((extras || {})[`pg_anexo_${a.i}`] || '')}))
          .filter(a => ANEXOS[a.esc]);
        if(!escolhidos.length) return;
        if(!ANEXOS[S.anexo]) S.anexo = escolhidos.slice().sort((a, b) => b.receita - a.receita)[0].esc;
        feitos.push(escolhidos.length === 1 ? 'anexo de 1 receita' : `anexo de ${escolhidos.length} receitas`);
        return;
      }
      const escolhido = x.escolher ? String((extras || {}).pg_anexo_v || '') : x.valor;
      if(!ANEXOS[escolhido]) return;                  // marcou a caixa mas não escolheu: não inventa anexo
      S.anexo = escolhido;
      feitos.push(`anexo ${escolhido}`);
      return;
    }
    feitos.push(x.rot.toLowerCase());
  });
  if(feitos.length){ render(); toast(`Preenchido: ${feitos.join(', ')} — confira e salve`); }
  return feitos.length;
}
function rComparaPgdas(d){

          `<option value="${o.v}"${o.fica < 0 ? ' disabled' : ''}${o.v === String(campo.padrao) ? ' selected' : ''}>` +
          `${esc(o.nome)}: ${brl(o.hoje)} → ${o.fica < 0 ? 'negativa' : brl(o.fica)}</option>`).join('')}</select>`
      : '';
    return `<label class="pg-item"><input type="checkbox" name="pg_${campo.k}" checked>
      <span class="pg-item-rot">${campo.rot}</span><span class="pg-item-v">${valor}</span>${seletor}</label>`;
  }).join('');
  const aplicar = campos.length ? `<div class="pg-bloco aplicar">
      <span class="cap">Preencher o mês <small>nada é gravado até você salvar</small></span>${itens}</div>` : '';

  return `<div class="pg">
    <p class="pg-ctx${alerta ? ' alerta' : ''}">${esc(contexto)}${alerta ? ` — ${esc(alerta)}` : ''}</p>
    <p class="sub">${pendentes ? `${pendentes} ${pendentes === 1 ? 'ponto não bate' : 'pontos não batem'} com o que está lançado.`
                               : 'Tudo o que dá para comparar bate com o que está lançado.'}</p>
    <div class="pg-cab"><span></span><span>Declaração</span><span>Painel</span><span>Diferença</span></div>
    ${tabela}
    ${atividades}

  </div>`;
}

                       vendas: r.vendas.map(x => [x.doc, x.nome, x.valor, x.notas, x.consumidor ? 'consumidor' : ''])};

function pesoCatalogo(){

  lista.forEach(x => { const l = noCatalogo(cat, x); if(l) porLinha.set(l, (porLinha.get(l) || 0) + x.valor); });
  return {porLinha, total: lista.reduce((a, x) => a + x.valor, 0), lado: vend.length ? 'vendas' : 'compras', tem: !!lista.length};

    // a redução da CBS do item cadastrado continua aqui: era o encontro entre as notas e o catálogo

                 const t = tipoProduto(l); return `${rotuloTipo(t)} · CBS ${FMT.pct(aliqTipo(t))}`; })()
              ].filter(Boolean).join(' · ')
  }));

// empresa do regime normal. De pessoa física, de imune e de isento também não vem crédito. A coluna continua
// editável: isto é o palpite de partida, não a palavra final.
const creditoDoRegime = reg => !reg ? ''
  : /por fora/i.test(reg) ? 'sim'

function levarParaCadeia(r){

      if(!x.doc) return;                               // sem CNPJ não dá para casar com o cadastro
      // pessoa física que compra é consumidor final: conta no resumo das vendas, não vira cliente no cadastro
      if(!ehCompra && x.pf) return;

      const nome = x.semNome ? '' : x.nome;

async function consultarCnpj(cnpj){

    try { r = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`); } catch(e){}

async function consultarRegimes(g){

    ${grupo('Lucro Presumido ou Real', por('Lucro Presumido ou Real'),

    ${grupo('Situação irregular na Receita', irregulares.map(x => x.c), 'O regime entra igual — confira se o cadastro ainda faz sentido.',

  let r, erro = '';

    r = await modal({titulo: 'Regime pelo CNPJ', html, erro,

      botoes: achados.length ? [['cancelar', 'Cancelar'], ['preencher', `Preencher ${achados.length}`, 'prim']] : [['cancelar', 'Fechar']],

// Leva os itens para o catálogo de Produtos e serviços, com a mesma chave da consolidação: o produto comprado de
// três fornecedores entra uma vez, e o que já está cadastrado só é completado (NCM, NBS), nunca duplicado.
const MAX_CATALOGO = 150;
// os itens das notas juntados pela chave, do que mais pesa ao que menos pesa — o nome vem da nota de venda
function itensDasNotas(r){
  const itens = new Map();
  const juntar = (lista, daEmpresa) => (lista || []).forEach(x => {
    const ch = chaveItem(x), a = itens.get(ch);
    if(!a) itens.set(ch, {ncm: x.ncm, nbs: x.nbs, cod: x.cod, servico: x.servico, nome: x.nome, valor: x.valor, daEmpresa});
    else {
      a.valor += x.valor;
      if(daEmpresa && !a.daEmpresa){ a.nome = x.nome; a.daEmpresa = true; }   // o nome da nota de venda é o da empresa
      if(!a.ncm && x.ncm) a.ncm = x.ncm;
      if(!a.nbs && x.nbs) a.nbs = x.nbs;
      if(!a.cod && x.cod) a.cod = x.cod;
    }
  });
  juntar((r.itens || {}).vendas, true);            // vendas primeiro: a descrição da própria empresa nomeia melhor
  juntar((r.itens || {}).compras, false);
  return [...itens.entries()].sort((a, b) => b[1].valor - a[1].valor);

function levarParaCatalogo(r){
  const ordem = itensDasNotas(r);
  if(!ordem.length) return {novos: 0, tocados: 0, fora: 0};
  const lst = S.produtos = S.produtos || [];
  const onde = new Map();
  lst.forEach((l, i) => { const ch = chaveLinha(l); if(!onde.has(ch)) onde.set(ch, i); });
  let novos = 0, tocados = 0;
  ordem.slice(0, MAX_CATALOGO).forEach(([ch, x]) => {
    const i = noCatalogo(onde, x);
    if(i !== undefined){
      const l = lst[i];
      if(!l[0] && x.nome) l[0] = x.nome;
      if(!l[2]) l[2] = x.servico ? 'servico' : 'produto';
      if(!l[3] && x.ncm && !x.servico) l[3] = x.ncm;
      if(!l[4] && x.nbs) l[4] = x.nbs;
      if(!l[6] && x.cod) l[6] = x.cod;
      // completada, a linha ganha a chave mais forte (o código, o NCM): o próximo item igual casa direto

      onde.set(ch, lst.length - 1); novos++;
    }
  });
  return {novos, tocados, fora: Math.max(0, ordem.length - MAX_CATALOGO)};

// banco e ficam 30 dias lá, mas só dá para restaurar depois de recriar a empresa — por isso a confirmação pede
// o nome digitado, e não um simples "ok".
async function excluirEmpresa(){
  if(!banco.ativo || !banco.empresaId) return;
  const emp = banco.empresas.find(e => e.id === banco.empresaId) || {};
  const nome = emp.nome || S.co || 'esta empresa', meses = (banco.meses || []).length;
  let erro = '';
  for(;;){
    const r = await modal({
      titulo: 'Excluir esta empresa',
      texto: `${nome} sai da lista de toda a equipe, com a cadeia de crédito e os produtos. ` +
        (meses ? `${meses} ${meses === 1 ? 'mês salvo vai' : 'meses salvos vão'} para a lixeira, onde ${meses === 1 ? 'fica' : 'ficam'} 30 dias. `
               : 'Nenhum mês está salvo. ') +
        'Para confirmar, digite o nome da empresa.',
      campos: [['nome', 'Nome da empresa', '']],
      erro, botoes: [['cancelar', 'Cancelar', 'prim'], ['excluir', 'Excluir empresa']], padrao: 'cancelar'
    });

      continue;
    }
    await sb(`empresas?id=eq.${encodeURIComponent(banco.empresaId)}`, {metodo: 'DELETE'});

    banco.meses = []; banco.instantaneo = null; banco.hist = null; banco.ano = null;
    toast(`${nome} excluída`);

    return abrirEmpresa(banco.empresas[0].id);
  }

// regra de crédito da despesa: "sem crédito" tira a linha das premissas; passar a ter crédito entra pela alíquota geral
async function aplicarRegra(i, valor, grupo){
  grupo = grupo || 'ga';                             // despesas gerais ou compras do mês
  const r = S.monthly[grupo][i];
  let parte = +valor;
  if(valor === 'outra'){
    const res = await modal({
      titulo: 'Outra regra de crédito', texto: `Quanto do valor de "${r[0]}" dá direito a crédito de CBS.`,
      campos: [['parte', 'Parte com crédito (%)', dec((+r[2] || 0) * 100, 0, 2)]],
      botoes: [['cancelar', 'Cancelar'], ['ok', 'Aplicar', 'prim']], padrao: 'ok'
    });
    if(res.botao !== 'ok'){ render(); focar(`select[data-regra="${grupo}"][data-i="${i}"]`); return; }
    parte = Math.max(0, Math.min(1, num(res.valores.parte) / 100));
  }
  r[2] = parte;
  if(parte === 0) r[3] = 0;
  else if(!((+r[3] || 0) > 0)) r[3] = grupo === 'compras' ? S.monthly.reforma.aliqCompras : S.monthly.reforma.aliqGeral;
  render(); focar(`select[data-regra="${grupo}"][data-i="${i}"]`);
}

    case 'notas-cadastro': levarParaCadeia(leituraDoMes()); break;
    case 'notas-limpar': S.monthly.notas = {compras: [], vendas: []};
      S.monthly.itens = {compras: [], vendas: [], resumo: {}}; S.monthly.notasUma = []; render(); break;
    case 'notas-vis': ui.notasVis = b.dataset.id; render();
      focar(`[data-act="notas-vis"][data-id="${b.dataset.id}"]`); break;
    case 'editar-empresa': ui.menu = false; render(); comErro(editarEmpresa); break;
    case 'copiar-empresa': ui.menu = false; render(); comErro(copiarEmpresa); break;
    case 'excluir-empresa': ui.menu = false; render(); comErro(excluirEmpresa); break;
    case 'lixeira': ui.menu = false; render(); comErro(abrirLixeira); break;
    case 'historico': ui.menu = false; render(); comErro(abrirHistorico); break;
    // "Restaurar padrão" carrega o exemplo da farmácia: com banco, um salvamento depois gravaria o exemplo na empresa
    // (e renomearia a empresa). Por isso só existe no modo local
    case 'pr-add':
      ui.cadastro.produtos = true; ui.cliVis = 'produtos'; ui.cliBusca = ''; ui.cliFiltro = '';
      S.produtos.push(['', 'geral', 'produto', '', '', '', '']); render();
      { const n = app.querySelector(`input[data-b="produtos.${S.produtos.length - 1}.0"]`); if(n) n.focus(); }
      break;
    case 'pr-rm': S.produtos.splice(i, 1); render(); break;
    case 'baixar': ui.menu = false; render(); baixar(); break;
    case 'restaurar': S = defaults(); ui.menu = false; render(); toast('Padrão restaurado'); break;
    case 'limpar':
      clearTimeout(tLimpar);
      if(!ui.armado){
        ui.armado = true; render(); focar('[data-act="limpar"]');
        toast('Isso zera todos os valores. Clique de novo para confirmar.');
        tLimpar = setTimeout(() => { if(ui.armado){ ui.armado = false; if(ui.menu) render(); } }, 5000);
      } else {
        ui.armado = false; ui.menu = false; S = limparTudo(); render(); toast('Valores zerados — pronto para preencher');
      }
      break;
    case 'add':
      if(g === 'debitos') rf.debitos.push([NOME_RECEITA, 0, rf.aliqGeral, 'geral']);
      else rf.creditos.push(['Novo crédito', 0, aliqTipo('geral'), 'geral']);   // pelo tipo, como as demais
      render();
      { const campo = g === 'debitos' ? '1' : '0';   // receita já entra pelo valor; crédito, pelo nome
        const n = app.querySelector(`input[data-b="monthly.reforma.${g}.${rf[g].length - 1}.${campo}"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm': rf[g].splice(i, 1); if(g === 'debitos') sincronizarReceita(); render(); break;
    case 'add-ga':                                   // despesa nova entra com crédito integral pela alíquota geral
      S.monthly.ga.push(['Nova despesa', 0, 1, rf.aliqGeral]); render();
      { const n = app.querySelector(`input[data-b="monthly.ga.${S.monthly.ga.length - 1}.0"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm-ga': S.monthly.ga.splice(i, 1); render(); break;
    case 'li-add': {                                 // custos, vendas e tributárias (mês e exercício)
      const cam = b.dataset.lista, lst = getPath(cam);
      lst.push(['', 0]); render();
      const n = app.querySelector(`input[data-b="${cam}.${lst.length - 1}.0"]`); if(n) n.focus();
    } break;
    case 'li-rm': getPath(b.dataset.lista).splice(i, 1); render(); break;
    case 'das-digitar': {                            // passa o DAS calculado para o campo, para conferir ou ajustar
      const l = linhaSimples(S.monthly.tributarias); if(!l || ui.present) break;   // apresentação não altera valores
      l[1] = calcMes().dasBase; render();
      const n = app.querySelector(`input[data-b="monthly.tributarias.${S.monthly.tributarias.indexOf(l)}.1"]`);
      if(n){ n.focus(); n.select(); }
    } break;
    case 'add-es':
      (S.monthly.estoque = S.monthly.estoque || []).push(['Nova linha', 0]); render();
      { const n = app.querySelector(`input[data-b="monthly.estoque.${S.monthly.estoque.length - 1}.0"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm-es': S.monthly.estoque.splice(i, 1); render(); break;
    case 'add-co':                                   // compra nova entra com crédito integral pela alíquota das compras
      S.monthly.compras.push(['Nova compra', 0, 1, rf.aliqCompras || 0]); render();
      { const n = app.querySelector(`input[data-b="monthly.compras.${S.monthly.compras.length - 1}.0"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm-co': S.monthly.compras.splice(i, 1); render(); break;
    case 'logo-padrao': S.logo = null; refresh(); break;
    // andar um mês para trás ou para frente, dentro dos meses salvos
    case 'mes-passo': { const meses = banco.meses || [], i = meses.indexOf(banco.periodo);
      const alvo = i >= 0 ? meses[i + (+b.dataset.d || 0)] : null;
      if(alvo) comErro(() => trocar('periodo', alvo)); break; }
    // o trilho leva até a seção, com folga para o cabeçalho fixo não cobrir o título
    // o mês que falta: se já existe no banco, abre; senão, abre o fluxo de mês novo
    // abrir a carteira: carrega os doze meses de cada empresa na competência aberta
    case 'carteira': comErro(async () => {
      if(!(await podeSair())){ render(); return; }
      ui.tab = 'empresas'; ui.menu = false; render();
      await carregarCarteira(banco.periodo || periodoAtual());
    }); break;
    case 'carteira-mes': { const c = banco.carteira;
      comErro(() => carregarCarteira(somarMeses((c && c.periodo) || banco.periodo || periodoAtual(), +b.dataset.d || 0)));
      break; }
    case 'mes-menu': ui.menuMes = !ui.menuMes; render(); focar('[data-act="mes-menu"]'); break;
    case 'mes-escolher': ui.menuMes = false; comErro(() => trocar('periodo', b.dataset.p)); break;
    case 'mes-novo': ui.menuMes = false; render(); comErro(novoMes); break;
    case 'emp-menu':
      if(ui.present) break;                            // na apresentação, a lista de empresas não vai para a tela
      // com a barra recolhida, a lista abriria espremida em 64px: abre a barra junto
      if(ui.latFina){ ui.latFina = false; ui.menuEmp = true; } else ui.menuEmp = !ui.menuEmp;
      ui.buscaEmpMenu = ''; render();
      { const c = app.querySelector('input[data-busca-menu]'); if(c) c.focus(); else focar('[data-act="emp-menu"]'); } break;
    case 'emp-escolher': ui.menuEmp = false; comErro(() => trocar('empresa', b.dataset.id)); break;
    case 'emp-nova': ui.menuEmp = false; render(); comErro(novaEmpresa); break;
    case 'emp-filtro': ui.filtroEmp = b.dataset.id; render(); focar(`[data-act="emp-filtro"][data-id="${b.dataset.id}"]`); break;
    case 'emp-limpar': ui.buscaEmp = ''; ui.filtroEmp = 'todas'; render(); break;
    // clicar na linha abre a empresa: na Visão geral quando o mês está lançado, no Lançamento quando não está
    case 'abrir-empresa': { const id = b.dataset.id, salvo = b.dataset.salvo === '1';
      comErro(async () => { await trocar('empresa', id); irPara(salvo ? 'visao' : 'resultado'); garantirAnoDaTela(); });
      break; }
    case 'nova-empresa': comErro(novaEmpresa); break;
    case 'ano-meses': ui.anoMeses = !ui.anoMeses; render(); focar('[data-act="ano-meses"]'); break;
    case 'ano-lancar': { const per = b.dataset.p;
      if((banco.meses || []).includes(per)) comErro(async () => { await trocar('periodo', per); irPara('resultado'); });
      else comErro(novoMes);
      break; }
    case 'ir-secao': { const alvo = document.getElementById('sec-' + b.dataset.id);
      if(alvo) scrollTo({top: alvo.getBoundingClientRect().top + scrollY - 100, behavior: 'smooth'}); break; }
    case 'cadeia': ui.cadeia = b.dataset.id; render(); focar(`[data-act="cadeia"][data-id="${b.dataset.id}"]`); break;
    // trocar de visão zera a busca e o filtro: cada lista começa inteira
    // o item do menu lateral e a régua antiga usam a mesma ação: escolher a lista já abre a aba do cliente
    case 'cli-vis': ui.cliVis = b.dataset.id; ui.cadeia = b.dataset.id === 'clientes' ? 'clientes' : 'fornecedores';
      ui.cliBusca = ''; ui.cliFiltro = '';
      if(ui.tab !== 'cliente'){ irPara('cliente'); } else { render(); }
      focar(`[data-act="cli-vis"][data-id="${b.dataset.id}"]`); break;
    case 'cli-filtro': ui.cliFiltro = ui.cliFiltro === b.dataset.id ? '' : b.dataset.id; render();
      focar(`[data-act="cli-filtro"][data-id="${b.dataset.id}"]`); break;
    case 'cli-limpar': ui.cliBusca = ''; ui.cliFiltro = ''; render(); break;
    case 'cad-add':
      ui.cadastro.cadeia = true; ui.cliVis = g; ui.cadeia = g; ui.cliBusca = ''; ui.cliFiltro = '';
      S.cadeia[g].push(['', '', '', '']); render();
      { const n = app.querySelector(`input[data-b="cadeia.${g}.${S.cadeia[g].length - 1}.0"]`); if(n) n.focus(); }
      break;
    case 'cad-rm': S.cadeia[g].splice(i, 1); render(); break;
    case 'cad-regimes': comErro(() => consultarRegimes(g)); break;
    case 'cad-limpar': comErro(() => limparCadastro(g)); break;
  }
});
document.addEventListener('click', e => {
  if(ui.menu && !e.target.closest('.menu-wrap')){ ui.menu = false; ui.armado = false; render(); }
  if(ui.menuEmp && !e.target.closest('.lat-emp-wrap')){ ui.menuEmp = false; render(); }
  if(ui.menuMes && !e.target.closest('.lat-comp-wrap')){ ui.menuMes = false; render(); }
  if(ui.lpMenu && !e.target.closest('.lp-ver')){ ui.lpMenu = false; render(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.body.classList.contains('realcando')){ realcar(null); return; }
  if(e.key === 'Escape' && ui.menu){ ui.menu = false; ui.armado = false; render(); focar('[data-act="menu"]'); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && banco.ativo && banco.sessao){ e.preventDefault(); salvarBanco(); }
});
app.addEventListener('submit', async e => {
  if(!e.target.matches('[data-form="login"]')) return;
  e.preventDefault();
  const f = new FormData(e.target), bt = e.target.querySelector('button[type="submit"]');
  bt.disabled = true; bt.textContent = 'Entrando…';
  try { await entrar(String(f.get('email') || '').trim(), String(f.get('senha') || '')); }
  catch(err){
    banco.msgLogin = err.status === 400 ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + err.message;
    render();
  }
});
// Imprimir / PDF: pergunta quanto sai no papel e abre (ou fecha) as seções só durante a impressão — a tela volta
// como estava. Ctrl+P imprime a tela do jeito que está, com a mesma folha e o mesmo rodapé
const IMPRESSAO = {
  resultado: ['Lançamento', 'DRE, Simples, estoque, CBS e o quadro dos dois regimes, sem abrir as linhas.',
    'Com as linhas de receita e despesas, as compras, a posição de estoque e a memória de cálculo da CBS.'],
  anual: ['Anual', 'O ano somado pelos meses salvos e os cartões do Lucro Presumido.',
    'Com a apuração do Lucro Presumido por trimestre, em resumo.',
    'A mesma apuração com uma coluna por mês salvo — em folha deitada, que é o que comporta doze colunas.'],
  cliente: ['Resumo do cliente', 'Os gráficos da cadeia de crédito e dos produtos.', 'Com as tabelas de cadastro de fornecedores (ou clientes) e de produtos.'],
};
async function imprimir(){
  ui.menu = false; ui.armado = false; render();
  const [aba, totais, completo, mensal] = IMPRESSAO[ui.tab];
  const aberto = ui.tab === 'cliente' ? ui.cadastro.cadeia || ui.cadastro.produtos
    : ui.detalhe || (ui.tab === 'resultado' && (ui.memoria || ui.estoque)) || (ui.tab === 'anual' && ui.presumido);
  // a aba Anual ganha a terceira escolha quando há tabela do Presumido para imprimir mês a mês
  const temMensal = !!mensal && ui.tab === 'anual' && !!(banco.presumido && banco.presumido.de === banco.ano);
  const {botao} = await modal({titulo: 'Imprimir ou salvar em PDF', texto: `Aba ${aba}. O que deve sair no papel?`,
    html: `<div class="imp-opcoes"><p><b>Só os totais</b>${esc(totais)}</p><p><b>Com o detalhamento</b>${esc(completo)}</p>` +
      (temMensal ? `<p><b>Mês a mês</b>${esc(mensal)}</p>` : '') + `</div>`,
    botoes: [['cancelar', 'Cancelar'], ['totais', 'Só os totais', aberto ? '' : 'prim'],
      ['completo', 'Com o detalhamento', aberto && !ui.lpMes ? 'prim' : '']]
      .concat(temMensal ? [['mensal', 'Mês a mês', aberto && ui.lpMes ? 'prim' : '']] : []),
    padrao: !aberto ? 'totais' : ui.lpMes && temMensal ? 'mensal' : 'completo'});
  if(botao !== 'totais' && botao !== 'completo' && botao !== 'mensal') return;
  // no papel a tabela do Presumido sai por trimestre e em resumo: doze colunas de mês não cabem em A4 e a
  // tabela saía cortada. Os dois cenários do Simples ficam, e as colunas sem movimento não voltam
  const antes = {detalhe: ui.detalhe, memoria: ui.memoria, estoque: ui.estoque, presumido: ui.presumido, imprimindo: ui.imprimindo,
    lpCenario: ui.lpCenario, lpResumo: ui.lpResumo, lpVazias: ui.lpVazias, lpMes: ui.lpMes,
    papelDeitado: ui.papelDeitado, cadastro: {...ui.cadastro}};
  ui.lpCenario = 'ambos'; ui.lpResumo = true; ui.lpVazias = false; ui.lpMes = botao === 'mensal';
  ui.papelDeitado = botao === 'mensal';          // treze colunas só cabem em folha deitada (ver prepararFolha)
  const tudo = botao === 'completo' || botao === 'mensal';
  if(ui.tab === 'cliente'){ ui.cadastro = {cadeia: tudo, produtos: tudo}; ui.imprimindo = true; }
  else {
    ui.detalhe = tudo;
    if(ui.tab === 'resultado'){ ui.memoria = tudo; ui.estoque = tudo; }
    if(ui.tab === 'anual') ui.presumido = tudo;
  }
  render();
  addEventListener('afterprint', () => { Object.assign(ui, antes); render(); }, {once: true});
  setTimeout(() => window.print(), 50);
}
// a folha: rodapé em toda página, data de emissão no cabeçalho e o título, que o Chrome usa como nome do PDF
function prepararFolha(){
  const rotulo = (ui.tab === 'cliente' ? 'Resumo do cliente' : 'DRE') + ' · ' + (ui.tab === 'anual' ? S.anoLabel : S.mesLabel);
  const periodo = ui.tab === 'anual' ? String(S.anoLabel || '').toLowerCase() : competencia(S.mesLabel).replace('/', '-');
  const info = document.getElementById('imp-info');
  if(info) info.textContent = ['valores em reais',              // o CNPJ já aparece na linha de contexto
    'emitido em ' + dataHora(Date.now()).replace(', ', ' às ')].join(' · ');
  const aspas = s => '"' + String(s || '').replace(/\s+/g, ' ').replace(/[\\"]/g, '\\$&') + '"';
  const caixa = 'font-family:"IBM Plex Mono",monospace; font-size:8pt; color:#8A8D94';
  let st = document.getElementById('estilo-folha');
  if(!st){ st = document.createElement('style'); st.id = 'estilo-folha'; document.head.appendChild(st); }
  // da 2ª página em diante, empresa e período no alto; embaixo, o escritório (o rodapé da tela) e a página.
  // As caixas vazias não são enfeite: cada borda com caixa definida cala a data, o título e o endereço que o Chrome
  // imprime quando "Cabeçalhos e rodapés" está ligado no diálogo
  st.textContent = `@page{size:A4 ${ui.papelDeitado ? 'landscape' : 'portrait'};
    @top-left{content:${aspas([S.co, rotulo].filter(Boolean).join(' · '))}; ${caixa}} @top-right{content:""}
    @bottom-left{content:${aspas(S.footer)}; ${caixa}}
    @bottom-right{content:"Página " counter(page) " de " counter(pages); ${caixa}}}
  @page:first{@top-left{content:""}}`;
  tituloAntesDeImprimir = document.title;
  document.title = [S.co, (ui.tab === 'cliente' ? 'Resumo do cliente ' : 'DRE ') + periodo].filter(Boolean).join(' — ').replace(/[\\/:*?"<>|]/g, '-');
}
// campo de texto não quebra linha e corta o nome comprido ("Manutenção, dedetização, equ"): durante a impressão
// cada nome ganha uma cópia em texto comum, que o CSS mostra no lugar do campo
function nomesNoPapel(sim){
  app.querySelectorAll('.in-papel').forEach(s => s.remove());
  app.querySelectorAll('input.in.txt').forEach(el => {
    el.classList.toggle('so-tela', sim);
    if(sim){ const s = document.createElement('span'); s.className = 'in-papel so-papel'; s.textContent = el.value; el.after(s); }
  });
}
// papel é claro: imprimir no modo noturno gastaria tinta e sairia ilegível. Volta ao escuro depois
let temaAntesDeImprimir = false, tituloAntesDeImprimir = '';
addEventListener('beforeprint', () => {
  if(temaEscuro()){ temaAntesDeImprimir = true; aplicarTema('claro'); refresh(); }
  prepararFolha();                                   // depois do refresh(), que escreveria o título da tela por cima
  nomesNoPapel(true);
});
addEventListener('afterprint', () => {
  nomesNoPapel(false);
  if(temaAntesDeImprimir){ temaAntesDeImprimir = false; aplicarTema('escuro'); refresh(); }
  if(tituloAntesDeImprimir){ document.title = tituloAntesDeImprimir; tituloAntesDeImprimir = ''; }
});
window.addEventListener('beforeunload', e => { if(sujo()){ e.preventDefault(); e.returnValue = ''; } });
// tela cheia pelo botão ou saindo pelo Esc: só o rótulo do botão muda, sem redesenhar a tela
document.addEventListener('fullscreenchange', () => {
  const b = app.querySelector('[data-act="tela-cheia"]');
  if(b) b.textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia';
});

/* ---------- início ---------- */
let S = defaults();
// cadastro: as tabelas da aba do cliente começam recolhidas — ali o gráfico é que conversa
const ui = {tab: 'visao', detalhe: false, estoque: false, memoria: false, cadeia: 'fornecedores', notasVis: 'parceiros', cliVis: 'fornecedores', cliBusca: '', cliFiltro: '', imprimindo: false, buscaEmp: '', filtroEmp: 'todas',
  menuEmp: false, buscaEmpMenu: '', menuMes: false, anoMeses: false, cadastro: {cadeia: null, produtos: null}, presumido: false, inssBase: false, cbsLP: false, icmsLP: false, latFina: false, latAberta: false, selo: false, termo: null, janela: 12, mesSel: null, lpCenario: 'ambos', lpResumo: true, lpVazias: false, lpMenu: false, papelDeitado: false, cbsAno: false, lpMes: false, editando: false, menu: false, personalizar: false, present: false, client: false, armado: false};
if(/cliente|apresentar/i.test(location.hash)){ ui.present = true; ui.client = true; ui.tab = 'cliente'; }
(async function(){
  await carregar();
  if(banco.ativo){ banco.sessao = guarda.ler('dre.sessao'); if(banco.sessao) return carregarDoBanco(); }
  render();
})();
</script>
