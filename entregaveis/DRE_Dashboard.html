/* ---------- banco de dados (Supabase) ---------- */
// Sem biblioteca: Auth e API REST do Supabase por fetch. Quem protege os dados é o RLS do banco
// (supabase/migrations): a chave pública sozinha não lê nada, só usuários da equipe logados.
const banco = {
  ativo: !!(SUPABASE && SUPABASE.url && SUPABASE.chave),
  sessao: null,            // {access_token, refresh_token, expires_at, email}
  carregando: false,
  empresas: [],            // [{id, nome, cnpj}]
  meses: [],               // competências salvas da empresa aberta, da mais recente para a mais antiga
  empresaId: null, periodo: null,
  heranca: null,           // o que o mês novo trouxe do anterior: {saldoDe, rbt12Meses} — só para a etiqueta na tela
  ano: null,               // {ano, linhas, carregando}: as competências do exercício, para a aba Anual
  semResumo: false,        // banco ainda sem a migração do resumo: salva sem p_resumo e não tenta de novo
  base: null,              // "atualizado_em" de quando o mês foi aberto: detecta se outra pessoa salvou depois
  instantaneo: null,       // estado no último salvamento: detecta alterações não salvas
  salvando: false, erro: '', salvoEm: null,
  msgLogin: '', emailLogin: '',
  aposLogin: null          // o que retomar depois de entrar de novo (sessão expirou no meio do trabalho)
};
const guarda = {             // localStorage com proteção: navegador sem acesso ao armazenamento não quebra o painel
  ler(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  gravar(k, v){ try { if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const rotuloMes = p => { const [a, m] = String(p).split('-'); return `${MESES[+m - 1]} ${a}`; };
const mesCurto = p => { const [a, m] = String(p).split('-'); return `${MESES[+m - 1].slice(0, 3).toLowerCase()}/${a}`; };
const mesBarra = p => { const [a, m] = String(p).split('-'); return `${m}/${a}`; };
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const hora = d => d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
function periodoAtual(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; }
// competência ± n meses (n negativo anda para trás): base do RBT12 e da herança do mês novo
function somarMeses(p, n){ const [a, m] = String(p).split('-').map(Number); const t = a * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}-01`; }
const proximoMes = p => somarMeses(p, 1);
function lerPeriodo(txt){                     // "12/2025", "2025-12" ou "Dezembro 2025" → "2025-12-01"
  const s = semAcento(txt); let m, ano, mes;
  if((m = s.match(/(\d{1,2})\s*\/\s*(\d{4})/))){ mes = +m[1]; ano = m[2]; }
  else if((m = s.match(/(\d{4})-(\d{1,2})/))){ ano = m[1]; mes = +m[2]; }
  else { const i = MESES.findIndex(n => s.includes(semAcento(n))), a = s.match(/\d{4}/); if(i >= 0 && a){ mes = i + 1; ano = a[0]; } }
  return ano && mes >= 1 && mes <= 12 ? `${ano}-${String(mes).padStart(2, '0')}-01` : null;
}
const instantaneo = () => JSON.stringify(S);
const sujo = () => banco.ativo && !!banco.empresaId && banco.instantaneo !== instantaneo();

async function sbAuth(caminho, corpo, token, metodo){
  const r = await fetch(`${SUPABASE.url}/auth/v1/${caminho}`, {
    method: metodo || 'POST',
    headers: Object.assign({apikey: SUPABASE.chave, 'Content-Type': 'application/json'}, token ? {Authorization: 'Bearer ' + token} : {}),
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch(e){}
  if(!r.ok){ const err = new Error((d && (d.error_description || d.msg || d.message)) || `HTTP ${r.status}`); err.status = r.status; throw err; }
  return d;
}
function guardarSessao(d){
  banco.sessao = d ? {
    access_token: d.access_token, refresh_token: d.refresh_token,
    expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
    email: (d.user && d.user.email) || (banco.sessao && banco.sessao.email) || ''
  } : null;
  guarda.gravar('dre.sessao', banco.sessao);
}
async function tokenValido(){
  const s = banco.sessao;
  if(!s) throw Object.assign(new Error('Entre para continuar'), {status: 401});
  if(s.expires_at - 60 > Date.now() / 1000) return s.access_token;
  try { guardarSessao(await sbAuth('token?grant_type=refresh_token', {refresh_token: s.refresh_token})); }
  catch(e){ guardarSessao(null); throw Object.assign(new Error('Sua sessão expirou'), {status: 401}); }
  return banco.sessao.access_token;
}
async function sb(caminho, o){
  o = o || {};
  const token = await tokenValido();
  const r = await fetch(`${SUPABASE.url}/rest/v1/${caminho}`, {
    method: o.metodo || 'GET',
    headers: Object.assign({apikey: SUPABASE.chave, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json'}, o.prefer ? {Prefer: o.prefer} : {}),
    body: o.corpo !== undefined ? JSON.stringify(o.corpo) : undefined
  });
  const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch(e){ d = txt; }
  if(!r.ok){
    const err = new Error((d && d.message) || `HTTP ${r.status}`); err.status = r.status;
    if(r.status === 401) guardarSessao(null);
    throw err;
  }
  return d;
}
async function comErro(fn){
  try { return await fn(); }
  catch(e){
    if(e.status === 401){ banco.msgLogin = 'Sua sessão expirou. Entre de novo.'; render(); }
    else toast('Erro no banco de dados: ' + e.message);
  }
}

// janela simples: resolve {botao, valores}; Enter = cfg.padrao, Esc = cancelar
function modal(cfg){
  return new Promise(resolve => {
    const caixa = document.getElementById('modal'), antes = document.activeElement;
    const campos = (cfg.campos || []).map(([nome, rotulo, valor, tipo]) =>
      `<label class="field"><span>${esc(rotulo)}</span><input class="in txt" name="${nome}" type="${tipo || 'text'}" value="${esc(valor || '')}" autocomplete="${tipo === 'password' ? 'new-password' : 'off'}"></label>`).join('');
    // caixas de seleção: [nome, rótulo, marcado, explicação] — FormData devolve 'on' só nas marcadas
    const caixas = (cfg.caixas || []).map(([nome, rotulo, marcado, nota]) =>
      `<label class="modal-cx"><input type="checkbox" name="${nome}"${marcado ? ' checked' : ''}><span>${esc(rotulo)}${nota ? `<small>${esc(nota)}</small>` : ''}</span></label>`).join('');
    const botoes = cfg.botoes.map(([k, rotulo, estilo]) => `<button type="button" class="btn ${estilo || ''}" data-modal="${k}">${esc(rotulo)}</button>`).join('');
    caixa.innerHTML = `<div class="modal-fundo"><form class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo">${esc(cfg.titulo)}</h2>${cfg.texto ? `<p class="sub">${esc(cfg.texto)}</p>` : ''}
      ${campos ? `<div class="modal-campos">${campos}</div>` : ''}${caixas ? `<div class="modal-campos">${caixas}</div>` : ''}${cfg.erro ? `<p class="modal-erro" role="alert">${esc(cfg.erro)}</p>` : ''}
      <div class="modal-acoes">${botoes}</div><button type="submit" hidden tabindex="-1"></button></form></div>`;
    caixa.hidden = false;
    const form = caixa.querySelector('form');
    const fechar = botao => {
      const valores = {}; new FormData(form).forEach((v, k) => { valores[k] = String(v); });
      caixa.hidden = true; caixa.innerHTML = '';
      if(antes && document.contains(antes)) antes.focus();
      resolve({botao, valores});
    };
    form.addEventListener('submit', e => { e.preventDefault(); fechar(cfg.padrao || 'cancelar'); });
    form.addEventListener('click', e => { const b = e.target.closest('[data-modal]'); if(b) fechar(b.dataset.modal); });
    form.addEventListener('keydown', e => { if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); fechar('cancelar'); } });
    (form.querySelector('input') || form.querySelector(`[data-modal="${cfg.padrao || 'cancelar'}"]`)).focus();
  });
}

// O que o mês novo traz do mês IMEDIATAMENTE anterior. É cópia etiquetada, não vínculo vivo: o número
// fica gravado neste mês e editável, e a tela diz de onde veio (banco.heranca).
// Estoque e despesas fixas saem do "modelo" do carregar_painel — quando existe mês anterior, o modelo
// é justamente ele: a ordenação do SQL põe qualquer mês anterior na frente de qualquer posterior.
const HERANCA = {saldo: true, rbt12: true, estoque: false, fixas: false};
async function herdarDoAnterior(empresaId, periodo, anterior, h){
  const info = {saldoDe: null, rbt12Meses: 0};
  if(h.saldo && anterior){
    // mês salvo antes da migração do resumo vem com "dados": o saldo credor é recalculado aqui
    const res = anterior.resumo || (anterior.dados ? resumoDe(prontoParaCalculo(anterior.dados)) : null);
    const saldo = res ? +res.saldoCredor || 0 : 0;
    if(saldo > 0.004){ S.monthly.reforma.saldoCredorAnterior = saldo; info.saldoDe = anterior.periodo; }
  }
  if(h.rbt12){
    const soma = await somarRbt12(empresaId, periodo);
    if(soma && soma.total > 0){ S.monthly.rbt12 = soma.total; info.rbt12Meses = soma.meses; }
  }
  banco.heranca = info;
}
// receita bruta dos 12 meses anteriores, somada pelos meses já salvos desta empresa
async function somarRbt12(empresaId, periodo){
  try{
    const lista = await sb('rpc/resumos', {metodo: 'POST', corpo: {p_empresa_id: empresaId,
      p_de: somarMeses(periodo, -12), p_ate: somarMeses(periodo, -1)}}) || [];
    return {total: lista.reduce((a, x) => a + (+x.receita || 0), 0), meses: lista.length};
  }catch(e){ return null; }           // banco ainda sem a função "resumos": o RBT12 segue digitado
}
// o mês anterior pode ter mudado depois: soma de novo, a pedido
async function atualizarRbt12(){
  if(!banco.empresaId || !banco.periodo) return;
  const soma = await somarRbt12(banco.empresaId, banco.periodo);
  if(!soma){ toast('O banco ainda não tem a função "resumos" — aplique a migração mais recente.'); return; }
  S.monthly.rbt12 = soma.total;
  banco.heranca = Object.assign({}, banco.heranca, {rbt12Meses: soma.meses});
  render();
  toast(soma.meses ? `Somados ${soma.meses} ${soma.meses === 1 ? 'mês salvo' : 'meses salvos'} antes desta competência`
                   : 'Nenhum mês salvo antes desta competência');
}
/* ---------- o ano pelos meses salvos (aba Anual) ---------- */
// Soma as competências do exercício. Mês salvo antes da migração do resumo não tem os números
// gravados: o estado dele é baixado e recalculado aqui, para o ano não ficar incompleto.
async function carregarAno(ano){
  let lista;
  try{
    lista = await sb('rpc/resumos', {metodo: 'POST', corpo: {p_empresa_id: banco.empresaId,
      p_de: `${ano}-01-01`, p_ate: `${ano}-12-01`}}) || [];
  }catch(e){
    // banco ainda sem a migração: explica na própria aba, sem alarde de erro
    if(e.status !== 404 && e.status !== 400) throw e;
    banco.ano = {ano, linhas: [], carregando: false, semFuncao: true}; render(); return;
  }
  const faltam = lista.filter(x => !x.resumo).map(x => x.periodo);
  if(faltam.length){
    const crus = await sb(`competencias?select=periodo,dados&empresa_id=eq.${banco.empresaId}&periodo=in.(${faltam.join(',')})`);
    const porPeriodo = {};
    (crus || []).forEach(c => { porPeriodo[c.periodo] = c.dados; });
    lista.forEach(x => { if(!x.resumo && porPeriodo[x.periodo]) x.resumo = resumoDe(prontoParaCalculo(porPeriodo[x.periodo])); });
  }
  banco.ano = {ano, linhas: lista, carregando: false};
  render();
}
function garantirAno(recarregar){
  if(!banco.ativo || !banco.empresaId) return;
  const ano = anoCompetencia();
  if(!recarregar && banco.ano && banco.ano.ano === ano) return;
  banco.ano = {ano, linhas: [], carregando: true};
  render();
  comErro(() => carregarAno(ano));
}
function totaisAno(linhas){
  const t = {rec: 0, das: 0, cbs: 0, res: 0, custos: 0, ga: 0, vendas: 0, trib: 0, nat: 0, compras: 0, n: 0};
  (linhas || []).forEach(x => {
    const r = x.resumo;
    if(!r) return;
    t.n++; t.rec += +r.receita || 0; t.das += +r.das || 0; t.cbs += +r.cbs || 0; t.res += +r.resultado || 0;
    t.custos += +r.custos || 0; t.ga += +r.ga || 0; t.vendas += +r.vendas || 0; t.trib += +r.trib || 0;
    t.nat += +r.naTransicao || 0; t.compras += +r.compras || 0;
  });
  return t;
}
// meses do exercício que ainda não têm competência salva, até o mês aberto
function mesesFaltando(linhas, ano){
  const tem = new Set((linhas || []).map(x => +x.periodo.slice(5, 7)));
  const ate = anoCompetencia() === ano ? +(lerPeriodo(S.mesLabel) || '').slice(5, 7) || 12 : 12;
  const falta = [];
  for(let m = 1; m <= ate; m++) if(!tem.has(m)) falta.push(MESES[m - 1].slice(0, 3).toLowerCase());
  return falta;
}
// duas leituras do exercício: o tamanho do ano e o que ele mostra (regime, faixa, sazonalidade)
function textoAno(t, linhas){
  const cem = v => dec(t.rec ? v / t.rec * 100 : 0, 2, 2);
  const p1 = `${t.n} ${t.n === 1 ? 'mês somado' : 'meses somados'}: receita de ${brl(t.rec)} e DAS de ${brl(t.das)} — alíquota efetiva média de ${cem(t.das)}%. Com as demais despesas tributárias, os tributos do ano somam ${brl(t.trib)}, ou ${cem(t.trib)}% da receita.`;
  const p = [];
  if(t.nat > 0.004){
    const dif = t.nat - t.das;
    p.push(Math.abs(dif) < 0.005 ? 'No acumulado do ano, os dois regimes empatam.'
      : dif > 0 ? `No acumulado do ano, o convencional sai ${brl(dif)} mais barato que apurar a CBS por fora.`
                : `No acumulado do ano, apurar a CBS por fora sai ${brl(-dif)} mais barato que o convencional.`);
  }
  const faixas = [...new Set((linhas || []).map(x => x.resumo && x.resumo.faixa).filter(Boolean))].sort();
  if(faixas.length === 1) p.push(`A empresa ficou na ${faixas[0]}ª faixa do Simples o ano todo.`);
  else if(faixas.length > 1) p.push(`A faixa do Simples foi da ${faixas[0]}ª à ${faixas[faixas.length - 1]}ª ao longo do ano.`);
  const comReceita = (linhas || []).filter(x => x.resumo && (+x.resumo.receita || 0) > 0.004);
  if(comReceita.length > 1){
    const ord = comReceita.slice().sort((a, b) => b.resumo.receita - a.resumo.receita), ultimo = ord[ord.length - 1];
    p.push(`O melhor mês em receita foi ${mesCurto(ord[0].periodo)}, com ${brl(ord[0].resumo.receita)}; o menor, ${mesCurto(ultimo.periodo)}, com ${brl(ultimo.resumo.receita)}.`);
  }
  return [p1, p.join(' ')];
}
const SUBLIMITE = 3600000;
// a receita do exercício contra o sublimite e o limite do Simples, pelo ritmo dos meses somados
function alertaLimite(t){
  const proj = t.n ? t.rec / t.n * 12 : 0;
  if(t.rec > LIMITE_SN) return `A receita do ano já passou de ${brl(LIMITE_SN)}: acima do limite do Simples Nacional.`;
  if(t.rec > SUBLIMITE) return `A receita do ano já passou do sublimite de ${brl(SUBLIMITE)}: ICMS e ISS passam a ser recolhidos fora do DAS.`;
  if(t.n >= 3 && proj > LIMITE_SN) return `No ritmo destes ${t.n} meses, o ano fecharia em ${brl(proj)} — acima do limite de ${brl(LIMITE_SN)} do Simples Nacional.`;
  if(t.n >= 3 && proj > SUBLIMITE) return `No ritmo destes ${t.n} meses, o ano fecharia em ${brl(proj)} — acima do sublimite de ${brl(SUBLIMITE)}, que tira ICMS e ISS do DAS.`;
  return '';
}
// substitui as linhas do exercício pelos totais dos meses salvos (pede confirmação: o digitado se perde)
async function preencherAno(){
  const a = banco.ano;
  if(!a || !a.linhas.length) return;
  const t = totaisAno(a.linhas);
  const r = await modal({
    titulo: 'Preencher o exercício',
    texto: `As linhas do exercício passam a ser os totais dos ${t.n} meses salvos de ${a.ano}. O que estiver digitado aqui é substituído.`,
    botoes: [['cancelar', 'Cancelar'], ['preencher', 'Substituir pelos totais', 'prim']], padrao: 'cancelar'
  });
  if(r.botao !== 'preencher'){ render(); return; }
  const rot = `soma dos meses salvos de ${a.ano}`;
  S.annual.receita = t.rec;
  S.annual.custos = [[`Custos — ${rot}`, t.custos]];
  S.annual.ga = [[`Despesas gerais e administrativas — ${rot}`, t.ga]];
  S.annual.vendas = t.vendas > 0.004 ? [[`Despesas com vendas — ${rot}`, t.vendas]] : [];
  // a linha do Simples continua com esse nome: é ela que o cálculo do exercício procura
  S.annual.tributarias = [['Simples Nacional', t.das], [`Outras despesas tributárias — ${rot}`, Math.max(0, t.trib - t.das)]];
  S.annual.resultadoInformado = t.res;
  S.annual.compraMercadoria = t.compras;
  render();
  toast(`Exercício preenchido com ${t.n} ${t.n === 1 ? 'mês salvo' : 'meses salvos'}`);
}

async function abrirMes(empresaId, periodo, op){
  op = op || {};
  const r = await sb('rpc/carregar_painel', {metodo: 'POST', corpo: {p_empresa_id: empresaId, p_periodo: periodo}});
  const cadeia = {fornecedores: [], clientes: []};
  (r.parceiros || []).forEach(p => cadeia[p[0] === 'cliente' ? 'clientes' : 'fornecedores'].push([p[1] || '', p[2] || '', p[3] || '', p[4] || '']));
  const novo = !r.competencia;
  banco.heranca = null; banco.ano = null;          // o quadro do ano é refeito ao entrar na aba Anual
  if(!novo){
    S = mesclar(defaults(), migrar(r.competencia.dados)); S.cadeia = cadeia; normalizarDebitos(S.monthly.reforma);
    banco.base = r.competencia.atualizado_em;
  } else {
    // mês ainda não salvo: a tela atual (primeira empresa) ou o mês salvo mais próximo, com os valores zerados
    if(!op.manterTela){
      const h = op.heranca || HERANCA;
      S = zerarValores(r.modelo ? mesclar(defaults(), migrar(r.modelo)) : defaults(), h); S.cadeia = cadeia; normalizarDebitos(S.monthly.reforma);
      if(!r.modelo) S.anexo = '';                  // empresa nova: o anexo do exemplo não vale para ela
      S.mesLabel = rotuloMes(periodo);             // a herança calcula pelo ano desta competência
      await herdarDoAnterior(empresaId, periodo, r.anterior, h);
    }
    S.co = (banco.empresas.find(e => e.id === empresaId) || {}).nome || S.co;
    banco.base = '-infinity';                      // no banco, "este mês ainda não pode existir"
  }
  S.mesLabel = rotuloMes(periodo);
  Object.assign(banco, {empresaId, periodo, erro: '', salvoEm: null, instantaneo: novo ? null : instantaneo()});
  guarda.gravar('dre.ultimo', {empresaId, periodo});
  ui.menu = false;
  render();
  if(novo && !op.semSalvar) await salvarBanco();
}

// Excluir a competência aberta: apaga do banco para toda a equipe, sem desfazer. A cadeia de
// crédito é da empresa (não do mês) e não é tocada.
async function excluirMes(){
  if(!banco.empresaId || !banco.periodo || !(banco.meses || []).includes(banco.periodo)) return;
  const empresa = (banco.empresas.find(e => e.id === banco.empresaId) || {}).nome || S.co, alvo = banco.periodo;
  const r = await modal({
    titulo: 'Excluir este mês',
    texto: `${empresa} · ${mesCurto(alvo)} será apagado do banco de dados, para toda a equipe. Não dá para desfazer.`,
    botoes: [['cancelar', 'Cancelar', 'prim'], ['excluir', 'Excluir o mês']],
    padrao: 'cancelar'
  });
  if(r.botao !== 'excluir'){ render(); return; }
  await sb(`competencias?empresa_id=eq.${encodeURIComponent(banco.empresaId)}&periodo=eq.${alvo}`, {metodo: 'DELETE'});
  banco.meses = banco.meses.filter(p => p !== alvo);
  banco.instantaneo = null;                        // o que está na tela deixou de ser um mês salvo
  toast(`${mesCurto(alvo)} excluído`);
  // abre o mês salvo mais recente; se não sobrou nenhum, o mês atual, sem gravar
  if(banco.meses.length) return abrirMes(banco.empresaId, banco.meses[0]);
  return abrirMes(banco.empresaId, periodoAtual(), {semSalvar: true});
}

async function salvarBanco(forcar){
  if(!banco.ativo){ toast('Banco de dados não configurado — veja "Banco de dados" no README.'); return; }
  if(!banco.sessao){ banco.aposLogin = () => salvarBanco(forcar); render(); return; }
  if(!banco.empresaId) return comErro(novaEmpresa);
  if(banco.salvando) return;
  const enviado = instantaneo(), dados = JSON.parse(enviado);
  const cadeia = dados.cadeia || {fornecedores: [], clientes: []}; delete dados.cadeia;
  const linha = tipo => r => [tipo, limpaCnpj(r[0]), r[1] || '', r[2] || '', r[3] || ''];
  const parceiros = cadeia.fornecedores.map(linha('fornecedor')).concat(cadeia.clientes.map(linha('cliente')));
  banco.salvando = true; banco.erro = ''; atualizarBarra();
  try{
    // p_resumo: os números do mês, para a herança e para a aba Anual. Banco ainda sem a migração
    // recusa o parâmetro — nesse caso salva sem ele e não tenta de novo nesta sessão.
    const corpo = {p_empresa_id: banco.empresaId, p_periodo: banco.periodo, p_dados: dados,
                   p_parceiros: parceiros, p_base: forcar ? null : banco.base};
    if(!banco.semResumo) corpo.p_resumo = resumoDe(S);
    try { banco.base = await sb('rpc/salvar_painel', {metodo: 'POST', corpo}); }
    catch(err){
      if(banco.semResumo || !(err.status === 404 || err.status === 400)) throw err;
      banco.semResumo = true; delete corpo.p_resumo;
      banco.base = await sb('rpc/salvar_painel', {metodo: 'POST', corpo});
    }
    banco.instantaneo = enviado; banco.salvoEm = new Date(); banco.salvando = false;
    const mesNovo = !banco.meses.includes(banco.periodo);
    if(mesNovo) banco.meses = banco.meses.concat(banco.periodo).sort().reverse();
    const emp = banco.empresas.find(e => e.id === banco.empresaId), nome = String(S.co || '').trim();
    const renomeou = !!(emp && nome && emp.nome !== nome);
    if(renomeou){ emp.nome = nome; banco.empresas.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')); }
    if(mesNovo || renomeou){ const foco = document.activeElement && document.activeElement.id; render(); if(foco) focar('#' + foco); }
    else atualizarBarra();
    toast('Salvo no banco de dados');
  }catch(e){
    banco.salvando = false;
    if(e.message === 'CONFLITO'){ atualizarBarra(); return resolverConflito(); }
    if(e.status === 401){
      banco.aposLogin = () => salvarBanco(forcar);
      banco.msgLogin = 'Sua sessão expirou. Entre de novo — o que você preencheu continua aqui.';
      render(); return;
    }
    banco.erro = e.message; atualizarBarra();
    toast('Não foi possível salvar: ' + e.message);
  }
}
async function resolverConflito(){
  const r = await modal({
    titulo: 'Outra pessoa salvou este mês',
    texto: `${S.co} · ${mesCurto(banco.periodo)} foi salvo por outra pessoa depois que você abriu. O que fazer com as suas alterações?`,
    botoes: [['sobrescrever', 'Salvar as minhas por cima'], ['recarregar', 'Descartar e abrir a versão salva'], ['cancelar', 'Cancelar', 'prim']],
    padrao: 'cancelar'
  });
  if(r.botao === 'sobrescrever') return salvarBanco(true);
  if(r.botao === 'recarregar') return comErro(() => abrirMes(banco.empresaId, banco.periodo));
}
async function podeSair(){
  if(!sujo()) return true;
  const r = await modal({
    titulo: 'Alterações não salvas',
    texto: `Há alterações em ${S.co} · ${mesCurto(banco.periodo)} que ainda não foram salvas.`,
    botoes: [['salvar', 'Salvar e continuar', 'prim'], ['descartar', 'Descartar'], ['cancelar', 'Cancelar']],
    padrao: 'salvar'
  });
  if(r.botao === 'salvar'){ await salvarBanco(); return !sujo(); }
  return r.botao === 'descartar';
}
async function trocar(tipo, valor){
  if(valor === '__nova__'){ render(); return comErro(tipo === 'empresa' ? novaEmpresa : novoMes); }
  if(!(await podeSair())){ render(); return; }
  await comErro(() => tipo === 'empresa' ? abrirEmpresa(valor) : abrirMes(banco.empresaId, valor));
}
async function novaEmpresa(){
  if(!(await podeSair())){ render(); return; }
  const primeira = !banco.empresas.length;
  let valores = {nome: primeira ? S.co : '', cnpj: '', periodo: mesBarra(primeira ? (lerPeriodo(S.mesLabel) || periodoAtual()) : periodoAtual())};
  let erro = '';
  for(;;){
    const r = await modal({
      titulo: primeira ? 'Cadastre a primeira empresa' : 'Nova empresa',
      texto: primeira ? 'O que está na tela agora será salvo nesta empresa.' : 'A empresa começa com as categorias e alíquotas padrão e os valores zerados.',
      campos: [['nome', 'Nome da empresa', valores.nome], ['cnpj', 'CNPJ (opcional)', valores.cnpj], ['periodo', 'Competência (mês/ano)', valores.periodo]],
      erro, botoes: [['cancelar', 'Cancelar'], ['criar', 'Cadastrar e salvar', 'prim']], padrao: 'criar'
    });
    if(r.botao !== 'criar'){ render(); return; }
    valores = r.valores;
    const nome = (valores.nome || '').trim(), cnpj = limpaCnpj(valores.cnpj), periodo = lerPeriodo(valores.periodo);
    erro = !nome ? 'Informe o nome da empresa.'
      : cnpj && !cnpjValido(cnpj) ? 'CNPJ inválido — confira os números.'
      : !periodo ? 'Competência inválida — use mês/ano, por exemplo 12/2025.' : '';
    if(erro) continue;
    try{
      const [empresa] = await sb('empresas?select=id,nome,cnpj', {metodo: 'POST', corpo: {nome, cnpj: cnpj || null}, prefer: 'return=representation'});
      banco.empresas = banco.empresas.concat(empresa).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      banco.meses = [];
      if(primeira) S.co = nome;
      return abrirMes(empresa.id, periodo, {manterTela: primeira});
    }catch(e){
      if(e.status === 401) throw e;
      erro = e.status === 409 ? 'Já existe uma empresa com esse CNPJ.' : 'Não foi possível cadastrar: ' + e.message;
    }
  }
}
async function novoMes(){
  if(!banco.empresaId) return novaEmpresa();
  if(!(await podeSair())){ render(); return; }
  let valor = mesBarra(banco.meses.length ? proximoMes(banco.meses[0]) : periodoAtual()), erro = '';
  let h = Object.assign({}, HERANCA);
  for(;;){
    const r = await modal({
      titulo: 'Novo mês',
      texto: 'Começa com as categorias, as alíquotas e a cadeia de crédito do mês salvo mais próximo, com os valores zerados. Se o mês já existir, ele é aberto.',
      campos: [['periodo', 'Competência (mês/ano)', valor]],
      caixas: [
        ['saldo', 'Saldo credor da CBS', h.saldo, 'o "CBS Crédito" que sobrou no mês anterior vira crédito inicial deste'],
        ['rbt12', 'Receita dos últimos 12 meses', h.rbt12, 'somada pelos meses já salvos desta empresa; confira no PGDAS'],
        ['estoque', 'Posição de estoque', h.estoque, 'repete as linhas e os valores do mês anterior, para você ajustar'],
        ['fixas', 'Valores das despesas gerais', h.fixas, 'repete aluguel, contabilidade, folha… em vez de começar zerado']
      ],
      erro, botoes: [['cancelar', 'Cancelar'], ['criar', 'Criar e salvar', 'prim']], padrao: 'criar'
    });
    if(r.botao !== 'criar'){ render(); return; }
    valor = r.valores.periodo;
    h = {saldo: r.valores.saldo === 'on', rbt12: r.valores.rbt12 === 'on',
         estoque: r.valores.estoque === 'on', fixas: r.valores.fixas === 'on'};
    const periodo = lerPeriodo(valor);
    if(!periodo){ erro = 'Competência inválida — use mês/ano, por exemplo 01/2026.'; continue; }
    await listarMeses(banco.empresaId);
    return abrirMes(banco.empresaId, periodo, {heranca: h});
  }
}
async function alterarSenha(){
  let erro = '';
  for(;;){
    const r = await modal({
      titulo: 'Alterar senha',
      texto: `Nova senha para ${banco.sessao.email}. Use pelo menos 8 caracteres.`,
      campos: [['senha', 'Nova senha', '', 'password'], ['confirma', 'Repita a nova senha', '', 'password']],
      erro, botoes: [['cancelar', 'Cancelar'], ['salvar', 'Salvar senha', 'prim']], padrao: 'salvar'
    });
    if(r.botao !== 'salvar') return;
    const senha = r.valores.senha || '';
    erro = senha.length < 8 ? 'A senha precisa ter pelo menos 8 caracteres.'
      : senha !== r.valores.confirma ? 'As duas senhas não são iguais.' : '';
    if(erro) continue;
    try { await sbAuth('user', {password: senha}, await tokenValido(), 'PUT'); toast('Senha alterada'); return; }
    catch(e){ if(e.status === 401) throw e; erro = 'Não foi possível alterar: ' + e.message; }

}
async function sair(){
  if(!(await podeSair())){ render(); return; }
  const token = banco.sessao && banco.sessao.access_token;
  guardarSessao(null);
  try { if(token) await sbAuth('logout', null, token); } catch(e){}
  Object.assign(banco, {empresas: [], meses: [], empresaId: null, periodo: null, base: null, instantaneo: null, erro: '', salvoEm: null, msgLogin: ''});
  S = defaults(); ui.menu = false;
  render();
}

// regra de crédito da despesa: "sem crédito" tira a linha das premissas; passar a ter crédito entra pela alíquota geral
async function aplicarRegra(i, valor, grupo){
  grupo = grupo || 'ga';                             // despesas gerais ou compras do mês
  const r = S.monthly[grupo][i];
  let parte = +valor;
  if(valor === 'outra'){
    const res = await modal({
      titulo: 'Outra regra de crédito', texto: `Quanto do valor de "${r[0]}" dá direito a crédito de CBS.`,
      campos: [['parte', 'Parte com crédito (%)', dec((+r[2] || 0) * 100, 0, 2)]],
      botoes: [['cancelar', 'Cancelar'], ['ok', 'Aplicar', 'prim']], padrao: 'ok'
    });
    if(res.botao !== 'ok'){ render(); focar(`select[data-regra="${grupo}"][data-i="${i}"]`); return; }
    parte = Math.max(0, Math.min(1, num(res.valores.parte) / 100));
  }
  r[2] = parte;
  if(parte === 0) r[3] = 0;
  else if(!((+r[3] || 0) > 0)) r[3] = grupo === 'compras' ? S.monthly.reforma.aliqCompras : S.monthly.reforma.aliqGeral;
  render(); focar(`select[data-regra="${grupo}"][data-i="${i}"]`);
}

const app = document.getElementById('app');
app.addEventListener('focusin', e => {
  if(e.target.dataset && e.target.dataset.premissa === 'geral') alvoGeral = S.monthly.ga.map(r => (r[3] || 0) > 0);
});
app.addEventListener('focusout', e => { if(e.target.dataset && e.target.dataset.premissa === 'geral') alvoGeral = null; });
app.addEventListener('input', e => {
  const t = e.target; if(!t.matches('input[data-b]')) return;
  setPath(t.dataset.b, PARSE[t.dataset.f](t.value));
  if(/^monthly\.reforma\.debitos\.\d+\.1$/.test(t.dataset.b)) sincronizarReceita();   // receita = soma das linhas
  if(t.dataset.premissa) propagar(t.dataset.premissa);
  refresh();
});
app.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('input[data-file="logo"]')){
    const f = t.files && t.files[0]; if(!f) return;
    const rd = new FileReader(); rd.onload = () => { S.logo = rd.result; refresh(); }; rd.readAsDataURL(f);
    return;
  }
  if(t.matches('select[data-banco]')){ trocar(t.dataset.banco, t.value); return; }
  if(t.matches('select[data-tipo]')){
    const r = S.monthly.reforma[t.dataset.g][+t.dataset.i]; r[3] = t.value; r[2] = aliqTipo(r[3]); refresh(); return;
  }
  // produto ou serviço troca os campos da linha (NCM × NBS + cClassTrib): precisa redesenhar, não só recalcular
  if(t.matches('select[data-nat]')){ S.produtos[+t.dataset.i][2] = t.value; render(); return; }
  if(t.matches('select[data-regra]')){ aplicarRegra(+t.dataset.i, t.value, t.dataset.regra); return; }
  if(t.matches('select[data-sit]')){ S.monthly.reforma.debitos[+t.dataset.i][5] = t.value; refresh(); return; }
  if(t.matches('select[data-b]')){ setPath(t.dataset.b, t.value); refresh(); return; }
  if(!t.matches('input[data-b]') || t.type === 'color') return;
  if(t.dataset.f === 'txt' && t.dataset.b.startsWith('monthly.reforma') && !t.value.trim()) setPath(t.dataset.b, '(sem nome)');
  t.value = FMT[t.dataset.f](getPath(t.dataset.b));
  refresh();
});
app.addEventListener('keydown', e => {
  const t = e.target;
  if(e.key === 'Enter' && t.matches('input[data-b]')){ e.preventDefault(); t.blur(); return; }
  if(t.matches('[data-file-trigger]') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); t.querySelector('input').click(); return; }
  if(t.matches('.tab') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)){
    e.preventDefault();
    const ordem = ['resultado', 'cliente', 'anual'], n = ordem.length;
    let i = ordem.indexOf(t.dataset.id);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n;
    irPara(ordem[i], true);
  }
});

    case 'cadastro': { const id = b.dataset.id; ui.cadastro[id] = !ui.cadastro[id]; render(); focar(`[data-act="cadastro"][data-id="${id}"]`); } break;
    case 'memoria': ui.memoria = !ui.memoria; render(); focar('[data-act="memoria"]'); break;
    case 'editar': ui.editando = !ui.editando; ui.menu = false; render();
      toast(ui.editando ? 'Edição ligada — clique nos valores da DRE' : 'Edição desligada'); break;
    case 'personalizar': ui.personalizar = !ui.personalizar; ui.menu = false; render(); break;
    case 'present': ui.present = !ui.present; ui.menu = false; render(); break;
    case 'print': ui.menu = false; render(); setTimeout(() => window.print(), 50); break;
    case 'salvar': ui.menu = false; render(); salvar(); break;
    case 'salvar-banco': salvarBanco(); break;
    case 'rbt12': comErro(atualizarRbt12); break;
    case 'sair': ui.menu = false; sair(); break;
    case 'senha': ui.menu = false; render(); comErro(alterarSenha); break;
    case 'excluir-mes': ui.menu = false; render(); comErro(excluirMes); break;
    case 'pr-add':
      ui.cadastro.produtos = true;                   // quem adiciona quer ver a tabela
      S.produtos.push(['', 'geral', 'produto', '', '', '']); render();
      { const n = app.querySelector(`input[data-b="produtos.${S.produtos.length - 1}.0"]`); if(n) n.focus(); }
      break;
    case 'pr-rm': S.produtos.splice(i, 1); render(); break;
    case 'baixar': ui.menu = false; render(); baixar(); break;
    case 'restaurar': S = defaults(); ui.menu = false; render(); toast('Padrão restaurado'); break;
    case 'limpar':
      clearTimeout(tLimpar);
      if(!ui.armado){
        ui.armado = true; render(); focar('[data-act="limpar"]');
        toast('Isso zera todos os valores. Clique de novo para confirmar.');
        tLimpar = setTimeout(() => { if(ui.armado){ ui.armado = false; if(ui.menu) render(); } }, 5000);
      } else {
        ui.armado = false; ui.menu = false; S = limparTudo(); render(); toast('Valores zerados — pronto para preencher');
      }
      break;
    case 'add':
      if(g === 'debitos') rf.debitos.push([NOME_RECEITA, 0, rf.aliqGeral, 'geral']);
      else rf.creditos.push(['Novo crédito', 0, rf.aliqCompras || 0, 'geral']);   // mesma alíquota das compras: não muda o total
      render();
      { const campo = g === 'debitos' ? '1' : '0';   // receita já entra pelo valor; crédito, pelo nome
        const n = app.querySelector(`input[data-b="monthly.reforma.${g}.${rf[g].length - 1}.${campo}"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm': rf[g].splice(i, 1); if(g === 'debitos') sincronizarReceita(); render(); break;
    case 'add-ga':                                   // despesa nova entra com crédito integral pela alíquota geral
      S.monthly.ga.push(['Nova despesa', 0, 1, rf.aliqGeral]); render();
      { const n = app.querySelector(`input[data-b="monthly.ga.${S.monthly.ga.length - 1}.0"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm-ga': S.monthly.ga.splice(i, 1); render(); break;
    case 'li-add': {                                 // custos, vendas e tributárias (mês e exercício)
      const cam = b.dataset.lista, lst = getPath(cam);
      lst.push(['', 0]); render();
      const n = app.querySelector(`input[data-b="${cam}.${lst.length - 1}.0"]`); if(n) n.focus();
    } break;
    case 'li-rm': getPath(b.dataset.lista).splice(i, 1); render(); break;
    case 'add-es':
      (S.monthly.estoque = S.monthly.estoque || []).push(['Nova linha', 0]); render();
      { const n = app.querySelector(`input[data-b="monthly.estoque.${S.monthly.estoque.length - 1}.0"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm-es': S.monthly.estoque.splice(i, 1); render(); break;
    case 'add-co':                                   // compra nova entra com crédito integral pela alíquota das compras
      S.monthly.compras.push(['Nova compra', 0, 1, rf.aliqCompras || 0]); render();
      { const n = app.querySelector(`input[data-b="monthly.compras.${S.monthly.compras.length - 1}.0"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm-co': S.monthly.compras.splice(i, 1); render(); break;
    case 'logo-padrao': S.logo = null; refresh(); break;
    case 'cadeia': ui.cadeia = b.dataset.id; render(); focar(`[data-act="cadeia"][data-id="${b.dataset.id}"]`); break;
    case 'cad-add':
      ui.cadastro.cadeia = true;                     // quem adiciona quer ver a tabela
      S.cadeia[g].push(['', '', '', '']); render();
      { const n = app.querySelector(`input[data-b="cadeia.${g}.${S.cadeia[g].length - 1}.0"]`); if(n) n.focus(); }
      break;
    case 'cad-rm': S.cadeia[g].splice(i, 1); render(); break;
  }
});
document.addEventListener('click', e => {
  if(ui.menu && !e.target.closest('.menu-wrap')){ ui.menu = false; ui.armado = false; render(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && ui.menu){ ui.menu = false; ui.armado = false; render(); focar('[data-act="menu"]'); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && banco.ativo && banco.sessao){ e.preventDefault(); salvarBanco(); }
});
app.addEventListener('submit', async e => {
  if(!e.target.matches('[data-form="login"]')) return;
  e.preventDefault();
  const f = new FormData(e.target), bt = e.target.querySelector('button[type="submit"]');
  bt.disabled = true; bt.textContent = 'Entrando…';
  try { await entrar(String(f.get('email') || '').trim(), String(f.get('senha') || '')); }
  catch(err){
    banco.msgLogin = err.status === 400 ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + err.message;
    render();
  }
});
window.addEventListener('beforeunload', e => { if(sujo()){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- início ---------- */
let S = defaults();
// cadastro: as tabelas da aba do cliente começam recolhidas — ali o gráfico é que conversa
const ui = {tab: 'resultado', detalhe: false, estoque: false, memoria: false, cadeia: 'fornecedores', cadastro: {cadeia: false, produtos: false}, editando: false, menu: false, personalizar: false, present: false, client: false, armado: false};
if(/cliente|apresentar/i.test(location.hash)){ ui.present = true; ui.client = true; ui.tab = 'cliente'; }
(async function(){
  await carregar();
  if(banco.ativo){ banco.sessao = guarda.ler('dre.sessao'); if(banco.sessao) return carregarDoBanco(); }
  render();
})();
</script>
