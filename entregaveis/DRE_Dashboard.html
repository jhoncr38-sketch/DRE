    .cmp-leg{grid-template-columns:minmax(0,1fr); gap:6px}             /* uma fatia por linha: três colunas não cabem */
    .cmp-parte{align-items:center}
    .cmp-parte .cg-q{margin-top:0}
    .cmp-parte > span:last-child{display:flex; align-items:baseline; gap:10px; flex:1; min-width:0}
    .cmp-parte b{margin-left:auto}
    /* receita por tipo: nome e receita; situação no DAS e tipo da CBS; débito embaixo */
    .grec{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"nome receita" "sit cbs" "deb deb"; gap:4px 10px}
    .grec > :nth-child(1){grid-area:nome}
    .grec > :nth-child(2){grid-area:receita}
    .grec > :nth-child(3){grid-area:sit; padding-left:0}
    .grec > :nth-child(4){grid-area:cbs}
    .grec > :nth-child(5){grid-area:deb; text-align:right}
    .grec.gh{display:none}
    .grec.gr > :nth-child(5)::before{content:"Débito CBS "; font:400 11px var(--sans); color:var(--muted-2)}
    .g4{grid-template-columns:minmax(0,1.2fr) 64px minmax(0,1fr); gap:2px 8px}
    .g4 > :first-child{grid-column:1 / -1}
    /* cadeia de crédito: nome em cima; CNPJ e regime; depois o crédito */
    .cad-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px; grid-template-areas:"nome nome x" "cnpj cnpj cnpj" "regime cred cred"; row-gap:6px; padding:8px 0}
    .cad-row > :nth-child(1){grid-area:cnpj}
    .cad-row > :nth-child(2){grid-area:nome}
    .cad-row > :nth-child(3){grid-area:regime}
    .cad-row > :nth-child(4){grid-area:cred}
    .cad-row > :nth-child(5){grid-area:x}
    .cad-row.gh{display:none}
    /* Lucro Presumido: no celular fica só a coluna do ano — com várias colunas a que importa sumia na rolagem */
    .gpres{grid-template-columns:minmax(0,1fr) auto; min-width:0}
    .gpres > span:not(:first-child):not(:last-child){display:none}
  }
  @media (max-width:560px){
    .page{padding:var(--e5) var(--e4) var(--e7)}
    .tab{padding:7px 10px}
    .tl-long{display:none}
    .logo{height:38px}
    .nav{justify-content:flex-start}
  }
  /* Impressão e PDF: folha A4. O rodapé de cada página (empresa, período, "Página x de y") muda com a empresa, então
     as caixas de margem são montadas no beforeprint, em #estilo-folha — ver prepararFolha() */
  @page{size:A4; margin:14mm 12mm 16mm}
  .so-papel{display:none}                                          /* texto que só faz sentido impresso */
  @media print{
    body{background:#fff}
    .page{padding:0}
    /* botão, link e instrução de uso não servem no papel */
    .so-tela, .nav, .panel, .toast, .fixo, .row-ctl, .btn, .lk, .add, .cad-mais, .cad-x, .cad-alt,
    .ano-acoes, .cad-vazio p, .anx:has(option[value=""]:checked){display:none !important}
    footer.foot{display:none}                                     /* o escritório vai no rodapé de toda página */
    .so-papel{display:revert}
    .entra{animation:none}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    /* campo e seletor viram texto: sem traço, sem seta, sem texto de exemplo */
    .in, .sel{border-bottom-color:transparent !important}
    .sel-wrap::after{display:none}
    .sel{padding-right:0}                                          /* a folga era da seta, que não sai no papel */
    .lk-linha .seta{display:none}
    .in::placeholder{color:transparent}
    .scroll-x{overflow:visible}
    .cbscol.dir small{min-height:0}
    /* no papel branco o cartão branco não aparece: o recuo dele cai para 16px, o bastante para as faixas coloridas
       (lucro bruto, resultado, CBS a pagar) avançarem sobre ele — o que passa da área útil da folha o Chrome corta.
       Os blocos viram fluxo comum porque é no fluxo comum que o Chrome respeita "não quebrar aqui" */
    .wrap, .reforma{display:block}
    .conteudo > *{margin-top:18px}
    .conteudo > *:first-child{margin-top:0}
    .cab{position:static; padding:0 16px 12px; border-bottom:1px solid var(--line-3); backdrop-filter:none; background:none}
    .lat, .modo, .cab-comp, .hamburguer{display:none !important}      /* a folha não tem navegação */
    .conteudo{padding:0; max-width:none; gap:0}
    .faixa-escr{border-bottom:0; padding-bottom:4px}               /* no papel basta o risco do próprio cabeçalho */
    .card, .memo, .cli{padding:0 16px}
    .card, .panel, .barra, .kc{box-shadow:none}                    /* no papel o filete vira ruído */
    .card{background:var(--surface)}                               /* e a luz do cartão não se imprime */
    .card, .panel, .memo, .cli, .kc, .cmp-card, .det, .hero-side{border-radius:0}
    .track, .sb-track, .cmp-bar2{animation:none !important; clip-path:none !important}
    .hero-row{padding:12px 16px}
    .card-h{margin-bottom:14px}
    /* campo de texto não quebra linha: no papel o nome vai num texto comum (ver nomesNoPapel) */
    .in-papel{min-width:0; font-size:13px; color:var(--ink); overflow-wrap:anywhere}
    .imp-info{margin-top:3px; font-family:var(--mono); font-size:11px; color:var(--muted)}
    .cmp2{grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}   /* os dois regimes lado a lado, como na tela larga */
    .cmp-card{padding:14px 14px 12px}
    /* tabelas no tamanho da folha, sem a coluna do botão de remover */
    .g5{grid-template-columns:minmax(0,1fr) 96px 130px 96px 90px}
    .grec{grid-template-columns:minmax(0,1fr) 110px 140px 130px 100px}
    .gprod{min-width:0; grid-template-columns:minmax(0,1fr) 70px 90px 90px 120px 80px}
    .cad-row{grid-template-columns:150px minmax(0,1fr) 170px 100px}
    /* Presumido e ano: na tela as colunas têm a largura do conteúdo e a área rola de lado; no papel não há
       para onde rolar, então elas encolhem e a tabela cabe na folha */
    .gpres, .gano{min-width:0; font-size:10px; gap:0 6px}
    .gpres{grid-template-columns:minmax(86px,1.25fr) repeat(var(--cols,5), minmax(0,1fr))}
    .gpres > span:not(:first-child){letter-spacing:-.02em}         /* o número em mono não quebra: aperta um fio */
    .gpres > span:first-child small{font-size:8.5px}
    .gpres.gh{font-size:9px}

const isObj = o => !!o && typeof o === 'object' && !Array.isArray(o);
function mesclar(base, extra){
  if(extra === undefined || extra === null) return base;
  if(isObj(base) && isObj(extra)){
    const out = Object.assign({}, base);
    for(const k in extra) out[k] = mesclar(base[k], extra[k]);
    return out;
  }

}
function migrar(s){
  if(!isObj(s)) return null;
  s = JSON.parse(JSON.stringify(s));
  if((s.v || 1) < 2){
    // v1: tema/cores antigos saem; débitos e créditos ganham o tipo da premissa
    delete s.theme; delete s.ink; delete s.accent; delete s.sub;
    const rf = (s.monthly && s.monthly.reforma) || {};
    const geral = rf.creditoGeralAliq != null ? rf.creditoGeralAliq : 0.08;
    const conv = arr => Array.isArray(arr)
      ? arr.map(r => [r[0], r[1] || 0, r[2] || 0, (r[2] || 0) > 0 && (r[2] || 0) < geral ? 'reduzida' : 'geral'])
      : undefined;
    const debitos = conv(rf.debitos), creditos = conv(rf.creditosCompra);
    if(s.monthly){
      const mm = s.monthly;
      mm.reforma = { aliqGeral: geral,
        cbsSobreEfetiva: rf.cbsSobreEfetiva, debitos, creditos, saldoCredorAnterior: rf.saldoCredorAnterior };
      // v1 guardava estoque em campos soltos; sem eles, a lista fica vazia (não herda os números do padrão)
      mm.estoque = [['Estoque atualizado — custo total', mm.estoqueCusto], ['Estoque atualizado — preço total', mm.estoquePreco],
        ['Pagamento a fornecedor', mm.fornecedor]].filter(r => r[1] != null);
      delete mm.estoqueCusto; delete mm.estoquePreco; delete mm.fornecedor; delete mm.rbt12;
    }
    if(s.logo === LOGO_DEFAULT) s.logo = null;
    s.v = 2;
  }
  if(s.v < 3){
    // antes da v3 não havia crédito direto sobre as compras: começa zerado para não somar em cima dos créditos já lançados
    if(s.monthly && s.monthly.reforma && s.monthly.reforma.aliqCompras == null) s.monthly.reforma.aliqCompras = 0;
    s.v = 3;
  }
  if(s.v < 4){
    // anexo e receita dos 12 meses (v4): arquivo antigo não herda os do cliente de exemplo e segue com a parcela informada
    if(s.anexo == null) s.anexo = '';
    if(s.monthly && s.monthly.rbt12 == null) s.monthly.rbt12 = 0;
    s.v = 4;
  }
  if(s.v < 5){
    // até a v4 uma linha puxava o que sobrava da receita declarada; agora a receita é a soma das linhas
    const mm = s.monthly, rf = mm && mm.reforma;
    if(rf && Array.isArray(rf.debitos)){
      const fixas = rf.debitos.reduce((a, r) => a + (r[4] === 'pgdas' ? 0 : (r[1] || 0)), 0);
      const nPg = rf.debitos.filter(r => r[4] === 'pgdas').length;
      const resto = Math.max(0, (mm.receita || 0) - fixas) / (nPg || 1);
      rf.debitos.forEach(r => { if(r[4] === 'pgdas'){ r[1] = resto; r[4] = null; } });
      if(rf.debitos.length) mm.receita = rf.debitos.reduce((a, r) => a + (r[1] || 0), 0);
    }
    s.v = 5;
  }
  if(s.v < 6){
    // v6: a alíquota da receita deixa de ser campo e passa a sair do tipo. Quem acerta a linha é
    // normalizarLinhas(), aplicado em todo carregamento — inclusive em mês já salvo nesta versão.
    s.v = 6;
  }
  if(s.v < 7){
    // as compras do mês deixam de ser um número só e viram linhas com regra e alíquota. As linhas de
    // crédito atadas a "parte das compras" viram base fixa: as duas coisas modelavam o mesmo crédito.
    const mm = s.monthly, rf = mm && mm.reforma, total = (mm && mm.compraMercadoria) || 0;
    if(mm && !Array.isArray(mm.compras))
      mm.compras = total > 0 ? [['Compra de mercadoria do mês', total, 1, (rf && rf.aliqCompras) || 0]] : [];
    if(rf && Array.isArray(rf.creditos))
      rf.creditos.forEach(r => { if(typeof r[4] === 'number'){ r[1] = total * r[4]; r[4] = null; } });
    if(mm) delete mm.compraMercadoria;
    s.v = 7;
  }
  return s;
}

/* ---------- formatação e leitura de números (pt-BR) ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const zero = v => Math.abs(v) < 0.005 ? 0 : v;

const mil = v => Math.abs(v) >= 1e6 ? dec(v / 1e6, 1, 1) + ' mi' : Math.abs(v) >= 1000 ? dec(v / 1000, 0, 0) + ' mil' : dec(v, 0, 0);
const brlSinal = v => v < -0.004 ? '− ' + brl(-v) : brl(Math.max(0, v));       // negativo de verdade (prejuízo): "− R$ 1.000,00"
// CBS débito − crédito em duas colunas: "a pagar" e "crédito". Cada valor vai numa só e a outra fica com traço — sem sinal
// de menos (crédito não é prejuízo), sem palavra no meio do número e sem cor (testados e recusados pelo usuário)
const cbsPagar = v => v > 0.004 ? brl(v) : '—';
const cbsCredito = v => v < -0.004 ? brl(-v) : '—';
const pct = v => dec(Math.abs(v) < 0.05 ? 0 : v, 1, 1) + '%';          // v em pontos percentuais
const FMT = {                                   // estado -> texto do campo
  brl:  v => brl(+v || 0),
  base: v => dec(+v || 0, 2, 2),
  pct:  v => dec((+v || 0) * 100, 2, 2) + '%',
  pct0: v => dec((+v || 0) * 100, 0, 2) + '%',

// CNPJ numérico ou alfanumérico (RFB, a partir de jul/2026): 12 posições A-Z/0-9 + 2 dígitos verificadores

const temaEscuro = () => document.documentElement.dataset.tema === 'escuro';
function aplicarTema(t){

/* ---------- cálculo ---------- */
const soma = arr => (arr || []).reduce((a, r) => a + (+r[1] || 0), 0);
// sem uma linha "Simples Nacional", não há DAS declarado: o painel usa o calculado pela tabela, em vez
// de tomar outra despesa tributária (INSS, FGTS…) por DAS — as listas agora podem ser editadas e removidas
const linhaSimples = trib => (trib || []).find(r => /^simples nacional/i.test(r[0])) || null;
const credLinha = r => (r[1] || 0) * (r[2] || 0) * (r[3] || 0);   // valor × % base × alíquota
// quando a regra reduz a base, a alíquota que de fato incide é menor: 70% × 9% = 6,30%. Vale também na linha
// ainda zerada — é a taxa que valerá quando ela receber valor. Sem redução a efetiva é a própria alíquota
const efetivaCredito = r => { const p = +r[2] || 0, a = +r[3] || 0;
  return p > 0 && p < 1 && a > 0 ? 'efetiva ' + FMT.pct(p * a) : ''; };
const baseLinha = r => (r[1] || 0);
const valorCbs = r => baseLinha(r) * (r[2] || 0);                  // base × alíquota (créditos)
// a receita declarada do mês é a soma das linhas de receita (cada uma com a sua situação no DAS)
const somaDebitos = () => S.monthly.reforma.debitos.reduce((a, r) => a + (+r[1] || 0), 0);
function sincronizarReceita(){ S.monthly.receita = somaDebitos(); }

function calcMes(){
  const m = S.monthly, rf = m.reforma, R = somaDebitos();
  const custos = soma(m.custos), ga = soma(m.ga), vendas = soma(m.vendas), tribLancado = soma(m.tributarias);
  const lucroBruto = R - custos;
  const creditoGeral = m.ga.reduce((a, r) => a + credLinha(r), 0);
  const baseDespesas = m.ga.reduce((a, r) => a + ((r[3] || 0) > 0 ? (r[1] || 0) * (r[2] || 0) : 0), 0);
  const debitoTotal = rf.debitos.reduce((a, r) => a + (+r[1] || 0) * (r[2] || 0), 0);
  const saldoAnterior = rf.saldoCredorAnterior || 0;
  // compras itemizadas: cada linha tem a sua regra e alíquota, igual às despesas gerais
  const compras = m.compras.reduce((a, r) => a + (+r[1] || 0), 0);
  const creditoCompras = m.compras.reduce((a, r) => a + credLinha(r), 0);
  const creditoTotal = rf.creditos.reduce((a, r) => a + valorCbs(r), 0) + creditoGeral + creditoCompras + saldoAnterior;
  const cbsPagar = Math.max(0, debitoTotal - creditoTotal);          // nunca negativo
  const saldoCredor = Math.max(0, creditoTotal - debitoTotal);       // excedente vai para o mês seguinte
  const ls = linhaSimples(m.tributarias), simplesDeclarado = ls ? (ls[1] || 0) : 0;

  const seg = segregacao();
  const pelaTabela = !!(seg && !seg.excluida && seg.das > 0.004);
  const parcela = pelaTabela ? seg.cbs / seg.das : (rf.cbsSobreEfetiva || 0);
  // enquanto o DAS declarado estiver zerado, a comparação usa o DAS que sai da receita por tipo
  const dasCalculado = pelaTabela ? seg.das : 0;
  const dasBase = simplesDeclarado > 0.004 ? simplesDeclarado : dasCalculado;
  const semDeclarado = simplesDeclarado <= 0.004 && dasBase > 0.004;
  // o Simples do mês é o declarado ou, enquanto ele não vier, o calculado pela receita por tipo — o quadro
  // de baixo já fazia isso, e a DRE mostrava zero: o lucro do mês aparecia maior do que é
  const simples = dasBase;
  const efetiva = R > 0 ? simples / R * 100 : 0;                     // Simples do mês ÷ receita
  // sem a linha "Simples Nacional" não há onde mostrar o valor na DRE, então ele fica fora do total
  const dasNaDre = semDeclarado && !!ls;
  const trib = tribLancado + (dasNaDre ? dasBase : 0);
  const resultado = lucroBruto - ga - vendas - trib;
  const parcelaCbs = dasBase * parcela;                              // a CBS é uma fatia do DAS
  const simplesSemCbs = dasBase - parcelaCbs;
  const ibs = m.ibs || 0;
  const naTransicao = simplesSemCbs + cbsPagar + ibs;
  // equilíbrio: a CBS por fora empata com hoje quando custa o mesmo que a parcela da CBS no Simples (menos o IBS informado).
  // faltaCredito > 0: falta crédito para empatar; < 0: folga; null: nem com a CBS zerada empata
  const limite = parcelaCbs - ibs;
  const faltaCredito = limite > 0.004 ? (debitoTotal - limite) - creditoTotal : null;
  return {R, custos, ga, vendas, trib, lucroBruto, resultado, creditoGeral, baseDespesas, debitoTotal,
    saldoAnterior, creditoTotal, cbsPagar, saldoCredor, simples, efetiva, seg, pelaTabela, parcela, parcelaCbs, simplesSemCbs, ibs,
    dasCalculado, dasBase, semDeclarado, dasNaDre, simplesDeclarado, naTransicao, delta: naTransicao - dasBase,
    faltaCredito, compras, creditoCompras};
}

function comEstado(st, fn){ const ant = S; S = st; try { return fn(); } finally { S = ant; } }

         [3600000, .23, 62100, 0, .235, .1715, .1696], [4800000, .305, 540000, 0, 0, .20, .1978]]}
};
const LIMITE_SN = 4800000, TETO_ISS = 0.05;
// alíquotas sobre a receita: total do DAS e as partes de ICMS, ISS, PIS/Cofins (CBS a partir de 2027) e a CBS da simulação
function simplesFaixa(anexo, rbt12, ano){
  const A = ANEXOS[anexo];
  if(!A || !(rbt12 >= 0)) return null;
  if(rbt12 > LIMITE_SN) return {excluida: true};
  const n = A.faixas.findIndex(x => rbt12 <= x[0]), f = A.faixas[n];
  // sem receita acumulada a empresa está na 1ª faixa, onde não há parcela a deduzir: vale a nominal
  const ef = x => rbt12 > 0 ? (rbt12 * x[1] - x[2]) / rbt12 : x[1];
  const fed = ef(f), loc = n < 5 ? f : A.faixas[4], el = ef(loc);          // 6ª faixa: ICMS e ISS seguem calculados pela 5ª
  const icms = el * loc[3], iss = el * loc[4];
  const excesso = A.redist && iss > TETO_ISS ? iss - TETO_ISS : 0;           // ISS acima de 5% vai para os tributos federais
  const extra = excesso * (A.redist || 0);
  return {faixa: n + 1, sexta: n === 5, total: n < 5 ? fed : fed + icms + iss, icms, iss: iss - excesso,
    pc: fed * (ano >= 2027 ? f[6] : f[5]) + extra, cbs: fed * f[6] + extra};
}
// toda linha de receita é a receita declarada no PGDAS: o que diferencia uma da outra é a situação no DAS
const NOME_RECEITA = 'Receita PGDAS';
// situação da receita no DAS: ICMS-ST tira o ICMS, monofásico tira PIS/Cofins (a CBS, a partir de 2027), ISS retido tira o ISS
const SITUACOES =[['', 'Integral'], ['st', 'ICMS-ST'], ['mono', 'Monofásico'], ['stmono', 'ICMS-ST + monofásico'], ['iss', 'ISS retido']];
const anoCompetencia = () => { const p = lerPeriodo(S.mesLabel); return p ? +p.slice(0, 4) : new Date().getFullYear(); };
// alíquota efetiva do DAS conforme a situação: ICMS-ST tira o ICMS, monofásico tira PIS/Cofins
// (a CBS, de 2027 em diante) e ISS retido tira o ISS. Usada nas receitas e no cadastro de produtos.
function aliqSituacao(f, sit){
  const st = sit === 'st' || sit === 'stmono', mono = sit === 'mono' || sit === 'stmono';
  return f.total - (st ? f.icms : 0) - (mono ? f.pc : 0) - (sit === 'iss' ? f.iss : 0);
}
// DAS e CBS dentro do DAS de cada linha de receita (as mesmas linhas do débito da CBS)
// Com a receita dos 12 meses zerada há dois casos, e só quem preenche sabe qual é:
//   • início de atividade: RBT12 proporcionalizado — receita do mês × 12 (LC 123/2006 art. 18 §2º;
//     Resolução CGSN 140/2018 art. 21)
//   • empresa que passou os 12 meses sem movimento: o RBT12 é zero mesmo, e zero é a 1ª faixa
function baseRbt12(){
  const informado = +S.monthly.rbt12 || 0;
  if(informado > 0) return {valor: informado, inicio: false, parado: false};
  const R = somaDebitos();
  if(S.monthly.inicioAtividade && R > 0) return {valor: R * 12, inicio: true, parado: false};
  return {valor: 0, inicio: false, parado: true};
}
// Empresa com mais de uma atividade é tributada em mais de um anexo. A receita dos 12 meses é uma só —
// logo a faixa é a mesma —, mas a alíquota efetiva e a fatia da CBS saem da tabela de cada anexo.
// Linha sem anexo próprio usa o da empresa: mês salvo antes disso continua com os mesmos números.
const anexoLinha = r => (r && ANEXOS[r[6]]) ? r[6] : anexoEmpresa();
function anexoEmpresa(){
  if(ANEXOS[S.anexo]) return S.anexo;
  const r = (S.monthly.reforma.debitos || []).find(x => ANEXOS[x[6]]);   // sem anexo na empresa, vale o da 1ª linha
  return r ? r[6] : '';
}
// com mais de um anexo entre as linhas não existe "o anexo da empresa": cada linha tem o seu, e o campo
// único da empresa passa a mostrar um dos dois como se fosse o de todos
const variosAnexos = () => new Set((S.monthly.reforma.debitos || []).map(anexoLinha)).size > 1;
function segregacao(){
  const base = baseRbt12(), ano = anoCompetencia(), cache = {};
  const faixaDe = a => a in cache ? cache[a] : (cache[a] = simplesFaixa(a, base.valor, ano));
  const ref = faixaDe(anexoEmpresa());
  if(!ref || ref.excluida) return ref;
  ref.inicio = base.inicio; ref.parado = base.parado;
  const efetivas = {};
  const linhas = S.monthly.reforma.debitos.map(r => {
    const a = anexoLinha(r), f = faixaDe(a) || ref;
    const sit = r[5] || '', b = +r[1] || 0, mono = sit === 'mono' || sit === 'stmono';
    if(b > 0.004) efetivas[a] = f.total;                                 // só entra no rótulo o anexo com receita
    return {das: b * aliqSituacao(f, sit), cbs: mono ? 0 : b * f.cbs, anexo: a, efetiva: f.total};
  });
  return Object.assign(ref, {linhas, efetivas,
    das: linhas.reduce((a, x) => a + x.das, 0), cbs: linhas.reduce((a, x) => a + x.cbs, 0)});
}

function linhasComCredito(){ return alvoGeral || S.monthly.ga.map(r => (r[3] || 0) > 0); }
function propagar(tipo){
  const rf = S.monthly.reforma, v = tipo === 'compras' ? rf.aliqCompras : rf.aliqGeral;
  // a alíquota das compras só vale para as linhas de compra que têm crédito
  if(tipo === 'compras'){ S.monthly.compras.forEach(r => { if((r[2] || 0) > 0) r[3] = v; }); return; }
  const alvo = linhasComCredito(); S.monthly.ga.forEach((r, i) => { if(alvo[i]) r[3] = v; });
  // toda redução é um fator da geral, então mexer nela move todas as linhas, e não só as de alíquota cheia
  rf.debitos.concat(rf.creditos).forEach(r => { r[2] = aliqTipo(r[3]); });
}

/* ---------- textos ---------- */
// Cadeia de crédito — concordância: singular/plural pela contagem; fornecedor "gera crédito", cliente "aproveita o crédito"
function resumoCadeia(lst, forn){
  const n = lst.length;
  if(!n) return 'Quem vende e quem compra da empresa. O regime tributário de cada um define se há direito a crédito na reforma.';
  const conta = v => lst.filter(r => (r[3] || '') === v).length;
  const sim = conta('sim'), parcial = conta('parcial');
  const verbo = q => forn ? (q === 1 ? 'gera' : 'geram') : (q === 1 ? 'aproveita' : 'aproveitam');
  const objeto = forn ? 'crédito de CBS para a empresa' : 'o crédito da CBS';
  const quem = forn ? (n === 1 ? 'fornecedor' : 'fornecedores') : (n === 1 ? 'cliente' : 'clientes');
  let frase = n === 1 ? `${sim} de 1 ${quem} ${verbo(1)} ${objeto}.`
    : sim === n ? `Todos os ${n} ${quem} ${verbo(n)} ${objeto}.`
    : sim === 0 ? `Nenhum dos ${n} ${quem} ${verbo(1)} ${objeto}.`
    : `${sim} dos ${n} ${quem} ${verbo(sim)} ${objeto}.`;
  if(parcial) frase += forn ? ` ${parcial} ${verbo(parcial)} crédito parcial.` : ` ${parcial} ${verbo(parcial)} parcialmente.`;
  return frase + (n === 1 ? ' O regime tributário define o direito ao crédito.' : ' O regime tributário de cada um define o direito ao crédito.');
}
// uma barra por regime (Simples → Presumido → Real → demais), segmentos medidos sobre o total de cadastros
function graficoCadeia(lst, forn){
  const n = lst.length, conta = (arr, v) => arr.filter(r => (r[3] || '') === v).length;
  const ordem = ['Simples Nacional', 'Lucro Presumido', 'Lucro Real'], vistos = lst.map(r => r[2] || '');
  const nomes = ordem.concat(vistos.filter(x => !ordem.includes(x))).filter((x, i, a) => a.indexOf(x) === i && vistos.includes(x));
  const larg = q => (n ? q / n * 100 : 0) + '%';
  const linhas = nomes.map(nome => {

      `<div class="cg-trilho" aria-hidden="true"><span class="cg-sim" style="width:${larg(conta(grupo, 'sim'))}"></span>` +
      `<span class="cg-parcial" style="width:${larg(conta(grupo, 'parcial'))}"></span><span class="cg-nao" style="width:${larg(conta(grupo, 'nao'))}"></span></div></div>`;
  }).join('');
  // pizza gera/não gera (handoff 5.1, opção B), nas mesmas cores das barras: as barras quebram por
  // regime, a pizza dá a proporção do total. A legenda é uma só, ao lado da pizza, com o percentual.
  // escala neutra: grafite em quem gera crédito, cinza médio no parcial, cinza claro em quem não gera
  const CATEGORIAS = [['sim', forn ? 'gera crédito' : 'aproveita o crédito', 'var(--cad-sim)'],
    ['parcial', forn ? 'gera crédito parcial' : 'aproveita parcialmente', 'var(--cad-parcial)'],
    ['nao', forn ? 'não gera' : 'não aproveita', 'var(--cad-nao)'],
    ['', 'a definir', 'var(--line-3)']];
  const presentes = CATEGORIAS.map(([v, rotulo, cor]) => ({v, rotulo, cor, q: conta(lst, v)}))
    .filter(c => c.q > 0);                                         // só aparece o que existe
  let acumulado = 0;
  const fatias = presentes.map(c => {

    `<span class="cg-rot">${c.rotulo}</span><span class="cg-pct">${parte(c.q)}</span></span>`).join('');
  // com uma categoria só, o lugar do gráfico recebe o número e o que ele quer dizer

    ? (n ? `<div class="cg-pizza">${soloCg(presentes[0], quem,
        `${n} ${n === 1 ? quem.slice(0, -1) : quem} ${n === 1 ? 'cadastrado' : 'cadastrados'} · ${presentes[0].rotulo}`)}</div>` : '')
    : `<div class="cg-pizza">
      ${discoCg(presentes, n, fatias)}

// Com uma categoria só não há proporção para mostrar (disco cheio de uma cor e anel com o número foram

function discoCg(grupos, n, fatias) {
  const rotulo = esc(grupos.map(g => `${g.rotulo} ${dec(g.q / n * 100, 1, 1)}%`).join(', '));
  return `<div class="cg-disco" role="img" aria-label="${rotulo}" style="background:conic-gradient(${fatias})"></div>`;
}
function soloCg(g, quem, sub) {
  // a contagem e o nome da faixa já estão na barra ao lado: aqui fica só a proporção (o que o gráfico

  return `<div class="cg-solo"><span class="cap cg-solo-c">100% dos ${quem}</span>` +

const NATUREZAS = [['', 'Escolha…'], ['produto', 'Produto'], ['servico', 'Serviço']];
// a alíquota cheia é o caso comum e fica no tom mais claro; quanto maior a redução, mais escuro —

const COR_TIPO = {geral: 'var(--cbs-6)', red30: 'var(--cbs-5)', red40: 'var(--cbs-4)', red50: 'var(--cbs-3)',
  reduzida: 'var(--cbs-2)', red70: 'var(--cbs-1)', zero: 'var(--cbs-0)'};
function resumoProdutos(lst){
  const n = lst.length;
  if(!n) return 'O que a empresa vende. Cada produto ou serviço tem a sua redução na CBS, e a alíquota reduzida sai das premissas do mês.';
  const com = lst.filter(r => (r[1] || 'geral') !== 'geral').length;
  if(n === 1) return com ? 'O único item cadastrado tem redução na CBS.' : 'O único item cadastrado entra pela alíquota cheia da CBS.';
  if(!com) return `Nenhum dos ${n} itens cadastrados tem redução na CBS: todos entram pela alíquota cheia.`;
  if(com === n) return `Todos os ${n} itens cadastrados têm redução na CBS.`;
  const resto = n - com;
  return `${com} dos ${n} itens cadastrados ${com === 1 ? 'tem' : 'têm'} redução na CBS; ` +
    `${resto === 1 ? 'o outro entra' : `os outros ${resto} entram`} pela alíquota cheia.`;

// mesmo vocabulário da cadeia de crédito: uma linha por faixa e a pizza com a proporção do total
function graficoProdutos(lst){

// Quanto de crédito separa os dois regimes, dito no gasto que produz esse crédito — compra e despesa
// creditável servem igual, só que em valores diferentes, porque a alíquota de cada uma é outra.
// O crédito em reais não entra no texto: é o mesmo número da barra logo acima.
function textoEquilibrio(c){
  if(!(c.dasBase > 0.004)) return '';
  if(c.faltaCredito === null) return 'Nem zerando a CBS o híbrido empataria: o IBS informado já passa a CBS que está dentro do DAS.';
  const v = Math.abs(c.faltaCredito);
  if(v < 0.005) return '';
  const rf = S.monthly.reforma, aC = +rf.aliqCompras || 0, aD = +rf.aliqGeral || 0;
  // "despesa" sem qualificar induz a somar folha e retirada, que não geram crédito de CBS
  const emC = a => `${brl(v / a)} em compras (${FMT.pct0(a)})`, emD = a => `${brl(v / a)} em despesas com direito a crédito (${FMT.pct0(a)})`;
  // sem nenhuma alíquota não há conversão possível, e aí só resta dizer o crédito
  const quanto = aC > 0 && aD > 0
    ? (Math.abs(aC - aD) < 1e-9 ? `${brl(v / aC)} em compras ou despesas com direito a crédito (${FMT.pct0(aC)})` : `${emC(aC)} ou ${emD(aD)}`)
    : aC > 0 ? emC(aC) : aD > 0 ? emD(aD) : `${brl(v)} de crédito de CBS`;
  // "no mês" vem antes do valor: no fim ele cairia depois do parêntese da alíquota, longe do verbo
  return c.faltaCredito > 0
    ? `Para o híbrido empatar com o tradicional, faltam no mês ${quanto}.`
    : `O híbrido continua mais barato mesmo perdendo no mês ${quanto}.`;
}

      // troféu ao lado do nome do regime que sai mais barato no ano, entre os que estão na tela

      const menorAno = Math.min(t.total, melhor);
      ['total', 'conv', 'hibr'].forEach(k => { V[`lp.venc.${k}`] = t.n > 0 && t[k] - menorAno <= 0.004; });
      O['lp.difRot'] = Math.abs(dif) <= 0.004 ? `Presumido e ${nomeSimples()} empatam no ano`
        : dif > 0 ? `${nomeSimples()} sai mais barato no ano` : 'Presumido sai mais barato no ano';
      O['lp.cargaSNRot'] = ui.lpCenario === 'ambos' ? 'Carga do Simples (melhor cenário)' : `Carga do ${nomeSimples().toLowerCase()}`;
      V['lp.temEscondidas'] = escondidasLP(ano.linhas) > 0;
      O['lp.escondidas'] = (() => { const n = escondidasLP(ano.linhas);
        return n === 1 ? `1 ${ui.lpMes ? 'mês' : 'trimestre'} sem movimento está escondido`
                       : `${n} ${ui.lpMes ? 'meses' : 'trimestres'} sem movimento estão escondidos`; })();
      O['lp.ganhoLP'] = `${brl(Math.abs(dif))} a menos que o Simples ${t.hibr < t.conv ? 'híbrido' : 'tradicional'}`;
      O['lp.ganhoSN'] = `${brl(Math.abs(dif))} a menos que o Presumido`;
      V['lp.semIcms'] = at.icms && !(prem.icms > 0);
      // os dois cartões: imposto do ano e carga tributária sobre a receita somada dos meses salvos
      O['lp.presuncao'] = `Presunção de ${FMT.pct0(at.irpj)} da receita no IRPJ e ${FMT.pct0(at.csll)} na CSLL` +
        (at.escolhida ? '.' : ` — atividade pelo anexo ${anexo || 'do Simples'}; troque se não for esta.`);
      O['lp.notaLP'] = `${at.nome} · ${t.n} ${t.n === 1 ? 'mês salvo' : 'meses salvos'}`;
      O['lp.cargaLPInfo'] = `sobre a receita de ${brl(t.rec)}`;
      O['lp.irpjTot'] = brl(t.irpj + t.adicional);
      O['lp.simples'] = brl(melhor);
      O['lp.notaSN'] = `Melhor cenário: ${qual}`;
      O['lp.cargaSNInfo'] = `sobre a receita de ${brl(t.rec)}`;
      O['lp.cargaConv'] = `carga de ${P2(t.conv, t.rec)}`;
      O['lp.cargaHibr'] = `carga de ${P2(t.hibr, t.rec)}`;
      // CBS: débito menos crédito do ano no cartão; aberta na tabela, débito e crédito de cada trimestre
      O['lp.cbsInfo'] = `débito de ${brl(t.debCbs)} − crédito de ${brl(t.credCbs)}` + (t.credorCbs > 0.004 ? ` · sobra crédito de ${brl(t.credorCbs)}` : '');
      O['lp.cbsNota'] = 'Débito menos crédito de cada mês, sem o crédito transportado: transportar ou não muda só o mês em que se paga. ' +
        (t.credorCbs > 0.004 ? `No ano sobra crédito de ${brl(t.credorCbs)}: a CBS do ano fica zerada e o saldo vai para o ano seguinte.`
                             : `No ano: ${brl(t.debCbs)} − ${brl(t.credCbs)} = ${brl(t.cbs)}.`);
      // ICMS: no cartão, o líquido do ano com a conta ao lado; aberto na tabela, débito e crédito de cada período
      O['lp.icmsInfo'] = prem.icmsCompras > 0
        ? `débito de ${brl(t.icmsDeb)} − crédito de ${brl(t.icmsCred)}` + (t.credorIcms > 0.004 ? ` · sobra crédito de ${brl(t.credorIcms)}` : '')
        : `${FMT.pct(prem.icms)} sobre a receita de ${brl(t.rec)}`;
      O['lp.icmsNota'] = prem.icmsCompras > 0
        ? `Débito de ${FMT.pct(prem.icms)} sobre a receita menos crédito de ${FMT.pct(prem.icmsCompras)} sobre as compras de ${brl(t.compras)}. `
          + (t.credorIcms > 0.004 ? `No ano sobra crédito de ${brl(t.credorIcms)}: o ICMS do ano fica zerado e o saldo vai para o ano seguinte.`
                                  : `No ano: ${brl(t.icmsDeb)} − ${brl(t.icmsCred)} = ${brl(t.icms)}.`)
        : 'Sem alíquota sobre as compras informada, entra só o débito da receita. Informe a carga de crédito para a empresa que é contribuinte do ICMS.';
      // INSS: base à vista no cartão; aberta na tabela, cada despesa por trimestre com a sua alíquota
      const lf = lp.linhas || [], nomes = cat => lf.filter(l => l.cat === cat).map(l => l.nome);
      O['lp.folhaNota'] = !lf.length
        ? 'Nenhuma linha de folha nas despesas (procura folha, salário, funcionário e pró-labore): o INSS patronal ficou zerado.'
        : [nomes('folha').length ? `Folha pelas linhas de despesa ${nomes('folha').join(', ')}: ${brl(t.folha)} nos meses salvos.` : '',
           nomes('prolabore').length ? `Pró-labore pela linha ${nomes('prolabore').join(', ')}: ${brl(t.prolabore)}.` : ''].filter(Boolean).join(' ');
      const partesInss = [t.folha > 0.004 ? `folha de ${brl(t.folha)} × ${FMT.pct(prem.encargos)}` : '',
        t.prolabore > 0.004 ? `pró-labore de ${brl(t.prolabore)} × ${FMT.pct(prem.encargosPro)}` : ''].filter(Boolean);
      O['lp.inssInfo'] = partesInss.length ? 'base: ' + partesInss.join(' + ') : 'sem folha nas despesas';
      // cada despesa da folha na coluna certa: por trimestre ou por mês, conforme a tabela está
      const coluna = {};
      cols.forEach((t, i) => { if(i === ultima) return;
        if(ui.lpMes) coluna[t.periodo] = i; else ano.linhas.forEach(x => { if(Math.floor((+x.periodo.slice(5, 7) - 1) / 3) === i) coluna[x.periodo] = i; });
      });
      lf.forEach((l, j) => {
        const somas = cols.map(() => 0);
        ano.linhas.forEach(x => {
          if(!x.resumo) return;                        // mesmos meses que entram na conta
          const v = l.valores[x.periodo] || 0, i = coluna[x.periodo];
          if(i !== undefined) somas[i] += v;
          somas[ultima] += v;
        });
        somas.forEach((v, i) => { O[`lp.lf.${j}.${i}`] = cols[i].n && v > 0.004 ? brl(v) : '—'; });
        O[`lp.lf.${j}.aliq`] = '× ' + FMT.pct(l.cat === 'prolabore' ? prem.encargosPro : prem.encargos);
      });
      O['lp.inssNota'] = `Folha × ${FMT.pct(prem.encargos)} (20% patronal + RAT + terceiros)` +
        (t.prolabore > 0.004 ? `; pró-labore × ${FMT.pct(prem.encargosPro)} (20% patronal, sem RAT nem terceiros)` : '') +
        '. Entram as despesas com folha, salário, funcionário, ordenado ou pró-labore no nome. O FGTS fica de fora: é igual nos dois regimes.';
    }
  }
  // cadeia de crédito: contadores do alternador, estado de cada linha e a visão aberta
  ['fornecedores', 'clientes'].forEach(g => {
    const lista = (S.cadeia && S.cadeia[g]) || [];
    O[`cad.${g}.qtd`] = String(lista.length);
    lista.forEach((r, i) => {
      V[`cad.${g}.${i}.inv`] = !!limpaCnpj(r[0]) && !cnpjValido(r[0]);
      ['sim', 'parcial', 'nao'].forEach(v => { V[`cad.${g}.${i}.${v}`] = r[3] === v; });
    });
  });
  const visao = ui.cadeia || 'fornecedores', lst = (S.cadeia && S.cadeia[visao]) || [];
  O['cad.resumo'] = resumoCadeia(lst, visao === 'fornecedores');
  const invalidos = lst.filter(r => limpaCnpj(r[0]) && !cnpjValido(r[0])).length;
  O['cad.alerta'] = invalidos === 1 ? '1 CNPJ não confere' : `${invalidos} CNPJs não conferem`;
  V['cad.temAlerta'] = invalidos > 0;
  H['cad.grafico'] = graficoCadeia(lst, visao === 'fornecedores');
  // produtos e serviços: a reduzida sai das premissas e a efetiva, da faixa do Simples com a situação no DAS
  const prods = S.produtos || [];
  O['pr.resumo'] = resumoProdutos(prods);
  prods.forEach((r, i) => { O[`pr.${i}.red`] = FMT.pct(aliqTipo(TIPOS.some(([v]) => v === r[1]) ? r[1] : 'geral')); });
  if(prods.length) H['pr.grafico'] = graficoProdutos(prods);
  return {O, W, C, V, H};
}

// Conferência do mês: cada item é uma pergunta que o painel consegue responder sozinho com o que está lançado.
// Verde quando tudo passa; âmbar quando algo pede atenção — nunca impede de entregar, só avisa.
function conferencias(){
  const c = calcMes(), m = S.monthly, lista = [];
  const dif = (a, b) => Math.abs(a - b);
  // 1) a receita da DRE é a mesma que a soma das linhas de receita da memória (o que vai ao PGDAS)
  const somaReceita = soma(m.reforma.debitos);
  lista.push({ok: dif(somaReceita, c.R) <= 1, titulo: 'Receita da DRE bate com as linhas do PGDAS',
    detalhe: dif(somaReceita, c.R) <= 1
      ? `Receita declarada de ${brl(c.R)}, igual à soma das linhas de receita.`
      : `A DRE tem ${brl(c.R)} e as linhas de receita somam ${brl(somaReceita)} — diferença de ${brl(dif(somaReceita, c.R))}.`});
  // 2) o DAS lançado nas despesas confere com o que a tabela do Simples calcula
  const temTabela = c.pelaTabela && c.dasCalculado > 0.004, decl = c.simplesDeclarado;
  lista.push({ok: !temTabela || decl <= 0.004 || dif(decl, c.dasCalculado) <= 1,
    titulo: 'DAS declarado confere com o calculado',
    detalhe: !temTabela ? 'Sem receita por tipo lançada, o painel usa o DAS que você declarou.'
      : decl <= 0.004 ? `Nenhum DAS lançado nas despesas: vale o calculado pela tabela, ${brl(c.dasCalculado)}.`
      : dif(decl, c.dasCalculado) <= 1 ? `Declarado ${brl(decl)}, calculado ${brl(c.dasCalculado)}.`
      : `Declarado ${brl(decl)} e calculado ${brl(c.dasCalculado)} — diferença de ${brl(dif(decl, c.dasCalculado))}.`});
  // 3) crédito de CBS quase zerado diante do débito costuma ser regra de crédito mal marcada
  const quaseSem = c.debitoTotal > 0.004 && c.creditoTotal < c.debitoTotal * 0.02 && (c.compras > 0.004 || c.baseDespesas > 0.004);
  lista.push({ok: !quaseSem, titulo: 'Crédito de CBS compatível com as compras',
    detalhe: quaseSem ? `Crédito de ${brl(c.creditoTotal)} para um débito de ${brl(c.debitoTotal)}: confira a regra de crédito das compras e despesas.`
      : `Crédito de ${brl(c.creditoTotal)} sobre um débito de ${brl(c.debitoTotal)}.`});
  // 4) CNPJ do cadastro: um número errado atrapalha a conversa sobre a cadeia de crédito
  const maus = ['fornecedores', 'clientes'].reduce((n, g) => n + (S.cadeia[g] || []).filter(r => r[0] && !cnpjValido(r[0])).length, 0);
  if(maus || (S.cadeia.fornecedores || []).length || (S.cadeia.clientes || []).length)
    lista.push({ok: !maus, titulo: 'CNPJ dos cadastros confere',
      detalhe: maus ? `${maus} ${maus === 1 ? 'CNPJ não confere' : 'CNPJs não conferem'} no cadastro de fornecedores ou clientes.`
        : 'Todos os CNPJs cadastrados passam na validação.'});
  // 5) Fator R perto do corte: quem vive de serviço muda de anexo por causa dele
  const fr = fatorRLigado() ? calcFatorR() : null;
  if(fr && fr.valor != null){
    const perto = fr.valor >= FATOR_R_CORTE && fr.valor - FATOR_R_CORTE < 0.02;
    lista.push({ok: fr.valor >= FATOR_R_CORTE && !perto, titulo: 'Fator R com folga para o Anexo III',
      detalhe: fr.valor < FATOR_R_CORTE
        ? `Fator R de ${FMT.pct(fr.valor)}: abaixo dos 28%, a tributação é a do Anexo V. Faltam ${brl(fr.faltaFolha)} de folha nos doze meses.`
        : perto ? `Fator R de ${FMT.pct(fr.valor)}: a menos de 2 pontos do corte — um mês de receita alta derruba para o Anexo V.`
        : `Fator R de ${FMT.pct(fr.valor)}, com folga sobre os 28%.`});
  }
  // 6) com banco: o exercício está completo?
  const ano = banco.ano && !banco.ano.carregando && banco.ano.linhas ? banco.ano : null;
  if(ano){
    const falta = mesesFaltando(ano.linhas, ano.ano);
    lista.push({ok: !falta.length, titulo: `Exercício de ${ano.ano} completo`,
      detalhe: falta.length ? `Ainda sem competência salva: ${falta.join(', ')}.` : 'Todos os meses do ano têm competência salva.'});
  }
  return lista;
}

// Cabeçalho: quem é a empresa, em que competência, e as ações do mês
function rCabecalho(){
  const meses = !banco.ativo ? '' : (banco.meses || []).map(x =>

// Compras do mês: mesma tabela das despesas gerais — regra de crédito, alíquota e crédito de CBS por linha

// Os quatro cartões e o "O que observar" saíram a pedido do usuário: os mesmos números já estão na
// faixa de indicadores do topo e no quadro Tradicional × Híbrido, no fim da aba Resultado.
// Receita e imposto, mês a mês (redesenho de 23/09/2026, docs/redesign-graficos): os últimos 6 ou 12 meses
// salvos, não o ano civil — é a mesma janela do Fator R, e é ela que decide faixa do Simples e anexo.
// A barra é empilhada: embaixo o imposto, em cima o que fica com a empresa; a altura toda é a receita.
const janelaVista = () => ui.janela === 6 ? 6 : 12;
// os meses da vista, do mais antigo ao mês aberto
function mesesVista(){
  const h = banco.hist;
  if(!h || h.carregando || h.semFuncao || !h.meses.length) return null;
  return h.meses.slice(-janelaVista());
}
const mesSelecionado = lista => {
  const alvo = ui.mesSel && lista.some(m => m.periodo === ui.mesSel) ? ui.mesSel : lista[lista.length - 1].periodo;
  return lista.find(m => m.periodo === alvo);
};
// eixo com topo redondo: o do desenho antigo ficava preso em 100 mil e mentia sobre a altura das barras
const escalaEixo = (max, passos = 4) => {
  if(!(max > 0)) return passos;
  const bruto = max / passos, p10 = Math.pow(10, Math.floor(Math.log10(bruto)));
  return (([1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(k => k * p10 >= bruto) || 10) * p10) * passos;
};
function rMeses(){
  if(!banco.ativo) return '';
  const lista = mesesVista();
  const cab = (jan) => `<div class="card-h"><div><h2>Receita e imposto, mês a mês</h2>
    <p class="sub">Clique num mês para ver o detalhe ao lado.</p></div>
    <div class="per" role="group" aria-label="Período">
      ${[6, 12].map(n => `<button type="button" data-act="janela" data-n="${n}" aria-pressed="${jan === n}">${n} meses</button>`).join('')}
    </div></div>`;
  if(!lista) return banco.hist && banco.hist.carregando
    ? `<section class="card graf">${cab(janelaVista())}<p class="sub">Somando os meses salvos…</p></section>` : '';
  const jan = janelaVista(), sel = mesSelecionado(lista);
  const topo = escalaEixo(Math.max(...lista.map(m => m.receita)));
  const eixo = [4, 3, 2, 1, 0].map(k => `<span style="bottom:${k * 25}%">${k ? mil(topo * k / 4) : '0'}</span>`).join('');
  const grade = [4, 3, 2, 1].map(k => `<i style="bottom:${k * 25}%"></i>`).join('');
  const cols = lista.map(m => {
    const rot = mesCurto(m.periodo), on0 = m.periodo === sel.periodo;
    if(!m.salvo) return `<button type="button" class="gcol vazio" data-act="mes-sel" data-p="${m.periodo}" aria-pressed="${on0}"` +
      ` aria-label="${rot}: sem lançamento salvo"><span class="gstub"></span></button>`;
    const alt = Math.max(1, m.receita / topo * 100), on = m.periodo === sel.periodo;
    const imp = m.imposto == null ? null : Math.max(0, Math.min(m.receita, m.imposto));
    const pilha = imp == null
      ? `<span class="gsobra" style="flex:1"></span>`
      : `<span class="gsobra" style="flex:${Math.max(0.001, m.receita - imp)}"></span><span class="gimp" style="flex:${Math.max(0.001, imp)}"></span>`;
    return `<button type="button" class="gcol" data-act="mes-sel" data-p="${m.periodo}" aria-pressed="${on}"` +
      ` aria-label="${rot}: receita ${brl(m.receita)}${imp == null ? '' : ', imposto ' + brl(imp)}">
      <span class="gval"><b>${mil(m.receita)}</b>${imp != null && m.receita > 0.004 && (jan <= 6 || on)
        ? `<small>${dec(imp / m.receita * 100, 1, 1)}% imp.</small>` : ''}</span>
      <span class="gstack" style="height:${alt.toFixed(1)}%">${pilha}</span></button>`;
  }).join('');
  const rotulos = lista.map(m => `<span class="gx${m.periodo === sel.periodo ? ' on' : ''}">${mesCurto(m.periodo).slice(0, 3)}` +
    `<small>'${m.periodo.slice(2, 4)}</small></span>`).join('');
  const vazios = lista.filter(m => !m.salvo).length;
  return `<section class="card graf">${cab(jan)}
    <div class="graf-corpo">
      <div class="graf-plot">
        <div class="glegenda"><span><i class="sw rec"></i>Fica com a empresa</span><span><i class="sw imp"></i>Imposto</span></div>
        <div class="plot-row"><div class="yaxis">${eixo}</div>
          <div class="plot">${grade}<div class="cols">${cols}</div></div></div>
        <div class="xrow"><div class="yaxis"></div><div class="cells">${rotulos}</div></div>
        ${vazios ? `<p class="note"><span class="stub-mini"></span>${vazios} ${vazios === 1 ? 'mês sem lançamento salvo conta' : 'meses sem lançamento salvo contam'} como zero na receita dos doze meses.</p>` : ''}
      </div>
      <aside class="graf-lado" aria-live="polite">${rDetalheMes(lista, sel)}</aside>
    </div></section>`;
}
// painel do mês escolhido: o que a barra mostra, aberto em números
function rDetalheMes(lista, m){
  const cap = `<span class="cap">Mês selecionado</span><div class="lado-tit">${rotuloMes(m.periodo)}</div>`;
  if(!m.salvo) return `<div>${cap}</div>
    <p class="lado-vazio">Nenhum lançamento salvo neste mês. Ele entra como R$ 0,00 na receita e na folha dos doze meses.</p>`;
  const i = lista.indexOf(m), ant = i > 0 ? lista[i - 1] : null;
  const imp = m.imposto, fica = imp == null ? null : m.receita - imp;   // 'fica' desenha a parte verde da barra
  const varia = ant && ant.salvo && ant.receita > 0.004
    ? (() => { const d = (m.receita - ant.receita) / ant.receita * 100;
        return `<span class="lado-var ${d >= 0 ? 'sobe' : 'desce'}">${d >= 0 ? '▲' : '▼'} ${dec(Math.abs(d), 1, 1)}% vs ${mesCurto(ant.periodo)}</span>`; })()
    : `<span class="lado-var">sem mês anterior para comparar</span>`;
  const fr = fatorRLigado() ? calcFatorR() : null;
  const pFr = fr ? (fr.pontos.find(x => x.periodo === m.periodo) || {}).valor : null;
  return `<div>${cap}</div>
    <div><span class="cap">Receita</span><div class="lado-v">${brl(m.receita)}</div>${varia}</div>
    ${imp == null ? '' : `<div class="lado-split"><i class="rec" style="flex:${Math.max(0.001, fica)}"></i><i class="imp" style="flex:${Math.max(0.001, imp)}"></i></div>`}
    <div class="lado-linhas">
      ${imp == null ? '<div><span>Imposto</span><span class="v">salvo antes do resumo</span></div>'
        : `<div><span>Imposto</span><span class="v imp">${brl(imp)} · ${dec(imp / m.receita * 100, 1, 1)}%</span></div>`}
      ${fr ? `<div><span>Fator R (12 meses)</span><span class="v">${pFr != null ? FMT.pct(pFr) : '—'}</span></div>` : ''}
    </div>`;
}
// Fator R (redesenho de 23/09/2026): sem as barras de faturamento — elas já estão no gráfico de cima — e sem
// eixo duplo. Fica a linha com escala própria, a faixa do Anexo III sombreada acima do corte de 28% e a folha
// do mês em mini-barras embaixo, alinhadas coluna a coluna com o gráfico de receita.
function rFatorR(){
  const h = banco.hist;
  if(!banco.ativo || !h || h.semFuncao || !fatorRLigado()) return '';
  const cab = `<div class="card-h"><div><h2>Fator R${ajuda('fatorR')}</h2>
    <p class="sub">Folha dos últimos 12 meses ÷ receita do mesmo período. De 28% para cima, a tributação cai para o Anexo III.</p></div>
    <div class="glegenda"><span><i class="sw linha"></i>Fator R</span><span><i class="sw corte"></i>Corte 28%</span></div></div>`;
  if(h.carregando) return `<section class="card frr">${cab}<p class="sub">Somando os doze meses…</p></section>`;
  const c = calcFatorR();
  if(!c || c.valor == null) return `<section class="card frr">${cab}
    <div class="vazio"><strong>Ainda não dá para calcular</strong>
    <p>O Fator R precisa da receita e da folha dos últimos doze meses salvos.</p></div></section>`;
  const lista = mesesVista(), jan = lista.length, sel = mesSelecionado(lista);
  const pontos = c.pontos.slice(-jan);
  // escala própria: sempre com o corte dentro e uma folga acima do maior ponto
  const alvo = Math.max(FATOR_R_CORTE, ...pontos.map(x => x.valor || 0)) * 100 + 4;
  const topo = Math.max(32, Math.ceil(alvo / 2) * 2) / 100;
  const y = v => (1 - v / topo) * 100;                // em % da altura do quadro
  const yCorte = y(FATOR_R_CORTE);
  const passo = topo > 0.4 ? 20 : 10;
  const marcas = [];
  for(let v = 0; v <= topo * 100 + 0.001; v += passo) marcas.push(v);
  const eixo = marcas.map(v => `<span style="top:${y(v / 100).toFixed(1)}%">${v}%</span>`).join('');
  const grade = marcas.map(v => `<i style="top:${y(v / 100).toFixed(1)}%"></i>`).join('');
  const validos = pontos.map((x, k) => ({...x, k})).filter(x => x.valor != null);
  const linha = validos.length > 1
    ? `<svg class="frr-svg" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${
        validos.map(x => `${((x.k + .5) / jan * 1000).toFixed(1)},${y(x.valor).toFixed(2)}`).join(' ')
      }" fill="none" stroke="var(--frr-linha)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`
    : '';
  const bolas = validos.map((x, n) => {
    const on = x.periodo === sel.periodo, esq = (x.k + .5) / jan * 100;
    const rot = on || jan <= 6 || (validos.length - 1 - n) % 2 === 0;   // com doze pontos, um sim, um não
    return `<span class="frr-pt${on ? ' on' : ''}" style="left:${esq}%;top:${y(x.valor).toFixed(1)}%"></span>` +
      (rot ? `<span class="frr-rot${on ? ' on' : ''}" style="left:${esq}%;top:${y(x.valor).toFixed(1)}%">${FMT.pct(x.valor)}</span>` : '');
  }).join('');
  const comEnc = m => m.folha + m.prolabore + (m.encargos || 0);
  const folhaMax = Math.max(1, ...lista.map(comEnc));
  const folhas = lista.map(m => {
    const v = comEnc(m), on = m.periodo === sel.periodo;
    return `<div class="fcell"><span class="gx${on ? ' on' : ''}">${mesCurto(m.periodo).slice(0, 3)}</span>
      <span class="fbar-wrap"><i class="fbar${on ? ' on' : ''}" style="height:${m.salvo ? Math.max(2, v / folhaMax * 100) : 0}%"></i></span>
      <span class="fval">${m.salvo ? mil(v) : '—'}</span></div>`;
  }).join('');
  return `<section class="card frr">${cab}
    <div class="graf-corpo">
      <div class="graf-plot">
        <div class="plot-row"><div class="yaxis alto">${eixo}</div>
          <div class="plot frr-plot">
            <span class="frr-zona" style="height:${yCorte.toFixed(1)}%"></span>
            <span class="frr-zona-rot cima">Anexo III</span>
            <span class="frr-zona-rot baixo" style="top:calc(${yCorte.toFixed(1)}% + 6px)">Anexo V</span>
            ${grade}<span class="frr-corte" style="top:${yCorte.toFixed(1)}%"></span>${linha}${bolas}
          </div></div>
        <div class="xrow"><div class="yaxis rot-folha">folha</div><div class="cells">${folhas}</div></div>
      </div>
      <aside class="graf-lado">${rLadoFatorR(c)}</aside>
    </div></section>`;
}
// painel do Fator R: onde está, quanto falta de folha e com que premissa
function rLadoFatorR(c){
  const acima = c.valor >= FATOR_R_CORTE, escala = 0.35;
  const anexoVale = ['III', 'IV', 'V'].includes(anexoEmpresa());
  const necessaria = c.somaR * FATOR_R_CORTE, falta = Math.max(0, necessaria - c.somaF);
  return `<div><span class="cap">Fator R em ${mesCurto(banco.periodo)}</span>
      <div class="frr-grande"><span class="frr-num">${FMT.pct(c.valor)}</span>
      <span class="frr-tag ${acima ? 'ok' : 'nao'}">${acima ? 'Anexo III' : 'Anexo V'}</span></div></div>
    <div>
      <div class="medidor" role="meter" aria-valuemin="0" aria-valuemax="35" aria-valuenow="${(c.valor * 100).toFixed(2)}" aria-label="Fator R">
        <i class="fill" style="width:${Math.min(100, c.valor / escala * 100).toFixed(1)}%"></i>
        <i class="mark" style="left:${(FATOR_R_CORTE / escala * 100).toFixed(1)}%"></i>
      </div>
      <div class="medidor-esc"><span style="left:0">0%</span>
        <span class="corte" style="left:${(FATOR_R_CORTE / escala * 100).toFixed(1)}%">28%</span>
        <span style="right:0">35%</span></div>
    </div>

// render() refaz a tela inteira, então animar tudo faria a página piscar a cada linha adicionada. Entra com efeito
// só o que não estava na tela: a aba nova, a seção que abriu, o menu, a linha recém-criada. Na troca de mês ou de
// empresa (ui.animarTela) o conteúdo todo entra de novo, menos o cabeçalho e a barra de seleção, que não mudaram.
const SEL_ANIM = '.conteudo > *, .det, .prem, .calc, .menu, .panel, .li, .gr, .cr, .cad-row:not(.gh), .gprod:not(.gh)';
function chaveAnim(el){
  if(el.parentElement && el.parentElement.classList.contains('conteudo'))
    return 'bloco:' + (el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') || el.id || el.classList[0] || el.tagName);
  // linha e seção se reconhecem pelo primeiro campo (ou botão) que carregam: é o que não muda entre um render e outro
  const b = el.querySelector('[data-b]'), a = el.querySelector('[data-act]'), d = a ? a.dataset : {};
  return el.classList[0] + ':' + (b ? b.dataset.b : a ? [d.act, d.id, d.i, d.g, d.lista].join('|') : '');
}
function chavesNaTela(){
  const k = new Set();
  app.querySelectorAll(SEL_ANIM).forEach(el => {
    if(ui.animarTela && el.closest('.conteudo > *')) return;
    k.add(chaveAnim(el));
  });
  return k;
}
function animarNovos(antes){
  let n = 0;
  app.querySelectorAll(SEL_ANIM).forEach(el => {
    // dentro de um bloco que já está entrando, o filho entra junto: animar os dois daria o efeito em dobro
    if(antes.has(chaveAnim(el)) || (el.parentElement !== app && el.parentElement.closest('.entra'))) return;
    el.classList.add('entra');
    if(el.parentElement && el.parentElement.classList.contains('conteudo')) el.style.setProperty('--i', n++);
  });
}
// barra compacta: desce quando a barra de seleção sai da tela. Nome e competência vêm dos mesmos data-o do

const LINHAS_REALCE = '.dl, .hero-row, .cmp-row, .sum-bar, .total, .li, .gr, .cr, .gano, .gpres, .sn-l';
function realcar(el){
  const atual = app.querySelector('.realce');
  if(atual) atual.classList.remove('realce');
  const novo = el && el !== atual ? el : null;
  if(novo) novo.classList.add('realce');
  document.body.classList.toggle('realcando', !!novo);
}
// Na apresentação o número de destaque sobe até o valor em vez de aparecer pronto: é o momento em que o
// cliente está olhando a tela. Fora da apresentação nada disso roda — quem digita quer ver o número na hora.
const CONTA_SEL = '.hero-row .val, .kv, .dl.rec .v, .dl.gross .v, .dl.tot .v, .dl.res .v,' +
  ' .total > span:last-child, .cmp-row.dest .v, .cmp-row.tot .v, .sb-v';
const NUM_BR = /-?\d{1,3}(?:\.\d{3})*,\d{2}/;
const semMovimento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function contarAte(el, alvo){
  const fim = alvo.match(NUM_BR), de = (el.textContent || '').match(NUM_BR);
  const val = m => parseFloat(m[0].replace(/\./g, '').replace(',', '.'));
  if(!fim){ el.textContent = alvo; return; }                       // sem número no texto: entra direto
  const a = de ? val(de) : 0, b = val(fim);
  if(a === b){ el.textContent = alvo; return; }
  cancelAnimationFrame(el._conta); clearTimeout(el._contaFim);
  const t0 = performance.now(), dur = 420;
  // rede de segurança: com a aba escondida o navegador para de dar quadros e o número ficaria a meio caminho
  el._contaFim = setTimeout(() => { cancelAnimationFrame(el._conta); el.textContent = alvo; }, dur + 80);
  const passo = t => {
    // o carimbo do primeiro quadro pode ser anterior ao instante em que a conta começou: sem o piso em 0
    // a curva dispara e o número aparece em outra casa
    const p = Math.min(1, Math.max(0, (t - t0) / dur));
    el.textContent = p < 1 ? alvo.replace(NUM_BR, dec(a + (b - a) * (1 - Math.pow(1 - p, 3)), 2, 2)) : alvo;
    if(p < 1) el._conta = requestAnimationFrame(passo);
  };
  el._conta = requestAnimationFrame(passo);
}
function refresh(){
  const root = document.documentElement.style;
  let brand = hex(S.brand) ? S.brand : '#A80000', fill = hex(S.fill) ? S.fill : '#14161A';
  const escuro = temaEscuro();
  if(escuro){
    brand = mix(brand, '#ffffff', .3);             // o vermelho da reforma vira texto em fundo escuro: precisa clarear
    if(luz(fill) < .4) fill = '#E4E5E8';           // preenchimento escuro some no fundo escuro: a aba ativa e a faixa viram claras
  }
  root.setProperty('--fill', fill); root.setProperty('--brand', brand);
  root.setProperty('--sobre-fill', luz(fill) > .5 ? '#14161A' : '#FFFFFF');   // vale também para cor clara escolhida no claro
  root.setProperty('--brand-dark', escuro ? mix(brand, '#ffffff', .15) : mix(brand, '#000000', .3));
  root.setProperty('--brand-wash', escuro ? mix(brand, '#1B1C1F', .86) : mix(brand, '#ffffff', .95));
  const {O, W, C, V, H} = saidas();
  app.querySelectorAll('[data-h]').forEach(el => { const v = H[el.dataset.h]; if(v !== undefined && el._h !== v){ el._h = v; el.innerHTML = v; } });
  const conta = ui.present && !semMovimento();
  app.querySelectorAll('[data-o]').forEach(el => {
    const v = O[el.dataset.o];
    if(v === undefined || el.textContent === v) return;
    // o valor costuma ser um span dentro da célula (.v), por isso o pai também vale como alvo
    if(conta && (el.matches(CONTA_SEL) || (el.parentElement && el.parentElement.matches(CONTA_SEL)))) contarAte(el, v);
    else el.textContent = v;
  });
  app.querySelectorAll('[data-w]').forEach(el => { if(W[el.dataset.w] !== undefined) el.style.width = W[el.dataset.w]; });
  app.querySelectorAll('[data-oc]').forEach(el => { el.style.color = C[el.dataset.oc] || ''; });
  app.querySelectorAll('[data-v]').forEach(el => { el.hidden = !V[el.dataset.v]; });
  app.querySelectorAll('[data-cls]').forEach(el => el.dataset.cls.split(' ').forEach(par => {   // "classe:chave classe2:chave2"
    const [cls, k] = par.split(':'); el.classList.toggle(cls, !!V[k]);
  }));
  app.querySelectorAll('input[data-b], select[data-b]').forEach(el => {
    if(el === document.activeElement) return;                 // não mexe no campo que está sendo digitado
    const s = FMT[el.dataset.f](getPath(el.dataset.b));
    if(el.value.toLowerCase() !== s.toLowerCase()) el.value = s;
  });
  const img = app.querySelector('[data-src="logo"]'), src = S.logo || LOGO_DEFAULT;
  if(img && img.getAttribute('src') !== src) img.setAttribute('src', src);
  document.title = 'DRE — ' + (S.co || 'Painel');
  atualizarBarra();
  marcarRolagemX();
}

function zerarValores(base, manter){
  // zera valores; mantém categorias, % base, alíquotas, premissas, identidade visual e rótulos.
  // manter {estoque, fixas}: o que o mês novo repete do anterior em vez de zerar (ver herdarDoAnterior)
  manter = manter || {};
  const d = JSON.parse(JSON.stringify(base));
  const zera = arr => arr.forEach(r => { r[1] = 0; });
  const fixas = manter.fixas ? JSON.parse(JSON.stringify(d.monthly.ga)) : null;
  [d.annual, d.monthly].forEach(x => { x.receita = 0; ['custos', 'ga', 'vendas', 'tributarias'].forEach(g => zera(x[g])); });
  d.annual.compraMercadoria = 0; zera(d.monthly.compras);
  d.annual.resultadoInformado = 0;
  zera(d.monthly.reforma.debitos); zera(d.monthly.reforma.creditos);
  if(!manter.estoque) zera(d.monthly.estoque || []);
  if(fixas) d.monthly.ga = fixas;                  // despesas gerais repetidas: o anual continua zerado
  d.monthly.reforma.saldoCredorAnterior = 0; d.monthly.ibs = 0; d.monthly.rbt12 = 0;
  return d;
}
// Mês de empresa sem nenhum mês salvo. Antes saía do exemplo da farmácia zerado e levava "Cagece", "Corpvs Segurança",
// o "Conselho Regional de Farmácia" e o inventário de 25/11/2025 para toda empresa nova — foi o que apareceu na
// Consult RL e na marcenaria em 16/09/2026. Categorias genéricas; regras de crédito e alíquotas são as do exemplo.
function modeloEmBranco(){
  const d = zerarValores(defaults()), rf = d.monthly.reforma, g = rf.aliqGeral;
  d.co = ''; d.anexo = ''; d.cadeia = {fornecedores: [], clientes: []}; d.produtos = [];
  d.annual.custos = [['Custo das mercadorias e serviços vendidos', 0]];
  d.annual.ga = [['Pró-labore e retirada de sócio', 0], ['Folha de pagamento e encargos', 0], ['Aluguel', 0], ['Seguros', 0],
    ['Telefone e internet', 0], ['Energia e água', 0], ['Contabilidade', 0], ['Segurança e vigilância', 0],
    ['Tarifas bancárias e de cartão', 0], ['Sistemas', 0], ['Manutenção e equipamentos', 0], ['Outras despesas', 0]];
  d.annual.vendas = [['Despesas com vendas', 0]];

const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const rotuloMes = p => { const [a, m] = String(p).split('-'); return `${MESES[+m - 1]} ${a}`; };
const mesCurto = p => { const [a, m] = String(p).split('-'); return `${MESES[+m - 1].slice(0, 3).toLowerCase()}/${a}`; };
const mesBarra = p => { const [a, m] = String(p).split('-'); return `${m}/${a}`; };
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const hora = d => d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
const dataHora = t => t ? new Date(t).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '—';

// competência ± n meses (n negativo anda para trás): base do RBT12 e da herança do mês novo
function somarMeses(p, n){ const [a, m] = String(p).split('-').map(Number); const t = a * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}-01`; }
const proximoMes = p => somarMeses(p, 1);
function lerPeriodo(txt){                     // "12/2025", "2025-12" ou "Dezembro 2025" → "2025-12-01"
  const s = semAcento(txt); let m, ano, mes;
  if((m = s.match(/(\d{1,2})\s*\/\s*(\d{4})/))){ mes = +m[1]; ano = m[2]; }
  else if((m = s.match(/(\d{4})-(\d{1,2})/))){ ano = m[1]; mes = +m[2]; }
  else { const i = MESES.findIndex(n => s.includes(semAcento(n))), a = s.match(/\d{4}/); if(i >= 0 && a){ mes = i + 1; ano = a[0]; } }
  return ano && mes >= 1 && mes <= 12 ? `${ano}-${String(mes).padStart(2, '0')}-01` : null;
}

async function sbAuth(caminho, corpo, token, metodo){
  const r = await fetch(`${SUPABASE.url}/auth/v1/${caminho}`, {
    method: metodo || 'POST',
    headers: Object.assign({apikey: SUPABASE.chave, 'Content-Type': 'application/json'}, token ? {Authorization: 'Bearer ' + token} : {}),
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch(e){}
  if(!r.ok){ const err = new Error((d && (d.error_description || d.msg || d.message)) || `HTTP ${r.status}`); err.status = r.status; throw err; }
  return d;
}
function guardarSessao(d){
  banco.sessao = d ? {
    access_token: d.access_token, refresh_token: d.refresh_token,
    expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
    email: (d.user && d.user.email) || (banco.sessao && banco.sessao.email) || ''
  } : null;

// Renovação: o Supabase gira o refresh token a cada uso, então duas consultas que vencem juntas não podem
// renovar cada uma por si — a segunda chegaria com um token já queimado e derrubaria a sessão. Quem chega
// enquanto a renovação está em curso espera pela mesma promessa.
let renovando = null;
async function tokenValido(){
  const s = banco.sessao;
  if(!s) throw Object.assign(new Error('Entre para continuar'), {status: 401});
  if(s.expires_at - 60 > Date.now() / 1000) return s.access_token;
  if(!renovando){
    renovando = sbAuth('token?grant_type=refresh_token', {refresh_token: s.refresh_token})
      .then(nova => { guardarSessao(nova); return banco.sessao.access_token; })
      .catch(() => { guardarSessao(null); throw Object.assign(new Error('Sua sessão expirou'), {status: 401}); })
      .finally(() => { renovando = null; });
  }
  return renovando;
}
async function sb(caminho, o){
  o = o || {};
  const token = await tokenValido();
  const r = await fetch(`${SUPABASE.url}/rest/v1/${caminho}`, {
    method: o.metodo || 'GET',
    headers: Object.assign({apikey: SUPABASE.chave, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json'}, o.prefer ? {Prefer: o.prefer} : {}),
    body: o.corpo !== undefined ? JSON.stringify(o.corpo) : undefined
  });
  const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch(e){ d = txt; }
  if(!r.ok){
    const err = new Error((d && d.message) || `HTTP ${r.status}`); err.status = r.status;
    if(r.status === 401) guardarSessao(null);
    throw err;
  }
  return d;
}

// janela simples: resolve {botao, valores}; Enter = cfg.padrao, Esc = cancelar
function modal(cfg){
  return new Promise(resolve => {
    const caixa = document.getElementById('modal'), antes = document.activeElement;
    const campos = (cfg.campos || []).map(([nome, rotulo, valor, tipo]) =>
      `<label class="field"><span>${esc(rotulo)}</span><input class="in txt" name="${nome}" type="${tipo || 'text'}" value="${esc(valor || '')}" autocomplete="${tipo === 'password' ? 'new-password' : 'off'}"></label>`).join('');
    // caixas de seleção: [nome, rótulo, marcado, explicação] — FormData devolve 'on' só nas marcadas
    const caixas = (cfg.caixas || []).map(([nome, rotulo, marcado, nota]) =>
      `<label class="modal-cx"><input type="checkbox" name="${nome}"${marcado ? ' checked' : ''}><span>${esc(rotulo)}${nota ? `<small>${esc(nota)}</small>` : ''}</span></label>`).join('');
    const botoes = cfg.botoes.map(([k, rotulo, estilo]) => `<button type="button" class="btn ${estilo || ''}" data-modal="${k}">${esc(rotulo)}</button>`).join('');
    caixa.innerHTML = `<div class="modal-fundo"><form class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo">${esc(cfg.titulo)}</h2>${cfg.texto ? `<p class="sub">${esc(cfg.texto)}</p>` : ''}${cfg.html || ''}
      ${campos ? `<div class="modal-campos">${campos}</div>` : ''}${caixas ? `<div class="modal-campos">${caixas}</div>` : ''}${cfg.erro ? `<p class="modal-erro" role="alert">${esc(cfg.erro)}</p>` : ''}
      <div class="modal-acoes">${botoes}</div><button type="submit" hidden tabindex="-1"></button></form></div>`;
    caixa.hidden = false;
    const form = caixa.querySelector('form');
    const fechar = botao => {
      const valores = {}; new FormData(form).forEach((v, k) => { valores[k] = String(v); });
      caixa.hidden = true; caixa.innerHTML = '';
      if(antes && document.contains(antes)) antes.focus();
      resolve({botao, valores});
    };
    form.addEventListener('submit', e => { e.preventDefault(); fechar(cfg.padrao || 'cancelar'); });
    form.addEventListener('click', e => { const b = e.target.closest('[data-modal]'); if(b) fechar(b.dataset.modal); });
    form.addEventListener('keydown', e => { if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); fechar('cancelar'); } });
    (form.querySelector('input') || form.querySelector(`[data-modal="${cfg.padrao || 'cancelar'}"]`)).focus();
  });
}

const HERANCA = {saldo: true, rbt12: true, estoque: false, fixas: false};
async function herdarDoAnterior(empresaId, periodo, anterior, h){
  const info = {saldoDe: null, rbt12Meses: 0};

// receita bruta dos 12 meses anteriores, somada pelos meses já salvos desta empresa
async function somarRbt12(empresaId, periodo){
  try{

      p_de: somarMeses(periodo, -12), p_ate: somarMeses(periodo, -1)}}) || [];
    return {total: lista.reduce((a, x) => a + (+x.receita || 0), 0), meses: lista.length};
  }catch(e){ return null; }           // banco ainda sem a função "resumos": o RBT12 segue digitado

/* ---------- o ano pelos meses salvos (aba Anual) ---------- */
// Soma as competências do exercício. Mês salvo antes da migração do resumo não tem os números
// gravados: o estado dele é baixado e recalculado aqui, para o ano não ficar incompleto.
async function carregarAno(ano){
  let lista;
  try{
    lista = await sb('rpc/resumos', {metodo: 'POST', corpo: {p_empresa_id: banco.empresaId,
      p_de: `${ano}-01-01`, p_ate: `${ano}-12-01`}}) || [];
  }catch(e){
    // banco ainda sem a migração: explica na própria aba, sem alarde de erro
    if(e.status !== 404 && e.status !== 400) throw e;
    banco.ano = {ano, linhas: [], carregando: false, semFuncao: true}; render(); return;
  }
  // mês sem resumo, ou com resumo de antes do débito e crédito da CBS: recalcula pelo estado salvo. Só as partes que
  // a conta usa (a logo personalizada fica no estado e pode ser grande); ao salvar o mês de novo, o resumo se completa
  const faltam = lista.filter(x => !x.resumo || x.resumo.debito === undefined).map(x => x.periodo);
  if(faltam.length){
    const crus = await sb(`competencias?select=periodo,v:dados->v,anexo:dados->anexo,mesLabel:dados->mesLabel,monthly:dados->monthly` +
      `&empresa_id=eq.${banco.empresaId}&periodo=in.(${faltam.join(',')})`);
    const porPeriodo = {};
    (crus || []).forEach(c => { if(c.monthly) porPeriodo[c.periodo] = {v: c.v, anexo: c.anexo, mesLabel: c.mesLabel, monthly: c.monthly}; });
    lista.forEach(x => { if(porPeriodo[x.periodo]) x.resumo = resumoDe(prontoParaCalculo(porPeriodo[x.periodo])); });
  }
  banco.ano = {ano, linhas: lista, carregando: false};
  render();
  garantirPresumido();
}

/* ---------- Doze meses móveis: receita, imposto e folha ---------- */
// É a base dos dois gráficos da Visão geral — o de receita e imposto e o do Fator R. O ano civil continua
// existindo à parte (banco.ano), porque a aba Anual soma o exercício, não os doze meses que terminam no mês
// aberto.
// O corte é 28%: chegando lá, a empresa de serviço do Anexo V passa a ser tributada pelo III, bem mais barato.
// A conta é da LC 123 (art. 18, §24): folha de salários dos 12 meses (com pró-labore e encargos) ÷ receita dos
// 12 meses. Os encargos entram por um percentual à parte (padrão 8%, o FGTS), editável: o que vale é o que o
// escritório considera folha — o painel mostra a conta aberta em vez de decidir sozinho.
const FATOR_R_CORTE = 0.28;
// encargos que entram na folha do Fator R: as linhas de INSS e FGTS lançadas em despesas tributárias. Antes
// era um percentual sobre a folha (8%, o FGTS); o escritório preferiu somar o que está lançado de verdade.
const RE_ENCARGO = /inss|fgts/i;
const janelaMeses = (ate, n) => {                   // os n períodos que terminam em 'ate' (aaaa-mm-01)
  const [a, m] = ate.split('-').map(Number), fim = new Date(Date.UTC(a, m - 1, 1)), lista = [];
  for(let i = n - 1; i >= 0; i--){
    const d = new Date(Date.UTC(fim.getUTCFullYear(), fim.getUTCMonth() - i, 1));

};
const doze = ate => janelaMeses(ate, 12);
// o gráfico do Fator R mostra doze pontos e cada ponto é uma janela de doze meses: 23 meses ao todo
const HIST_MESES = 23;
function garantirHist(recarregar){
  if(!banco.ativo || !banco.empresaId || !banco.periodo) return;
  const ate = banco.periodo;
  if(!recarregar && banco.hist && banco.hist.ate === ate && banco.hist.empresa === banco.empresaId) return;
  banco.hist = {ate, empresa: banco.empresaId, carregando: true, meses: []};
  comErro(() => carregarHist(ate));
}
async function carregarHist(ate){
  const periodos = janelaMeses(ate, HIST_MESES), alvo = banco.hist;
  let resumos = [];
  try{
    resumos = await sb('rpc/resumos', {metodo: 'POST', corpo: {p_empresa_id: banco.empresaId,
      p_de: periodos[0], p_ate: periodos[periodos.length - 1]}}) || [];
  }catch(e){
    if(e.status !== 404 && e.status !== 400) throw e;
    if(banco.hist === alvo){ banco.hist = {ate, empresa: banco.empresaId, semFuncao: true, meses: []}; render(); }
    return;
  }
  const folhas = await sb(`competencias?select=periodo,ga:dados->monthly->ga,trib:dados->monthly->tributarias` +
    `&empresa_id=eq.${banco.empresaId}&periodo=in.(${periodos.join(',')})`) || [];
  const porPeriodo = {};
  folhas.forEach(c => {
    const f = porPeriodo[c.periodo] = {folha: 0, prolabore: 0, encargos: 0};
    (Array.isArray(c.ga) ? c.ga : []).forEach(r => {
      const cat = categoriaFolha(String(r[0] || '').trim());
      if(cat) f[cat] += +r[1] || 0;
    });
    // encargos do Fator R: o que está lançado em despesas tributárias como INSS ou FGTS — nada de percentual
    (Array.isArray(c.trib) ? c.trib : []).forEach(r => {
      if(RE_ENCARGO.test(String(r[0] || ''))) f.encargos += +r[1] || 0;
    });
  });

  // resumo gravado, também conta (aí o imposto fica desconhecido: só o resumo gravado traz DAS e CBS)
  const salvos = {};
  resumos.forEach(x => { salvos[x.periodo] = {receita: +x.receita || 0, resumo: x.resumo}; });
  const meses = periodos.map(per => {
    const f = porPeriodo[per], r = salvos[per];
    return {periodo: per, salvo: !!r, receita: r ? r.receita : 0,
      imposto: r && r.resumo ? (+r.resumo.das || 0) + (+r.resumo.cbs || 0) : null,
      folha: f ? f.folha : 0, prolabore: f ? f.prolabore : 0, encargos: f ? f.encargos : 0};
  });
  if(banco.hist !== alvo) return;                 // trocou de mês ou de empresa enquanto buscava

// a conta: o valor de hoje é dos doze meses que terminam na competência aberta; cada ponto do gráfico é o
// Fator R da janela de doze meses que termina naquele mês — por isso os 23 meses buscados
function calcFatorR(){
  const fr = banco.hist;
  if(!fr || fr.carregando || fr.semFuncao || !fr.meses.length) return null;
  const todos = fr.meses.map(m => Object.assign({}, m,
    {folhaTotal: m.folha + m.prolabore + (m.encargos || 0)}));
  const meses = todos.slice(-12);                   // os doze que terminam na competência aberta
  const somaR = meses.reduce((a, x) => a + x.receita, 0);
  const somaF = meses.reduce((a, x) => a + x.folhaTotal, 0);
  const faltam = meses.filter(x => !x.salvo).length;
  const valor = somaR > 0.004 ? somaF / somaR : null;
  // um ponto por mês do último ano: a janela de doze que termina nele. Abaixo de três meses salvos na janela
  // a conta diz pouco e o ponto fica de fora — a linha começa onde o histórico começa.
  const pontos = meses.map((m, i) => {
    const fim = todos.length - 12 + i;              // índice do mês em 'todos'; a janela são os doze até ele
    const jan = todos.slice(fim - 11, fim + 1);
    const salvos = jan.filter(x => x.salvo).length;
    const r = jan.reduce((a, x) => a + x.receita, 0), f = jan.reduce((a, x) => a + x.folhaTotal, 0);
    return {periodo: m.periodo, valor: r > 0.004 && salvos >= 3 ? f / r : null, salvo: m.salvo};
  });
  const somaEnc = meses.reduce((a, x) => a + (x.encargos || 0), 0);
  const semEncargo = meses.filter(x => x.salvo && (x.folha + x.prolabore) > 0.004 && !(x.encargos > 0.004)).length;
  const alvo = somaR * FATOR_R_CORTE;               // quanto de folha faria chegar aos 28%
  return {valor, pontos, meses, somaR, somaF, somaEnc, faltam, semEncargo,
    faltaFolha: valor != null && valor < FATOR_R_CORTE ? alvo - somaF : 0};
}

/* ---------- Lucro Presumido: estimativa pelos meses salvos ---------- */

// LC 224/2025: presunção 10% maior sobre a receita acima de R$ 5 milhões no ano, aplicada R$ 1,25 milhão por
// trimestre, acumulado, com ajuste nos seguintes (em disputa na Justiça, ADI 7920). Regras de 2027: PIS/Cofins
// viram a CBS por fora — débito menos crédito, a mesma do híbrido. IBS quase zero até 2028: fica de fora.
const LP = {irpj: .15, adicional: .10, limiteMes: 20000, csll: .09, limiteTri: 1250000, acrescimo: .10};
// presunção por atividade (Lei 9.249/1995, arts. 15 e 20): [id, nome, IRPJ, CSLL, ISS?, ICMS?]
const ATIVIDADES = [
  ['servicos', 'Serviços em geral (consultoria, profissões, administração, locação)', .32, .32, true, false],
  ['hospitalar', 'Serviços hospitalares e de auxílio diagnóstico', .08, .12, true, false],
  ['obraMaterial', 'Construção por empreitada com todos os materiais', .08, .12, true, false],
  ['obraMao', 'Construção só com mão de obra', .32, .32, true, false],
  ['cargas', 'Transporte de cargas', .08, .12, true, true],
  ['passageiros', 'Transporte de passageiros', .16, .12, true, true],
  ['comercio', 'Comércio e indústria', .08, .12, false, true],
  ['combustivel', 'Revenda de combustíveis', .016, .12, false, true],
  ['outra', 'Outra atividade — informar os percentuais', null, null, true, true],
];
const LP_CAMPOS = ['n', 'rec', 'compras', 'cbs', 'debCbs', 'credCbs', 'semCbs', 'folha', 'prolabore', 'baseInss', 'das', 'hib', 'acrescimo',
  'baseIrpj', 'baseCsll', 'irpj', 'adicional', 'csll', 'iss', 'icms', 'icmsDeb', 'icmsCred', 'inss', 'total', 'conv', 'hibr'];
const RE_FOLHA = /folha|sal[aá]rio|funcion[aá]rio|ordenado|pr[oó][\s-]*labore/i;
const RE_PROLABORE = /pr[oó][\s-]*labore/i;

const categoriaFolha = nome => !RE_FOLHA.test(nome) ? '' : RE_PROLABORE.test(nome) && !/folha|sal[aá]rio|funcion[aá]rio|ordenado/i.test(nome) ? 'prolabore' : 'folha';
// atividade da empresa: a escolhida ou, sem escolha, a do anexo do Simples (I e II vendem mercadoria; III a V, serviço)
function atividadeLP(){
  const pr = S.presumido || {}, id = ATIVIDADES.some(x => x[0] === pr.atividade) ? pr.atividade
    : ['I', 'II'].includes(anexoEmpresa()) ? 'comercio' : 'servicos';
  const [, nome, irpj, csll, iss, icms] = ATIVIDADES.find(x => x[0] === id);
  return {id, nome, escolhida: id === pr.atividade, iss, icms,
    irpj: irpj === null ? +pr.irpjOutra || 0 : irpj, csll: csll === null ? +pr.csllOutra || 0 : csll};

function premissasLP(){
  const pr = S.presumido || {}, at = atividadeLP();
  return {irpj: at.irpj, csll: at.csll, iss: at.iss ? +pr.iss || 0 : 0, icms: at.icms ? +pr.icms || 0 : 0,
    icmsCompras: at.icms ? +pr.icmsCompras || 0 : 0, encargos: +pr.encargos || 0,
    encargosPro: pr.encargosProlabore == null ? 0.20 : +pr.encargosProlabore || 0};

// Colunas da tabela: trimestre (ou mês) com movimento. Coluna só de travessões ocupa a largura de quem tem
// número — some por padrão, e o botão "mostrar sem movimento" devolve todas
function colunasLP(linhas){
  const ms = (linhas || []).filter(x => x.resumo).sort((a, b) => a.periodo < b.periodo ? -1 : 1);
  const mov = r => (+r.receita || 0) > 0.004 || (+r.das || 0) > 0.004;
  if(ui.lpMes) return ms.filter(x => ui.lpVazias || mov(x.resumo)).map(x => x.periodo);
  return [0, 1, 2, 3].filter(i => ui.lpVazias ||
    ms.some(x => Math.floor((+x.periodo.slice(5, 7) - 1) / 3) === i && mov(x.resumo)));

// cenário do Simples em disputa: os dois (padrão), só o tradicional ou só o híbrido
const escondidasLP = linhas => {
  const antes = ui.lpVazias; ui.lpVazias = true;
  const total = colunasLP(linhas).length; ui.lpVazias = antes;

const simplesDe = t => ui.lpCenario === 'conv' ? t.conv : ui.lpCenario === 'hibr' ? t.hibr : Math.min(t.conv, t.hibr);
const nomeSimples = () => ui.lpCenario === 'conv' ? 'Simples tradicional' : ui.lpCenario === 'hibr' ? 'Simples híbrido' : 'Simples';
function calcPresumido(linhas, folhas, prem, anexo){
  const q = [0, 1, 2, 3].map(() => Object.fromEntries(LP_CAMPOS.map(k => [k, 0])));
  (linhas || []).forEach(x => {
    const r = x.resumo; if(!r) return;
    const t = q[Math.floor((+x.periodo.slice(5, 7) - 1) / 3)];
    t.n++; t.rec += +r.receita || 0; t.das += +r.das || 0; t.compras += +r.compras || 0;
    // CBS pelo débito e crédito de cada mês, sem o transportado (ver totaisAno); o híbrido é o DAS sem a CBS mais ela
    const cb = cbsDoMes(r);
    t.debCbs += cb.deb; t.credCbs += cb.cred; t.semCbs += (+r.naTransicao || 0) - (+r.cbs || 0);
    const f = folhas[x.periodo];                     // número sozinho = só folha (forma antiga, usada nos testes)

  });
  let acumulada = 0, excedenteAntes = 0;

    t.inss = t.folha * prem.encargos + t.prolabore * (prem.encargosPro == null ? prem.encargos : prem.encargosPro);
    t.total = t.irpj + t.adicional + t.csll + t.cbs + t.iss + t.icms + t.inss;

  // sem receita no trimestre, divididos igualmente. A tabela diz isso embaixo
  const meses = (linhas || []).filter(x => x.resumo).sort((a, b) => a.periodo < b.periodo ? -1 : 1).map(x => {
    const r = x.resumo, tri = q[Math.floor((+x.periodo.slice(5, 7) - 1) / 3)];

    m.semCbs = (+r.naTransicao || 0) - (+r.cbs || 0); m.hib = m.semCbs + m.cbs;
    m.folha = typeof f === 'object' && f ? +f.folha || 0 : +f || 0;
    m.prolabore = typeof f === 'object' && f ? +f.prolabore || 0 : 0;
    m.baseInss = m.folha + m.prolabore;
    m.inss = m.folha * prem.encargos + m.prolabore * (prem.encargosPro == null ? prem.encargos : prem.encargosPro);
    m.compras = +r.compras || 0;

  });
