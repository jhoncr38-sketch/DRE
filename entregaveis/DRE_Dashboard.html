<style>
  /* Tokens do handoff "Painel DRE". --fill e --brand são personalizáveis;
     --ink (texto) nunca muda, para uma cor clara escolhida não apagar o texto. */
  :root{
    color-scheme:light;
    --ink:#16171A; --fill:#16171A; --ink-2:#4A4D52; --ink-3:#4A4D52;
    --muted:#82868C; --muted-2:#9A9EA4; --muted-3:#9A9EA4; --disabled:#B6B8BC;
    /* o vermelho é o da logo do escritório (#A80000, medido nos pixels dela), não um carmim próximo:
       com azul na mistura, os tons claros da rampa da CBS puxavam para o rosa e destoavam da marca */
    --brand:#A80000; --brand-dark:#760000; --brand-wash:#FBF2F2;
    /* fundo um tom abaixo do antigo #EFEEEA: com ele, cartão branco e página quase não se separavam.
       A barra das abas desce junto, senão some no fundo novo (que tem o tom que ela tinha) */
    --canvas:#E9E7E2; --surface:#FFFFFF; --surface-2:#F5F3EF; --rail:#E0DDD6;
    --line:#EFECE6; --line-2:#E2DFD8; --line-3:#D8D3C9; --on-fill:#C9CCD2;
    /* barra lateral: superfícies escuras próprias, que não dependem do tema da página */
    --lat:#17181A; --lat-2:#1E1F22; --lat-linha:#2A2C30; --lat-ativo:#26282B;
    --lat-ink:#F2F1EE; --lat-mut:#8D9096; --lat-mut-2:#63666B;
    --ok:#1D7A4E;                                 /* CBS crédito: crédito maior que o débito */
    --aviso:#C9A227;                              /* conferência: ponto que pede atenção antes de entregar */
    /* Fator R: o verde e o azul do modelo do escritório, em tons suaves para assentar no bege (a família rosa
       e terroso do painel foi testada lado a lado e recusada). O azul ficou um pouco mais fechado de propósito:
       com os dois igualmente claros, quem tem daltonismo tritan não separava um do outro (ΔE 5); assim são 20.
       O contraste baixo do preenchimento é coberto pela legenda e pelos rótulos em cima das barras */
    --frr-linha:#1B6B55;                          /* linha do Fator R */
    /* gráficos da Visão geral: verde do que fica com a empresa, vermelho do imposto, azul da folha */
    --g-rec:#3E8E6A; --g-rec-soft:#B9DBC8; --g-imp:#B5452F; --g-imp-soft:#E0A698;
    --g-folha:#3B6FB6; --g-folha-soft:#A9C1E3; --g-zona:#EEF6F1;
    /* Faixas de redução da CBS: uma escala, não categorias. Um tom só — o vermelho da marca —, escuro na
       alíquota cheia e clareando conforme a redução cresce, para a leitura ser "quanto mais forte, mais imposto".
       A alíquota zero fica fora da rampa: nenhum imposto não é um vermelho fraco */
    --cbs-6:var(--brand);
    --cbs-5:color-mix(in srgb, var(--brand) 76%, #FFFFFF);
    --cbs-4:color-mix(in srgb, var(--brand) 60%, #FFFFFF);
    --cbs-3:color-mix(in srgb, var(--brand) 46%, #FFFFFF);
    --cbs-2:color-mix(in srgb, var(--brand) 33%, #FFFFFF);
    --cbs-1:color-mix(in srgb, var(--brand) 22%, #FFFFFF);
    --cbs-0:var(--line-2);
    /* Cadeia de crédito: escala quente, para conversar com o bege do painel e com o vermelho da logo — o
       grafite frio destoava dos dois (o verde foi comparado antes e recusado) */
    --cad-sim:#8C7A6E;
    --cad-parcial:#BAAAA0;
    --cad-nao:#DED8D1;
    /* texto sobre --fill (recalculado em refresh() pela luz da cor) e tons que antes estavam cravados no CSS */
    /* o cartão não é branco chapado: escurece um fio na base, como papel sob luz que vem de cima */
    --card-luz:color-mix(in srgb, var(--surface) 97%, var(--canvas));
    --sobre-fill:#FFFFFF; --hover-rail:rgba(255,255,255,.6); --hover-linha:#FAF9F6; --alt:#EDEAE4; --veu:rgba(20,22,26,.45);
    /* compasso do espaço: todo recuo e toda distância saem desta escala (4 · 8 · 12 · 16 · 24 · 32 · 48).
       Antes cada bloco tinha o seu (28/30/22, 22/26, 12/18…), e era isso que fazia a página parecer desalinhada */
    --r:9px; --r-2:7px; --r-card:14px;
    --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:32px; --e7:48px;
    --sans:'Instrument Sans','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  /* Modo noturno: só os tokens trocam. --fill e --brand ficam de fora de propósito: são as cores personalizáveis,
     chegam como estilo inline e estilo inline vence qualquer regra daqui — refresh() recalcula as duas */
  html[data-tema="escuro"]{
    color-scheme:dark;
    --ink:#ECEDEF; --ink-2:#C6C9CE; --ink-3:#C6C9CE;
    --muted:#9B9FA6; --muted-2:#7E828A; --muted-3:#7E828A; --disabled:#595D64;
    --canvas:#111214; --surface:#1B1C1F; --surface-2:#232529; --rail:#2B2D32;
    --line:#2C2E33; --line-2:#373A40; --line-3:#4B4F56;
    --ok:#2A8C5C;
    --frr-linha:#7FD7B2;
    --g-rec:#4FA37C; --g-rec-soft:#2F5C49; --g-imp:#C4604A; --g-imp-soft:#6B3B31;
    --g-folha:#5C90D0; --g-folha-soft:#2F4763; --g-zona:#1F2A24;
    --card-luz:color-mix(in srgb, var(--surface) 93%, #FFFFFF);   /* no escuro a luz clareia o alto, não a base */
    /* a mesma rampa das faixas da CBS, com passos mais cheios: no fundo escuro o branco chega rápido demais */
    --cbs-5:color-mix(in srgb, var(--brand) 84%, #FFFFFF);
    --cbs-4:color-mix(in srgb, var(--brand) 70%, #FFFFFF);
    --cbs-3:color-mix(in srgb, var(--brand) 58%, #FFFFFF);
    --cbs-2:color-mix(in srgb, var(--brand) 48%, #FFFFFF);
    --cbs-1:color-mix(in srgb, var(--brand) 40%, #FFFFFF);
    --cbs-0:var(--line-3);
    --cad-sim:#C0AC9E;
    --cad-parcial:#8C7D73;
    --cad-nao:#4B4640;
    --hover-rail:rgba(255,255,255,.08); --hover-linha:#25272B; --alt:#232529; --veu:rgba(0,0,0,.62);
  }
  html[data-tema="escuro"] .logo{background:#fff; padding:3px}          /* a logo é escura: ganha uma placa clara */
  html[data-tema="escuro"] .btn.prim:hover{filter:brightness(.9)}       /* no escuro o botão é claro: clarear some */
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--canvas); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
  [hidden]{display:none !important}
  button{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px}
  .m{font-family:var(--mono)}
  .r{text-align:right}
  h2{margin:0; font-size:18px; font-weight:600; letter-spacing:-.01em}
  h3{margin:0 0 2px; font-size:15px; font-weight:600}
  h4{margin:0 0 8px; font-size:13px; font-weight:600; color:var(--ink)}
  .sub{margin:4px 0 0; font-size:13px; color:var(--muted)}
  .cap{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase}

  /* Casca v2: barra lateral fixa + cabeçalho preso no alto + coluna de conteúdo */
  .page{padding:0}
  .wrap{max-width:none; margin:0; display:block}
  .app2{display:flex; align-items:stretch; min-height:100vh}
  .lat{width:244px; flex:0 0 244px; background:var(--lat); color:var(--lat-ink); display:flex; flex-direction:column;
    position:sticky; top:0; align-self:flex-start; height:100vh; transition:width .18s ease, flex-basis .18s ease}
  .lat-topo{display:flex; align-items:center; gap:9px; padding:22px 14px 22px 20px}
  .lat-topo .logo{height:22px; border-radius:4px}
  .lat-marca{flex:1; min-width:0; font-size:10.5px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
    color:var(--lat-mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lat-x{background:transparent; border:0; color:var(--lat-mut-2); font-size:15px; line-height:1; cursor:pointer; padding:5px 7px; border-radius:var(--r-2)}
  .lat-x:hover{background:var(--lat-ativo); color:var(--lat-ink)}
  .lat-emp{padding:0 14px 22px}
  .lat-emp-b{width:100%; display:flex; align-items:center; gap:10px; background:var(--lat-2); border:1px solid var(--lat-linha);
    border-radius:10px; padding:11px 12px; font:inherit; color:var(--lat-ink); cursor:pointer; text-align:left}
  .lat-emp-b:hover{background:#232427}
  .lat-emp-t{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .lat-emp-n{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lat-emp-c{font-size:10px; color:#75787E; font-family:var(--mono)}
  .lat-emp-b{position:relative}
  .lat-emp-sel{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font:inherit}
  .lat-nav{display:flex; flex-direction:column; padding:0 12px}
  .lat-grupo{font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--lat-mut-2); padding:0 10px 9px; font-family:var(--mono)}
  .lat-grupo + .lat-grupo, .lat-nav .lat-grupo ~ .lat-grupo{padding-top:22px}
  .lat-item{display:flex; align-items:center; gap:10px; width:100%; background:transparent; border:0; color:var(--lat-mut);
    font:inherit; font-size:13px; text-align:left; padding:9px 10px; border-radius:8px; cursor:pointer; transition:background-color .12s ease, color .12s ease}
  .lat-item:hover{background:var(--lat-2); color:var(--lat-ink)}
  .lat-item[aria-current="page"]{background:var(--lat-ativo); color:#fff; font-weight:600}
  .lat-ponto{width:4px; height:4px; border-radius:50%; background:transparent; flex:0 0 4px}
  .lat-item[aria-current="page"] .lat-ponto{background:var(--brand)}
  .lat-pe{margin-top:auto; padding:18px 20px; display:flex; flex-direction:column; gap:12px; border-top:1px solid #232427}
  .lat-salvo{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--lat-mut)}
  .lat-salvo::before{content:""; width:5px; height:5px; border-radius:50%; background:#3FA87A; flex:0 0 5px}
  .lat-salvo.sujo::before{background:var(--lat-mut)}
  .lat-salvo.erro::before{background:var(--brand)}
  .lat-acoes{display:flex; flex-direction:column; gap:2px; position:relative}
  .lat-acoes .menu{left:0; right:auto; top:auto; bottom:calc(100% + 6px); min-width:240px}
  .lat-acoes button{text-align:left; background:transparent; border:0; color:var(--lat-mut); padding:6px 0; font:inherit; font-size:12px; cursor:pointer}
  .lat-acoes button:hover{color:var(--lat-ink)}
  /* recolhida: só os pontos, com o nome no title */
  body.lat-fina .lat{width:64px; flex-basis:64px}
  body.lat-fina .lat-marca, body.lat-fina .lat-emp-t, body.lat-fina .lat-emp-seta,
  body.lat-fina .lat-grupo:first-of-type, body.lat-fina .lat-salvo span, body.lat-fina .lat-acoes{display:none}
  body.lat-fina .lat-grupo{height:18px; overflow:hidden; font-size:0; padding:0}
  body.lat-fina .lat-topo, body.lat-fina .lat-pe{flex-direction:column; align-items:center; padding:18px 0}
  body.lat-fina .lat-emp{padding:0 12px 22px}
  body.lat-fina .lat-emp-b, body.lat-fina .lat-item{justify-content:center; padding:9px 0}
  body.lat-fina .lat-ponto{width:7px; height:7px; flex-basis:7px; background:var(--lat-mut-2)}
  body.lat-fina .lat-item span:not(.lat-ponto){display:none}
  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .cab{position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--canvas) 92%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid color-mix(in srgb, var(--line-3) 70%, var(--canvas));
    padding:18px 36px}
  /* o cabeçalho ocupa a largura toda (o filete vai de ponta a ponta), mas o conteúdo dele fica na mesma
     coluna centralizada do resto — senão, com a barra recolhida, tudo encosta na esquerda */
  .cab-in{max-width:1120px; margin:0 auto; width:100%; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap}
  body.present .cab-in{max-width:1240px}
  .cab-id{display:flex; align-items:center; gap:12px; min-width:0}
  .cab-id h1{margin:0; font-size:21px; font-weight:600; letter-spacing:-.015em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cab-sub{display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:5px}
  .cab-dir{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .modo{display:flex; background:var(--rail); border-radius:10px; padding:3px; gap:2px}
  .modo button{background:transparent; border:0; border-radius:8px; padding:7px 14px; font:inherit; font-size:12.5px; color:var(--ink-3); cursor:pointer}
  .modo button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(20,18,16,.08)}
  .cab-comp{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r); padding:5px 12px}
  .cab-comp .cap{color:var(--muted-2)}
  .cab-comp select{font:inherit; font-size:13px; font-weight:600; color:var(--ink); background:transparent; border:0; padding:2px 0; cursor:pointer; outline:none}
  .hamburguer{display:none}
  .conteudo{padding:28px 36px 56px; margin:0 auto; display:flex; flex-direction:column; gap:20px; max-width:1120px; width:100%; box-sizing:border-box}
  body.present .conteudo{max-width:1240px}
  .lat-veu{display:none}
  @media (max-width:900px){
    .lat{position:fixed; top:0; left:0; z-index:60; width:250px; flex-basis:250px; height:100vh;
      box-shadow:0 0 40px rgba(0,0,0,.35); transform:translateX(-105%); transition:transform .22s ease}
    body.lat-aberta .lat{transform:none}
    body.lat-fina .lat{width:250px; flex-basis:250px}
    .lat-x{display:none}
    .lat-veu{display:block; position:fixed; inset:0; z-index:50; background:rgba(20,18,16,.45)}
    body:not(.lat-aberta) .lat-veu{display:none}
    .hamburguer{display:inline-flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--line-2);
      border-radius:var(--r); width:36px; height:36px; font-size:15px; line-height:1; cursor:pointer; color:var(--ink); flex:0 0 36px}
    .cab{padding:14px 18px}
    .cab-in{align-items:center; gap:12px}
    .cab-id h1{font-size:16px}
    .conteudo{padding:18px 16px 44px; gap:14px}
  }

  /* Cabeçalho */
  /* faixa de cima: logo e nome do escritório, que assina o trabalho; embaixo, a empresa do cliente e o período */
  .top{position:relative; display:flex; flex-direction:column; align-items:stretch; gap:10px}
  .faixa-escr{display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--line-2)}
  .faixa-escr .logo{height:30px}
  .escr-nome{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .ident{display:flex; align-items:flex-end; gap:14px; min-width:0}
  .cli-id{min-width:0}
  .logo{height:44px; width:auto; display:block; flex:0 0 auto}
  .top .nav{position:absolute; right:0; bottom:0}
  @media (max-width:640px){ .top .nav{position:static; justify-content:flex-start} }
  .co{font-size:17px; font-weight:600; letter-spacing:-.01em}
  .ctx{font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.02em; text-transform:uppercase; margin-top:2px}
  .nav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:100%}
  .rail{display:flex; gap:6px; background:var(--rail); padding:4px; border-radius:var(--r); max-width:100%; overflow-x:auto; scrollbar-width:none}
  .tab{padding:7px 14px; font:500 13px/1 var(--sans); border:0; border-radius:var(--r-2); background:transparent; color:var(--ink-3); cursor:pointer; white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--fill); color:var(--sobre-fill)}
  .tab:not([aria-selected="true"]):hover{background:var(--hover-rail); color:var(--ink)}
  .rail-sep{flex:0 0 1px; background:var(--line-3); margin:4px 1px}
  .btn{padding:10px 13px; font:500 12px/1 var(--sans); background:var(--surface); color:var(--ink); border:1px solid var(--line-2); border-radius:var(--r); cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
  .btn:hover{border-color:var(--line-3); background:var(--surface-2)}
  /* resposta ao toque: cor muda em 150ms e o botão afunda 1px enquanto está pressionado */
  .btn, .tab, .add, .lk, .x{transition:background-color .15s ease, border-color .15s ease, color .15s ease, filter .15s ease, transform .1s ease}
  .btn:active:not(:disabled), .tab:active, .add:active{transform:translateY(1px)}
  .in{transition:border-color .15s ease}
  .card-h .btn{padding:7px 13px}

  /* Menu de opções */
  .menu-wrap{position:relative}
  .menu{position:absolute; right:0; top:calc(100% + 6px); z-index:30; background:var(--surface); border-radius:var(--r); box-shadow:0 0 0 1px var(--line-2); min-width:240px; padding:6px 0; display:flex; flex-direction:column}
  .menu button{display:flex; justify-content:space-between; align-items:baseline; gap:12px; width:100%; text-align:left; padding:9px 14px; border:0; background:transparent; font-size:13px; cursor:pointer}
  .menu button:hover{background:var(--surface-2)}
  .menu button.armed{background:var(--fill); color:var(--sobre-fill)}
  .menu .chk{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2)}
  .menu .sep{height:1px; background:var(--line); margin:6px 0}

  /* Personalizar */
  .panel{background:var(--surface); padding:var(--e5); border-radius:var(--r)}
  .panel-h{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px}
  .fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr)); gap:18px 28px}
  .field{display:flex; flex-direction:column; gap:4px; min-width:0}
  .field > span{font-size:11px; color:var(--muted)}
  .swatches{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .sw{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3)}
  .sw input[type=color]{width:34px; height:26px; padding:0; border:1px solid var(--line-2); border-radius:var(--r); background:none; cursor:pointer}

  /* Faixa de indicadores */
  .hero{display:grid; grid-template-columns:minmax(0,1fr); gap:var(--e4)}
  /* o recorte arredondado fica no contêiner: assim o fundo que faz as divisórias não sobra nas quinas */
  .hero-side{display:grid; grid-auto-rows:1fr; gap:1px; background:var(--line-2); min-width:0;
    border-radius:var(--r); overflow:hidden}
  .hero-row{background:var(--surface-2); padding:var(--e3) var(--e4); display:flex; align-items:center; justify-content:space-between; gap:4px 16px; flex-wrap:wrap}
  .hero-row .lbl{font-size:13px; color:var(--ink-3)}
  .hero-row .suf{font-size:11px; color:var(--muted-2)}
  .hero-row .val{font-family:var(--mono); font-size:16px; font-weight:600; white-space:nowrap; margin-left:auto}
  .hero-row.cbs{border-left:3px solid var(--brand)}
  .hero-row.cbs .val{color:var(--brand)}
  .hero-row.cbs.credito{border-left-color:var(--ok)}
  .hero-row.cbs.credito .val{color:var(--ok)}
  .pct-s{color:var(--muted-2); font-size:12px; font-weight:400}

  /* Glossário: botão redondo ao lado do termo e o painel no canto de baixo */
  .ajuda{width:15px; height:15px; margin-left:6px; border:1px solid var(--line-3); background:var(--surface); color:var(--muted);
    border-radius:50%; font:700 9.5px/1 var(--sans); cursor:pointer; padding:0; display:inline-flex; align-items:center; justify-content:center}
  .ajuda:hover{color:var(--ink); border-color:var(--muted)}
  .gloss{position:fixed; right:24px; bottom:24px; z-index:70; width:330px; max-width:calc(100% - 24px); background:var(--surface);
    border:1px solid var(--line-2); border-radius:12px; padding:16px 18px; box-shadow:0 12px 32px rgba(30,26,20,.16)}
  .gloss-h{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px}
  .gloss h3{font-size:13.5px}
  .gloss p{margin:0; font-size:13px; color:var(--ink-3); line-height:1.5; text-wrap:pretty}
  @media (max-width:640px){ .gloss{right:12px; left:12px; width:auto} }
  /* Como ler: a leitura em português no pé da DRE, só na apresentação */
  .como-ler{margin-top:var(--e4); padding:14px 16px; background:var(--surface-2); border-radius:var(--r)}
  .como-ler .cap{color:var(--muted-2)}
  .como-ler p{margin:4px 0 0; font-size:14px; color:var(--ink-2); line-height:1.5; text-wrap:pretty}

  /* Selo de conferência: filete verde quando está tudo certo, âmbar quando algo pede atenção */
  .selo{background:var(--surface); border:1px solid var(--line-2); border-left:4px solid var(--ok); border-radius:12px; overflow:hidden}
  .selo.atencao{border-color:#EDE0C2; border-left-color:var(--aviso)}
  .selo-b{display:flex; align-items:center; gap:12px; width:100%; background:transparent; border:0; padding:14px 18px; font:inherit; cursor:pointer; text-align:left}
  .selo-ponto{width:9px; height:9px; border-radius:50%; flex:0 0 9px; background:var(--ok)}
  .selo.atencao .selo-ponto{background:var(--aviso)}
  .selo-txt{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
  .selo-tit{font-size:13.5px; font-weight:600}
  .selo-sub{font-size:12.5px; color:var(--ink-3)}
  .selo-seta{font-size:12px; color:var(--muted)}
  .selo-lista{display:flex; flex-direction:column; border-top:1px solid var(--line)}
  .selo-item{display:flex; align-items:flex-start; gap:11px; padding:11px 18px; border-bottom:1px solid var(--line)}
  .selo-item:last-child{border-bottom:0}
  .selo-marca{width:18px; height:18px; border-radius:5px; flex:0 0 18px; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700}
  .selo-marca.ok{background:#E8F3ED; color:var(--ok)}
  .selo-marca.atencao{background:#FBF2DE; color:#96701A}
  .selo-t{display:block; font-size:13px; font-weight:500}
  .selo-d{display:block; font-size:12.5px; color:var(--muted); text-wrap:pretty}

  /* Visão geral: o mês em três números */
  .inds{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px}
  .ind{background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-card); padding:20px 22px;
    display:flex; flex-direction:column; gap:10px}
  .ind .cap{color:var(--muted)}
  .ind-v{font-family:var(--mono); font-size:27px; font-weight:600; letter-spacing:-.02em}
  .ind.brand .ind-v{color:var(--brand)}
  /* crédito de CBS não é conta a pagar: sai do vermelho e vira verde */
  .ind.brand.credito .ind-v{color:var(--ok)}
  .ind-s{font-size:12px; color:var(--ink-3)}
  /* Gráficos da Visão geral (redesenho de 23/09/2026, docs/redesign-graficos): o de receita e imposto e o do
     Fator R dividem a mesma casca — seletor de período, área de desenho com eixo à esquerda e painel ao lado */
  .per{display:flex; gap:2px; background:var(--surface-2); border-radius:var(--r-2); padding:2px}
  .per button{border:0; background:transparent; border-radius:5px; padding:6px 12px; font:500 12.5px/1 var(--sans);
    color:var(--muted); cursor:pointer}
  .per button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(30,26,20,.10)}
  .graf-corpo{display:flex; gap:var(--e6)}
  .graf-plot{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--e4)}
  .graf-lado{width:270px; flex-shrink:0; border-left:1px solid var(--line); padding-left:var(--e5);
    display:flex; flex-direction:column; gap:var(--e4)}
  .glegenda{display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:12px; color:var(--ink-2)}
  .glegenda span{display:flex; align-items:center; gap:6px}
  .sw{width:10px; height:10px; border-radius:2px; display:inline-block}
  .sw.rec{background:var(--g-rec)} .sw.imp{background:var(--g-imp)}
  .sw.linha{width:16px; height:0; border-radius:0; border-top:2px solid var(--frr-linha)}
  .sw.corte{width:16px; height:0; border-radius:0; border-top:2px dashed var(--g-imp)}
  .plot-row{display:flex; gap:12px}
  .yaxis{width:52px; flex-shrink:0; position:relative; font-family:var(--mono); font-size:10.5px; color:var(--muted-2)}
  .yaxis span{position:absolute; right:0; transform:translateY(50%)}
  .yaxis.alto span{transform:translateY(-50%)}
  .yaxis.rot-folha{text-align:right; color:var(--g-folha); font-family:var(--mono); font-size:10.5px; padding-top:26px}
  .plot{flex:1; min-width:0; position:relative; height:230px}
  .plot > i{position:absolute; left:0; right:0; border-top:1px solid var(--line)}
  .cols{position:absolute; inset:0; display:flex; gap:8px}
  .gcol{flex:1 1 0; min-width:0; height:100%; padding:0; border:0; border-radius:8px 8px 0 0; background:transparent;
    cursor:pointer; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px}
  .gcol[aria-pressed="true"]{background:var(--surface-2)}
  .gval{display:flex; flex-direction:column; align-items:center; gap:1px; font-family:var(--mono)}
  .gval b{font-size:10.5px; font-weight:600; color:var(--muted); white-space:nowrap}
  .gval small{font-size:9px; color:var(--g-imp); white-space:nowrap}
  .gcol[aria-pressed="true"] .gval b{color:var(--ink)}
  .gstack{width:64%; max-width:44px; display:flex; flex-direction:column; border-radius:4px 4px 0 0; overflow:hidden}
  .gsobra{background:var(--g-rec-soft)} .gimp{background:var(--g-imp-soft)}
  .gcol[aria-pressed="true"] .gsobra{background:var(--g-rec)}
  .gcol[aria-pressed="true"] .gimp{background:var(--g-imp)}
  .gstub{width:64%; max-width:44px; height:18px; border:1px dashed var(--line-3); border-bottom:0; border-radius:4px 4px 0 0}
  .xrow{display:flex; gap:12px; margin-top:-6px}
  .xrow .cells{flex:1; min-width:0; display:flex; gap:8px; border-top:1px solid var(--line-2); padding-top:8px}
  .gx{flex:1 1 0; min-width:0; text-align:center; font-family:var(--mono); font-size:11px; color:var(--muted-2)}
  .gx small{display:block; font-size:9px; color:var(--muted-3)}
  .gx.on{color:var(--ink); font-weight:600}
  .note{margin:0; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; text-wrap:pretty}
  .stub-mini{width:14px; height:9px; flex:0 0 14px; border:1px dashed var(--line-3); border-bottom:0; display:inline-block}
  /* painel do mês, ao lado do gráfico */
  .lado-tit{font-size:20px; font-weight:600; margin-top:2px}
  .lado-v{font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:-.01em}
  .lado-var{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  .lado-var.sobe{color:var(--ok)} .lado-var.desce{color:var(--g-imp)}
  .lado-split{display:flex; height:9px; border-radius:5px; overflow:hidden; background:var(--line)}
  .lado-split i.rec{background:var(--g-rec)} .lado-split i.imp{background:var(--g-imp)}
  .lado-linhas{display:flex; flex-direction:column; gap:9px; font-size:12.5px}
  .lado-linhas > div{display:flex; justify-content:space-between; gap:12px}
  .lado-linhas > div > span:first-child{color:var(--ink-3)}
  .lado-linhas .v{font-family:var(--mono)}
  .lado-linhas .v.forte, .lado-linhas .forte{font-weight:600}
  .lado-linhas .v.imp{color:var(--g-imp); font-weight:600}
  .lado-hr{height:1px; background:var(--line); display:block}
  .lado-vazio{margin:0; font-size:13px; color:var(--muted); line-height:1.5; text-wrap:pretty}
  /* Fator R: faixa do Anexo III, linha, pontos e a folha em mini-barras */
  .frr-plot .frr-zona{position:absolute; left:0; right:0; top:0; background:var(--g-zona)}
  .frr-zona-rot{position:absolute; right:6px; font-family:var(--mono); font-size:10.5px}
  .frr-zona-rot.cima{top:6px; color:var(--ok)}
  .frr-zona-rot.baixo{color:var(--g-imp)}
  .frr-corte{position:absolute; left:0; right:0; border-top:2px dashed var(--g-imp)}
  .frr-svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
  .frr-pt{position:absolute; width:9px; height:9px; border-radius:50%; background:var(--surface);
    border:2px solid var(--frr-linha); transform:translate(-50%, -50%)}
  .frr-pt.on{width:13px; height:13px; background:var(--frr-linha)}
  .frr-rot{position:absolute; transform:translate(-50%, -190%); font-family:var(--mono); font-size:10.5px;
    font-weight:600; color:var(--frr-linha); white-space:nowrap;
    text-shadow:0 0 3px var(--surface), 0 0 3px var(--surface), 0 0 2px var(--surface)}
  .frr-rot.on{background:var(--frr-linha); color:var(--surface); padding:2px 6px; border-radius:4px;
    transform:translate(-50%, -170%); text-shadow:none}
  .fcell{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px}
  .fbar-wrap{height:34px; width:100%; display:flex; align-items:flex-end; justify-content:center}
  .fbar{width:44%; max-width:26px; background:var(--g-folha-soft); border-radius:3px 3px 0 0}
  .fbar.on{background:var(--g-folha)}
  .fval{font-family:var(--mono); font-size:9.5px; color:var(--g-folha)}
  .frr-grande{display:flex; align-items:baseline; gap:10px; margin-top:2px}
  .frr-num{font-family:var(--mono); font-size:34px; font-weight:600; letter-spacing:-.02em}
  .frr-tag{font-size:12.5px; font-weight:500}
  .frr-tag.ok{color:var(--ok)} .frr-tag.nao{color:var(--g-imp)}
  .medidor{position:relative; height:10px; border-radius:5px; background:var(--line)}
  .medidor .fill{position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--ink)}
  .medidor .mark{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--g-imp)}
  .medidor-esc{position:relative; height:15px; margin-top:6px; font-family:var(--mono); font-size:10.5px; color:var(--muted-2)}
  .medidor-esc span{position:absolute}
  .medidor-esc .corte{transform:translateX(-50%); color:var(--g-imp); font-weight:600}
  .frr-box{background:var(--surface-2); border-radius:var(--r); padding:14px 16px; display:flex; flex-direction:column;
    gap:9px; font-size:12.5px}
  .frr-box .forte{font-weight:600}
  .frr-box .nota, .graf-lado .nota{margin:0; font-size:11.5px; color:var(--muted); line-height:1.5; text-wrap:pretty}
  .graf-lado .nota.aviso{color:var(--g-imp)}
  @media (max-width:900px){
    .graf-corpo{flex-direction:column}
    .graf-lado{width:auto; border-left:0; border-top:1px solid var(--line); padding-left:0; padding-top:var(--e5)}
    .gval small{display:none}
  }
  .faixa-sn{padding:18px 22px}
  .faixa-sn-in{display:flex; flex-wrap:wrap; gap:14px 34px}
  .faixa-sn-in > div{display:flex; flex-direction:column; gap:4px; padding-left:18px; border-left:1px solid var(--line)}
  .faixa-sn-in > div:first-child{padding-left:0; border-left:0}
  .fsn-v{font-family:var(--mono); font-size:14px; color:var(--ink)}

  /* DRE */
  /* filete de 1px mais uma sombra de papel: uma de contato bem fraca e uma larga e quase invisível embaixo.
     Comparada na tela com a versão só de filete (18/09/2026) — esta ganhou, o cartão deixa de parecer chapado.
     No escuro fica só o filete: sombra em fundo escuro suja em vez de dar volume */
  .card, .panel{box-shadow:0 0 0 1px var(--line), 0 1px 2px rgba(20,22,26,.045), 0 16px 32px -24px rgba(20,22,26,.30)}
  html[data-tema="escuro"] .card, html[data-tema="escuro"] .panel{box-shadow:0 0 0 1px var(--line)}
  .card{background:linear-gradient(180deg, var(--surface) 0, var(--card-luz) 100%); padding:var(--e5) var(--e5) var(--e4); min-width:0; border-radius:var(--r)}
  html[data-tema="escuro"] .card{background:linear-gradient(180deg, var(--card-luz) 0, var(--surface) 160px)}
  .card-h{display:flex; align-items:flex-end; justify-content:space-between; gap:var(--e3) var(--e5); flex-wrap:wrap; margin-bottom:var(--e5)}
  .dl{display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:11px 0; border-top:1px solid var(--line)}
  .dl .l{font-size:14px; min-width:0}
  .dl .v{font-family:var(--mono); font-size:15px; white-space:nowrap; display:flex; align-items:baseline; justify-content:flex-end}
  .p{color:var(--muted-2); font-size:12px; font-weight:400; display:inline-block; width:52px; flex:0 0 52px; text-align:right}
  .tag-src{font-weight:400; color:var(--muted-2); font-size:12px; font-family:var(--mono)}
  .dl.rec{border-top-color:var(--ink); padding:12px 0}
  .dl.rec .l{font-size:15px; font-weight:500}
  .dl.rec .v{font-size:17px; font-weight:600}
  .dl.tot{padding:14px 0 11px}
  .dl.tot .l{font-size:15px; font-weight:500}
  .dl.tot .v{font-size:16px; font-weight:600}
  /* lucro bruto só em texto vermelho: com fundo rosa ele chamava mais atenção que o próprio resultado */
  .dl.gross{padding:12px 0}
  .dl.gross .l, .dl.gross .v, .dl.gross .p{color:var(--brand)}
  .dl.gross .l{font-size:15px; font-weight:500}
  .dl.gross .v{font-size:16px; font-weight:600}
  /* fechamento da DRE (17/09/2026): traço duplo em cima e fundo bege claro, a convenção do total final em demonstrativo
     impresso. Substituiu o bloco preto; a faixa com filete escuro à esquerda foi comparada na tela e perdeu */
  .dl.res{background:var(--surface-2); color:var(--ink); margin:10px -16px 0; padding:14px 16px; border-top:4px double var(--ink); align-items:center}
  .dl.res .l{font-size:16px; font-weight:500}
  .dl.res .v{font-size:20px; font-weight:600}
  .dl.res .p{color:var(--muted-2); font-size:13px}
  .det{background:var(--surface-2); padding:6px 14px 10px; margin-bottom:4px; border-radius:var(--r)}
  .scroll-x{overflow-x:auto}
  /* nome curto não precisa de meia tela: o item tem teto e a folga vai para as colunas de números */
  /* colunas elásticas: com largura fixa a tabela estourava e caía na rolagem lateral em tela menor ou com zoom */
  .g5{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(86px,.9fr) minmax(96px,1.1fr) minmax(76px,.8fr) minmax(86px,.9fr); gap:10px; align-items:center}
  .g5 .in.val{width:100%}                        /* 15ch fixo estourava a célula e acendia a rolagem */
  .g5 > :nth-child(3){padding-left:14px}                               /* regra afastada do valor à esquerda */
  .g5.gh > span.esq, .grec.gh > span.esq{text-align:left}
  .regra .sel{font-size:12px}
  .regra.sem .sel{color:var(--muted-2)}
  .gr:hover .sel-wrap::after, .gr .sel-wrap:focus-within::after{opacity:1}
  .g4{display:grid; grid-template-columns:minmax(0,1fr) 118px 74px 104px; gap:10px; align-items:center}
  .gh{padding:8px 0 6px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2)}
  .gh > span:not(:first-child){text-align:right}
  .gr{padding:5px 0; border-top:1px solid var(--line); font-size:13px}
  .nm{color:var(--ink-2); min-width:0}
  .cr-v{font-family:var(--mono); font-weight:500; text-align:right; white-space:nowrap}
  .det-cap{padding:18px 0 4px; font:500 10px/1.4 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2)}
  .det-foot{display:flex; justify-content:space-between; gap:12px; padding:9px 0 2px; border-top:1px solid var(--ink); margin-top:4px; font-size:12px; font-family:var(--mono)}
  .det-foot span:first-child{color:var(--muted)}
  .det-foot span:last-child{font-weight:600; white-space:nowrap}
  .li{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:5px 0; border-top:1px solid var(--line); font-size:13px}
  .li .v{font-family:var(--mono); white-space:nowrap; display:flex; align-items:baseline}
  .li .p{width:52px; flex-basis:52px}
  /* Estado vazio: não é erro nem aviso, é a ausência de conteúdo. Por isso não ganha caixa — ganha o espaço
     que o conteúdo ocuparia, um traço em cima e a frase no meio. A caixa cinza fica para avisar (.flag) */
  .vazio{margin-top:var(--e5); padding:var(--e6) var(--e4) var(--e5); text-align:center; border-top:1px solid var(--line);
    font-size:13px; color:var(--muted); line-height:1.6}
  .vazio strong{display:block; margin-bottom:6px; font-size:15px; font-weight:500; color:var(--ink-2)}
  .vazio p{margin:0 auto; max-width:56ch}
  .flag{margin-top:18px; background:var(--surface-2); padding:10px 14px; border-radius:var(--r); font-size:12px; color:var(--muted); line-height:1.5}

  /* Campos: texto alinhado à coluna, sem caixa */
  .in{width:100%; min-width:0; text-align:right; font-family:var(--mono); font-size:13px; padding:2px 0; border:0; border-bottom:1px solid transparent; border-radius:0; background:transparent; color:var(--ink); outline:none}
  .in:hover{border-bottom-color:var(--line-3)}
  .in:focus, .in:focus-visible{border-bottom-color:var(--brand); outline:none}
  .in.txt{text-align:left; font-family:var(--sans)}
  .in.main{width:78px; font-size:15px; font-weight:600; border-bottom-color:var(--line-3)}
  .in.main:focus{border-bottom-color:var(--brand)}
  .field .in.txt{font-size:14px; border-bottom-color:var(--line-3)}
  .in.val{width:15ch; font-size:inherit; font-weight:inherit; color:inherit}
  .editando .in.val{border-bottom-color:var(--line-3)}
  .present .in{pointer-events:none; border-bottom-color:transparent !important}

  /* Reforma · CBS */
  .reforma{display:block}
  .memo{background:var(--surface); padding:26px 28px; min-width:0; border-radius:var(--r)}
  .prem{background:var(--surface-2); padding:14px 16px; margin:18px 0 22px; display:flex; align-items:flex-end; gap:14px 28px; flex-wrap:wrap}
  .prem-t{display:flex; flex-direction:column; gap:3px; flex:1 1 200px; min-width:0}
  .prem-t .cap{font-size:10px; letter-spacing:.1em; color:var(--muted-2)}
  .prem-t > span:last-child{font-size:12px; color:var(--muted)}
  .prem-f{display:flex; gap:22px; margin-left:auto}
  .prem-f label{display:flex; flex-direction:column; gap:2px}
  .prem-f label > span{font-size:11px; color:var(--muted)}
  .grp{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); padding-bottom:6px; border-bottom:1px solid var(--ink)}
  .memo .card-h{margin-bottom:0}
  .resumo-cbs{margin-top:18px; border-top:1px solid var(--ink)}
  .resumo-cbs .sum{border-bottom:1px solid var(--line)}
  .cr{padding:8px 0; border-bottom:1px solid var(--line); font-size:13px}
  .nmwrap{display:flex; align-items:center; gap:4px; min-width:0}
  .nmcol{display:flex; flex-direction:column; gap:1px; min-width:0}
  .parte{display:flex; align-items:baseline; gap:6px; font-size:11px; color:var(--muted-2)}
  .in.mini{width:44px; flex:0 0 44px; font-size:11px}
  .li .nm{flex:1 1 auto}
  .li .nmcol{flex:1 1 auto}                     /* nome editável ocupa a linha toda, como nas despesas gerais */
  .ink3{color:var(--ink-3)}
  .mut{color:var(--muted-2)}
  .mut12{color:var(--muted-2); font-size:12px}
  .mut11{color:var(--muted-2); font-size:11px}
  /* controles da linha ficam sobrepostos ao fim do nome e só aparecem no hover/foco: não ocupam espaço */
  .nmwrap{position:relative}
  .row-ctl{position:absolute; right:0; top:50%; transform:translateY(-50%); display:inline-flex; align-items:center;
    background:var(--surface); padding-left:6px; opacity:0; pointer-events:none; transition:opacity .15s}
  .cr:hover .row-ctl, .cr:focus-within .row-ctl, .editando .row-ctl{opacity:1; pointer-events:auto}
  @media (hover:none){ .row-ctl{opacity:1; pointer-events:auto} }
  .chip{border:0; background:transparent; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); padding:2px 4px; cursor:pointer; white-space:nowrap}
  .chip:hover, .x:hover{color:var(--ink)}
  /* tipo de alíquota da linha: seletor com cara de etiqueta */
  .chip-sel{appearance:none; -webkit-appearance:none; border:0; border-radius:0; background:transparent; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); padding:2px 4px; cursor:pointer; outline:none}
  .chip-sel:hover, .chip-sel:focus{color:var(--ink)}
  .chip-sel option{text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:13px; color:var(--ink)}
  .x{border:0; background:transparent; color:var(--muted-2); cursor:pointer; font-size:15px; line-height:1; padding:0 4px}
  .add{border:0; background:transparent; color:var(--muted); font-size:12px; padding:8px 0 2px; cursor:pointer}
  .add:hover{color:var(--ink); text-decoration:underline}
  .present .row-ctl, .present .add{display:none !important}
  .sum{display:flex; justify-content:space-between; gap:12px; padding:10px 0; font-size:14px}
  .sum span:first-child{font-weight:500}
  .sum span:last-child{font-family:var(--mono); font-weight:600; white-space:nowrap}
  .sum.deb{padding-bottom:18px}
  .sum.credor{padding-top:0; font-size:13px}
  .sum.credor span{font-weight:400 !important; color:var(--ink-3)}
  /* CBS a pagar: fundo claro, filete e valor em vermelho — a mesma linha "CBS a pagar" do topo da página. Com sobra
     de crédito, verde suave. Substituiu o bloco vermelho em 17/09/2026 */
  .total{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px 14px 13px; margin:10px -16px 0;
    background:var(--surface-2); color:var(--ink); border-left:3px solid var(--brand)}
  .total > span:first-child{font-size:15px; font-weight:500}
  .total > span:last-child{font-family:var(--mono); font-size:19px; font-weight:600; white-space:nowrap; color:var(--brand)}
  .total.credito{border-left-color:color-mix(in srgb, var(--ok) 80%, var(--surface))}
  .total.credito > span:last-child{color:var(--ok)}
  .total .suf{margin-left:8px; font-size:12px; font-weight:400; color:var(--muted)}
  /* débito e crédito com a barra na mesma linha: rótulo, barra, valor; a origem do crédito embaixo da barra */
  .sum-bar{display:grid; grid-template-columns:minmax(120px,.8fr) minmax(0,2fr) auto; align-items:center; gap:4px 18px;
    padding:11px 0; border-bottom:1px solid var(--line); font-size:14px}
  .sb-l{font-weight:500}
  .sb-track{display:flex; height:8px; background:var(--canvas)}
  .sb-track .fill{transition:width .3s cubic-bezier(.2,.7,.2,1)}
  .sb-v{font-family:var(--mono); font-weight:600; white-space:nowrap; text-align:right; min-width:110px}
  .sb-leg{grid-column:2 / 4; font-size:11px; color:var(--muted-2)}
  /* débito em grafite (neutro, de partida); crédito em tons de verde, porque é a favor da empresa — as partes na ordem da
     legenda. Grafite e verde se separam pela claridade, não só pela cor; vermelho fica para a CBS a pagar, na linha de baixo */
  .c-deb{background:var(--ink-3)}
  .cr-compras{background:color-mix(in srgb, var(--ok) 70%, var(--surface))}
  .cr-despesas{background:var(--ok)}
  .cr-outras{background:color-mix(in srgb, var(--ok) 45%, var(--surface))}
  .cr-saldo{background:color-mix(in srgb, var(--ok) 25%, var(--surface))}
  .bar{display:flex; flex-direction:column; gap:5px; margin-bottom:14px}
  .bar-h{display:flex; justify-content:space-between; gap:12px; font-size:12px}
  .bar-h > span:first-child{color:var(--ink-3)}
  .bar-h > span:last-child{font-family:var(--mono); font-weight:500; white-space:nowrap}
  .track{height:10px; background:var(--canvas)}
  .fill{height:100%; width:0; transition:width .3s cubic-bezier(.2,.7,.2,1)}
  .c-ink{background:var(--fill)} .c-ink3{background:var(--ink-3)} .c-mut{background:var(--muted-3)} .c-brand{background:var(--brand)} .c-line{background:var(--line-3)}
  .track.empilhada{display:flex}
  .cr-legenda{margin:5px 0 0; font-size:11px; color:var(--muted-2); line-height:1.5}
  .fill.credito{background:var(--ok)}
  .kv.brand.credito{color:var(--ok)}
  .prem2{margin-top:16px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:12px}
  .prem2 label{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12px; color:var(--ink-3)}
  .prem2 label small{display:block; font-size:11px; color:var(--muted-2); margin-top:2px}
  .prem2 .in{width:120px; flex:0 0 120px; font-size:14px; font-weight:600; border-bottom-color:var(--line-3)}
  .prem2 .in:focus{border-bottom-color:var(--brand)}
  .hint{margin:12px 0 0; font-size:11px; color:var(--muted-2); line-height:1.5}

  /* Tradicional × Híbrido: um cartão por regime — os números em cima, a composição dos tributos embaixo.
     Cada barra é o total do próprio regime; quem compara o tamanho dos dois é a faixa da decisão */
  .cmp2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; margin:4px 0 16px}
  .cmp-card{display:flex; flex-direction:column; min-width:0; border:1px solid var(--line-2); padding:var(--e5) var(--e5) var(--e4); background:var(--surface-2); border-radius:var(--r)}
  .cmp-card h3{font-size:16px}
  .cmp-nota{margin:0 0 10px; font-size:12px; color:var(--muted)}
  .cmp-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:13px; color:var(--ink-2)}
  .cmp-row > span:first-child{min-width:0}
  .cmp-row small{display:block; font-size:11px; color:var(--muted-2)}
  .cmp-row .v{font-family:var(--mono); font-size:14px; color:var(--ink); white-space:nowrap}
  .cmp-row.dest > span:first-child, .cmp-row.tot > span:first-child{font-weight:500; color:var(--ink)}
  .cmp-row.dest .v, .cmp-row.tot .v{font-size:17px; font-weight:600}
  .cmp-row.sub, .cmp-row.tot{margin-top:4px; padding:9px 10px; border-top:0; background:var(--surface)}   /* faixa branca no cartão cinza */
  .cmp-row.sub, .cmp-row.sub .v{color:var(--muted)}               /* parte do DAS, não soma a ele */
  .cmp-comp{margin-top:auto; padding-top:16px}                    /* as duas composições na mesma altura */
  .cmp-comp h4{margin:0 0 8px; padding-top:14px; border-top:1px solid var(--line-2); font-size:12px; font-weight:500; color:var(--ink-3)}
  .cmp-bar2 > span{transition:width .3s cubic-bezier(.2,.7,.2,1)}
  .cmp-bar2{display:flex; height:10px; background:var(--canvas)}
  .cmp-bar2 > span{display:block; height:100%; width:0}
  /* o DAS em cinza, não em preto: a barra fica leve e o olho vai para o vermelho, que é a CBS — o que se compara ali */
  .c-das{background:var(--muted-2)}
  .cmp-leg{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px 12px; margin-top:10px}
  .cmp-parte{display:flex; align-items:flex-start; gap:7px; min-width:0; font-size:11px; color:var(--muted)}
  .cmp-parte .cg-q{margin-top:3px}
  .cmp-parte b{display:block; font-family:var(--mono); font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap}
  .cmp-parte .m{display:block; color:var(--muted-2); white-space:nowrap}   /* "R$" nunca fica numa linha e o número na outra */
  .cmp-carga{display:block; margin-top:10px; font-size:11px; color:var(--muted-2)}
  .cmp-eq{margin:12px 0 0; font-size:12px; color:var(--ink-3); line-height:1.5}
  /* quem sai mais barato: o cartão vencedor fica branco, com filete verde suave no topo,
     etiqueta com troféu e a diferença embaixo do valor. A barra preta embaixo dos cartões saiu em 17/09/2026 (pesava
     mais que os cartões); a faixa clara no lugar dela e o contorno escuro no cartão foram testados e recusados.
     Filete por sombra interna, não por borda: não empurra o conteúdo e as linhas dos dois cartões seguem alinhadas */
  .cmp-tag, .cmp-ganho{display:none}
  .cmp-card.ganha{background:var(--surface); border-top-color:color-mix(in srgb, var(--ok) 80%, var(--surface));
    box-shadow:inset 0 2px 0 color-mix(in srgb, var(--ok) 80%, var(--surface))}   /* borda de cima + sombra: 3px verdes rentes à borda */
  .cmp-card.ganha .cmp-tag{display:inline-flex; align-items:center; gap:6px; align-self:flex-start; margin:0 0 10px; padding:5px 9px 5px 7px;
    font:500 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ok); background:color-mix(in srgb, var(--ok) 13%, var(--surface))}
  .cmp-tag .trofeu{width:13px; height:13px; flex:none}
  .cmp-card.ganha .cmp-ganho{display:block; margin:-2px 0 6px; font-size:12px; color:var(--ink-3)}
  html[data-tema="escuro"] .cmp-card.ganha .cmp-tag{color:#7BD3A3; background:color-mix(in srgb, var(--ok) 26%, var(--surface))}

  /* Receita por tipo (detalhamento da receita) e Simples Nacional do mês */
  .grec{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(86px,.9fr) minmax(104px,1.15fr) minmax(104px,1.15fr) minmax(86px,.9fr); gap:10px; align-items:center}
  /* o anexo fica embaixo do nome da linha: atividade diferente, tabela diferente, sem coluna nova */
  .grec .anx .sel{font-size:11px; color:var(--muted); padding:0}
  .grec .anx::after{font-size:9px}
  .grec > :nth-child(3){padding-left:14px}                              /* seletor afastado do número à esquerda */
  .gr:hover .row-ctl, .gr:focus-within .row-ctl, .li:hover .row-ctl, .li:focus-within .row-ctl{opacity:1; pointer-events:auto}
  .seg-prem{display:flex; align-items:flex-end; flex-wrap:wrap; gap:10px 28px; padding:8px 0 12px}
  .seg-campo{display:flex; flex-direction:column; gap:2px; min-width:0}
  .seg-campo > span:first-child{font-size:11px; color:var(--muted)}
  .seg-campo .sel-wrap, .seg-campo .in{width:150px}
  .seg-campo.larga .sel-wrap{width:172px}       /* "Início de atividade" não cabe em 150px */
  .seg-campo .sel, .seg-campo .in{font-size:14px; font-weight:600; text-align:left; border-bottom-color:var(--line-3)}
  .seg-campo .sel-wrap::after{opacity:1}
  .seg-faixa{font-family:var(--mono); font-size:12px; color:var(--ink-3); padding-bottom:4px}
  /* de onde veio a receita dos 12 meses: quantos meses entraram e o botão de somar de novo */
  /* ao lado da faixa, nunca embaixo do campo: dentro da coluna ela desalinhava os rótulos */
  .seg-nota{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--muted-2); padding-bottom:4px}
  .seg-nota .lk{border:0; background:none; padding:0; font:inherit; color:var(--ink-3); text-decoration:underline; cursor:pointer}
  .seg-nota .lk:hover{color:var(--brand)}
  .present .seg-nota .lk{display:none}
  /* o ano pelos meses salvos: uma linha por competência, com totais */
  .gano{display:grid; grid-template-columns:minmax(64px,.7fr) repeat(6, minmax(74px,1fr)); gap:0 12px; padding:7px 0; border-top:1px solid var(--line); font-size:13px; align-items:baseline; min-width:600px}
  .gano > span:not(:first-child){font-family:var(--mono); text-align:right; white-space:nowrap}
  .gano.gh{border-top:0; padding-bottom:5px; font-size:11px; color:var(--muted)}
  .gano.gh > span:not(:first-child){font-family:var(--sans); font-weight:400}
  .gano.tot{border-top:1px solid var(--line-3); font-weight:500}
  .gano.tot > span:first-child{font-weight:500}
  .gano.tot > span:not(:first-child), .gpres.tot > span:not(:first-child),
  .gpres.dif > span:not(:first-child), .sn-fim > .v{font-weight:600}
  .ano-acoes{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:16px}
  .ano-acoes .lk{border:0; background:none; padding:0; font:inherit; font-size:12px; color:var(--ink-3); text-decoration:underline; cursor:pointer}
  .ano-acoes .lk:hover{color:var(--brand)}
  .present .ano-acoes{display:none}
  /* Lucro Presumido: uma linha por tributo, uma coluna por trimestre e o ano */
  /* o número de colunas muda com o período escolhido (4 trimestres ou um por mês salvo), por isso vem em --cols */
  .gpres{display:grid; grid-template-columns:minmax(150px,1.5fr) repeat(var(--cols,5), minmax(max-content,1fr)); gap:0 12px; padding:7px 0; border-top:1px solid var(--line); font-size:13px; align-items:baseline; min-width:640px}
  .gpres > span:not(:first-child){font-family:var(--mono); text-align:right; white-space:nowrap}
  .gpres > span:first-child{color:var(--ink-2)}
  .gpres.gh{border-top:0; padding-bottom:6px; font-size:11px; color:var(--muted)}
  .gpres.gh > span:not(:first-child){font-family:var(--sans); font-weight:500; color:var(--ink-3)}
  .gpres.gh small{display:block; font-weight:400; color:var(--muted-2); font-size:10px}
  .gpres.gh .unid{font-family:var(--mono); letter-spacing:.06em; text-transform:uppercase}
  .gpres.rec{border-top-color:var(--ink); font-weight:500}
  .gpres.rec > span:first-child{color:var(--ink)}
  .gpres.sub, .gpres.sub > span:first-child{color:var(--muted-2); font-size:12px}
  .gpres.tot{border-top:1px solid var(--line-3); font-weight:500}
  .gpres.tot > span:first-child{color:var(--ink)}
  .gpres.cmp > span{color:var(--ink-3)}
  .gpres.dif{border-top:1px solid var(--ink); font-weight:500}
  .gpres > span:first-child small{display:block; font-family:var(--sans); font-size:11px; font-weight:400; color:var(--muted-2); line-height:1.35}
  /* troféu do regime que sai mais barato no ano, junto do nome. Marcar a célula de cada coluna (filete verde
     ou troféu no número) foi comparado na tela em 18/09/2026 e recusado: poluía a leitura dos valores */
  .venc-tag{display:inline-flex; align-items:center; margin-left:7px; color:var(--ok); vertical-align:-2px}
  .venc-tag .trofeu{width:13px; height:13px; flex:none}
  .gpres.dif > span:first-child{color:var(--ink)}
  .presumido .prem-f label{min-width:96px}
  .lp-ativ{display:flex; flex-direction:column; gap:6px; flex:1 1 320px; min-width:0}
  .lp-ativ .seg-campo .sel-wrap{width:min(460px,100%)}
  .lp-pres{font-size:12px; color:var(--muted)}
  .lp-folha{flex:1 1 100%; margin:0; font-size:12px; color:var(--muted)}
  .flag.lp-aviso{margin:-8px 0 18px; color:var(--brand); background:var(--brand-wash)}
  .presumido .cmp2{margin-top:0}
  .presumido .cmp-row small{font-weight:400}                     /* a nota da carga não herda o negrito da faixa */
  /* INSS na tabela por trimestre: a linha abre a base de cálculo */
  .lk-linha{display:inline-flex; align-items:baseline; gap:6px; padding:0; border:0; background:none; font:inherit; color:inherit; cursor:pointer; text-align:left}
  .lk-linha:hover{color:var(--brand)}
  .lk-linha .seta{display:inline-block; width:12px; font-size:12px; color:var(--ink-3)}
  .lk-linha:hover .seta{color:var(--brand)}
  .gpres.base{background:var(--surface-2); font-size:12px}
  .gpres.base > span, .gpres.base > span:first-child{color:var(--ink-3)}
  .gpres.base > span:first-child{padding-left:16px}
  .gpres.base.item > span:first-child{padding-left:30px; color:var(--muted)}
  .gpres.base small{font-family:var(--mono); font-size:11px; color:var(--muted-2)}
  .gano-abre{padding:10px 0 4px; border-top:1px solid var(--line); font-size:13px}
  .gano.base{background:var(--surface-2); font-size:12px}
  .gano.base > span:first-child{padding-left:16px}
  .gano.gh.base{padding-top:8px}
  .gano.tot.base{border-top-color:var(--line-3)}
  .gpres-nota{margin:0; padding:6px 16px 10px; font-size:11px; line-height:1.5; color:var(--muted-2); background:var(--surface-2)}
  .lp-alt{display:flex; justify-content:flex-end; margin-top:18px}
  .lp-alt{display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px 14px}
  .lp-vazias{font-size:12px}
  .lp-ver{display:flex; align-items:center; gap:14px}
  .lp-ver .btn{font-family:var(--sans)}
  .lp-ver .menu{min-width:220px}
  .menu-t{margin:0; padding:8px 14px 2px; font:500 10px/1.4 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2)}
  .menu button[aria-checked="true"]{color:var(--ink); font-weight:500}
  .lp-ver .chk{color:var(--muted-2)}
  .lp-tri{margin-top:10px}
  /* muitas colunas: o rótulo e o Ano ficam presos nas bordas enquanto o meio rola */
  .lp-tri .gpres > span:first-child, .lp-tri .gpres > span:last-child{position:sticky; background:var(--surface)}
  .lp-tri .gpres > span:first-child{left:0; z-index:2; padding-right:8px}
  .lp-tri .gpres > span:last-child{right:0; z-index:1; padding-left:8px}
  /* a sombra só aparece do lado em que há coluna escondida — é ela que avisa que a tabela continua */
  .lp-tri.x-esq .gpres > span:first-child{box-shadow:7px 0 7px -7px rgba(20,22,26,.18)}
  .lp-tri.x-dir .gpres > span:last-child{box-shadow:-7px 0 7px -7px rgba(20,22,26,.18)}
  .lp-tri .gpres.rec > span:first-child, .lp-tri .gpres.rec > span:last-child,
  .lp-tri .gpres.tot > span:first-child, .lp-tri .gpres.tot > span:last-child,
  .lp-tri .gpres.dif > span:first-child, .lp-tri .gpres.dif > span:last-child{background:var(--surface)}
  @media (hover:hover){ .lp-tri .gpres:hover > span:first-child, .lp-tri .gpres:hover > span:last-child{background:var(--hover-linha)} }
  html[data-tema="escuro"] .lp-tri .gpres > span:first-child, html[data-tema="escuro"] .lp-tri .gpres > span:last-child{background:var(--surface)}
  .seg .gr .sel{font-size:12px}
  .cbscol{display:flex; flex-direction:column; gap:1px; min-width:0}
  .cbscol small{font-size:11px; color:var(--muted-2); padding-left:2px}
  .dasauto{display:inline-flex; flex-direction:column; align-items:flex-end; gap:1px}
  .dasauto small{font-size:11px; color:var(--muted-2)}
  .dasauto .lk{border:0; background:none; padding:0; font:inherit; color:var(--ink-3); text-decoration:underline; cursor:pointer}
  .dasauto .lk:hover{color:var(--brand)}
  .cbscol.dir{align-items:flex-end}
  .cbscol.dir small{padding:0 2px 0 0; min-height:14px; white-space:nowrap}   /* efetiva embaixo da cheia; altura reservada e sem quebra mantêm o mesmo talhe em toda linha */
  .sn .seg-prem{padding:0}
  .sn-l{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--line); font-size:13px}
  .sn-l > span:first-child{color:var(--ink-3)}
  .sn-l .v{font-family:var(--mono); font-weight:600; white-space:nowrap}
  .sn-l .in{width:140px; flex:0 0 140px; font-weight:600; border-bottom-color:var(--line-3)}
  .sn-l small{display:block; margin-top:1px; font-family:var(--sans); font-size:11px; font-weight:400; color:var(--muted-2)}
  .sn-fim{border-top:1px solid var(--ink); font-weight:500}
  .sn-fim > span:first-child{color:var(--ink)}
  .sn-fim .v{display:flex; flex-direction:column; align-items:flex-end; gap:1px}
  .sn-fim .v small{text-align:right}
  .seg-hint{margin:2px 0 6px; font-size:12px; color:var(--ink-3)}
  .seg-conf{margin:6px 0 0; font-size:12px; color:var(--ink-3)}
  .seg-conf.ok{color:var(--ok)}
  .seg-conf.dif{color:var(--brand)}

  /* Banco de dados: barra de salvamento, login e janelas */
  .btn.prim{background:var(--fill); border-color:var(--fill); color:var(--sobre-fill)}
  .btn.prim:hover{border-color:var(--fill); filter:brightness(1.25)}
  .btn:disabled{opacity:.55; cursor:default; filter:none}
  .barra{display:flex; align-items:flex-end; gap:12px 22px; flex-wrap:wrap; background:var(--surface); padding:var(--e3) var(--e4); box-shadow:0 0 0 1px var(--line-2); border-radius:var(--r)}
  .barra.local{padding:9px 16px; font-size:12px; color:var(--muted); background:var(--surface-2)}
  .bsel{display:flex; flex-direction:column; gap:2px; min-width:0; max-width:100%}
  .bsel .cap{font-size:10px; letter-spacing:.1em; color:var(--muted-2)}
  .bsel select{font:600 14px/1.3 var(--sans); color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--line-3); border-radius:0; padding:2px 0; max-width:320px; cursor:pointer; outline:none}
  .bsel select:focus{border-bottom-color:var(--brand)}
  .bsel select:disabled{color:var(--muted-2); cursor:default}
  .bstatus{margin-left:auto; display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); white-space:nowrap}
  .bstatus::before{content:""; width:7px; height:7px; background:var(--muted-3)}
  .bstatus.ok::before{background:var(--ok)}
  .bstatus.sujo{color:var(--ink)}
  .bstatus.sujo::before{background:var(--fill)}
  .bstatus.erro{color:var(--ink)}
  .bstatus.erro::before{background:var(--brand)}
  .menu .menu-email{font-size:11px; color:var(--muted-2); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .login{width:min(380px,100%); margin:8vh auto 0; background:var(--surface); border-radius:var(--r); padding:var(--e6) var(--e5); display:flex; flex-direction:column; gap:10px; box-shadow:0 0 0 1px var(--line-2)}
  .login .logo{align-self:flex-start; margin-bottom:6px}
  .login .sub{margin:0}
  .login form{display:flex; flex-direction:column; gap:14px; margin-top:10px}
  .login .field .in.txt, .modal-caixa .field .in.txt{font-size:14px; border-bottom-color:var(--line-3)}
  .login-erro, .modal-erro{margin:0; min-height:1.2em; font-size:12px; color:var(--ink-3)}
  .login .btn.prim{justify-content:center; padding:12px}
  .modal-fundo{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--veu)}
  .modal-caixa{width:min(440px,100%); background:var(--surface); border-radius:var(--r); padding:var(--e5); display:flex; flex-direction:column; gap:14px; box-shadow:0 0 0 1px var(--line-2)}
  .modal-caixa .sub{margin:0}
  /* lixeira e histórico: lista com um botão por linha dentro da janela */
  .hist-t{margin:4px 0 0; font-size:13px; font-weight:600; color:var(--ink)}
  .hist-lista{display:flex; flex-direction:column; max-height:40vh; overflow-y:auto; border-top:1px solid var(--line)}
  .hist-item{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}
  .hist-item b{display:block; font-size:13px; font-weight:600; color:var(--ink)}
  .hist-item small{display:block; margin-top:1px; font-size:11px; color:var(--muted-2)}
  .hist-item .hist-aviso{color:var(--brand)}
  .hist-item .btn{flex:none; padding:7px 12px}
  .hist-vazio{margin:0; font-size:12px; color:var(--muted)}
  .modal-campos{display:flex; flex-direction:column; gap:12px}
  /* herança do mês novo: uma linha por item, com a explicação em letra miúda */
  .modal-cx{display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--ink-3); cursor:pointer}
  .modal-cx input{margin:3px 0 0; flex:0 0 auto; accent-color:var(--brand)}
  .modal-cx small{display:block; font-size:11px; color:var(--muted-2); margin-top:1px; line-height:1.4}
  .modal-acoes{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-top:4px}
  /* imprimir: o que cada botão põe no papel */
  .imp-opcoes{display:flex; flex-direction:column; gap:10px; padding:12px 14px; background:var(--surface-2)}
  .imp-opcoes p{margin:0; font-size:12px; color:var(--muted); line-height:1.5}
  .imp-opcoes b{display:block; font-size:13px; font-weight:600; color:var(--ink)}
  /* apresentação: a barra fica, mas só com a competência — trocar de mês em reunião é comum; a lista de
     empresas é de outros clientes e não deve aparecer na tela do cliente, e salvar não é coisa de apresentação */
  .present .barra{padding:8px 16px}
  .present .barra .bsel:first-child, .present .barra .bstatus, .present .barra #b-salvar{display:none}
  @media print{ .barra, #modal{display:none !important} }

  /* Resumo do cliente */
  .obs-largo{margin-top:32px; max-width:78ch}

  /* Cadeia de crédito (resumo do cliente) — handoff 5.1 */
  .cadeia{margin-top:36px; padding-top:28px; border-top:1px solid var(--line)}
  .cad-h{display:flex; align-items:flex-start; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:20px}
  .cad-h-txt{max-width:52ch}
  .cad-h-txt h3{margin:0 0 4px}
  .cad-h-txt p{margin:0; font-size:13px; color:var(--muted); line-height:1.5}
  .cli-blocos > .cadeia:first-child{margin-top:0; padding-top:0; border-top:0}   /* primeiro bloco da aba: sem risco solto no topo */
  .cad-ctl{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
  .cad-alt{display:flex; gap:6px; background:var(--alt); padding:4px; border-radius:var(--r)}
  .cad-aba{display:flex; align-items:center; gap:6px; padding:6px 12px; font:500 12px/1 var(--sans); border:0; border-radius:var(--r-2); background:transparent; color:var(--muted); cursor:pointer}
  .cad-aba[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line-2)}
  .cad-aba .m{opacity:.6}
  .cad-grafico{display:flex; align-items:flex-start; gap:24px 32px; flex-wrap:wrap; margin-bottom:22px}
  .cg-linhas{flex:1 1 280px; max-width:520px; min-width:0}
  .cg-pizza{display:flex; align-items:center; gap:16px; flex:0 1 auto}
  /* pizza cheia (o anel foi testado e recusado). O filete segura as fatias claras da rampa, que sozinhas
     somem no cartão branco; a legenda ao lado carrega o nome e o percentual de cada faixa */
  .cg-disco{width:108px; height:108px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px var(--line)}
  /* uma categoria só: no lugar do gráfico, a proporção como chapéu, a faixa em destaque e a leitura embaixo */
  .cg-solo{display:flex; flex-direction:column; gap:5px; padding-left:20px; border-left:1px solid var(--line);
    align-self:stretch; justify-content:center; min-width:0}
  .cg-solo-c{color:var(--muted-2)}
  .cg-solo-s{font-size:13px; color:var(--ink-3)}
  .cg-linha{display:flex; flex-direction:column; gap:4px; margin-bottom:10px}
  .cg-linha .bar-h > span:first-child{color:var(--ink-3)}
  .cg-linha .bar-h > span:last-child{font-family:var(--mono)}
  .cg-trilho{display:flex; height:8px; background:var(--canvas); border-radius:2px; overflow:hidden}
  .cg-trilho > span{display:block; height:100%}
  .cg-sim, .cg-q.cg-sim{background:var(--cad-sim)}
  .cg-parcial, .cg-q.cg-parcial{background:var(--cad-parcial)}
  .cg-nao, .cg-q.cg-nao{background:var(--cad-nao)}
  .cg-legenda{display:flex; flex-direction:column; gap:8px; min-width:150px; font-size:11px; color:var(--muted-2)}
  .cg-item{display:flex; align-items:center; gap:7px; width:100%}
  .cg-pct{margin-left:auto; padding-left:12px; font-family:var(--mono); color:var(--ink-3)}
  .cg-q{width:9px; height:9px; flex:none; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ink) 12%, transparent)}
  .cg-q.cg-def{box-shadow:inset 0 0 0 1px var(--line-3)}
  .cad-alerta{display:flex; align-items:baseline; gap:4px 10px; flex-wrap:wrap; padding:10px 14px; margin-bottom:14px; background:var(--brand-wash); border-left:3px solid var(--brand)}
  .cad-alerta strong{font-size:13px; font-weight:600; color:var(--brand)}
  .cad-alerta span{font-size:12px; color:var(--muted)}
  .cad-vazio{padding:var(--e6) var(--e5) var(--e5); text-align:center; border-top:1px solid var(--line)}
  .cad-vazio-t{font-size:15px; font-weight:500; color:var(--ink-2); margin-bottom:6px}
  .cad-vazio p{margin:0 auto 16px; font-size:12px; color:var(--muted); max-width:46ch; line-height:1.55}
  .cad-vazio .btn.prim{padding:8px 16px; font-size:13px}
  .cad-pe{display:flex; align-items:baseline; justify-content:space-between; gap:8px 20px; flex-wrap:wrap; padding-top:12px}
  .cad-pe span{font-size:11px; color:var(--muted-2); line-height:1.5; max-width:62ch}
  .cad-mais{padding:0; border:0; background:transparent; font:500 13px/1 var(--sans); color:var(--brand); cursor:pointer}
  .cad-mais:hover{text-decoration:underline}
  /* tabela: os campos parecem texto e só mostram o traço ao passar o mouse ou editar */
  .cad-row{display:grid; grid-template-columns:200px minmax(0,1fr) 170px 130px 28px; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px}
  .cad-row:not(.gh):hover{background:var(--hover-linha)}
  /* produtos e serviços: as duas alíquotas saem calculadas, por isso são texto e não campo */
  .gprod{display:grid; grid-template-columns:minmax(0,1.25fr) 118px 124px 118px 146px 96px 28px; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; min-width:880px}
  .gprod:not(.gh):hover{background:var(--hover-linha)}
  .gprod.gh{padding:0 0 7px; border-bottom-color:var(--ink)}
  .gprod.gh > span{text-align:left}
  .gprod.gh > span:nth-child(6){text-align:right}
  .gprod > .mut{color:var(--muted-2)}
  .cad-row.gh{padding:0 0 7px; border-bottom-color:var(--ink); font-size:10px}
  .cad-row.gh > span{text-align:left}
  .cad-row .in{text-align:left}
  .cad-cnpj{display:flex; align-items:center; gap:7px; min-width:0}
  .cad-cnpj .ponto{width:5px; height:5px; border-radius:50%; background:var(--line-2); flex:none}
  .cad-cnpj.inv .ponto{background:var(--brand)}
  .cad-cnpj.inv .in{color:var(--brand)}
  .sel-wrap{position:relative; display:flex; align-items:center; min-width:0}
  .sel{appearance:none; -webkit-appearance:none; width:100%; min-width:0; font:inherit; font-size:13px; color:var(--ink); background:transparent; border:0; border-bottom:1px solid transparent; border-radius:0; padding:2px 16px 2px 0; outline:none; cursor:pointer; text-overflow:ellipsis}
  .sel:hover{border-bottom-color:var(--line-3)}
  .sel:focus{border-bottom-color:var(--brand)}
  .sel:has(option[value=""]:checked){color:var(--muted-2)}
  .sel option{color:var(--ink)}
  .sel-wrap::after{content:"▾"; position:absolute; right:2px; font-size:10px; color:var(--muted-2); pointer-events:none; opacity:0; transition:opacity .15s}
  .cad-row:hover .sel-wrap::after, .sel-wrap:focus-within::after{opacity:1}
  .regime .sel{color:var(--muted)}
  .cred.sim .sel{color:var(--ink)}
  .cred.parcial .sel{color:var(--brand); font-weight:600}            /* o vermelho marca o parcial, como no gráfico */
  .cred.nao .sel{color:var(--ink-3)}
  .cad-x{width:22px; height:22px; display:flex; align-items:center; justify-content:center; border:0; border-radius:var(--r); background:transparent; color:var(--line-3); cursor:pointer; font-size:15px; line-height:1; padding:0}
  .cad-x:hover{color:var(--brand); background:var(--brand-wash)}
  @media (hover:none){ .sel-wrap::after{opacity:1} }
  .present .sel{pointer-events:none}
  .present .sel-wrap::after, .present .cad-x, .present .cad-mais, .present .cad-vazio .btn{display:none}
  .present .cad-row .in::placeholder{color:transparent}
  .hint.deb-hint{margin:-8px 0 16px; font-size:12px; color:var(--ink-3)}

  /* Resumo do cliente e bloco anual */
  .cli{background:var(--surface); padding:40px 44px 36px; min-width:0; border-radius:var(--r)}
  .cli h2{font-size:22px; letter-spacing:-.02em; margin-bottom:6px}
  .cli .sub{margin:0 0 30px; font-size:14px; max-width:60ch}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr)); gap:1px}
  .kc{padding:var(--e5) var(--e4); border-radius:var(--r); display:flex; flex-direction:column; gap:6px; box-shadow:0 0 0 1px var(--line-2); container-type:inline-size; min-width:0}
  .kc .cap{color:var(--muted-2); letter-spacing:.1em}
  .kv{font-family:var(--mono); font-weight:600; letter-spacing:-.02em; white-space:nowrap; font-size:26px; font-size:min(26px, calc(100cqi / 7.8))}
  .kv.brand{color:var(--brand)}
  .kc .note{font-size:12px; color:var(--muted); line-height:1.45}
  .obs{font-size:13px; color:var(--ink-3); line-height:1.65}
  .obs h4{line-height:1.45}
  .obs p{margin:0 0 8px}

  footer.foot{display:flex; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; color:var(--muted-2); padding-top:4px}
  .toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,16px); background:var(--fill); color:var(--sobre-fill); padding:10px 16px; border-radius:var(--r); font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:calc(100% - 32px)}
  .toast.show{opacity:1; transform:translate(-50%,0)}

  /* Movimento. Só recebe .entra o que não estava na tela antes do render() — ver animarNovos().
     O preenchimento é "backwards": terminado o efeito, quem manda é o estilo normal (o esmaecido da troca de mês,
     por exemplo); com "both" a opacidade final ficaria presa em 1 */
  @keyframes entra{from{opacity:0; transform:translateY(6px)}}
  @keyframes cai{from{opacity:0; transform:translateY(-4px)}}
  @keyframes esmaece{from{opacity:0}}
  .entra{animation:entra .24s cubic-bezier(.2,.7,.2,1) backwards}
  /* a barra se revela da esquerda para a direita quando o bloco entra. É a faixa inteira que vai sendo
     descoberta (clip-path), e não cada pedaço esticando: assim as partes empilhadas não se desencontram.
     O atraso segue o do bloco (--i herda do pai), para a barra entrar logo depois do texto dele */
  @keyframes revela{from{clip-path:inset(0 100% 0 0)}}
  .entra .track, .entra .sb-track, .entra .cmp-bar2{animation:revela .5s cubic-bezier(.2,.7,.2,1) backwards;
    animation-delay:calc(min(var(--i, 0), 6) * 35ms + 140ms)}
  .conteudo > .entra{animation-delay:calc(min(var(--i, 0), 6) * 35ms)}   /* os blocos da seção entram em cascata */
  .menu.entra{animation:cai .14s ease-out backwards}
  .modal-fundo{animation:esmaece .16s ease-out backwards}
  .modal-caixa{animation:entra .2s cubic-bezier(.2,.7,.2,1) backwards}
  /* troca de mês ou de empresa: o conteúdo esmaece e uma barra corre no topo enquanto o banco responde */
  .conteudo > *{transition:opacity .15s ease}
  body.trocando .conteudo > *{pointer-events:none}
  /* Enquanto o mês chega do banco: os rótulos ficam e os números viram barras cinza, do tamanho que tinham.
     Antes a tela inteira esmaecia e uma barra vermelha corria no topo — parecia erro, e escondia o que não ia mudar */
  @keyframes esqueleto{to{background-position:-200% 0}}
  body.trocando :is(.v, .val, .kv, .ind-v, .ind-s, .fsn-v, .lado-v, .frr-num, .p, .sb-v, .cr-v, .pct-s, .m, .in, .sel, .cmp-parte b){
    color:transparent !important; border-radius:var(--r-2);
    background-image:linear-gradient(90deg, var(--line) 0 40%, var(--line-2) 50%, var(--line) 60%);
    background-size:200% 100%; animation:esqueleto 1.15s linear infinite}
  body.trocando .fill{background:var(--line)}
  /* Barra compacta ao rolar: abas e Salvar à mão sem voltar ao topo numa aba Resultado longa. Fica fora do
     fluxo e desce quando a barra de seleção (no modo local, o aviso) sai da tela — ver marcarRolagem() */
  html{scroll-padding-top:64px}                                   /* campo focado não fica escondido atrás dela */
  .fixo{position:fixed; top:0; left:0; right:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line-2);
        transform:translateY(-100%); visibility:hidden; transition:transform .2s ease, visibility 0s linear .2s}
  body.rolou .fixo{transform:none; visibility:visible; transition:transform .2s ease, visibility 0s}
  .fixo-in{max-width:1140px; margin:0 auto; padding:8px 24px; display:flex; align-items:center; gap:10px 18px}
  .fixo-id{display:flex; align-items:baseline; gap:10px; min-width:0; padding:4px 0; border:0; background:none; cursor:pointer; text-align:left}
  .fixo-id b{font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .fixo-id span{font-family:var(--mono); font-size:11px; letter-spacing:.02em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
  .fixo-id:hover b{text-decoration:underline}
  .fixo-abas{display:flex; gap:4px; margin-left:auto; padding:3px; background:var(--rail); border-radius:var(--r); overflow-x:auto; scrollbar-width:none}
  .tabf{padding:6px 11px; font:500 12px/1 var(--sans); border:0; border-radius:var(--r-2); background:transparent; color:var(--ink-3); cursor:pointer; white-space:nowrap; transition:background-color .15s ease, color .15s ease}
  .tabf:hover{background:var(--hover-rail); color:var(--ink)}
  .tabf[aria-current="page"]{background:var(--fill); color:var(--sobre-fill)}
  .fixo-acao{display:flex; align-items:center; gap:12px}
  .fixo-acao .bstatus{margin-left:0}
  .fixo-acao .btn{padding:7px 13px}
  .present .fixo-acao{display:none}                                /* apresentação não salva */

  /* Comparação com o último mês salvo, ao lado do rótulo (receita, resultado, DAS) */
  .var{margin-left:8px; font-family:var(--mono); font-size:11px; font-weight:400; letter-spacing:0; color:var(--muted); white-space:nowrap}
  .hero-row .var{display:inline-block}

  html.tema-trocando *{transition:background-color .22s ease, color .22s ease, border-color .22s ease,
    box-shadow .22s ease, fill .22s ease !important}

  /* Modo apresentação */
  /* letra 15% maior para TV e projetor: o conteúdo inteiro cresce e a largura máxima encolhe na mesma proporção */
  @keyframes abrePresent{from{opacity:0}}
  body.present #app{animation:abrePresent .26s ease-out backwards}
  @media screen and (min-width:900px){
    body.present .page{zoom:1.15}
    body.present .conteudo, body.present .cab-in{max-width:calc(1240px / 1.15)}   /* o zoom de 1,15 encolhe a área útil */
  }
  /* projetor clareia as cores: cinzas de rótulo e de linha ficam mais escuros */
  html:not([data-tema="escuro"]) body.present{--muted:#55585E; --muted-2:#65686F; --muted-3:#85888F; --line:#D8D6D0; --line-2:#C8C6C0}
  html[data-tema="escuro"] body.present{--muted:#B3B7BD; --muted-2:#A3A7AE; --muted-3:#83878E; --line:#3A3D43; --line-2:#474A51}
  /* menos texto de apoio: subtítulos que explicam a tela, notas de método e as premissas do Presumido */
  .present .card-h .sub, .present .nota, .present .lp-prem{display:none}
  .present .dasauto .so-tela{display:none}                        /* "digitar" altera o mês: não existe na apresentação */
  .present .sel{border-bottom-color:transparent !important}      /* seletor vira texto, como os campos */
  /* apontador: clicar numa linha apaga as outras, para falar de um número só na TV */
  /* a linha em foco cresce para ser lida de longe: 6% a partir do centro, com sombra leve — assim ela parece
     levantada do cartão, e não desalinhada quando passa do recuo. Sobe de camada para cobrir as vizinhas */
  .present .realce{background:var(--alt); transform:scale(1.06); position:relative; z-index:2; box-shadow:0 2px 14px rgba(20,22,26,.14)}
  /* passar o mouse acende a linha. O fundo avança 12px para os lados por duas sombras sem borrão — assim ele
     respira sobre o recuo do cartão sem empurrar nada e sem invadir a linha de cima nem a de baixo */
  @media (hover:hover){
    .dl:not(.res):hover, .sn-l:not(.sn-fim):hover, .gano:not(.gh):not(.tot):hover, .gpres:not(.gh):not(.tot):not(.dif):hover,
    .cr:not(.gh):hover, .gr:not(.gh):hover{background:var(--hover-linha);
      box-shadow:var(--e3) 0 0 var(--hover-linha), calc(var(--e3) * -1) 0 0 var(--hover-linha)}
    .hero-row:hover{background:var(--hover-linha)}
  }
  .dl, .hero-row, .cmp-row, .sum-bar, .total, .li, .gr, .cr, .gano, .gpres, .sn-l{transition:transform .15s ease}
  .dl, .hero-row, .sn-l, .gano, .gpres, .gr, .cr{transition:background-color .12s ease, box-shadow .12s ease}
  .dl, .hero-row, .cmp-row, .sum-bar, .total, .li, .gr, .cr, .gano, .gpres, .sn-l{transition:opacity .15s ease}
  body.realcando .dl:not(.realce), body.realcando .hero-row:not(.realce), body.realcando .cmp-row:not(.realce),
  body.realcando .sum-bar:not(.realce), body.realcando .total:not(.realce), body.realcando .li:not(.realce),
  body.realcando .gr:not(.realce), body.realcando .cr:not(.realce), body.realcando .gano:not(.realce),
  body.realcando .gpres:not(.realce), body.realcando .sn-l:not(.realce){opacity:.22}
  /* a linha realçada cresce 6% e, dentro de uma área que rola, isso ligava as barras de rolagem: enquanto há
     realce a área não rola, e a linha pode passar um pouco da borda do cartão */
  body.realcando .scroll-x{overflow:visible}
  @media (max-width:640px){
    .fixo-in{padding:6px 16px; gap:8px}
    .fixo-id span, .fixo-acao .bstatus{display:none}
    .fixo-id b{max-width:34vw}
  }
  @media (max-width:480px){                                        /* celular estreito: as três abas dividem a largura */
    .fixo-id{display:none}
    .fixo-abas{flex:1; margin-left:0}
    .tabf{flex:1; padding:7px 6px}
  }
  /* quem pediu ao sistema menos movimento não recebe nenhum destes efeitos */
  @media (prefers-reduced-motion: reduce){
    /* nada de "1ms": isso dava transição de 1ms a toda propriedade de todo elemento, inclusive a cor ao trocar de tema */
    *, *::before, *::after{animation:none !important; transition:none !important}
  }

  @media (max-width:800px){ .cmp2{grid-template-columns:minmax(0,1fr)} }   /* um cartão embaixo do outro */
  @media (max-width:640px){
    .card{padding:var(--e5) var(--e4) var(--e4)}
    .memo{padding:22px 18px}
    .cli{padding:26px 20px 24px}
    .panel{padding:var(--e5) var(--e4)}
    .dl.res{margin:8px -10px 0; padding:14px 10px}
    .total{margin:10px -10px 0; padding:14px 10px 14px 7px}
    .sum-bar{grid-template-columns:minmax(0,1fr) auto}
    .sb-track{grid-column:1 / -1; grid-row:2}
    .sb-leg{grid-column:1 / -1}
    /* grades viram duas linhas: nome em cima, números embaixo */
    /* despesas: nome e regra em cima; valor, alíquota e crédito embaixo */
    .g5{grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr); grid-template-areas:"nome regra regra" "valor aliq cred"; gap:4px 8px}
    .g5 > :nth-child(1){grid-area:nome}
    .g5 > :nth-child(2){grid-area:valor}
    .g5 > :nth-child(3){grid-area:regra; padding-left:0}
    .g5 > :nth-child(4){grid-area:aliq}
    .g5 > :nth-child(5){grid-area:cred}
    .g5.gh{display:none}
    .cmp-card{padding:var(--e4) var(--e3) var(--e3)}
