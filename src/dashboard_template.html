// troféu da etiqueta "Mais barato": taça, alças, haste e base, na cor do texto da etiqueta
const TROFEU = '<svg class="trofeu" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h8V6a4 4 0 0 1-8 0z" fill="currentColor"/>' +
  '<path d="M4 3H2.2v1.3A2.6 2.6 0 0 0 4.4 6.9M12 3h1.8v1.3a2.6 2.6 0 0 1-2.2 2.6" fill="none" stroke="currentColor" stroke-width="1.3"/>' +
  '<rect x="7.2" y="9.6" width="1.6" height="2.8" fill="currentColor"/><rect x="4.5" y="12.2" width="7" height="2.2" rx=".6" fill="currentColor"/></svg>';
// fecha a aba: o Simples de hoje (CBS dentro do DAS) contra o regime híbrido (DAS sem a CBS + CBS por fora),
// um cartão por regime, com os números e a composição dos tributos do mês
function rComparativo(){
  const linha = (rot, k, cls, info) => `<div class="cmp-row${cls ? ' ' + cls : ''}"><span>${rot}${info ? `<small data-o="${info}"></small>` : ''}</span>` +
    `<span class="v" data-o="${k}"></span></div>`;
  const parte = (pre, id, rot, cor) => `<div class="cmp-parte"><span class="cg-q ${cor}"></span>` +
    `<span>${rot}<b data-o="${pre}.${id}.p"></b><span class="m" data-o="${pre}.${id}.v"></span></span></div>`;
  // o IBS só entra onde existe número para ele: dentro do DAS o painel não o separa, e por fora é o informado
  const comp = (pre, rotDas, rotCbs, rotIbs, carga) => `<div class="cmp-comp"><h4>Composição dos tributos do mês</h4>
      <div class="cmp-bar2" aria-hidden="true"><span class="c-das" data-w="${pre}.das"></span><span class="c-brand" data-w="${pre}.cbs"></span>` +
      (rotIbs ? `<span class="c-line" data-w="${pre}.ibs"></span>` : '') + `</div>
      <div class="cmp-leg">${parte(pre, 'das', rotDas, 'c-das')}${parte(pre, 'cbs', rotCbs, 'c-brand')}` +
      (rotIbs ? `<div data-v="k.temIbs">${parte(pre, 'ibs', rotIbs, 'c-line')}</div>` : '') + `</div>
      <small class="cmp-carga" data-o="${carga}" data-v="k.temCarga"></small></div>`;
  return `<section class="card comparativo" aria-label="Tradicional × Híbrido">
    <div class="card-h"><div><h2>Tradicional × Híbrido</h2><p class="sub">Compare os dois cenários e veja qual sai mais barato neste mês.</p></div></div>
    <div class="cmp2">
      <article class="cmp-card" data-cls="ganha:k.convGanha"><span class="cmp-tag">${TROFEU}Mais barato no mês</span><h3>Simples tradicional</h3><p class="cmp-nota">CBS dentro do DAS</p>
        ${linha('DAS total', 'k.dasConv', 'dest')}<p class="cmp-ganho" data-o="k.ganhoConv"></p>${linha('Alíquota efetiva', 'k.efetConv')}${linha('CBS dentro do DAS', 'k.cbsConv', 'sub')}
        ${comp('k.conv', 'DAS base', 'CBS', '', 'k.cargaConv')}</article>
      <article class="cmp-card" data-cls="ganha:k.hibGanha"><span class="cmp-tag">${TROFEU}Mais barato no mês</span><h3>Regime híbrido</h3><p class="cmp-nota">DAS sem a CBS e CBS por fora</p>
        ${linha('DAS sem CBS', 'k.dasHib')}${linha('CBS por fora', 'k.cbsHib', '', 'k.cbsHibInfo')}
        <div data-v="k.temIbs">${linha('IBS por fora', 'k.ibsHib')}</div>
        ${linha('Total', 'k.totHib', 'tot')}<p class="cmp-ganho" data-o="k.ganhoHib"></p>${linha('Alíquota efetiva', 'k.efetHib')}
        ${comp('k.hib', 'DAS sem CBS', 'CBS por fora', 'IBS por fora', 'k.cargaHib')}</article>
    </div>
    <p class="cmp-eq" data-v="k.empate">Os dois regimes empatam no mês.</p>
    <div class="flag" data-v="k.semDas" data-o="k.semDas"></div>
    <p class="cmp-eq" data-v="k.temVariacao" data-o="k.variacao"></p>
    <p class="cmp-eq" data-v="k.temEquilibrio" data-o="k.equilibrio"></p>
    <p class="cmp-eq nota" data-v="k.semIbs">O IBS ainda não é calculado: os dois cenários comparam só o DAS e a CBS.</p>
  </section>`;
}
function rResultado(){
  const m = S.monthly;
  let h = `<div class="card-h"><div><h2>Demonstração de resultado</h2><p class="sub">Valores do mês e participação sobre a receita.</p></div>${btnDetalhe()}</div>`;
  h += linha('rec', 'Receita declarada <span class="tag-src">PGDAS</span>' + varMes('receita'), 'm.receita', 'm.receitaP');
  if(ui.detalhe) h += detReceita();
  if(m.custos.length === 1) h += linha('', '( − ) ' + esc(m.custos[0][0]), 'm.cu.0.v', 'm.cu.0.p', 'monthly.custos.0.1');
  else { h += linha('tot', '( − ) Custos', 'm.custos', 'm.custosP'); if(ui.detalhe) h += lista('monthly.custos', m.custos, 'm.cu'); }
  h += linha('gross', '( = ) Lucro operacional bruto', 'm.lucroBruto', 'm.lucroBrutoP');
  h += linha('tot', '( − ) Despesas gerais e administrativas', 'm.ga', 'm.gaP');
  if(ui.detalhe) h += detDespesas();
  if(m.vendas.length){ h += linha('tot', '( − ) Despesas com vendas', 'm.vendas', 'm.vendasP'); if(ui.detalhe) h += lista('monthly.vendas', m.vendas, 'm.ve'); }
  h += linha('tot', '( − ) Despesas tributárias', 'm.trib', 'm.tribP');
  if(ui.detalhe) h += lista('monthly.tributarias', m.tributarias, 'm.tr');
  h += linha('res', '( = ) Resultado líquido' + varMes('resultado'), 'm.resultado', 'm.margem');
  return rSimplesMes() + painel('card', 'resultado', h) + rEstoque() + rReforma() + rComparativo();
}
// Compras do mês: mesma tabela das despesas gerais — regra de crédito, alíquota e crédito de CBS por linha
function tabelaCompras(){
  let h = `<div class="det"><div class="scroll-x"><div class="g5 gh"><span>Item</span><span>Valor</span><span class="esq">Regra de crédito</span><span>Alíquota</span><span>Crédito CBS</span></div>`;
  S.monthly.compras.forEach((r, i) => {
    const parte = +r[2] || 0, igual = v => Math.abs(v - parte) < 1e-9, padrao = REGRAS.some(([v]) => igual(v));
    const opcoes = REGRAS.map(([v, l]) => `<option value="${v}"${igual(v) ? ' selected' : ''}>${l}</option>`).join('') +
      (padrao ? '' : `<option value="${parte}" selected>Outra: ${FMT.pct0(parte)} com crédito</option>`) + `<option value="outra">Outra parte…</option>`;
    h += `<div class="g5 gr">
      <span class="nmcol"><span class="nmwrap">${inp(`monthly.compras.${i}.0`, 'txt', `Compra ${i + 1}`, 'txt')}
        <span class="row-ctl"><button class="x" data-act="rm-co" data-i="${i}" aria-label="Remover ${esc(r[0])}" title="Remover compra">×</button></span></span></span>
      <span class="r m">${inp(`monthly.compras.${i}.1`, 'brl', r[0] + ' — valor', 'val')}</span>
      <span class="sel-wrap regra${parte > 0 ? '' : ' sem'}"><select class="sel" data-regra="compras" data-i="${i}" aria-label="Regra de crédito — ${esc(r[0])}"${ui.present ? ' disabled' : ''}>${opcoes}</select></span>
      <span class="cbscol dir">${inp(`monthly.compras.${i}.3`, 'pct', r[0] + ' — alíquota')}<small class="m" data-o="m.co.${i}.ef"></small></span>
      <span class="cr-v" data-o="m.co.${i}.cr" data-oc="m.co.${i}.cr"></span></div>`;
  });
  return h + `</div>
    <button class="add" data-act="add-co">+ adicionar compra</button>
    <div class="det-foot"><span>Crédito de CBS gerado pelas compras</span><span data-o="m.compraCred"></span></div></div>`;
}
function rEstoque(){
  const lst = S.monthly.estoque || [];
  let h = `<div class="card-h"><div><h2>Estoque e compras</h2><p class="sub">Compras do mês, posição de estoque e pagamentos.</p></div>` +
    `<button class="btn" data-act="estoque" aria-expanded="${ui.estoque}">${ui.estoque ? 'Ocultar detalhamento' : 'Ver detalhamento'}</button></div>`;
  // o total vem da soma das linhas de compra; o detalhamento traz as compras e a posição de estoque
  h += linha('rec', 'Compra de mercadoria do mês', 'm.compra', 'm.compraP');
  if(ui.estoque) h += tabelaCompras() + `<div class="det"><div class="det-cap">Posição de estoque e pagamentos</div>` + lst.map((r, i) => `<div class="li">` +
    `<span class="nm nmwrap">${inp(`monthly.estoque.${i}.0`, 'txt', `Descrição ${i + 1}`, 'txt')}` +
    `<span class="row-ctl"><button class="x" data-act="rm-es" data-i="${i}" aria-label="Remover ${esc(r[0])}" title="Remover linha">×</button></span></span>` +
    `<span class="v">${inp(`monthly.estoque.${i}.1`, 'brl', r[0] || `Valor ${i + 1}`, 'val')}</span></div>`).join('') +
    `<button class="add" data-act="add-es">+ adicionar linha</button></div>`;
  return `<section class="card" aria-label="Estoque e compras">${h}</section>`;
}

  return S.monthly.reforma[g].map((r, i) => {
    // as compras do mês são itemizadas no bloco Estoque e compras: aqui a base é sempre digitada
    const base = inp(`monthly.reforma.${g}.${i}.1`, 'base', r[0] + ' — base');
    const tipo = TIPOS.some(([v]) => v === r[3]) ? r[3] : 'geral';
    const tipoSel = `<select class="chip-sel" data-tipo data-g="${g}" data-i="${i}" aria-label="Tipo de alíquota — ${esc(r[0])}" title="Tipo de alíquota">` +
      TIPOS.map(([v, l]) => `<option value="${v}"${v === tipo ? ' selected' : ''}>${l}</option>`).join('') + `</select>`;
    return `<div class="g4 cr">
    <span class="nmcol"><span class="nmwrap">${cred ? inp(`monthly.reforma.${g}.${i}.0`, 'txt', `Nome da linha ${i + 1}`, 'txt') : `<span class="nm">${NOME_RECEITA}</span>`}
      <span class="row-ctl">${tipoSel}<button class="x" data-act="rm" data-g="${g}" data-i="${i}" aria-label="Remover ${esc(r[0])}" title="Remover linha">×</button></span></span></span>
    ${base}
    <span class="r m" data-o="m.${k}.${i}.aliq"></span>
    <span class="cr-v" data-o="m.${k}.${i}.val"></span></div>`;
  }).join('');
}
function rReforma(){
  const aberta = ui.memoria;

  const resumo = `<div class="resumo-cbs">
      <div class="sum-bar"><span class="sb-l">Débito total</span>
        <span class="sb-track" aria-hidden="true"><span class="fill c-deb" data-w="b.deb"></span></span><span class="sb-v" data-o="m.debitoTotal"></span></div>
      <div class="sum-bar"><span class="sb-l">Crédito total</span>
        <span class="sb-track" aria-hidden="true"><span class="fill cr-compras" data-w="cr.compras"></span><span class="fill cr-despesas" data-w="cr.despesas"></span><span class="fill cr-outras" data-w="cr.outras"></span><span class="fill cr-saldo" data-w="cr.saldo"></span></span>
        <span class="sb-v" data-o="m.creditoTotal"></span><span class="sb-leg" data-v="cr.temLegenda" data-o="cr.legenda"></span></div>
    </div>`;
  const memo = `<div class="memo${aberta ? '' : ' fechada'}">
    <div class="card-h"><div><h2>Memória de cálculo — CBS</h2>
      <p class="sub">${aberta ? 'Base × alíquota.<span class="so-tela"> Ajuste os campos e tudo recalcula.</span>'
        : 'Débito e crédito do mês.'}</p></div>
      <button class="btn" data-act="memoria" aria-expanded="${aberta}">${aberta ? 'Ocultar memória' : 'Ver memória'}</button></div>
    ${!aberta ? resumo : `<div class="prem">
      <div class="prem-t"><span class="cap">Premissas</span><span class="so-tela">Alterar aqui vale para <span data-o="m.linhas"></span> e para débitos e créditos.</span></div>
      <div class="prem-f">
        <label><span>Alíquota geral</span>${inp('monthly.reforma.aliqGeral', 'pct', 'Alíquota geral', 'main', 'data-premissa="geral"')}</label>
        <label><span>Alíquota das compras</span>${inp('monthly.reforma.aliqCompras', 'pct', 'Alíquota das compras', 'main', 'data-premissa="compras"')}</label>
      </div>
    </div>
    <div class="scroll-x"><div class="calc">

      ${linhasCbs('debitos')}
      <button class="add" data-act="add" data-g="debitos">+ adicionar receita</button>
      <div class="sum deb"><span>Débito total</span><span data-o="m.debitoTotal"></span></div>
      <div class="grp">Crédito</div>
      <div class="g4 cr"><span>Crédito geral (despesas)</span><span class="r m mut12" data-o="m.baseDespesas"></span><span class="r mut11">por item</span><span class="cr-v" data-o="m.creditoGeral"></span></div>
      <div class="g4 cr"><span class="nmcol"><span>Compras do mês</span><span class="parte" data-v="m.temFornCap" data-o="m.fornCap"></span></span><span class="r m mut12" data-o="m.compra"></span><span class="r mut11">por item</span><span class="cr-v" data-o="m.compraCred"></span></div>
      ${linhasCbs('creditos')}
      <button class="add" data-act="add" data-g="creditos">+ adicionar crédito sobre compras</button>
      <div class="g4 cr"><span class="nmcol ink3"><span>Saldo credor do mês anterior</span><span class="parte" data-v="m.temSaldoDe" data-o="m.saldoDe"></span></span><span></span>${inp('monthly.reforma.saldoCredorAnterior', 'base', 'Saldo credor do mês anterior')}<span class="r m mut" data-o="m.saldoAnt"></span></div>
      <div class="sum"><span>Crédito total</span><span data-o="m.creditoTotal"></span></div>
    </div></div>`}
    <div class="total" data-cls="credito:m.temCredor"><span><span data-o="m.cbsRotulo"></span><span class="suf" data-v="m.temCredor">vai para o mês seguinte</span></span><span data-o="m.cbsRes"></span></div>
  </div>`;
  // fecha a aba Resultado: depois de receitas, despesas e resultado, a apuração da CBS
  return `<section class="reforma" aria-label="Memória de cálculo da CBS">${memo}</section>`;
}

// Os quatro cartões e o "O que observar" saíram a pedido do usuário: os mesmos números já estão na
// faixa de indicadores do topo e no quadro Tradicional × Híbrido, no fim da aba Resultado.
function rCliente(){
  return painel('cli', 'cliente', `<div class="cli-blocos">${rCadeia()}${rProdutos()}</div>`);
}
const REGIMES = ['Simples Nacional', 'Simples Nacional – IBS/CBS por fora', 'MEI', 'Lucro Presumido', 'Lucro Real', 'Pessoa física', 'Imune / isento', 'Outro'];
function rCadeia(){
  // um alternador (mesmo conjunto de dados em dois estados): fornecedores ou clientes
  const g = ui.cadeia || 'fornecedores', forn = g === 'fornecedores', sing = forn ? 'fornecedor' : 'cliente';
  const lst = S.cadeia[g], ro = ui.present ? ' disabled' : '';
  const botao = (id, rotulo) => `<button class="cad-aba" data-act="cadeia" data-id="${id}" aria-pressed="${g === id}">${rotulo} <span class="m" data-o="cad.${id}.qtd"></span></button>`;
  let corpo;
  if(!lst.length){
    corpo = `<div class="cad-vazio">
      <div class="cad-vazio-t">Nenhum ${sing} cadastrado</div>
      <p>${forn
        ? 'Cadastrar os fornecedores mostra quanto das compras gera crédito de CBS para a empresa — e quanto vem de quem não gera.'
        : 'Cadastrar os clientes mostra quanto da receita vai para quem aproveita o crédito da CBS — e quanto vai para consumidor final, que não aproveita.'}</p>
      <button class="btn prim" data-act="cad-add" data-g="${g}">+ adicionar ${sing}</button>
    </div>`;
  } else {
    const linhas = lst.map((r, i) => {
      const p = `cadeia.${g}.${i}`, nome = r[1] || `${sing} ${i + 1}`;
      const regimes = ['', ...REGIMES].map(x => `<option value="${esc(x)}"${(r[2] || '') === x ? ' selected' : ''}>${x || 'Regime…'}</option>`).join('');
      const creditos = [['', 'A definir'], ['sim', 'Sim'], ['parcial', 'Parcial'], ['nao', 'Não']]
        .map(([v, l]) => `<option value="${v}"${(r[3] || '') === v ? ' selected' : ''}>${l}</option>`).join('');
      return `<div class="cad-row">
        <span class="cad-cnpj" data-cls="inv:cad.${g}.${i}.inv"><span class="ponto" aria-hidden="true"></span>${inp(`${p}.0`, 'cnpj', 'CNPJ — ' + nome, 'cnpj', 'placeholder="CNPJ"')}</span>
        ${inp(`${p}.1`, 'txt', `Nome do ${sing} ${i + 1}`, 'txt', 'placeholder="Nome"')}
        <span class="sel-wrap regime"><select class="sel" data-b="${p}.2" data-f="txt" aria-label="Regime tributário — ${esc(nome)}"${ro}>${regimes}</select></span>
        <span class="sel-wrap cred" data-cls="sim:cad.${g}.${i}.sim parcial:cad.${g}.${i}.parcial nao:cad.${g}.${i}.nao"><select class="sel" data-b="${p}.3" data-f="txt" aria-label="Gera crédito — ${esc(nome)}"${ro}>${creditos}</select></span>
        <button class="cad-x" data-act="cad-rm" data-g="${g}" data-i="${i}" aria-label="Remover ${esc(nome)}" title="Remover">×</button>
      </div>`;
    }).join('');
    // o aviso de CNPJ fica visível mesmo com o cadastro recolhido: é problema a resolver, não detalhe
    corpo = `<div class="cad-grafico" data-h="cad.grafico"></div>
      <div class="cad-alerta" data-v="cad.temAlerta" role="status"><strong data-o="cad.alerta"></strong><span>Confira antes de usar o crédito na apuração.</span></div>
      ${!cadastroAberto('cadeia') ? '' : `<div class="cad-tabela">
        <div class="cad-row gh"><span>CNPJ</span><span>Nome</span><span>Regime tributário</span><span>Gera crédito</span><span></span></div>
        ${linhas}
        <div class="cad-pe">
          <button class="cad-mais" data-act="cad-add" data-g="${g}">+ adicionar ${sing}</button>
          <span>${forn ? 'Gera crédito: a compra deste fornecedor dá direito a crédito de CBS para a empresa.'

        </div>
      </div>`}`;
  }
  return `<div class="cadeia">

      <div class="cad-h-txt"><h3>Cadeia de crédito</h3><p data-o="cad.resumo"></p></div>

// O ano pelos meses salvos: só aparece com banco ligado e empresa aberta (no modo local não há meses)
// Produtos e serviços (abaixo da cadeia de crédito): nome + redução da CBS + situação no DAS.
// As duas alíquotas são calculadas — a reduzida pelas premissas, a efetiva pela faixa do Simples.
function rProdutos(){

  if(!lst.length){
    corpo = `<div class="cad-vazio">

      <button class="btn prim" data-act="pr-add">+ adicionar produto</button>
    </div>`;
  } else {
    const linhas = lst.map((r, i) => {
      const tipo = TIPOS.some(([v]) => v === r[1]) ? r[1] : 'geral';
      // a 3ª posição já guardou "situação no DAS" numa versão anterior: valor desconhecido vira "Escolha…"
      const nat = NATUREZAS.some(([v]) => v === r[2]) ? r[2] : '';
      // produto pede NCM; serviço pede NBS e cClassTrib. Cada código no seu lugar, para trocar o tipo não apagar o outro
      const traco = '<span class="m mut">—</span>';
      const codigo = nat === 'produto' ? inp(`produtos.${i}.3`, 'txt', `NCM — item ${i + 1}`, 'txt', 'placeholder="NCM"')

      // cClassTrib vale para produto e serviço (layout da NF-e da reforma); só espera o tipo ser escolhido
      const classtrib = nat ? inp(`produtos.${i}.5`, 'txt', `cClassTrib — item ${i + 1}`, 'txt', 'placeholder="cClassTrib"') : traco;

function atualizarBarra(){
  const st = document.getElementById('b-status'), bt = document.getElementById('b-salvar');
  if(!st || !bt) return;
  let texto, classe = '';
  if(banco.salvando) texto = 'Salvando…';
  else if(banco.erro){ texto = 'Não salvou — tente de novo'; classe = 'erro'; }
  else if(!banco.empresaId) texto = 'Cadastre uma empresa para salvar';
  else if(sujo()){ texto = 'Alterações não salvas'; classe = 'sujo'; }
  else { texto = banco.salvoEm ? `Salvo às ${hora(banco.salvoEm)}` : 'Tudo salvo'; classe = 'ok'; }
  if(st.textContent !== texto) st.textContent = texto;
  st.className = 'bstatus ' + classe;
  bt.disabled = banco.salvando;
  const fs = app.querySelector('.fixo-status'), fb = app.querySelector('.fixo-salvar');
  if(fs){ if(fs.textContent !== texto) fs.textContent = texto; fs.className = 'bstatus fixo-status ' + classe; }
  if(fb) fb.disabled = banco.salvando;
}

/* ---------- movimento ---------- */
// render() refaz a tela inteira, então animar tudo faria a página piscar a cada linha adicionada. Entra com efeito
// só o que não estava na tela: a aba nova, a seção que abriu, o menu, a linha recém-criada. Na troca de mês ou de
// empresa (ui.animarTela) o conteúdo todo entra de novo, menos o cabeçalho e a barra de seleção, que não mudaram.
const SEL_ANIM = '#app > *, .det, .prem, .calc, .menu, .panel, .li, .gr, .cr, .cad-row:not(.gh), .gprod:not(.gh)';
function chaveAnim(el){
  if(el.parentElement === app)
    return 'bloco:' + (el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') || el.id || el.classList[0] || el.tagName);
  // linha e seção se reconhecem pelo primeiro campo (ou botão) que carregam: é o que não muda entre um render e outro
  const b = el.querySelector('[data-b]'), a = el.querySelector('[data-act]'), d = a ? a.dataset : {};
  return el.classList[0] + ':' + (b ? b.dataset.b : a ? [d.act, d.id, d.i, d.g, d.lista].join('|') : '');
}
function chavesNaTela(){
  const k = new Set();
  app.querySelectorAll(SEL_ANIM).forEach(el => {
    if(ui.animarTela && el.closest('#app > :not(.top):not(.barra):not(.fixo)')) return;
    k.add(chaveAnim(el));
  });
  return k;
}
function animarNovos(antes){
  let n = 0;
  app.querySelectorAll(SEL_ANIM).forEach(el => {
    // dentro de um bloco que já está entrando, o filho entra junto: animar os dois daria o efeito em dobro
    if(antes.has(chaveAnim(el)) || (el.parentElement !== app && el.parentElement.closest('.entra'))) return;
    el.classList.add('entra');
    if(el.parentElement === app) el.style.setProperty('--i', n++);
  });
}
// barra compacta: desce quando a barra de seleção sai da tela. Nome e competência vêm dos mesmos data-o do

  const salvar = banco.ativo && banco.sessao
    ? `<span class="fixo-acao"><span class="bstatus fixo-status" aria-hidden="true"></span>` +
      `<button class="btn prim fixo-salvar" type="button" data-act="salvar-banco" title="Salvar (Ctrl+S)">Salvar</button></span>` : '';
  return `<div class="fixo" role="region" aria-label="Navegação rápida"><div class="fixo-in">
    <button class="fixo-id" type="button" data-act="topo" title="Voltar ao topo para trocar de empresa ou de competência"><b data-o="co"></b><span data-o="ctx"></span></button>
    <nav class="fixo-abas" aria-label="Seções do painel">${abas}</nav>${salvar}</div></div>`;

const CONTA_SEL = '.hero-row .val, .kv, .dl.rec .v, .dl.gross .v, .dl.tot .v, .dl.res .v,' +
  ' .total > span:last-child, .cmp-row.dest .v, .cmp-row.tot .v, .sb-v';
const NUM_BR = /-?\d{1,3}(?:\.\d{3})*,\d{2}/;
const semMovimento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function contarAte(el, alvo){
  const fim = alvo.match(NUM_BR), de = (el.textContent || '').match(NUM_BR);
  const val = m => parseFloat(m[0].replace(/\./g, '').replace(',', '.'));
  if(!fim){ el.textContent = alvo; return; }                       // sem número no texto: entra direto
  const a = de ? val(de) : 0, b = val(fim);
  if(a === b){ el.textContent = alvo; return; }
  cancelAnimationFrame(el._conta); clearTimeout(el._contaFim);
  const t0 = performance.now(), dur = 420;
  // rede de segurança: com a aba escondida o navegador para de dar quadros e o número ficaria a meio caminho
  el._contaFim = setTimeout(() => { cancelAnimationFrame(el._conta); el.textContent = alvo; }, dur + 80);
  const passo = t => {
    // o carimbo do primeiro quadro pode ser anterior ao instante em que a conta começou: sem o piso em 0
    // a curva dispara e o número aparece em outra casa
    const p = Math.min(1, Math.max(0, (t - t0) / dur));
    el.textContent = p < 1 ? alvo.replace(NUM_BR, dec(a + (b - a) * (1 - Math.pow(1 - p, 3)), 2, 2)) : alvo;
    if(p < 1) el._conta = requestAnimationFrame(passo);
  };
  el._conta = requestAnimationFrame(passo);
}

function zerarValores(base, manter){

  // manter {estoque, fixas}: o que o mês novo repete do anterior em vez de zerar (ver herdarDoAnterior)

  [d.annual, d.monthly].forEach(x => { x.receita = 0; ['custos', 'ga', 'vendas', 'tributarias'].forEach(g => zera(x[g])); });
  d.annual.compraMercadoria = 0; zera(d.monthly.compras);

}

const guarda = {             // localStorage com proteção: navegador sem acesso ao armazenamento não quebra o painel
  ler(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  gravar(k, v){ try { if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const rotuloMes = p => { const [a, m] = String(p).split('-'); return `${MESES[+m - 1]} ${a}`; };
const mesCurto = p => { const [a, m] = String(p).split('-'); return `${MESES[+m - 1].slice(0, 3).toLowerCase()}/${a}`; };
const mesBarra = p => { const [a, m] = String(p).split('-'); return `${m}/${a}`; };
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const hora = d => d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
const dataHora = t => t ? new Date(t).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '—';
function periodoAtual(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; }
// competência ± n meses (n negativo anda para trás): base do RBT12 e da herança do mês novo
function somarMeses(p, n){ const [a, m] = String(p).split('-').map(Number); const t = a * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}-01`; }
const proximoMes = p => somarMeses(p, 1);
function lerPeriodo(txt){                     // "12/2025", "2025-12" ou "Dezembro 2025" → "2025-12-01"
  const s = semAcento(txt); let m, ano, mes;
  if((m = s.match(/(\d{1,2})\s*\/\s*(\d{4})/))){ mes = +m[1]; ano = m[2]; }
  else if((m = s.match(/(\d{4})-(\d{1,2})/))){ ano = m[1]; mes = +m[2]; }
  else { const i = MESES.findIndex(n => s.includes(semAcento(n))), a = s.match(/\d{4}/); if(i >= 0 && a){ mes = i + 1; ano = a[0]; } }
  return ano && mes >= 1 && mes <= 12 ? `${ano}-${String(mes).padStart(2, '0')}-01` : null;
}

async function sbAuth(caminho, corpo, token, metodo){
  const r = await fetch(`${SUPABASE.url}/auth/v1/${caminho}`, {
    method: metodo || 'POST',
    headers: Object.assign({apikey: SUPABASE.chave, 'Content-Type': 'application/json'}, token ? {Authorization: 'Bearer ' + token} : {}),
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch(e){}
  if(!r.ok){ const err = new Error((d && (d.error_description || d.msg || d.message)) || `HTTP ${r.status}`); err.status = r.status; throw err; }
  return d;
}
function guardarSessao(d){
  banco.sessao = d ? {
    access_token: d.access_token, refresh_token: d.refresh_token,
    expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
    email: (d.user && d.user.email) || (banco.sessao && banco.sessao.email) || ''
  } : null;
  guarda.gravar('dre.sessao', banco.sessao);
}
async function tokenValido(){
  const s = banco.sessao;
  if(!s) throw Object.assign(new Error('Entre para continuar'), {status: 401});
  if(s.expires_at - 60 > Date.now() / 1000) return s.access_token;
  try { guardarSessao(await sbAuth('token?grant_type=refresh_token', {refresh_token: s.refresh_token})); }
  catch(e){ guardarSessao(null); throw Object.assign(new Error('Sua sessão expirou'), {status: 401}); }
  return banco.sessao.access_token;
}
async function sb(caminho, o){
  o = o || {};
  const token = await tokenValido();
  const r = await fetch(`${SUPABASE.url}/rest/v1/${caminho}`, {
    method: o.metodo || 'GET',
    headers: Object.assign({apikey: SUPABASE.chave, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json'}, o.prefer ? {Prefer: o.prefer} : {}),
    body: o.corpo !== undefined ? JSON.stringify(o.corpo) : undefined
  });
  const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch(e){ d = txt; }
  if(!r.ok){
    const err = new Error((d && d.message) || `HTTP ${r.status}`); err.status = r.status;
    if(r.status === 401) guardarSessao(null);
    throw err;
  }
  return d;
}

    else toast('Erro no banco de dados: ' + e.message);

// janela simples: resolve {botao, valores}; Enter = cfg.padrao, Esc = cancelar
function modal(cfg){
  return new Promise(resolve => {
    const caixa = document.getElementById('modal'), antes = document.activeElement;
    const campos = (cfg.campos || []).map(([nome, rotulo, valor, tipo]) =>
      `<label class="field"><span>${esc(rotulo)}</span><input class="in txt" name="${nome}" type="${tipo || 'text'}" value="${esc(valor || '')}" autocomplete="${tipo === 'password' ? 'new-password' : 'off'}"></label>`).join('');
    // caixas de seleção: [nome, rótulo, marcado, explicação] — FormData devolve 'on' só nas marcadas
    const caixas = (cfg.caixas || []).map(([nome, rotulo, marcado, nota]) =>
      `<label class="modal-cx"><input type="checkbox" name="${nome}"${marcado ? ' checked' : ''}><span>${esc(rotulo)}${nota ? `<small>${esc(nota)}</small>` : ''}</span></label>`).join('');
    const botoes = cfg.botoes.map(([k, rotulo, estilo]) => `<button type="button" class="btn ${estilo || ''}" data-modal="${k}">${esc(rotulo)}</button>`).join('');
    caixa.innerHTML = `<div class="modal-fundo"><form class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo">${esc(cfg.titulo)}</h2>${cfg.texto ? `<p class="sub">${esc(cfg.texto)}</p>` : ''}${cfg.html || ''}
      ${campos ? `<div class="modal-campos">${campos}</div>` : ''}${caixas ? `<div class="modal-campos">${caixas}</div>` : ''}${cfg.erro ? `<p class="modal-erro" role="alert">${esc(cfg.erro)}</p>` : ''}
      <div class="modal-acoes">${botoes}</div><button type="submit" hidden tabindex="-1"></button></form></div>`;
    caixa.hidden = false;
    const form = caixa.querySelector('form');
    const fechar = botao => {
      const valores = {}; new FormData(form).forEach((v, k) => { valores[k] = String(v); });
      caixa.hidden = true; caixa.innerHTML = '';
      if(antes && document.contains(antes)) antes.focus();
      resolve({botao, valores});
    };
    form.addEventListener('submit', e => { e.preventDefault(); fechar(cfg.padrao || 'cancelar'); });
    form.addEventListener('click', e => { const b = e.target.closest('[data-modal]'); if(b) fechar(b.dataset.modal); });
    form.addEventListener('keydown', e => { if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); fechar('cancelar'); } });
    (form.querySelector('input') || form.querySelector(`[data-modal="${cfg.padrao || 'cancelar'}"]`)).focus();
  });
}

const HERANCA = {saldo: true, rbt12: true, estoque: false, fixas: false};
async function herdarDoAnterior(empresaId, periodo, anterior, h){

  const faltam = lista.filter(x => !x.resumo || x.resumo.debito === undefined).map(x => x.periodo);

      `&empresa_id=eq.${banco.empresaId}&periodo=in.(${faltam.join(',')})`);

    lista.forEach(x => { if(porPeriodo[x.periodo]) x.resumo = resumoDe(prontoParaCalculo(porPeriodo[x.periodo])); });

/* ---------- Lucro Presumido: estimativa pelos meses salvos ---------- */
// IRPJ 15% e CSLL 9% sobre receita × presunção, apurados por TRIMESTRE — no mês a mês o adicional sai errado
// quando a receita oscila. Adicional do IRPJ: 10% sobre a base acima de R$ 20 mil por mês do trimestre.
// LC 224/2025: presunção 10% maior sobre a receita acima de R$ 5 milhões no ano, aplicada R$ 1,25 milhão por
// trimestre, acumulado, com ajuste nos seguintes (em disputa na Justiça, ADI 7920). Regras de 2027: PIS/Cofins
// viram a CBS por fora — débito menos crédito, a mesma do híbrido. IBS quase zero até 2028: fica de fora.
const LP = {irpj: .15, adicional: .10, limiteMes: 20000, csll: .09, limiteTri: 1250000, acrescimo: .10};
// presunção por atividade (Lei 9.249/1995, arts. 15 e 20): [id, nome, IRPJ, CSLL, ISS?, ICMS?]
const ATIVIDADES = [
  ['servicos', 'Serviços em geral (consultoria, profissões, administração, locação)', .32, .32, true, false],
  ['hospitalar', 'Serviços hospitalares e de auxílio diagnóstico', .08, .12, true, false],
  ['obraMaterial', 'Construção por empreitada com todos os materiais', .08, .12, true, false],
  ['obraMao', 'Construção só com mão de obra', .32, .32, true, false],
  ['cargas', 'Transporte de cargas', .08, .12, true, true],
  ['passageiros', 'Transporte de passageiros', .16, .12, true, true],
  ['comercio', 'Comércio e indústria', .08, .12, false, true],
  ['combustivel', 'Revenda de combustíveis', .016, .12, false, true],
  ['outra', 'Outra atividade — informar os percentuais', null, null, true, true],
];
const LP_CAMPOS = ['n', 'rec', 'cbs', 'debCbs', 'credCbs', 'semCbs', 'folha', 'prolabore', 'baseInss', 'das', 'hib', 'acrescimo',
  'baseIrpj', 'baseCsll', 'irpj', 'adicional', 'csll', 'iss', 'icms', 'inss', 'total', 'conv', 'hibr'];
const RE_FOLHA = /folha|sal[aá]rio|funcion[aá]rio|ordenado|pr[oó][\s-]*labore/i;
const RE_PROLABORE = /pr[oó][\s-]*labore/i;
// pró-labore paga 20% patronal, sem RAT nem terceiros; linha que mistura ("Folha e pró-labore") fica com a alíquota da folha
const categoriaFolha = nome => !RE_FOLHA.test(nome) ? '' : RE_PROLABORE.test(nome) && !/folha|sal[aá]rio|funcion[aá]rio|ordenado/i.test(nome) ? 'prolabore' : 'folha';
// atividade da empresa: a escolhida ou, sem escolha, a do anexo do Simples (I e II vendem mercadoria; III a V, serviço)
function atividadeLP(){
  const pr = S.presumido || {}, id = ATIVIDADES.some(x => x[0] === pr.atividade) ? pr.atividade
    : ['I', 'II'].includes(anexoEmpresa()) ? 'comercio' : 'servicos';
  const [, nome, irpj, csll, iss, icms] = ATIVIDADES.find(x => x[0] === id);
  return {id, nome, escolhida: id === pr.atividade, iss, icms,
    irpj: irpj === null ? +pr.irpjOutra || 0 : irpj, csll: csll === null ? +pr.csllOutra || 0 : csll};
}
function premissasLP(){
  const pr = S.presumido || {}, at = atividadeLP();
  return {irpj: at.irpj, csll: at.csll, iss: at.iss ? +pr.iss || 0 : 0, icms: at.icms ? +pr.icms || 0 : 0, encargos: +pr.encargos || 0,
    encargosPro: pr.encargosProlabore == null ? 0.20 : +pr.encargosProlabore || 0};
}
function calcPresumido(linhas, folhas, prem, anexo){
  const q = [0, 1, 2, 3].map(() => Object.fromEntries(LP_CAMPOS.map(k => [k, 0])));
  (linhas || []).forEach(x => {
    const r = x.resumo; if(!r) return;
    const t = q[Math.floor((+x.periodo.slice(5, 7) - 1) / 3)];
    t.n++; t.rec += +r.receita || 0; t.das += +r.das || 0;
    // CBS pelo débito e crédito de cada mês, sem o transportado (ver totaisAno); o híbrido é o DAS sem a CBS mais ela
    const cb = cbsDoMes(r);
    t.debCbs += cb.deb; t.credCbs += cb.cred; t.semCbs += (+r.naTransicao || 0) - (+r.cbs || 0);
    const f = folhas[x.periodo];                     // número sozinho = só folha (forma antiga, usada nos testes)
    t.folha += typeof f === 'object' && f ? +f.folha || 0 : +f || 0;
    t.prolabore += typeof f === 'object' && f ? +f.prolabore || 0 : 0;
  });
  let acumulada = 0, excedenteAntes = 0;
  q.forEach((t, i) => {
    t.cbs = t.debCbs - t.credCbs;                    // trimestre com mais crédito que débito fica negativo
    t.hib = t.semCbs + t.cbs;
    acumulada += t.rec;
    const excedente = Math.max(0, acumulada - LP.limiteTri * (i + 1)), excTri = excedente - excedenteAntes;
    excedenteAntes = excedente;
    // o acréscimo da LC 224 vale para as duas presunções; negativo = ajuste de trimestre anterior
    t.acrescimo = excTri * prem.irpj * LP.acrescimo;
    t.baseIrpj = Math.max(0, t.rec * prem.irpj + t.acrescimo);
    t.baseCsll = Math.max(0, t.rec * prem.csll + excTri * prem.csll * LP.acrescimo);
    t.irpj = t.baseIrpj * LP.irpj;
    t.adicional = Math.max(0, t.baseIrpj - LP.limiteMes * t.n) * LP.adicional;   // limite pelos meses salvos do trimestre
    t.csll = t.baseCsll * LP.csll;
    t.iss = t.rec * prem.iss;
    t.icms = t.rec * prem.icms;
    t.baseInss = t.folha + t.prolabore;
    t.inss = t.folha * prem.encargos + t.prolabore * (prem.encargosPro == null ? prem.encargos : prem.encargosPro);
    t.total = t.irpj + t.adicional + t.csll + t.cbs + t.iss + t.icms + t.inss;
    // no Anexo IV a contribuição patronal já é paga fora do DAS: entra dos dois lados e não decide nada
    const fora = anexo === 'IV' ? t.inss : 0;
    t.conv = t.das + fora; t.hibr = t.hib + fora;
  });
  const ano = Object.fromEntries(LP_CAMPOS.map(k => [k, q.reduce((s, t) => s + t[k], 0)]));
  // no ano, débito menos crédito; sobrando crédito, a CBS do ano é zero e o saldo fica para o ano seguinte
  ano.credorCbs = Math.max(0, -ano.cbs);
  if(ano.credorCbs > 0){ ano.cbs = 0; ano.total += ano.credorCbs; ano.hib += ano.credorCbs; ano.hibr += ano.credorCbs; }
  // Visão por mês: receita, CBS, ISS/ICMS, INSS e Simples são do próprio mês. IRPJ, adicional, CSLL e as bases são
  // apurados POR TRIMESTRE (é assim na lei), então aqui aparecem rateados pela receita do mês dentro do trimestre —
  // sem receita no trimestre, divididos igualmente. A tabela diz isso embaixo
  const meses = (linhas || []).filter(x => x.resumo).sort((a, b) => a.periodo < b.periodo ? -1 : 1).map(x => {
    const r = x.resumo, tri = q[Math.floor((+x.periodo.slice(5, 7) - 1) / 3)];
    const m = Object.fromEntries(LP_CAMPOS.map(k => [k, 0]));
    const cb = cbsDoMes(r), f = folhas[x.periodo];
    m.periodo = x.periodo; m.n = 1;
    m.rec = +r.receita || 0; m.das = +r.das || 0;
    m.debCbs = cb.deb; m.credCbs = cb.cred; m.cbs = cb.deb - cb.cred;
    m.semCbs = (+r.naTransicao || 0) - (+r.cbs || 0); m.hib = m.semCbs + m.cbs;
    m.folha = typeof f === 'object' && f ? +f.folha || 0 : +f || 0;
    m.prolabore = typeof f === 'object' && f ? +f.prolabore || 0 : 0;
    m.baseInss = m.folha + m.prolabore;
    m.inss = m.folha * prem.encargos + m.prolabore * (prem.encargosPro == null ? prem.encargos : prem.encargosPro);
    m.iss = m.rec * prem.iss; m.icms = m.rec * prem.icms;
    const parte = tri.rec > 0.004 ? m.rec / tri.rec : (tri.n ? 1 / tri.n : 0);
    ['acrescimo', 'baseIrpj', 'baseCsll', 'irpj', 'adicional', 'csll'].forEach(k => { m[k] = tri[k] * parte; });
    m.total = m.irpj + m.adicional + m.csll + m.cbs + m.iss + m.icms + m.inss;
    const fora = anexo === 'IV' ? m.inss : 0;
    m.conv = m.das + fora; m.hibr = m.hib + fora;
    return m;
  });
  return {q, ano, meses};
}
// folha dos meses salvos: só as linhas de despesa de cada mês (dados->monthly->ga), não o estado inteiro
async function carregarFolhas(a){
  const periodos = a.linhas.map(x => x.periodo);
  const lista = await sb(`competencias?select=periodo,ga:dados->monthly->ga&empresa_id=eq.${banco.empresaId}&periodo=in.(${periodos.join(',')})`) || [];
  // folhas[periodo] = {folha, prolabore}; linhas = cada despesa que entrou, com o valor de cada mês — é o que a
  // base de cálculo do INSS mostra aberta, para conferir o que o nome da linha puxou (ou deixou de puxar)
  const folhas = {}, porNome = new Map();
  lista.forEach(c => {
    const f = folhas[c.periodo] = {folha: 0, prolabore: 0};
    (Array.isArray(c.ga) ? c.ga : []).forEach(r => {
      const nome = String(r[0] || '').trim(), cat = categoriaFolha(nome), v = +r[1] || 0;
      if(!cat) return;
      f[cat] += v;
      if(!porNome.has(nome)) porNome.set(nome, {nome, cat, valores: {}});
      const l = porNome.get(nome); l.valores[c.periodo] = (l.valores[c.periodo] || 0) + v;
    });
  });
  if(banco.ano !== a) return;                        // trocou de empresa ou de ano enquanto buscava
  // linha zerada o ano todo não entra na conta nem na nota
  const linhas = [...porNome.values()].filter(l => Object.values(l.valores).some(v => v > 0.004));
  banco.presumido = {de: a, folhas, linhas, nomes: linhas.map(l => l.nome), carregando: false};
  render();
}
function garantirPresumido(){
  const a = banco.ano;
  if(!a || a.carregando || a.semFuncao || !a.linhas.length) return;
  if(banco.presumido && banco.presumido.de === a) return;
  banco.presumido = {de: a, folhas: {}, nomes: [], carregando: true};
  comErro(async () => {
    try { await carregarFolhas(a); }
    catch(e){ if(banco.presumido && banco.presumido.de === a){ banco.presumido = {de: a, erro: true}; render(); } throw e; }
  });
}
function garantirAno(recarregar){
  if(!banco.ativo || !banco.empresaId) return;
  const ano = anoCompetencia();
  if(!recarregar && banco.ano && banco.ano.ano === ano) return garantirPresumido();
  banco.ano = {ano, linhas: [], carregando: true};
  render();
  comErro(() => carregarAno(ano));
}
// CBS de um mês salvo: débito e crédito do próprio mês. Resumo antigo sem os dois (se o recálculo não veio) fica com
// o que foi pago, que era a conta de antes
const cbsDoMes = r => r.debito !== undefined
  ? {deb: +r.debito || 0, cred: +r.credito || 0, transp: +r.saldoAnterior || 0}
  : {deb: +r.cbs || 0, cred: 0, transp: 0};
function totaisAno(linhas){
  const t = {rec: 0, das: 0, cbs: 0, res: 0, custos: 0, ga: 0, vendas: 0, trib: 0, nat: 0, compras: 0, n: 0,
             deb: 0, cred: 0, transp: 0, pago: 0, semCbs: 0};
  (linhas || []).forEach(x => {
    const r = x.resumo;
    if(!r) return;
    const c = cbsDoMes(r);
    t.n++; t.rec += +r.receita || 0; t.das += +r.das || 0; t.res += +r.resultado || 0;
    t.custos += +r.custos || 0; t.ga += +r.ga || 0; t.vendas += +r.vendas || 0; t.trib += +r.trib || 0;
    t.compras += +r.compras || 0;
    t.deb += c.deb; t.cred += c.cred; t.transp += c.transp; t.pago += +r.cbs || 0;
    t.semCbs += (+r.naTransicao || 0) - (+r.cbs || 0);          // o híbrido sem a CBS: DAS sem a CBS e o IBS informado
  });
  // CBS do ano = débito menos crédito dos meses. Sobrando crédito, o ano não paga CBS e o saldo fica para o ano seguinte
  t.cbsLiq = t.deb - t.cred;
  t.cbs = Math.max(0, t.cbsLiq);
  t.credor = Math.max(0, -t.cbsLiq);
  t.nat = t.semCbs + t.cbs;
  return t;
}
// meses do exercício que ainda não têm competência salva, até o mês aberto
function mesesFaltando(linhas, ano){
  const tem = new Set((linhas || []).map(x => +x.periodo.slice(5, 7)));
  const ate = anoCompetencia() === ano ? +(lerPeriodo(S.mesLabel) || '').slice(5, 7) || 12 : 12;
  const falta = [];
  for(let m = 1; m <= ate; m++) if(!tem.has(m)) falta.push(MESES[m - 1].slice(0, 3).toLowerCase());
  return falta;
}
// duas leituras do exercício: o tamanho do ano e o que ele mostra (regime, faixa, sazonalidade)
function textoAno(t, linhas){
  const cem = v => dec(t.rec ? v / t.rec * 100 : 0, 2, 2);
  const p1 = `${t.n} ${t.n === 1 ? 'mês somado' : 'meses somados'}: receita de ${brl(t.rec)} e DAS de ${brl(t.das)} — alíquota efetiva média de ${cem(t.das)}%. Com as demais despesas tributárias, os tributos do ano somam ${brl(t.trib)}, ou ${cem(t.trib)}% da receita.`;
  const p = [];
  if(t.nat > 0.004){
    const dif = t.nat - t.das;
    p.push(Math.abs(dif) < 0.005 ? 'No acumulado do ano, os dois regimes empatam.'
      : dif > 0 ? `No acumulado do ano, o tradicional sai ${brl(dif)} mais barato que apurar a CBS por fora.`
                : `No acumulado do ano, apurar a CBS por fora sai ${brl(-dif)} mais barato que o tradicional.`);
  }
  const faixas = [...new Set((linhas || []).map(x => x.resumo && x.resumo.faixa).filter(Boolean))].sort();
  if(faixas.length === 1) p.push(`A empresa ficou na ${faixas[0]}ª faixa do Simples o ano todo.`);
  else if(faixas.length > 1) p.push(`A faixa do Simples foi da ${faixas[0]}ª à ${faixas[faixas.length - 1]}ª ao longo do ano.`);
  const comReceita = (linhas || []).filter(x => x.resumo && (+x.resumo.receita || 0) > 0.004);
  if(comReceita.length > 1){
    const ord = comReceita.slice().sort((a, b) => b.resumo.receita - a.resumo.receita), ultimo = ord[ord.length - 1];
    p.push(`O melhor mês em receita foi ${mesCurto(ord[0].periodo)}, com ${brl(ord[0].resumo.receita)}; o menor, ${mesCurto(ultimo.periodo)}, com ${brl(ultimo.resumo.receita)}.`);
  }
  return [p1, p.join(' ')];
}
const SUBLIMITE = 3600000;
// a receita do exercício contra o sublimite e o limite do Simples, pelo ritmo dos meses somados
function alertaLimite(t){
  const proj = t.n ? t.rec / t.n * 12 : 0;
  if(t.rec > LIMITE_SN) return `A receita do ano já passou de ${brl(LIMITE_SN)}: acima do limite do Simples Nacional.`;
  if(t.rec > SUBLIMITE) return `A receita do ano já passou do sublimite de ${brl(SUBLIMITE)}: ICMS e ISS passam a ser recolhidos fora do DAS.`;
  if(t.n >= 3 && proj > LIMITE_SN) return `No ritmo destes ${t.n} meses, o ano fecharia em ${brl(proj)} — acima do limite de ${brl(LIMITE_SN)} do Simples Nacional.`;
  if(t.n >= 3 && proj > SUBLIMITE) return `No ritmo destes ${t.n} meses, o ano fecharia em ${brl(proj)} — acima do sublimite de ${brl(SUBLIMITE)}, que tira ICMS e ISS do DAS.`;
  return '';
}
async function abrirMes(empresaId, periodo, op){
  op = op || {};
  const r = await sb('rpc/carregar_painel', {metodo: 'POST', corpo: {p_empresa_id: empresaId, p_periodo: periodo}});
  const cadeia = {fornecedores: [], clientes: []};
  (r.parceiros || []).forEach(p => cadeia[p[0] === 'cliente' ? 'clientes' : 'fornecedores'].push([p[1] || '', p[2] || '', p[3] || '', p[4] || '']));
  const novo = !r.competencia;
  banco.heranca = null; banco.ano = null;          // o quadro do ano é refeito ao entrar na aba Anual
  // o último mês salvo antes deste (pode não ser o mês de calendário anterior: a tela diz qual é).
  // Salvo antes da migração do resumo, vem com os dados e é recalculado aqui
  const ant = r.anterior;
  banco.anterior = ant ? {periodo: ant.periodo, resumo: ant.resumo || (ant.dados ? resumoDe(prontoParaCalculo(ant.dados)) : null)} : null;
  if(!novo){
    S = mesclar(defaults(), migrar(r.competencia.dados)); S.cadeia = cadeia; normalizarLinhas(S.monthly.reforma);
    banco.base = r.competencia.atualizado_em;
  } else {
    // mês ainda não salvo: a tela atual (primeira empresa) ou o mês salvo mais próximo, com os valores zerados
    if(!op.manterTela){
      const h = op.heranca || HERANCA;
      S = r.modelo ? zerarValores(mesclar(defaults(), migrar(r.modelo)), h) : modeloEmBranco();
      S.cadeia = cadeia; normalizarLinhas(S.monthly.reforma);
      if(!r.modelo) S.anexo = '';                  // empresa nova: o anexo do exemplo não vale para ela
      S.mesLabel = rotuloMes(periodo);             // a herança calcula pelo ano desta competência
      await herdarDoAnterior(empresaId, periodo, r.anterior, h);
    }
    S.co = (banco.empresas.find(e => e.id === empresaId) || {}).nome || S.co;
    banco.base = '-infinity';                      // no banco, "este mês ainda não pode existir"
  }
  // catálogo é da empresa, não do mês (como a cadeia). Lista vazia no banco não apaga o que veio no
  // estado: pode ser um mês salvo antes da migração, e ele grava o catálogo no próximo salvamento.
  if(Array.isArray(r.produtos) && r.produtos.length)
    S.produtos = r.produtos.map(p => [p[0] || '', p[1] || 'geral', p[2] || '', p[3] || '', p[4] || '', p[5] || '']);
  S.mesLabel = rotuloMes(periodo);
  // fornecedores, clientes e catálogo como estão no banco: se a tela chegar sem eles ao salvar, é com estes que se pergunta
  banco.listas = {cadeia: JSON.parse(JSON.stringify(cadeia)),
                  produtos: Array.isArray(r.produtos) ? r.produtos.map(x => [x[0] || '', x[1] || 'geral', x[2] || '', x[3] || '', x[4] || '', x[5] || '']) : null};
  Object.assign(banco, {empresaId, periodo, erro: '', salvoEm: null, instantaneo: novo ? null : instantaneo()});
  guarda.gravar('dre.ultimo', {empresaId, periodo});
  ui.menu = false;
  render();
  if(novo && !op.semSalvar) await salvarBanco();
}

// Excluir a competência aberta: apaga do banco para toda a equipe, sem desfazer. A cadeia de
// crédito é da empresa (não do mês) e não é tocada.
async function excluirMes(){
  if(!banco.empresaId || !banco.periodo || !(banco.meses || []).includes(banco.periodo)) return;
  const empresa = (banco.empresas.find(e => e.id === banco.empresaId) || {}).nome || S.co, alvo = banco.periodo;
  const r = await modal({
    titulo: 'Excluir este mês',
    texto: `${empresa} · ${mesCurto(alvo)} sai da lista de meses de toda a equipe e vai para a lixeira, onde fica 30 dias (Opções → Lixeira).`,
    botoes: [['cancelar', 'Cancelar', 'prim'], ['excluir', 'Excluir o mês']],
    padrao: 'cancelar'
  });
  if(r.botao !== 'excluir'){ render(); return; }
  await sb(`competencias?empresa_id=eq.${encodeURIComponent(banco.empresaId)}&periodo=eq.${alvo}`, {metodo: 'DELETE'});
  banco.meses = banco.meses.filter(p => p !== alvo);
  banco.instantaneo = null;                        // o que está na tela deixou de ser um mês salvo
  toast(`${mesCurto(alvo)} excluído`);
  // abre o mês salvo mais recente; se não sobrou nenhum, o mês atual, sem gravar
  if(banco.meses.length) return abrirMes(banco.empresaId, banco.meses[0]);
  return abrirMes(banco.empresaId, periodoAtual(), {semSalvar: true});
}

// Lixeira: meses excluídos nos últimos 30 dias, de todas as empresas. Restaurar devolve o mês como estava
async function abrirLixeira(){
  let itens;
  try { itens = await sb('rpc/listar_lixeira', {metodo: 'POST', corpo: {}}); }
  catch(e){ if(e.status === 404){ toast('A lixeira ainda não está ativa: falta aplicar a atualização do banco de dados.'); return; } throw e; }
  const linha = x => {
    const trava = x.sem_empresa ? 'a empresa não existe mais' : x.ocupado ? 'já existe um mês salvo nesse período' : '';
    return `<div class="hist-item"><div><b>${esc(x.empresa || '—')} · ${mesCurto(x.periodo)}</b>
      <small>excluído em ${dataHora(x.excluido_em)}${x.por ? ' por ' + esc(x.por) : ''} · receita ${brl(+x.receita || 0)}</small>
      ${trava ? `<small class="hist-aviso">${trava}</small>` : ''}</div>
      <button type="button" class="btn" data-modal="restaurar:${x.id}"${trava ? ' disabled' : ''}>Restaurar</button></div>`;
  };
  const r = await modal({
    titulo: 'Lixeira',
    texto: itens.length ? 'Meses excluídos nos últimos 30 dias. Restaurar devolve o mês como estava quando foi excluído.'
      : 'Nenhum mês excluído nos últimos 30 dias.',
    html: itens.length ? `<div class="hist-lista">${itens.map(linha).join('')}</div>` : '',
    botoes: [['cancelar', 'Fechar', 'prim']], padrao: 'cancelar'
  });
  if(!r.botao.startsWith('restaurar:')){ render(); return; }
  const item = itens.find(x => x.id === r.botao.slice('restaurar:'.length));
  const feito = await sb('rpc/restaurar_competencia', {metodo: 'POST', corpo: {p_id: item.id}});
  toast(`${item.empresa} · ${mesCurto(item.periodo)} restaurado`);
  // mês da empresa aberta: volta para a lista, e abre se não houver o que perder na tela
  if(feito.empresa_id === banco.empresaId){
    await listarMeses(banco.empresaId);
    if(await podeSair()) return abrirMes(banco.empresaId, feito.periodo);
  }
  render();
}

// Histórico do mês aberto: versões anteriores dos valores do mês e das listas da empresa (fornecedores, clientes, produtos).
// Restaurar guarda o que havia antes — dá para desfazer
async function abrirHistorico(){
  const emp = banco.empresaId, per = banco.periodo, nomeMes = mesCurto(per);
  let versoes, cadastros;
  try {
    [versoes, cadastros] = await Promise.all([
      sb('rpc/listar_versoes', {metodo: 'POST', corpo: {p_empresa_id: emp, p_periodo: per}}),
      sb('rpc/listar_versoes_cadastros', {metodo: 'POST', corpo: {p_empresa_id: emp}})]);
  } catch(e){ if(e.status === 404){ toast('O histórico ainda não está ativo: falta aplicar a atualização do banco de dados.'); return; } throw e; }
  const doMes = v => `<div class="hist-item"><div><b>Como estava em ${dataHora(v.salvo_em)}</b>
      <small>receita ${brl(+v.receita || 0)}${v.salvo_por ? ' · salvo por ' + esc(v.salvo_por) : ''} · substituído em ${dataHora(v.substituido_em)}</small></div>
      <button type="button" class="btn" data-modal="mes:${v.id}">Restaurar</button></div>`;
  const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
  const daEmpresa = v => `<div class="hist-item"><div><b>Lista até ${dataHora(v.substituido_em)}</b>
      <small>${plural(v.fornecedores, 'fornecedor', 'fornecedores')} · ${plural(v.clientes, 'cliente', 'clientes')} · ${plural(v.produtos, 'produto', 'produtos')}${v.por ? ' · trocada por ' + esc(v.por) : ''}</small></div>
      <button type="button" class="btn" data-modal="cad:${v.id}">Restaurar</button></div>`;
  const r = await modal({
    titulo: `Histórico de ${nomeMes}`,
    texto: 'Cada salvamento guarda o que havia antes. Restaurar também guarda, então dá para desfazer.',
    html: `<h3 class="hist-t">Valores do mês</h3>` +
      (versoes.length ? `<div class="hist-lista">${versoes.map(doMes).join('')}</div>` : '<p class="hist-vazio">Nenhuma versão anterior deste mês ainda.</p>') +
      `<h3 class="hist-t">Fornecedores, clientes e produtos da empresa</h3>` +
      (cadastros.length ? `<div class="hist-lista">${cadastros.map(daEmpresa).join('')}</div>` : '<p class="hist-vazio">Nenhuma lista anterior guardada ainda.</p>'),
    botoes: [['cancelar', 'Fechar', 'prim']], padrao: 'cancelar'
  });
  if(!/^(mes|cad):/.test(r.botao)){ render(); return; }
  if(!(await podeSair())){ render(); return; }       // o que está na tela sem salvar seria substituído
  const [tipo, id] = r.botao.split(':');
  await sb(tipo === 'mes' ? 'rpc/restaurar_versao' : 'rpc/restaurar_cadastros', {metodo: 'POST', corpo: {p_id: id}});
  toast(tipo === 'mes' ? `${nomeMes} voltou à versão escolhida` : 'Fornecedores, clientes e produtos restaurados');
  return abrirMes(emp, per);
}

async function salvarBanco(forcar){
  if(!banco.ativo){ toast('Banco de dados não configurado — veja "Banco de dados" no README.'); return; }
  if(!banco.sessao){ banco.aposLogin = () => salvarBanco(forcar); render(); return; }
  if(!banco.empresaId) return comErro(novaEmpresa);
  if(banco.salvando) return;
  const enviado = instantaneo(), dados = JSON.parse(enviado);
  const cadeia = dados.cadeia || {fornecedores: [], clientes: []}; delete dados.cadeia;
  const linha = tipo => r => [tipo, limpaCnpj(r[0]), r[1] || '', r[2] || '', r[3] || ''];
  const parceiros = cadeia.fornecedores.map(linha('fornecedor')).concat(cadeia.clientes.map(linha('cliente')));
  // trava: a tela chegou sem fornecedores/clientes ou sem produtos que a empresa tem no banco. Salvar trocaria a lista da
  // empresa — de todos os meses — pela vazia. Pergunta antes; o banco também recusa sem confirmação (migração de 16/09/2026)
  const salvas = banco.listas || {cadeia: {fornecedores: [], clientes: []}, produtos: null};
  const nParc = salvas.cadeia.fornecedores.length + salvas.cadeia.clientes.length, nProd = (salvas.produtos || []).length;
  const faltaParc = !parceiros.length && nParc > 0, faltaProd = !(dados.produtos || []).length && nProd > 0;
  let apagarListas = false;
  if(faltaParc || faltaProd){
    const oQue = [faltaParc && `${nParc} ${nParc === 1 ? 'fornecedor ou cliente' : 'fornecedores e clientes'}`,
                  faltaProd && `${nProd} ${nProd === 1 ? 'produto' : 'produtos'}`].filter(Boolean).join(' e ');
    const r = await modal({
      titulo: 'Faltam cadastros na tela',
      texto: `A empresa tem ${oQue} salvos que não estão na tela. Salvar assim apaga essa lista da empresa, que vale para todos os meses.`,
      botoes: [['cancelar', 'Cancelar'], ['apagar', 'Apagar e salvar'], ['manter', 'Manter os salvos', 'prim']], padrao: 'manter'
    });
    if(r.botao === 'cancelar'){ render(); return; }
    if(r.botao === 'manter'){
      if(faltaParc) S.cadeia = JSON.parse(JSON.stringify(salvas.cadeia));
      if(faltaProd) S.produtos = JSON.parse(JSON.stringify(salvas.produtos));
      render(); return salvarBanco(forcar);
    }
    apagarListas = true;
  }
  banco.salvando = true; banco.erro = ''; atualizarBarra();
  try{
    // p_resumo: os números do mês, para a herança e para a aba Anual. Banco ainda sem a migração
    // recusa o parâmetro — nesse caso salva sem ele e não tenta de novo nesta sessão.
    const corpo = {p_empresa_id: banco.empresaId, p_periodo: banco.periodo, p_dados: dados,
                   p_parceiros: parceiros, p_base: forcar ? null : banco.base};
    // o catálogo vai para a tabela da empresa e continua no estado do mês, que é o que vale
    // enquanto o banco não tiver a migração
    if(!banco.semResumo){ corpo.p_resumo = resumoDe(S); corpo.p_produtos = dados.produtos || []; }
    if(apagarListas) corpo.p_apagar_listas = true;
    try { banco.base = await sb('rpc/salvar_painel', {metodo: 'POST', corpo}); }
    catch(err){
      // CONFLITO também é 400, e antes caía aqui: o painel achava que o banco era antigo e parava de enviar o catálogo
      // pelo resto da sessão. Conflito vai direto para a janela de conflito.
      if(err.message === 'CONFLITO' || !(err.status === 404 || err.status === 400)) throw err;
      if(corpo.p_apagar_listas){                     // banco sem a migração de 16/09/2026: lá a lista vazia já apaga
        delete corpo.p_apagar_listas;
        banco.base = await sb('rpc/salvar_painel', {metodo: 'POST', corpo});
      } else {
        if(banco.semResumo) throw err;
        banco.semResumo = true; delete corpo.p_resumo; delete corpo.p_produtos;
        banco.base = await sb('rpc/salvar_painel', {metodo: 'POST', corpo});
      }
    }
    banco.instantaneo = enviado; banco.salvoEm = new Date(); banco.salvando = false;
    banco.listas = {cadeia: JSON.parse(JSON.stringify(S.cadeia || {fornecedores: [], clientes: []})),
                    produtos: JSON.parse(JSON.stringify(S.produtos || []))};
    const mesNovo = !banco.meses.includes(banco.periodo);
    if(mesNovo) banco.meses = banco.meses.concat(banco.periodo).sort().reverse();
    const emp = banco.empresas.find(e => e.id === banco.empresaId), nome = String(S.co || '').trim();
    const renomeou = !!(emp && nome && emp.nome !== nome);
    if(renomeou){ emp.nome = nome; banco.empresas.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')); }
    if(mesNovo || renomeou){ const foco = document.activeElement && document.activeElement.id; render(); if(foco) focar('#' + foco); }
    else atualizarBarra();
    toast('Salvo no banco de dados');
  }catch(e){
    banco.salvando = false;
    if(e.message === 'CONFLITO'){ atualizarBarra(); return resolverConflito(); }
    if(e.status === 401){
      banco.aposLogin = () => salvarBanco(forcar);
      banco.msgLogin = 'Sua sessão expirou. Entre de novo — o que você preencheu continua aqui.';
      render(); return;
    }
    banco.erro = e.message; atualizarBarra();
    toast('Não foi possível salvar: ' + e.message);
  }
}
async function resolverConflito(){
  const r = await modal({
    titulo: 'Outra pessoa salvou este mês',
    texto: `${S.co} · ${mesCurto(banco.periodo)} foi salvo por outra pessoa depois que você abriu. O que fazer com as suas alterações?`,
    botoes: [['sobrescrever', 'Salvar as minhas por cima'], ['recarregar', 'Descartar e abrir a versão salva'], ['cancelar', 'Cancelar', 'prim']],
    padrao: 'cancelar'
  });
  if(r.botao === 'sobrescrever') return salvarBanco(true);
  if(r.botao === 'recarregar') return comErro(() => abrirMes(banco.empresaId, banco.periodo));
}
async function podeSair(){
  if(!sujo()) return true;
  const r = await modal({
    titulo: 'Alterações não salvas',
    texto: `Há alterações em ${S.co} · ${mesCurto(banco.periodo)} que ainda não foram salvas.`,
    botoes: [['salvar', 'Salvar e continuar', 'prim'], ['descartar', 'Descartar'], ['cancelar', 'Cancelar']],
    padrao: 'salvar'
  });
  if(r.botao === 'salvar'){ await salvarBanco(); return !sujo(); }
  return r.botao === 'descartar';
}
async function trocar(tipo, valor){
  if(valor === '__nova__'){ render(); return comErro(tipo === 'empresa' ? novaEmpresa : novoMes); }
  if(!(await podeSair())){ render(); return; }
  // sem isto a tela congela até o banco responder, e parece que o clique não pegou
  ocupado(true); ui.animarTela = true;
  try { await comErro(() => tipo === 'empresa' ? abrirEmpresa(valor) : abrirMes(banco.empresaId, valor)); }
  finally { ocupado(false); ui.animarTela = false; }
}
async function novaEmpresa(){
  if(!(await podeSair())){ render(); return; }
  const primeira = !banco.empresas.length;
  let valores = {nome: '', cnpj: '', periodo: mesBarra(periodoAtual())};
  let erro = '';
  for(;;){
    const r = await modal({
      titulo: primeira ? 'Cadastre a primeira empresa' : 'Nova empresa',
      texto: 'A empresa começa com categorias genéricas, as alíquotas padrão e os valores zerados.',
      campos: [['nome', 'Nome da empresa', valores.nome], ['cnpj', 'CNPJ (opcional)', valores.cnpj], ['periodo', 'Competência (mês/ano)', valores.periodo]],
      erro, botoes: [['cancelar', 'Cancelar'], ['criar', 'Cadastrar e salvar', 'prim']], padrao: 'criar'
    });
    if(r.botao !== 'criar'){ render(); return; }
    valores = r.valores;
    const nome = (valores.nome || '').trim(), cnpj = limpaCnpj(valores.cnpj), periodo = lerPeriodo(valores.periodo);
    erro = !nome ? 'Informe o nome da empresa.'
      : cnpj && !cnpjValido(cnpj) ? 'CNPJ inválido — confira os números.'
      : !periodo ? 'Competência inválida — use mês/ano, por exemplo 12/2025.' : '';
    if(erro) continue;
    try{
      const [empresa] = await sb('empresas?select=id,nome,cnpj', {metodo: 'POST', corpo: {nome, cnpj: cnpj || null}, prefer: 'return=representation'});
      banco.empresas = banco.empresas.concat(empresa).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      banco.meses = [];
      return abrirMes(empresa.id, periodo);
    }catch(e){
      if(e.status === 401) throw e;
      erro = e.status === 409 ? 'Já existe uma empresa com esse CNPJ.' : 'Não foi possível cadastrar: ' + e.message;
    }
  }
}
async function novoMes(){
  if(!banco.empresaId) return novaEmpresa();
  if(!(await podeSair())){ render(); return; }
  let valor = mesBarra(banco.meses.length ? proximoMes(banco.meses[0]) : periodoAtual()), erro = '';
  let h = Object.assign({}, HERANCA);
  for(;;){
    const r = await modal({
      titulo: 'Novo mês',
      texto: 'Começa com as categorias, as alíquotas e a cadeia de crédito do mês salvo mais próximo, com os valores zerados. Se o mês já existir, ele é aberto.',
      campos: [['periodo', 'Competência (mês/ano)', valor]],
      caixas: [
        ['saldo', 'Saldo credor da CBS', h.saldo, 'o "CBS Crédito" que sobrou no mês anterior vira crédito inicial deste'],
        ['rbt12', 'Receita dos últimos 12 meses', h.rbt12, 'somada pelos meses já salvos desta empresa; confira no PGDAS'],
        ['estoque', 'Posição de estoque', h.estoque, 'repete as linhas e os valores do mês anterior, para você ajustar'],
        ['fixas', 'Valores das despesas gerais', h.fixas, 'repete aluguel, contabilidade, folha… em vez de começar zerado']
      ],
      erro, botoes: [['cancelar', 'Cancelar'], ['criar', 'Criar e salvar', 'prim']], padrao: 'criar'
    });
    if(r.botao !== 'criar'){ render(); return; }
    valor = r.valores.periodo;
    h = {saldo: r.valores.saldo === 'on', rbt12: r.valores.rbt12 === 'on',
         estoque: r.valores.estoque === 'on', fixas: r.valores.fixas === 'on'};
    const periodo = lerPeriodo(valor);
    if(!periodo){ erro = 'Competência inválida — use mês/ano, por exemplo 01/2026.'; continue; }
    await listarMeses(banco.empresaId);
    return abrirMes(banco.empresaId, periodo, {heranca: h});
  }
}
async function alterarSenha(){
  let erro = '';
  for(;;){
    const r = await modal({
      titulo: 'Alterar senha',
      texto: `Nova senha para ${banco.sessao.email}. Use pelo menos 8 caracteres.`,
      campos: [['senha', 'Nova senha', '', 'password'], ['confirma', 'Repita a nova senha', '', 'password']],
      erro, botoes: [['cancelar', 'Cancelar'], ['salvar', 'Salvar senha', 'prim']], padrao: 'salvar'
    });
    if(r.botao !== 'salvar') return;
    const senha = r.valores.senha || '';
    erro = senha.length < 8 ? 'A senha precisa ter pelo menos 8 caracteres.'
      : senha !== r.valores.confirma ? 'As duas senhas não são iguais.' : '';
    if(erro) continue;
    try { await sbAuth('user', {password: senha}, await tokenValido(), 'PUT'); toast('Senha alterada'); return; }
    catch(e){ if(e.status === 401) throw e; erro = 'Não foi possível alterar: ' + e.message; }
  }
}
async function sair(){
  if(!(await podeSair())){ render(); return; }
  const token = banco.sessao && banco.sessao.access_token;
  guardarSessao(null);
  try { if(token) await sbAuth('logout', null, token); } catch(e){}
  Object.assign(banco, {empresas: [], meses: [], empresaId: null, periodo: null, base: null, instantaneo: null, erro: '', salvoEm: null, msgLogin: ''});
  S = defaults(); ui.menu = false;
  render();
}

// regra de crédito da despesa: "sem crédito" tira a linha das premissas; passar a ter crédito entra pela alíquota geral
async function aplicarRegra(i, valor, grupo){
  grupo = grupo || 'ga';                             // despesas gerais ou compras do mês
  const r = S.monthly[grupo][i];
  let parte = +valor;
  if(valor === 'outra'){
    const res = await modal({
      titulo: 'Outra regra de crédito', texto: `Quanto do valor de "${r[0]}" dá direito a crédito de CBS.`,
      campos: [['parte', 'Parte com crédito (%)', dec((+r[2] || 0) * 100, 0, 2)]],
      botoes: [['cancelar', 'Cancelar'], ['ok', 'Aplicar', 'prim']], padrao: 'ok'
    });
    if(res.botao !== 'ok'){ render(); focar(`select[data-regra="${grupo}"][data-i="${i}"]`); return; }
    parte = Math.max(0, Math.min(1, num(res.valores.parte) / 100));
  }
  r[2] = parte;
  if(parte === 0) r[3] = 0;
  else if(!((+r[3] || 0) > 0)) r[3] = grupo === 'compras' ? S.monthly.reforma.aliqCompras : S.monthly.reforma.aliqGeral;
  render(); focar(`select[data-regra="${grupo}"][data-i="${i}"]`);
}

/* ---------- eventos ---------- */
const app = document.getElementById('app');
app.addEventListener('focusin', e => {
  if(e.target.dataset && e.target.dataset.premissa === 'geral') alvoGeral = S.monthly.ga.map(r => (r[3] || 0) > 0);
});
app.addEventListener('focusout', e => { if(e.target.dataset && e.target.dataset.premissa === 'geral') alvoGeral = null; });
app.addEventListener('input', e => {
  const t = e.target; if(!t.matches('input[data-b]')) return;
  setPath(t.dataset.b, PARSE[t.dataset.f](t.value));
  if(/^monthly\.reforma\.debitos\.\d+\.1$/.test(t.dataset.b)) sincronizarReceita();   // receita = soma das linhas
  if(t.dataset.premissa) propagar(t.dataset.premissa);
  refresh();
});
app.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('input[data-file="logo"]')){
    const f = t.files && t.files[0]; if(!f) return;
    const rd = new FileReader(); rd.onload = () => { S.logo = rd.result; refresh(); }; rd.readAsDataURL(f);
    return;
  }
  if(t.matches('select[data-banco]')){ trocar(t.dataset.banco, t.value); return; }
  if(t.matches('select[data-tipo]')){
    const r = S.monthly.reforma[t.dataset.g][+t.dataset.i]; r[3] = t.value; r[2] = aliqTipo(r[3]); refresh(); return;
  }
  // produto ou serviço troca os campos da linha (NCM × NBS + cClassTrib): precisa redesenhar, não só recalcular
  if(t.matches('select[data-nat]')){ S.produtos[+t.dataset.i][2] = t.value; render(); return; }
  if(t.matches('select[data-regra]')){ aplicarRegra(+t.dataset.i, t.value, t.dataset.regra); return; }
  if(t.matches('select[data-sit]')){ S.monthly.reforma.debitos[+t.dataset.i][5] = t.value; refresh(); return; }
  // atividade do Presumido troca os campos (ISS, ICMS, percentuais de "outra"): redesenha
  if(t.matches('select[data-atividade]')){ S.presumido.atividade = t.value; render(); return; }
  if(t.matches('select[data-b]')){ setPath(t.dataset.b, t.value); refresh(); return; }
  if(!t.matches('input[data-b]') || t.type === 'color') return;
  if(t.dataset.f === 'txt' && t.dataset.b.startsWith('monthly.reforma') && !t.value.trim()) setPath(t.dataset.b, '(sem nome)');
  t.value = FMT[t.dataset.f](getPath(t.dataset.b));
  refresh();
});
app.addEventListener('keydown', e => {
  const t = e.target;
  if(e.key === 'Enter' && t.matches('input[data-b]')){ e.preventDefault(); t.blur(); return; }
  if(t.matches('[data-file-trigger]') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); t.querySelector('input').click(); return; }
  if(t.matches('.tab') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)){
    e.preventDefault();
    const ordem = ['resultado', 'cliente', 'anual'], n = ordem.length;
    let i = ordem.indexOf(t.dataset.id);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n;
    irPara(ordem[i], true);
  }
});
let tLimpar = null;
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  // apresentação: clicar numa linha destaca; clicar de novo (ou em outro lugar) desfaz
  if(ui.present && !b && !e.target.closest('input, select, textarea, a')) realcar(e.target.closest(LINHAS_REALCE));
  if(!b) return;
  const rf = S.monthly.reforma, g = b.dataset.g, i = +b.dataset.i;
  switch(b.dataset.act){
    case 'tab': irPara(b.dataset.id); if(b.dataset.id === 'anual') garantirAno(); break;
    // da barra compacta a aba nova começa do topo, e não no meio de onde a outra estava
    case 'tab-fixo': irPara(b.dataset.id); if(b.dataset.id === 'anual') garantirAno(); scrollTo(0, 0); break;
    // rolagem suave é JavaScript: a regra de movimento reduzido do CSS não chega aqui, então pergunta de novo
    case 'topo': scrollTo({top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); break;
    case 'ano-atualizar': garantirAno(true); break;
    case 'presumido': ui.presumido = !ui.presumido; render(); focar('[data-act="presumido"]'); break;
    case 'lp-inss': ui.inssBase = !ui.inssBase; render(); focar('[data-act="lp-inss"]'); break;
    case 'lp-cbs': ui.cbsLP = !ui.cbsLP; render(); focar('[data-act="lp-cbs"]'); break;
    case 'lp-periodo': ui.lpMes = b.dataset.p === 'mes'; render(); focar(`[data-act="lp-periodo"][data-p="${b.dataset.p}"]`); break;
    case 'an-cbs': ui.cbsAno = !ui.cbsAno; render(); focar('[data-act="an-cbs"]'); break;
    case 'menu': ui.menu = !ui.menu; ui.armado = false; render(); focar('[data-act="menu"]'); break;
    case 'detalhe': ui.detalhe = !ui.detalhe; render(); focar('[data-act="detalhe"]'); break;
    case 'estoque': ui.estoque = !ui.estoque; render(); focar('[data-act="estoque"]'); break;
    case 'cadastro': { const id = b.dataset.id; ui.cadastro[id] = !ui.cadastro[id]; render(); focar(`[data-act="cadastro"][data-id="${id}"]`); } break;
    case 'memoria': ui.memoria = !ui.memoria; render(); focar('[data-act="memoria"]'); break;
    case 'editar': ui.editando = !ui.editando; ui.menu = false; render();
      toast(ui.editando ? 'Edição ligada — clique nos valores da DRE' : 'Edição desligada'); break;
    case 'personalizar': ui.personalizar = !ui.personalizar; ui.menu = false; render(); break;
    case 'present':
      ui.present = !ui.present; ui.menu = false;
      // a apresentação começa com a maquinaria recolhida (os botões "Ver" continuam); ao sair, a tela volta como estava
      if(ui.present){
        ui.antesDeApresentar = {detalhe: ui.detalhe, memoria: ui.memoria, estoque: ui.estoque, presumido: ui.presumido,
                               cadastro: {...ui.cadastro}};
        Object.assign(ui, {detalhe: false, memoria: false, estoque: false, presumido: false, cadastro: {cadeia: false, produtos: false}});
      } else {
        if(ui.antesDeApresentar) Object.assign(ui, ui.antesDeApresentar);
        ui.antesDeApresentar = null;
        if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
      }
      render(); break;
    case 'tela-cheia':
      if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else document.documentElement.requestFullscreen().catch(() => toast('O navegador não deixou abrir em tela cheia.'));
      break;
    // preferência de quem está olhando, não dado da empresa: fica no navegador, não no estado salvo
    case 'tema': aplicarTema(temaEscuro() ? 'claro' : 'escuro'); guarda.gravar('dre.tema', temaEscuro() ? 'escuro' : null);
      ui.menu = false; render(); focar('[data-act="menu"]'); break;
    case 'print': imprimir(); break;
    case 'salvar': ui.menu = false; render(); salvar(); break;
    case 'salvar-banco': salvarBanco(); break;
    case 'rbt12': comErro(atualizarRbt12); break;
    case 'sair': ui.menu = false; sair(); break;
    case 'senha': ui.menu = false; render(); comErro(alterarSenha); break;
    case 'excluir-mes': ui.menu = false; render(); comErro(excluirMes); break;
    case 'lixeira': ui.menu = false; render(); comErro(abrirLixeira); break;
    case 'historico': ui.menu = false; render(); comErro(abrirHistorico); break;
    // "Restaurar padrão" carrega o exemplo da farmácia: com banco, um salvamento depois gravaria o exemplo na empresa
    // (e renomearia a empresa). Por isso só existe no modo local
    case 'pr-add':
      ui.cadastro.produtos = true;                   // quem adiciona quer ver a tabela
      S.produtos.push(['', 'geral', 'produto', '', '', '']); render();
      { const n = app.querySelector(`input[data-b="produtos.${S.produtos.length - 1}.0"]`); if(n) n.focus(); }
      break;
    case 'pr-rm': S.produtos.splice(i, 1); render(); break;
    case 'baixar': ui.menu = false; render(); baixar(); break;
    case 'restaurar': S = defaults(); ui.menu = false; render(); toast('Padrão restaurado'); break;
    case 'limpar':
      clearTimeout(tLimpar);
      if(!ui.armado){
        ui.armado = true; render(); focar('[data-act="limpar"]');
        toast('Isso zera todos os valores. Clique de novo para confirmar.');
        tLimpar = setTimeout(() => { if(ui.armado){ ui.armado = false; if(ui.menu) render(); } }, 5000);
      } else {
        ui.armado = false; ui.menu = false; S = limparTudo(); render(); toast('Valores zerados — pronto para preencher');
      }
      break;
    case 'add':
      if(g === 'debitos') rf.debitos.push([NOME_RECEITA, 0, rf.aliqGeral, 'geral']);
      else rf.creditos.push(['Novo crédito', 0, aliqTipo('geral'), 'geral']);   // pelo tipo, como as demais
      render();
      { const campo = g === 'debitos' ? '1' : '0';   // receita já entra pelo valor; crédito, pelo nome
        const n = app.querySelector(`input[data-b="monthly.reforma.${g}.${rf[g].length - 1}.${campo}"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm': rf[g].splice(i, 1); if(g === 'debitos') sincronizarReceita(); render(); break;
    case 'add-ga':                                   // despesa nova entra com crédito integral pela alíquota geral
      S.monthly.ga.push(['Nova despesa', 0, 1, rf.aliqGeral]); render();
      { const n = app.querySelector(`input[data-b="monthly.ga.${S.monthly.ga.length - 1}.0"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm-ga': S.monthly.ga.splice(i, 1); render(); break;
    case 'li-add': {                                 // custos, vendas e tributárias (mês e exercício)
      const cam = b.dataset.lista, lst = getPath(cam);
      lst.push(['', 0]); render();
      const n = app.querySelector(`input[data-b="${cam}.${lst.length - 1}.0"]`); if(n) n.focus();
    } break;
    case 'li-rm': getPath(b.dataset.lista).splice(i, 1); render(); break;
    case 'das-digitar': {                            // passa o DAS calculado para o campo, para conferir ou ajustar
      const l = linhaSimples(S.monthly.tributarias); if(!l || ui.present) break;   // apresentação não altera valores
      l[1] = calcMes().dasBase; render();
      const n = app.querySelector(`input[data-b="monthly.tributarias.${S.monthly.tributarias.indexOf(l)}.1"]`);
      if(n){ n.focus(); n.select(); }
    } break;
    case 'add-es':
      (S.monthly.estoque = S.monthly.estoque || []).push(['Nova linha', 0]); render();
      { const n = app.querySelector(`input[data-b="monthly.estoque.${S.monthly.estoque.length - 1}.0"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm-es': S.monthly.estoque.splice(i, 1); render(); break;
    case 'add-co':                                   // compra nova entra com crédito integral pela alíquota das compras
      S.monthly.compras.push(['Nova compra', 0, 1, rf.aliqCompras || 0]); render();
      { const n = app.querySelector(`input[data-b="monthly.compras.${S.monthly.compras.length - 1}.0"]`); if(n){ n.focus(); n.select(); } }
      break;
    case 'rm-co': S.monthly.compras.splice(i, 1); render(); break;
    case 'logo-padrao': S.logo = null; refresh(); break;
    case 'cadeia': ui.cadeia = b.dataset.id; render(); focar(`[data-act="cadeia"][data-id="${b.dataset.id}"]`); break;
    case 'cad-add':
      ui.cadastro.cadeia = true;                     // quem adiciona quer ver a tabela
      S.cadeia[g].push(['', '', '', '']); render();
      { const n = app.querySelector(`input[data-b="cadeia.${g}.${S.cadeia[g].length - 1}.0"]`); if(n) n.focus(); }
      break;
    case 'cad-rm': S.cadeia[g].splice(i, 1); render(); break;
  }
});
document.addEventListener('click', e => {
  if(ui.menu && !e.target.closest('.menu-wrap')){ ui.menu = false; ui.armado = false; render(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.body.classList.contains('realcando')){ realcar(null); return; }
  if(e.key === 'Escape' && ui.menu){ ui.menu = false; ui.armado = false; render(); focar('[data-act="menu"]'); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && banco.ativo && banco.sessao){ e.preventDefault(); salvarBanco(); }
});
app.addEventListener('submit', async e => {
  if(!e.target.matches('[data-form="login"]')) return;
  e.preventDefault();
  const f = new FormData(e.target), bt = e.target.querySelector('button[type="submit"]');
  bt.disabled = true; bt.textContent = 'Entrando…';
  try { await entrar(String(f.get('email') || '').trim(), String(f.get('senha') || '')); }
  catch(err){
    banco.msgLogin = err.status === 400 ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + err.message;
