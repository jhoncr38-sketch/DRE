<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRE — Painel</title>
<style id="fontes">{{FONTS_CSS}}</style>
<style>
  /* Tokens do handoff "Painel DRE". --fill e --brand são personalizáveis;
     --ink (texto) nunca muda, para uma cor clara escolhida não apagar o texto. */
  :root{
    color-scheme:light;
    --ink:#14161A; --fill:#14161A; --ink-2:#33363B; --ink-3:#4A4D53;
    --muted:#6E7178; --muted-2:#8A8D94; --muted-3:#9A9DA4; --disabled:#B6B8BC;
    --brand:#B3122B; --brand-dark:#7d0c1e; --brand-wash:#FBF3F4;
    --canvas:#EFEEEA; --surface:#FFFFFF; --surface-2:#F8F7F4; --rail:#E3E2DD;
    --line:#E7E5E0; --line-2:#DAD8D2; --line-3:#C7C5BF; --on-fill:#C9CCD2;
    --ok:#1D7A4E;                                 /* CBS crédito: crédito maior que o débito */
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--canvas); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
  [hidden]{display:none !important}
  button{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px}
  .m{font-family:var(--mono)}
  .r{text-align:right}
  h2{margin:0; font-size:18px; font-weight:600; letter-spacing:-.01em}
  h3{margin:0 0 2px; font-size:15px; font-weight:600}
  h4{margin:0 0 8px; font-size:13px; font-weight:600; color:var(--ink)}
  .sub{margin:4px 0 0; font-size:13px; color:var(--muted)}
  .cap{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase}

  .page{padding:28px 24px 64px}
  .wrap{max-width:1140px; margin:0 auto; display:flex; flex-direction:column; gap:24px}

  /* Cabeçalho */
  .top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap}
  .ident{display:flex; align-items:center; gap:14px; min-width:0}
  .logo{height:44px; width:auto; display:block; flex:0 0 auto}
  .co{font-size:17px; font-weight:600; letter-spacing:-.01em}
  .ctx{font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.02em; text-transform:uppercase; margin-top:2px}
  .nav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:100%}
  .rail{display:flex; gap:6px; background:var(--rail); padding:4px; border-radius:2px; max-width:100%; overflow-x:auto; scrollbar-width:none}
  .tab{padding:7px 14px; font:500 13px/1 var(--sans); border:0; border-radius:2px; background:transparent; color:var(--ink-3); cursor:pointer; white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--fill); color:#fff}
  .rail-sep{flex:0 0 1px; background:var(--line-3); margin:4px 1px}
  .btn{padding:10px 13px; font:500 12px/1 var(--sans); background:var(--surface); color:var(--ink); border:1px solid var(--line-2); border-radius:2px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
  .btn:hover{border-color:var(--line-3)}
  .card-h .btn{padding:7px 13px}

  /* Menu de opções */
  .menu-wrap{position:relative}
  .menu{position:absolute; right:0; top:calc(100% + 6px); z-index:30; background:var(--surface); box-shadow:0 0 0 1px var(--line-2); min-width:240px; padding:6px 0; display:flex; flex-direction:column}
  .menu button{display:flex; justify-content:space-between; align-items:baseline; gap:12px; width:100%; text-align:left; padding:9px 14px; border:0; background:transparent; font-size:13px; cursor:pointer}
  .menu button:hover{background:var(--surface-2)}
  .menu button.armed{background:var(--fill); color:#fff}
  .menu .chk{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2)}
  .menu .sep{height:1px; background:var(--line); margin:6px 0}

  /* Personalizar */
  .panel{background:var(--surface); padding:22px 26px}
  .panel-h{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px}
  .fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr)); gap:18px 28px}
  .field{display:flex; flex-direction:column; gap:4px; min-width:0}
  .field > span{font-size:11px; color:var(--muted)}
  .swatches{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .sw{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3)}
  .sw input[type=color]{width:34px; height:26px; padding:0; border:1px solid var(--line-2); border-radius:2px; background:none; cursor:pointer}

  /* Faixa de indicadores */
  .hero{display:grid; grid-template-columns:minmax(0,1fr); gap:16px}
  .hero-side{display:grid; grid-auto-rows:1fr; gap:1px; background:var(--line-2); min-width:0}
  .hero-row{background:var(--surface-2); padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:4px 16px; flex-wrap:wrap}
  .hero-row .lbl{font-size:13px; color:var(--ink-3)}
  .hero-row .suf{font-size:11px; color:var(--muted-2)}
  .hero-row .val{font-family:var(--mono); font-size:16px; font-weight:600; white-space:nowrap; margin-left:auto}
  .hero-row.cbs{border-left:3px solid var(--brand)}
  .hero-row.cbs .val{color:var(--brand)}
  .hero-row.cbs.credito{border-left-color:var(--ok)}
  .hero-row.cbs.credito .val{color:var(--ok)}
  .pct-s{color:var(--muted-2); font-size:12px; font-weight:400}

  /* DRE */
  .card{background:var(--surface); padding:28px 30px 22px; min-width:0}
  .card-h{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; margin-bottom:20px}
  .dl{display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:11px 0; border-top:1px solid var(--line)}
  .dl .l{font-size:14px; min-width:0}
  .dl .v{font-family:var(--mono); font-size:15px; white-space:nowrap; display:flex; align-items:baseline; justify-content:flex-end}
  .p{color:var(--muted-2); font-size:12px; font-weight:400; display:inline-block; width:52px; flex:0 0 52px; text-align:right}
  .tag-src{font-weight:400; color:var(--muted-2); font-size:12px; font-family:var(--mono)}
  .dl.rec{border-top-color:var(--ink); padding:12px 0}
  .dl.rec .l{font-size:15px; font-weight:600}
  .dl.rec .v{font-size:17px; font-weight:600}
  .dl.tot{padding:14px 0 11px}
  .dl.tot .l{font-size:15px; font-weight:600}
  .dl.tot .v{font-size:16px; font-weight:600}
  .dl.gross{background:var(--brand-wash); margin:0 -12px; padding:12px}
  .dl.gross .l, .dl.gross .v, .dl.gross .p{color:var(--brand)}
  .dl.gross .l{font-size:15px; font-weight:600}
  .dl.gross .v{font-size:16px; font-weight:600}
  .dl.res{background:var(--fill); color:#fff; margin:8px -16px 0; padding:14px 16px; border:0; align-items:center}
  .dl.res .l{font-size:15px; font-weight:600}
  .dl.res .v{font-size:19px; font-weight:600}
  .dl.res .p{color:var(--muted-3); font-size:13px}
  .det{background:var(--surface-2); padding:6px 14px 10px; margin-bottom:4px}
  .scroll-x{overflow-x:auto}
  .g5{display:grid; grid-template-columns:minmax(0,1fr) 110px 138px 70px 92px; gap:10px; align-items:center}
  .g5 > :nth-child(3){padding-left:14px}                               /* regra afastada do valor à esquerda */
  .g5.gh > span.esq, .grec.gh > span.esq{text-align:left}
  .regra .sel{font-size:12px}
  .regra.sem .sel{color:var(--muted-2)}
  .gr:hover .sel-wrap::after, .gr .sel-wrap:focus-within::after{opacity:1}
  .g4{display:grid; grid-template-columns:minmax(0,1fr) 118px 74px 104px; gap:10px; align-items:center}
  .gh{padding:8px 0 6px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2)}
  .gh > span:not(:first-child){text-align:right}
  .gr{padding:5px 0; border-top:1px solid var(--line); font-size:13px}
  .nm{color:var(--ink-2); min-width:0}
  .cr-v{font-family:var(--mono); font-weight:500; text-align:right; white-space:nowrap}
  .det-foot{display:flex; justify-content:space-between; gap:12px; padding:9px 0 2px; border-top:1px solid var(--ink); margin-top:4px; font-size:12px; font-family:var(--mono)}
  .det-foot span:first-child{color:var(--muted)}
  .det-foot span:last-child{font-weight:600; white-space:nowrap}
  .li{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:5px 0; border-top:1px solid var(--line); font-size:13px}
  .li .v{font-family:var(--mono); white-space:nowrap; display:flex; align-items:baseline}
  .li .p{width:52px; flex-basis:52px}
  .flag{margin-top:18px; background:var(--surface-2); padding:10px 14px; font-size:12px; color:var(--muted); line-height:1.5}

  /* Campos: texto alinhado à coluna, sem caixa */
  .in{width:100%; min-width:0; text-align:right; font-family:var(--mono); font-size:13px; padding:2px 0; border:0; border-bottom:1px solid transparent; border-radius:0; background:transparent; color:var(--ink); outline:none}
  .in:hover{border-bottom-color:var(--line-3)}
  .in:focus, .in:focus-visible{border-bottom-color:var(--brand); outline:none}
  .in.txt{text-align:left; font-family:var(--sans)}
  .in.main{width:78px; font-size:15px; font-weight:600; border-bottom-color:var(--line-3)}
  .in.main:focus{border-bottom-color:var(--brand)}
  .field .in.txt{font-size:14px; border-bottom-color:var(--line-3)}
  .in.val{width:15ch; font-size:inherit; font-weight:inherit; color:inherit}
  .editando .in.val{border-bottom-color:var(--line-3)}
  .present .in{pointer-events:none; border-bottom-color:transparent !important}

  /* Reforma · CBS */
  .reforma{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px; align-items:start}
  .memo{background:var(--surface); padding:26px 28px; min-width:0}
  .prem{background:var(--surface-2); padding:14px 16px; margin:18px 0 22px; display:flex; align-items:flex-end; gap:14px 28px; flex-wrap:wrap}
  .prem-t{display:flex; flex-direction:column; gap:3px; flex:1 1 200px; min-width:0}
  .prem-t .cap{font-size:10px; letter-spacing:.1em; color:var(--muted-2)}
  .prem-t > span:last-child{font-size:12px; color:var(--muted)}
  .prem-f{display:flex; gap:22px; margin-left:auto}
  .prem-f label{display:flex; flex-direction:column; gap:2px}
  .prem-f label > span{font-size:11px; color:var(--muted)}
  .grp{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); padding-bottom:6px; border-bottom:1px solid var(--ink)}
  .memo .card-h{margin-bottom:0}
  .resumo-cbs{margin-top:18px; border-top:1px solid var(--ink)}
  .resumo-cbs .sum{border-bottom:1px solid var(--line)}
  .cr{padding:8px 0; border-bottom:1px solid var(--line); font-size:13px}
  .nmwrap{display:flex; align-items:center; gap:4px; min-width:0}
  .nmcol{display:flex; flex-direction:column; gap:1px; min-width:0}
  .parte{display:flex; align-items:baseline; gap:6px; font-size:11px; color:var(--muted-2)}
  .in.mini{width:44px; flex:0 0 44px; font-size:11px}
  .li .nm{flex:1 1 auto}
  .ink3{color:var(--ink-3)}
  .mut{color:var(--muted-2)}
  .mut12{color:var(--muted-2); font-size:12px}
  .mut11{color:var(--muted-2); font-size:11px}
  /* controles da linha ficam sobrepostos ao fim do nome e só aparecem no hover/foco: não ocupam espaço */
  .nmwrap{position:relative}
  .row-ctl{position:absolute; right:0; top:50%; transform:translateY(-50%); display:inline-flex; align-items:center;
    background:var(--surface); padding-left:6px; opacity:0; pointer-events:none; transition:opacity .15s}
  .cr:hover .row-ctl, .cr:focus-within .row-ctl, .editando .row-ctl{opacity:1; pointer-events:auto}
  @media (hover:none){ .row-ctl{opacity:1; pointer-events:auto} }
  .chip{border:0; background:transparent; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); padding:2px 4px; cursor:pointer; white-space:nowrap}
  .chip:hover, .x:hover{color:var(--ink)}
  /* tipo de alíquota da linha: seletor com cara de etiqueta */
  .chip-sel{appearance:none; -webkit-appearance:none; border:0; border-radius:0; background:transparent; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); padding:2px 4px; cursor:pointer; outline:none}
  .chip-sel:hover, .chip-sel:focus{color:var(--ink)}
  .chip-sel option{text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:13px; color:var(--ink)}
  .x{border:0; background:transparent; color:var(--muted-2); cursor:pointer; font-size:15px; line-height:1; padding:0 4px}
  .add{border:0; background:transparent; color:var(--muted); font-size:12px; padding:8px 0 2px; cursor:pointer}
  .add:hover{color:var(--ink); text-decoration:underline}
  .present .row-ctl, .present .add{display:none !important}
  .sum{display:flex; justify-content:space-between; gap:12px; padding:10px 0; font-size:14px}
  .sum span:first-child{font-weight:600}
  .sum span:last-child{font-family:var(--mono); font-weight:600; white-space:nowrap}
  .sum.deb{padding-bottom:18px}
  .sum.credor{padding-top:0; font-size:13px}
  .sum.credor span{font-weight:400 !important; color:var(--ink-3)}
  .total{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; margin:8px -16px -6px; background:var(--brand); color:#fff}
  .total > span:first-child{font-size:15px; font-weight:600}
  .total > span:last-child{font-family:var(--mono); font-size:19px; font-weight:600; white-space:nowrap}
  .total.credito{background:var(--ok)}
  .total .suf{margin-left:8px; font-size:12px; font-weight:400; color:rgba(255,255,255,.8)}
  .side{display:flex; flex-direction:column; gap:16px; min-width:0}
  .chart{background:var(--surface); padding:24px 26px}
  .chart .sub{margin:0 0 18px; font-size:12px}
  .bar{display:flex; flex-direction:column; gap:5px; margin-bottom:14px}
  .bar-h{display:flex; justify-content:space-between; gap:12px; font-size:12px}
  .bar-h > span:first-child{color:var(--ink-3)}
  .bar-h > span:last-child{font-family:var(--mono); font-weight:500; white-space:nowrap}
  .track{height:10px; background:var(--canvas)}
  .fill{height:100%; width:0}
  .c-ink{background:var(--fill)} .c-ink3{background:var(--ink-3)} .c-mut{background:var(--muted-3)} .c-brand{background:var(--brand)} .c-line{background:var(--line-3)}
  .track.empilhada{display:flex}
  .cr-legenda{margin:5px 0 0; font-size:11px; color:var(--muted-2); line-height:1.5}
  .fill.credito{background:var(--ok)}
  .kv.brand.credito{color:var(--ok)}
  .prem2{margin-top:16px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:12px}
  .prem2 label{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12px; color:var(--ink-3)}
  .prem2 label small{display:block; font-size:11px; color:var(--muted-2); margin-top:2px}
  .prem2 .in{width:120px; flex:0 0 120px; font-size:14px; font-weight:600; border-bottom-color:var(--line-3)}
  .prem2 .in:focus{border-bottom-color:var(--brand)}
  .hint{margin:12px 0 0; font-size:11px; color:var(--muted-2); line-height:1.5}

  /* Convencional × Híbrido: números com uma barra empilhada por regime (DAS escuro + CBS em brand) */
  .cmp-l{display:grid; grid-template-columns:minmax(0,1fr) 140px 200px 140px; gap:16px; align-items:baseline; padding:12px 0; border-top:1px solid var(--line)}
  .cmp-h{padding:0 0 7px; border-top:0; border-bottom:1px solid var(--ink); font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2)}
  .cmp-h + .cmp-l{border-top:0}
  .cmp-h > span{text-align:right}
  .cmp-n{display:flex; flex-direction:column; gap:6px; font-size:14px; font-weight:600}
  .cmp-bar{display:flex; height:8px; background:var(--canvas); max-width:320px}
  .cmp-bar > span{display:block; height:100%; width:0}
  .cmp-carga{font-family:var(--sans); font-size:11px; font-weight:400; color:var(--muted-2)}
  .cmp-v{display:flex; flex-direction:column; align-items:flex-end; gap:1px; text-align:right; font-family:var(--mono); font-size:15px; white-space:nowrap}
  .cmp-v small{font-family:var(--sans); font-size:11px; font-weight:400; color:var(--muted-2); white-space:normal}
  .cmp-res.hibrido{background:var(--ok)}
  .cmp-eq{margin:12px 0 0; font-size:12px; color:var(--ink-3); line-height:1.5}

  /* Receita por tipo (detalhamento da receita) e Simples Nacional do mês */
  .grec{display:grid; grid-template-columns:minmax(0,1fr) 124px 170px 156px 100px; gap:10px; align-items:center}
  .grec > :nth-child(3){padding-left:14px}                              /* seletor afastado do número à esquerda */
  .gr:hover .row-ctl, .gr:focus-within .row-ctl, .li:hover .row-ctl, .li:focus-within .row-ctl{opacity:1; pointer-events:auto}
  .seg-prem{display:flex; align-items:flex-end; flex-wrap:wrap; gap:10px 28px; padding:8px 0 12px}
  .seg-campo{display:flex; flex-direction:column; gap:2px; min-width:0}
  .seg-campo > span:first-child{font-size:11px; color:var(--muted)}
  .seg-campo .sel-wrap, .seg-campo .in{width:150px}
  .seg-campo .sel, .seg-campo .in{font-size:14px; font-weight:600; text-align:left; border-bottom-color:var(--line-3)}
  .seg-campo .sel-wrap::after{opacity:1}
  .seg-faixa{font-family:var(--mono); font-size:12px; color:var(--ink-3); padding-bottom:4px}
  /* de onde veio a receita dos 12 meses: quantos meses entraram e o botão de somar de novo */
  /* ao lado da faixa, nunca embaixo do campo: dentro da coluna ela desalinhava os rótulos */
  .seg-nota{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--muted-2); padding-bottom:4px}
  .seg-nota .lk{border:0; background:none; padding:0; font:inherit; color:var(--ink-3); text-decoration:underline; cursor:pointer}
  .seg-nota .lk:hover{color:var(--brand)}
  .present .seg-nota .lk{display:none}
  /* o ano pelos meses salvos: uma linha por competência, com totais */
  .gano{display:grid; grid-template-columns:minmax(64px,.7fr) repeat(5, minmax(74px,1fr)); gap:0 12px; padding:7px 0; border-top:1px solid var(--line); font-size:13px; align-items:baseline; min-width:520px}
  .gano > span:not(:first-child){font-family:var(--mono); text-align:right; white-space:nowrap}
  .gano.gh{border-top:0; padding-bottom:5px; font-size:11px; color:var(--muted)}
  .gano.gh > span:not(:first-child){font-family:var(--sans); font-weight:400}
  .gano.tot{border-top:1px solid var(--line-3); font-weight:600}
  .gano.tot > span:first-child{font-weight:600}
  .ano-acoes{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:16px}
  .ano-acoes .lk{border:0; background:none; padding:0; font:inherit; font-size:12px; color:var(--ink-3); text-decoration:underline; cursor:pointer}
  .ano-acoes .lk:hover{color:var(--brand)}
  .present .ano-acoes{display:none}
  .seg .gr .sel{font-size:12px}
  .cbscol{display:flex; flex-direction:column; gap:1px; min-width:0}
  .cbscol small{font-size:11px; color:var(--muted-2); padding-left:2px}
  .sn .seg-prem{padding:0}
  .sn-l{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--line); font-size:13px}
  .sn-l > span:first-child{color:var(--ink-3)}
  .sn-l .v{font-family:var(--mono); font-weight:600; white-space:nowrap}
  .sn-l .in{width:140px; flex:0 0 140px; font-weight:600; border-bottom-color:var(--line-3)}
  .sn-l small{display:block; margin-top:1px; font-family:var(--sans); font-size:11px; font-weight:400; color:var(--muted-2)}
  .sn-fim{border-top:1px solid var(--ink); font-weight:600}
  .sn-fim > span:first-child{color:var(--ink)}
  .sn-fim .v{display:flex; flex-direction:column; align-items:flex-end; gap:1px}
  .sn-fim .v small{text-align:right}
  .seg-hint{margin:2px 0 6px; font-size:12px; color:var(--ink-3)}

  /* Resumo do cliente */
  .obs-largo{margin-top:32px; max-width:78ch}

  /* Cadeia de crédito (resumo do cliente) — handoff 5.1 */
  .cadeia{margin-top:36px; padding-top:28px; border-top:1px solid var(--line)}
  .cad-h{display:flex; align-items:flex-start; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:20px}

  .sel-wrap::after{content:"▾"; position:absolute; right:2px; font-size:10px; color:var(--muted-2); pointer-events:none; opacity:0; transition:opacity .15s}

  .present .sel{pointer-events:none}

  @media (max-width:900px){ .reforma{grid-template-columns:minmax(0,1fr)} }

    /* grades viram duas linhas: nome em cima, números embaixo */
    /* despesas: nome e regra em cima; valor, alíquota e crédito embaixo */
    .g5{grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr); grid-template-areas:"nome regra regra" "valor aliq cred"; gap:4px 8px}
    .g5 > :nth-child(1){grid-area:nome}
    .g5 > :nth-child(2){grid-area:valor}

    .g5 > :nth-child(5){grid-area:cred}

    .cmp-h > span:first-child{display:none}
    .cmp-v{font-size:13px}
    /* receita por tipo: nome e receita; situação no DAS e tipo da CBS; débito embaixo */
    .grec{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"nome receita" "sit cbs" "deb deb"; gap:4px 10px}
    .grec > :nth-child(1){grid-area:nome}
    .grec > :nth-child(2){grid-area:receita}
    .grec > :nth-child(3){grid-area:sit; padding-left:0}
    .grec > :nth-child(4){grid-area:cbs}
    .grec > :nth-child(5){grid-area:deb; text-align:right}
    .grec.gh{display:none}
    .grec.gr > :nth-child(5)::before{content:"Débito CBS "; font:400 11px var(--sans); color:var(--muted-2)}
    .g4{grid-template-columns:minmax(0,1.2fr) 64px minmax(0,1fr); gap:2px 8px}
    .g4 > :first-child{grid-column:1 / -1}
    /* cadeia de crédito: nome em cima; CNPJ e regime; depois o crédito */
    .cad-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px; grid-template-areas:"nome nome x" "cnpj cnpj cnpj" "regime cred cred"; row-gap:6px; padding:8px 0}
    .cad-row > :nth-child(1){grid-area:cnpj}
    .cad-row > :nth-child(2){grid-area:nome}
    .cad-row > :nth-child(3){grid-area:regime}
    .cad-row > :nth-child(4){grid-area:cred}
    .cad-row > :nth-child(5){grid-area:x}
    .cad-row.gh{display:none}
  }
  @media (max-width:560px){
    .page{padding:20px 16px 48px}
    .tab{padding:7px 10px}
    .tl-long{display:none}
    .logo{height:38px}
    .nav{justify-content:flex-start}
  }
  @media print{
    body{background:#fff}
    .page{padding:0}
    .nav, .panel, .toast, .row-ctl, .add, .card-h .btn{display:none !important}
    .hero, .card, .memo, .chart, .cli{break-inside:avoid}
    .in{border-bottom-color:transparent !important}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  }
</style>

<body>
<div class="page"><div class="wrap" id="app"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>
<script>
const LOGO_DEFAULT = "data:image/png;base64,{{LOGO_B64}}";
// Supabase {url, chave pública}: preenchido no build (scripts/vercel_build.mjs ou gerar_dashboard.py com .env).
// null = modo local: o painel funciona, mas não salva no banco.
const SUPABASE = /*SUPABASE_CONFIG*/null;
const SCHEMA = 6;

/* ---------- dados iniciais (DRE do cliente) ---------- */
function defaults(){ return {
  v: SCHEMA,
  fill: "#14161A", brand: "#B3122B",
  co: "Aragão Produtos Farmacêuticos",
  mesLabel: "Dezembro 2025",
  anoLabel: "Exercício anual",
  footer: "Alexandre Araújo — Consultoria & Contabilidade",
  logo: null,                                   // null = logo padrão do escritório
  anexo: "I",                                   // anexo do Simples Nacional (I a V): dado da empresa, passa de um mês para o outro
  // cadeia de crédito: [CNPJ, nome, regime, gera crédito ('sim' | 'parcial' | 'nao' | '')] — começa vazia
  cadeia: { fornecedores: [], clientes: [] },
  annual: {
    receita: 1187289.06,
    custos: [["Custo de medicamentos, produtos e outros",696475.30],["Produtos vencidos",3160.96]],
    ga: [["Retirada de sócio / Plano",19031.85],["Funcionários",160841.13],["Aluguel",32400],["Seguro",1385.85],
         ["Telefone / Internet",815],["Energia",20707.37],["Cagece",3396.07],["Contabilidade",15300],
         ["Corpvs Segurança",1809.03],["Taxa de banco e cartões",10171.97],["Sistema",17790.53],
         ["Manutenção, Dedetização, Equipamentos",240],["Fatura Cartão",23592.58],["Outras despesas",691.50]],
    vendas: [["Acessórios / conserto veículo / revisão",96]],
    tributarias: [["Simples Nacional",60625.84],["INSS",8249.04],["FGTS",16118.12],["SEFAZ",2869.60],
         ["Taxas e Impostos Diversos - Cartório Aguiar",14125.77],["Parcelamento Simples",1126.20],["IPTU",773.87],
         ["Conselho Regional de Farmácia",2051.69],["Novo Parcelamento Simples e-CAC",1539.39],
         ["Novo Parcelamento Previdência",511.76],["Novo Parcelamento PGFN",1025.34]],
    resultadoInformado: 81289.32,
    compraMercadoria: 721324.99
  },
  monthly: {
    receita: 106419.89,
    rbt12: 1179636.95,                          // receita bruta dos 12 meses anteriores (faixa do Simples)
    custos: [["Custo de vendas de produtos / outros",58039.60]],
    // [item, valor, % da base com direito a crédito, alíquota CBS]
    ga: [["Retirada de sócio",0,0,0],["HapVida",804.29,0,0],["Folha",12346.56,0,0],
         ["Aluguel",2700,0.30,0.08],["Seguro",125.87,1,0.08],["Telefone / Internet",151.26,1,0.08],
         ["Energia / Cagece",1946.13,1,0.08],["Contabilidade",2100,0.70,0.08],["Corpvs Segurança",152.84,1,0.08],
         ["Taxa de banco e cartões",2537.14,1,0.08],["Sistema",800,1,0.08],
         ["Manutenção, dedetização, equipamentos",5,1,0.08],["Outras despesas",181,0,0]],
    vendas: [],
    tributarias: [["Simples Nacional",4889.93],["INSS",986.67],["FGTS",987.19],["SEFAZ",678.16]],
    compraMercadoria: 62239.31,
    reforma: {
      aliqGeral: 0.08, aliqReduzida: 0.032,
      aliqCompras: 0.09,                        // crédito sobre as compras do mês; não segue as premissas
      cbsSobreEfetiva: 0.1533,                  // parcela da CBS dentro do Simples (README, pendência 3)
      // [nome, receita, alíquota, tipo, —, situação no DAS]: a receita declarada do mês é a soma destas linhas.
      // O tipo diz a alíquota da CBS por fora ('geral' | 'red30' | 'reduzida' | 'red70' | 'zero') e a situação
      // ('' | 'st' | 'mono' | 'stmono' | 'iss') ajusta o DAS.
      debitos: [["Receita PGDAS",106419.89,0.08,"geral"]],
      // créditos adicionados saem das compras do mês; 5º item opcional: parte das compras (base = compras × parte)
      creditos: [],
      saldoCredorAnterior: 0
    },
    // posição de estoque e pagamentos: [descrição, valor]
    estoque: [["Inventário 25/11/2025 — custo total",211166.93],["Inventário 25/11/2025 — preço total",569370.33],
              ["Estoque atualizado 26/11/2025 — custo total",177250.29],["Estoque atualizado 26/11/2025 — preço total",453222.22],
              ["Pagamento a fornecedor até dezembro",506100.89]],
    ibs: 0
  }
};}

/* ---------- estado salvo: migração do modelo antigo e mescla profunda ---------- */
const isObj = o => !!o && typeof o === 'object' && !Array.isArray(o);
function mesclar(base, extra){
  if(extra === undefined || extra === null) return base;
  if(isObj(base) && isObj(extra)){
    const out = Object.assign({}, base);
    for(const k in extra) out[k] = mesclar(base[k], extra[k]);
    return out;
  }
  return extra;
}
function migrar(s){
  if(!isObj(s)) return null;
  s = JSON.parse(JSON.stringify(s));
  if((s.v || 1) < 2){
    // v1: tema/cores antigos saem; débitos e créditos ganham o tipo da premissa
    delete s.theme; delete s.ink; delete s.accent; delete s.sub;
    const rf = (s.monthly && s.monthly.reforma) || {};
    const geral = rf.creditoGeralAliq != null ? rf.creditoGeralAliq : 0.08;
    const conv = arr => Array.isArray(arr)
      ? arr.map(r => [r[0], r[1] || 0, r[2] || 0, (r[2] || 0) > 0 && (r[2] || 0) < geral ? 'reduzida' : 'geral'])
      : undefined;
    const debitos = conv(rf.debitos), creditos = conv(rf.creditosCompra);
    const red = (debitos || []).concat(creditos || []).find(r => r[3] === 'reduzida');
    if(s.monthly){
      const mm = s.monthly;
      mm.reforma = { aliqGeral: geral, aliqReduzida: red ? red[2] : undefined,
        cbsSobreEfetiva: rf.cbsSobreEfetiva, debitos, creditos, saldoCredorAnterior: rf.saldoCredorAnterior };
      // v1 guardava estoque em campos soltos; sem eles, a lista fica vazia (não herda os números do padrão)
      mm.estoque = [['Estoque atualizado — custo total', mm.estoqueCusto], ['Estoque atualizado — preço total', mm.estoquePreco],
        ['Pagamento a fornecedor', mm.fornecedor]].filter(r => r[1] != null);
      delete mm.estoqueCusto; delete mm.estoquePreco; delete mm.fornecedor; delete mm.rbt12;
    }
    if(s.logo === LOGO_DEFAULT) s.logo = null;
    s.v = 2;
  }
  if(s.v < 3){
    // antes da v3 não havia crédito direto sobre as compras: começa zerado para não somar em cima dos créditos já lançados
    if(s.monthly && s.monthly.reforma && s.monthly.reforma.aliqCompras == null) s.monthly.reforma.aliqCompras = 0;
    s.v = 3;
  }
  if(s.v < 4){
    // anexo e receita dos 12 meses (v4): arquivo antigo não herda os do cliente de exemplo e segue com a parcela informada
    if(s.anexo == null) s.anexo = '';
    if(s.monthly && s.monthly.rbt12 == null) s.monthly.rbt12 = 0;
    s.v = 4;
  }
  if(s.v < 5){
    // até a v4 uma linha puxava o que sobrava da receita declarada; agora a receita é a soma das linhas
    const mm = s.monthly, rf = mm && mm.reforma;
    if(rf && Array.isArray(rf.debitos)){
      const fixas = rf.debitos.reduce((a, r) => a + (r[4] === 'pgdas' ? 0 : (r[1] || 0)), 0);
      const nPg = rf.debitos.filter(r => r[4] === 'pgdas').length;
      const resto = Math.max(0, (mm.receita || 0) - fixas) / (nPg || 1);
      rf.debitos.forEach(r => { if(r[4] === 'pgdas'){ r[1] = resto; r[4] = null; } });
      if(rf.debitos.length) mm.receita = rf.debitos.reduce((a, r) => a + (r[1] || 0), 0);
    }
    s.v = 5;
  }
  if(s.v < 6){
    // v6: a alíquota da receita deixa de ser campo e passa a sair do tipo. Quem acerta a linha é
    // normalizarDebitos(), aplicado em todo carregamento — inclusive em mês já salvo nesta versão.
    s.v = 6;
  }
  return s;
}

/* ---------- formatação e leitura de números (pt-BR) ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(s){                                // vírgula = decimal; sem vírgula, ponto = decimal
  if(typeof s === 'number') return s;
  let t = String(s).replace(/[^\d,.-]/g, '');
  t = t.indexOf(',') >= 0 ? t.replace(/\./g, '').replace(',', '.') : t;
  const v = parseFloat(t);
  return isNaN(v) ? 0 : v;
}
const zero = v => Math.abs(v) < 0.005 ? 0 : v;
const dec = (v, min, max) => zero(v).toLocaleString('pt-BR', {minimumFractionDigits:min, maximumFractionDigits:max});
const brl = v => 'R$ ' + dec(v, 2, 2);
const pct = v => dec(Math.abs(v) < 0.05 ? 0 : v, 1, 1) + '%';          // v em pontos percentuais
const FMT = {                                   // estado -> texto do campo
  brl:  v => brl(+v || 0),
  base: v => dec(+v || 0, 2, 2),
  pct:  v => dec((+v || 0) * 100, 2, 2) + '%',
  pct0: v => dec((+v || 0) * 100, 0, 2) + '%',
  txt:  v => v == null ? '' : String(v),
  cnpj: v => fmtCnpj(v)
};
const PARSE = { brl:num, base:num, pct: s => num(s) / 100, pct0: s => num(s) / 100, txt: s => s, cnpj: s => limpaCnpj(s) };
// CNPJ numérico ou alfanumérico (RFB, a partir de jul/2026): 12 posições A-Z/0-9 + 2 dígitos verificadores
const limpaCnpj = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 14);
const fmtCnpj = v => { const s = limpaCnpj(v); return s.length === 14 ? s.replace(/^(.{2})(.{3})(.{3})(.{4})(.{2})$/, '$1.$2.$3/$4-$5') : s; };
function cnpjValido(v){
  const s = limpaCnpj(v);
  if(!/^[0-9A-Z]{12}[0-9]{2}$/.test(s) || /^(.)\1{13}$/.test(s)) return false;
  const dv = base => {                            // pesos 2..9 da direita para a esquerda; valor = código ASCII − 48
    let soma = 0, peso = 2;
    for(let i = base.length - 1; i >= 0; i--){ soma += (base.charCodeAt(i) - 48) * peso; peso = peso === 9 ? 2 : peso + 1; }
    const r = soma % 11; return r < 2 ? 0 : 11 - r;
  };
  const d1 = dv(s.slice(0, 12)), d2 = dv(s.slice(0, 12) + d1);
  return s.slice(12) === `${d1}${d2}`;
}
function getPath(p){ return p.split('.').reduce((o, k) => o == null ? undefined : o[k], S); }
function setPath(p, v){ const ks = p.split('.'); let o = S; for(let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }
function competencia(lbl){
  const s = String(lbl || '').trim(), ano = (s.match(/\d{4}/) || [''])[0];
  const mes = s.replace(/\d{4}/, '').trim().slice(0, 3).toLowerCase();
  return mes && ano ? `${mes}/${ano}` : s.toLowerCase();
}
function hex(h){ h = String(h || '').replace('#', ''); if(h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16); return h.length !== 6 || isNaN(n) ? null : [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t){ const pa = hex(a), pb = hex(b); if(!pa || !pb) return a;
  return '#' + pa.map((x, i) => Math.round(x + (pb[i] - x) * t).toString(16).padStart(2, '0')).join(''); }

/* ---------- cálculo ---------- */
const soma = arr => (arr || []).reduce((a, r) => a + (+r[1] || 0), 0);
const linhaSimples = trib => (trib || []).find(r => /^simples nacional/i.test(r[0])) || (trib || [])[0];
const credLinha = r => (r[1] || 0) * (r[2] || 0) * (r[3] || 0);   // valor × % base × alíquota
const parteCompras = r => typeof r[4] === 'number' ? r[4] : null;
const baseLinha = r => parteCompras(r) !== null ? (S.monthly.compraMercadoria || 0) * r[4] : (r[1] || 0);
const valorCbs = r => baseLinha(r) * (r[2] || 0);                  // base × alíquota (créditos)
// a receita declarada do mês é a soma das linhas de receita (cada uma com a sua situação no DAS)
const somaDebitos = () => S.monthly.reforma.debitos.reduce((a, r) => a + (+r[1] || 0), 0);
function sincronizarReceita(){ S.monthly.receita = somaDebitos(); }

function calcMes(){
  const m = S.monthly, rf = m.reforma, R = somaDebitos();
  const custos = soma(m.custos), ga = soma(m.ga), vendas = soma(m.vendas), trib = soma(m.tributarias);
  const lucroBruto = R - custos, resultado = lucroBruto - ga - vendas - trib;
  const creditoGeral = m.ga.reduce((a, r) => a + credLinha(r), 0);
  const baseDespesas = m.ga.reduce((a, r) => a + ((r[3] || 0) > 0 ? (r[1] || 0) * (r[2] || 0) : 0), 0);
  const debitoTotal = rf.debitos.reduce((a, r) => a + (+r[1] || 0) * (r[2] || 0), 0);
  const saldoAnterior = rf.saldoCredorAnterior || 0;
  const compras = m.compraMercadoria || 0;
  const outrasCompras = rf.creditos.reduce((a, r) => a + baseLinha(r), 0);   // linhas de crédito saem das compras
  const baseCompras = Math.max(0, compras - outrasCompras);
  const creditoCompras = baseCompras * (rf.aliqCompras || 0);
  const creditoTotal = rf.creditos.reduce((a, r) => a + valorCbs(r), 0) + creditoGeral + creditoCompras + saldoAnterior;
  const cbsPagar = Math.max(0, debitoTotal - creditoTotal);          // nunca negativo
  const saldoCredor = Math.max(0, creditoTotal - debitoTotal);       // excedente vai para o mês seguinte
  const ls = linhaSimples(m.tributarias), simples = ls ? (ls[1] || 0) : 0;
  const efetiva = R > 0 ? simples / R * 100 : 0;                     // Simples pago ÷ receita
  // CBS dentro do DAS: pela receita por tipo quando há anexo e receita dos 12 meses; sem eles, a parcela informada
  const seg = segregacao();
  const pelaTabela = !!(seg && !seg.excluida && seg.das > 0.004);
  const parcela = pelaTabela ? seg.cbs / seg.das : (rf.cbsSobreEfetiva || 0);
  // enquanto o DAS declarado estiver zerado, a comparação usa o DAS que sai da receita por tipo
  const dasCalculado = pelaTabela ? seg.das : 0;
  const dasBase = simples > 0.004 ? simples : dasCalculado;
  const semDeclarado = simples <= 0.004 && dasBase > 0.004;
  const parcelaCbs = dasBase * parcela;                              // a CBS é uma fatia do DAS
  const simplesSemCbs = dasBase - parcelaCbs;
  const ibs = m.ibs || 0;
  const naTransicao = simplesSemCbs + cbsPagar + ibs;
  // equilíbrio: a CBS por fora empata com hoje quando custa o mesmo que a parcela da CBS no Simples (menos o IBS informado).
  // faltaCredito > 0: falta crédito para empatar; < 0: folga; null: nem com a CBS zerada empata
  const limite = parcelaCbs - ibs;
  const faltaCredito = limite > 0.004 ? (debitoTotal - limite) - creditoTotal : null;
  return {R, custos, ga, vendas, trib, lucroBruto, resultado, creditoGeral, baseDespesas, debitoTotal,
    saldoAnterior, creditoTotal, cbsPagar, saldoCredor, simples, efetiva, seg, pelaTabela, parcela, parcelaCbs, simplesSemCbs, ibs,
    dasCalculado, dasBase, semDeclarado, naTransicao, delta: naTransicao - dasBase, faltaCredito, compras, baseCompras, creditoCompras,
    excessoCompras: Math.max(0, outrasCompras - compras)};
}

// Resumo do mês, gravado junto com o estado: é daqui que o mês seguinte herda o saldo credor e
// que a aba Anual soma o exercício, sem precisar baixar o estado inteiro de cada competência.
function comEstado(st, fn){ const ant = S; S = st; try { return fn(); } finally { S = ant; } }
function resumoDe(st){
  return comEstado(st, () => {
    const c = calcMes(), sg = c.seg;
    return {receita: c.R, das: c.dasBase, simples: c.simples, cbs: c.cbsPagar, saldoCredor: c.saldoCredor,
      resultado: c.resultado, custos: c.custos, ga: c.ga, vendas: c.vendas, trib: c.trib, compras: c.compras,
      naTransicao: c.naTransicao, efetiva: c.R ? c.dasBase / c.R : 0,
      rbt12: +st.monthly.rbt12 || 0, anexo: st.anexo || '', faixa: sg && !sg.excluida ? sg.faixa : null};
  });
}
// estado salvo → pronto para calcular (mesma sequência de abrirMes)
function prontoParaCalculo(dados){
  const st = mesclar(defaults(), migrar(dados));
  normalizarDebitos(st.monthly.reforma);
  return st;
}

/* ---------- reforma: tipos de alíquota e regras de crédito (LC 214/2025) ---------- */
// tipo da linha de débito/crédito: a reduzida (−60%) tem premissa própria; cheia, −30%, −70% e zero seguem a alíquota geral
const TIPOS = [['geral', 'Alíquota cheia'], ['red30', 'Redução de 30%'], ['reduzida', 'Redução de 60%'], ['red70', 'Redução de 70%'], ['zero', 'Alíquota zero']];
const FATOR_TIPO = {red30: 0.7, red70: 0.3, zero: 0};
function aliqTipo(tipo){
  const rf = S.monthly.reforma;
  return tipo === 'reduzida' ? rf.aliqReduzida : (tipo in FATOR_TIPO ? FATOR_TIPO[tipo] : 1) * rf.aliqGeral;
}
// A receita não tem alíquota própria: ela sai do tipo da linha. Todo mês carregado passa por aqui, senão
// uma alíquota antiga gravada (ex.: 15,33%, que é a parcela da CBS no DAS) apareceria até trocarem o tipo.
function normalizarDebitos(rf){
  if(!rf || !Array.isArray(rf.debitos)) return;
  rf.debitos.forEach(r => {
    r[2] = r[3] === 'reduzida' ? (rf.aliqReduzida || 0) : ((r[3] in FATOR_TIPO ? FATOR_TIPO[r[3]] : 1) * (rf.aliqGeral || 0));
  });
}
// regra de crédito da despesa = parte do valor que dá direito a crédito (profissões regulamentadas −30%, locação de imóveis −70%)
const REGRAS = [[1, 'Integral'], [0.7, 'Redução de 30%'], [0.4, 'Redução de 60%'], [0.3, 'Redução de 70%'], [0, 'Sem crédito']];

/* ---------- Simples Nacional: faixa e partilha (LC 123/2006; a partir de 2027 com CBS e IBS, LC 214/2025) ---------- */
// faixa: [receita dos 12 meses até, alíquota nominal, parcela a deduzir, ICMS, ISS, PIS+Cofins (até 2026), CBS (2027 em diante)]
// redist: parte do PIS/Cofins (e da CBS) no excedente do ISS acima de 5%
const ANEXOS = {

         [720000, .102, 12420, 0, .40, .24, .2374], [1800000, .14, 39780, 0, .40, .23, .2275],

         [3600000, .23, 62100, 0, .235, .1715, .1696], [4800000, .305, 540000, 0, 0, .20, .1978]]}
};
const LIMITE_SN = 4800000, TETO_ISS = 0.05;
// alíquotas sobre a receita: total do DAS e as partes de ICMS, ISS, PIS/Cofins (CBS a partir de 2027) e a CBS da simulação
function simplesFaixa(anexo, rbt12, ano){
  const A = ANEXOS[anexo];
  if(!A || !(rbt12 > 0)) return null;
  if(rbt12 > LIMITE_SN) return {excluida: true};
  const n = A.faixas.findIndex(x => rbt12 <= x[0]), f = A.faixas[n];
  const ef = x => (rbt12 * x[1] - x[2]) / rbt12;
  const fed = ef(f), loc = n < 5 ? f : A.faixas[4], el = ef(loc);          // 6ª faixa: ICMS e ISS seguem calculados pela 5ª
  const icms = el * loc[3], iss = el * loc[4];
  const excesso = A.redist && iss > TETO_ISS ? iss - TETO_ISS : 0;           // ISS acima de 5% vai para os tributos federais
  const extra = excesso * (A.redist || 0);
  return {faixa: n + 1, sexta: n === 5, total: n < 5 ? fed : fed + icms + iss, icms, iss: iss - excesso,
    pc: fed * (ano >= 2027 ? f[6] : f[5]) + extra, cbs: fed * f[6] + extra};
}
// toda linha de receita é a receita declarada no PGDAS: o que diferencia uma da outra é a situação no DAS
const NOME_RECEITA = 'Receita PGDAS';
// situação da receita no DAS: ICMS-ST tira o ICMS, monofásico tira PIS/Cofins (a CBS, a partir de 2027), ISS retido tira o ISS
const SITUACOES =[['', 'Integral'], ['st', 'ICMS-ST'], ['mono', 'Monofásico'], ['stmono', 'ICMS-ST + monofásico'], ['iss', 'ISS retido']];
const anoCompetencia = () => { const p = lerPeriodo(S.mesLabel); return p ? +p.slice(0, 4) : new Date().getFullYear(); };
// DAS e CBS dentro do DAS de cada linha de receita (as mesmas linhas do débito da CBS)
function segregacao(){
  const f = simplesFaixa(S.anexo, +S.monthly.rbt12 || 0, anoCompetencia());
  if(!f || f.excluida) return f;
  const linhas = S.monthly.reforma.debitos.map(r => {
    const sit = r[5] || '', b = +r[1] || 0, st = sit === 'st' || sit === 'stmono', mono = sit === 'mono' || sit === 'stmono';
    return {das: b * (f.total - (st ? f.icms : 0) - (mono ? f.pc : 0) - (sit === 'iss' ? f.iss : 0)), cbs: mono ? 0 : b * f.cbs};
  });
  return Object.assign(f, {linhas, das: linhas.reduce((a, x) => a + x.das, 0), cbs: linhas.reduce((a, x) => a + x.cbs, 0)});
}

function calcAno(){
  const a = S.annual, R = a.receita || 0;
  const custos = soma(a.custos), ga = soma(a.ga), vendas = soma(a.vendas), trib = soma(a.tributarias);
  const lucroBruto = R - custos, despesas = ga + vendas + trib, calculado = lucroBruto - despesas;
  const resultado = a.resultadoInformado == null ? calculado : a.resultadoInformado;
  const ls = linhaSimples(a.tributarias);
  return {R, custos, ga, vendas, trib, lucroBruto, despesas, calculado, resultado,
    diff: resultado - calculado, simples: ls ? (ls[1] || 0) : 0};
}

/* ---------- premissas: propagam para as linhas ---------- */
let alvoGeral = null;          // linhas de despesa afetadas, fixadas ao entrar no campo
function linhasComCredito(){ return alvoGeral || S.monthly.ga.map(r => (r[3] || 0) > 0); }
function propagar(tipo){
  const rf = S.monthly.reforma, v = tipo === 'reduzida' ? rf.aliqReduzida : rf.aliqGeral;
  if(tipo === 'geral'){ const alvo = linhasComCredito(); S.monthly.ga.forEach((r, i) => { if(alvo[i]) r[3] = v; }); }
  rf.debitos.concat(rf.creditos).forEach(r => { if((r[3] === 'reduzida') === (tipo === 'reduzida')) r[2] = aliqTipo(r[3]); });
}

// Cadeia de crédito — concordância: singular/plural pela contagem; fornecedor "gera crédito", cliente "aproveita o crédito"
function resumoCadeia(lst, forn){
  const n = lst.length;
  if(!n) return 'Quem vende e quem compra da empresa. O regime tributário de cada um define se há direito a crédito na reforma.';
  const conta = v => lst.filter(r => (r[3] || '') === v).length;
  const sim = conta('sim'), parcial = conta('parcial');
  const verbo = q => forn ? (q === 1 ? 'gera' : 'geram') : (q === 1 ? 'aproveita' : 'aproveitam');
  const objeto = forn ? 'crédito de CBS para a empresa' : 'o crédito da CBS';
  const quem = forn ? (n === 1 ? 'fornecedor' : 'fornecedores') : (n === 1 ? 'cliente' : 'clientes');
  let frase = n === 1 ? `${sim} de 1 ${quem} ${verbo(1)} ${objeto}.`
    : sim === n ? `Todos os ${n} ${quem} ${verbo(n)} ${objeto}.`
    : sim === 0 ? `Nenhum dos ${n} ${quem} ${verbo(1)} ${objeto}.`
    : `${sim} dos ${n} ${quem} ${verbo(sim)} ${objeto}.`;
  if(parcial) frase += forn ? ` ${parcial} ${verbo(parcial)} crédito parcial.` : ` ${parcial} ${verbo(parcial)} parcialmente.`;
  return frase + (n === 1 ? ' O regime tributário define o direito ao crédito.' : ' O regime tributário de cada um define o direito ao crédito.');
}
// uma barra por regime (Simples → Presumido → Real → demais), segmentos medidos sobre o total de cadastros
function graficoCadeia(lst, forn){
  const n = lst.length, conta = (arr, v) => arr.filter(r => (r[3] || '') === v).length;
  const ordem = ['Simples Nacional', 'Lucro Presumido', 'Lucro Real'], vistos = lst.map(r => r[2] || '');
  const nomes = ordem.concat(vistos.filter(x => !ordem.includes(x))).filter((x, i, a) => a.indexOf(x) === i && vistos.includes(x));
  const larg = q => (n ? q / n * 100 : 0) + '%';
  const linhas = nomes.map(nome => {
    const grupo = lst.filter(r => (r[2] || '') === nome);
    return `<div class="cg-linha"><div class="bar-h"><span>${esc(nome || 'Regime não informado')}</span><span>${grupo.length}</span></div>` +
      `<div class="cg-trilho" aria-hidden="true"><span class="cg-sim" style="width:${larg(conta(grupo, 'sim'))}"></span>` +
      `<span class="cg-parcial" style="width:${larg(conta(grupo, 'parcial'))}"></span><span class="cg-nao" style="width:${larg(conta(grupo, 'nao'))}"></span></div></div>`;
  }).join('');
  const legenda = [['sim', forn ? 'gera crédito' : 'aproveita o crédito'], ['parcial', forn ? 'gera crédito parcial' : 'aproveita parcialmente'],
    ['nao', forn ? 'não gera' : 'não aproveita'], ['', 'a definir']]
    .filter(([v]) => conta(lst, v) > 0)                            // só aparece o que existe
    .map(([v, rotulo]) => `<span class="cg-item"><span class="cg-q cg-${v || 'def'}"></span>${rotulo}</span>`).join('');
  return linhas + `<div class="cg-legenda">${legenda}</div>`;
}

function textoObservar(c){
  const margem = pct(c.R ? c.resultado / c.R * 100 : 0);
  let t = `A margem líquida do mês foi de ${margem}. `;
  if(c.saldoCredor > 0.004)
    t += `Na transição da reforma, o Simples cai para ${brl(c.simplesSemCbs)} e a CBS apurada em separado fica zerada: os créditos superam os débitos e sobram ${brl(c.saldoCredor)} para o mês seguinte`;
  else
    t += `Na transição da reforma, o Simples cai para ${brl(c.simplesSemCbs)} e a CBS passa a ser apurada em separado, em ${brl(c.cbsPagar)}`;
  t += c.ibs > 0.004
    ? `. Com o IBS informado (${brl(c.ibs)}), somados dão ${brl(c.naTransicao)}, contra ${brl(c.dasBase)} hoje. `
    : ` — somados, ${brl(c.naTransicao)}, contra ${brl(c.dasBase)} hoje. `;
  t += `Os créditos sobre compras e despesas somam ${brl(c.creditoTotal)}.`;
  const eq = textoEquilibrio(c);
  return eq ? `${t} ${eq}` : t;
}
// quanto de crédito separa hoje da CBS por fora — em compras quando há alíquota de compras (o valor em crédito já é o delta)
// hib: na linguagem do quadro Convencional × Híbrido; sem ele, na do resumo do cliente
function textoEquilibrio(c, hib){
  if(!(c.dasBase > 0.004)) return '';
  const [quem, Quem, barato, ref] = hib ? ['o híbrido', 'O híbrido', 'mais barato', 'o convencional']
                                        : ['a apuração separada', 'A apuração separada', 'mais barata', 'hoje'];
  if(c.faltaCredito === null) return `Nem com a CBS zerada ${quem} empataria: o IBS informado já passa a parcela da CBS no Simples.`;
  const aliq = S.monthly.reforma.aliqCompras || 0, v = Math.abs(c.faltaCredito);
  if(v < 0.005) return hib ? '' : 'Hoje e a apuração separada empatam.';
  const quanto = aliq > 0 ? `${brl(v / aliq)} em compras com crédito de ${FMT.pct0(aliq)}` : `${brl(v)} de crédito`;
  return c.faltaCredito > 0
    ? `Para ${quem} empatar com ${ref}, faltariam cerca de ${quanto} no mês.`
    : `${Quem} segue ${barato} que ${ref} mesmo com até ${quanto} a menos no mês.`;
}
// clientes da cadeia: quem aproveita crédito recebe o crédito cheio quando a CBS é apurada por fora
function textoClientesCadeia(){
  const lst = (S.cadeia && S.cadeia.clientes) || [], n = lst.length;
  if(!n) return '';
  const q = lst.filter(r => r[3] === 'sim' || r[3] === 'parcial').length;
  const cheio = q === 1 ? 'ele passa a receber o crédito cheio' : 'eles passam a receber o crédito cheio';
  if(n === 1) return q ? `O cliente cadastrado aproveita crédito da CBS: com a CBS apurada por fora, ${cheio}, e não só a parte paga no Simples.`
                       : 'O cliente cadastrado não aproveita crédito da CBS: para ele, apurar a CBS por fora não muda nada.';
  if(!q) return `Nenhum dos ${n} clientes cadastrados aproveita crédito da CBS: para eles, apurar a CBS por fora não muda nada.`;
  return `${q === n ? `Todos os ${n}` : `${q} dos ${n}`} clientes cadastrados ${q === 1 ? 'aproveita' : 'aproveitam'} crédito da CBS: ` +
    `com a CBS apurada por fora, ${cheio}, e não só a parte paga no Simples.`;
}

/* ---------- saídas: todo texto calculado da tela, por chave ---------- */
function saidas(){
  const cm = calcMes(), ca = calcAno(), m = S.monthly, a = S.annual, rf = m.reforma;
  const O = {}, W = {}, C = {}, V = {}, H = {};                         // H: trechos de HTML sem campos (gráficos)
  const P = (v, R) => pct(R ? v / R * 100 : 0);
  const P2 = (v, R) => dec(R ? v / R * 100 : 0, 2, 2) + '%';          // faixa de indicadores: duas casas
  const larg = (v, max) => (max > 0 ? Math.max(2, Math.max(0, v) / max * 100) : 2) + '%';
  const parte = (v, R) => (R > 0 ? Math.max(0, Math.min(100, v / R * 100)) : 0) + '%';
  const itens = (arr, k, R) => arr.forEach((r, i) => { O[`${k}.${i}.v`] = brl(r[1] || 0); O[`${k}.${i}.p`] = P(r[1] || 0, R); });
  const an = ui.tab === 'anual';

  O.co = S.co || ''; O.footer = S.footer || '';
  O.ctx = 'DRE · ' + (an ? S.anoLabel : S.mesLabel);
  O.comp = an ? 'Valores em reais · ' + String(S.anoLabel || '').toLowerCase()
              : 'Valores em reais · competência ' + competencia(S.mesLabel);

  // mês — DRE
  Object.assign(O, {
    'm.receita': brl(cm.R), 'm.receitaP': pct(cm.R ? 100 : 0),
    'm.custos': brl(cm.custos), 'm.custosP': P(cm.custos, cm.R),
    'm.lucroBruto': brl(cm.lucroBruto), 'm.lucroBrutoP': P(cm.lucroBruto, cm.R),
    'm.ga': brl(cm.ga), 'm.gaP': P(cm.ga, cm.R), 'm.vendas': brl(cm.vendas), 'm.vendasP': P(cm.vendas, cm.R),
    'm.trib': brl(cm.trib), 'm.tribP': P(cm.trib, cm.R),
    'm.resultado': brl(cm.resultado), 'm.margem': P(cm.resultado, cm.R),
    'm.simples': brl(cm.simples), 'm.simplesP': P2(cm.simples, cm.R), 'm.cbsPagar': brl(cm.cbsPagar)
  });
  itens(m.custos, 'm.cu', cm.R); itens(m.vendas, 'm.ve', cm.R); itens(m.tributarias, 'm.tr', cm.R);
  m.ga.forEach((r, i) => { const c = credLinha(r);
    O[`m.ga.${i}.v`] = brl(r[1] || 0); O[`m.ga.${i}.cr`] = brl(c); C[`m.ga.${i}.cr`] = c > 0.004 ? 'var(--ink)' : 'var(--disabled)'; });

  // mês — CBS
  const forn =(S.cadeia && S.cadeia.fornecedores) || [], fq = forn.filter(r => r[3] === 'nao' || r[3] === 'parcial').length;
  Object.assign(O, {
    'm.creditoGeral': brl(cm.creditoGeral), 'm.baseDespesas': brl(cm.baseDespesas),
    'm.debitoTotal': brl(cm.debitoTotal), 'm.creditoTotal': brl(cm.creditoTotal),
    'm.saldoAnt': brl(cm.saldoAnterior), 'm.saldoCredor': brl(cm.saldoCredor),
    'm.linhas': `${linhasComCredito().filter(Boolean).length} de ${m.ga.length} linhas de despesa`,
    'm.lblRed': 'Alíquota reduzida',
    // fornecedores da cadeia que não geram crédito cheio: o crédito das compras pode estar alto
    'm.fornCap': forn.length === 1 ? '1 de 1 fornecedor cadastrado não gera crédito cheio — confira a alíquota'
      : `${fq} dos ${forn.length} fornecedores cadastrados não ${fq === 1 ? 'gera' : 'geram'} crédito cheio — confira a alíquota`
  });
  V['m.temFornCap'] = fq > 0;
  V['m.temCredor'] = cm.saldoCredor > 0.004;
  rf.creditos.forEach((r, i) => { O[`m.cred.${i}.base`] = FMT.base(baseLinha(r)); });
  O['m.compraCred'] = brl(cm.creditoCompras);
  V['m.compraCap'] = rf.creditos.length > 0;
  O['m.compraCap'] = cm.excessoCompras > 0.004 ? `as outras linhas passam as compras em ${brl(cm.excessoCompras)}`
                                               : `restante das compras: ${brl(cm.baseCompras)}`;
  O['m.compra'] = brl(cm.compras); O['m.compraP'] = P(cm.compras, cm.R);
  // herança do mês novo: de onde veio o saldo credor e quantos meses entraram no RBT12
  const hz = banco.heranca || {};
  V['m.temSaldoDe'] = !!hz.saldoDe;
  O['m.saldoDe'] = hz.saldoDe ? `veio de ${mesCurto(hz.saldoDe)}` : '';
  // somar os 12 meses só faz sentido com histórico: mais de dois meses salvos e algum antes deste
  const salvos = banco.meses || [], antes = salvos.filter(p => p < banco.periodo).length;
  V['r.temRbt'] = !!(banco.ativo && banco.empresaId && salvos.length > 2 && antes > 0);
  O['r.rbtNota'] = hz.rbt12Meses ? `somados ${hz.rbt12Meses} de 12 meses salvos${hz.rbt12Meses < 12 ? ' — confira no PGDAS' : ''}` : '';
  O['r.rbtBt'] = hz.rbt12Meses ? 'atualizar' : 'somar pelos meses salvos';
  (m.estoque || []).forEach((r, i) => { O[`m.es.${i}.v`] = brl(r[1] || 0); });
  // a alíquota da linha aparece na tabela: é fácil confundir a alíquota da CBS com a parcela dela dentro do DAS
  rf.debitos.forEach((r, i) => { O[`m.deb.${i}.val`] = brl((+r[1] || 0) * (r[2] || 0)); O[`m.deb.${i}.aliq`] = FMT.pct(r[2]); });
  rf.creditos.forEach((r, i) => { O[`m.cred.${i}.val`] = brl(valorCbs(r)); });
  // crédito maior que o débito: a CBS vira "CBS Crédito" (verde) com o saldo que vai para o mês seguinte
  const credor = V['m.temCredor'];
  O['m.cbsRotulo'] = credor ? 'CBS Crédito' : 'CBS a pagar';
  O['m.cbsRes'] = brl(credor ? cm.saldoCredor : cm.cbsPagar);
  const maxCbs = Math.max(cm.debitoTotal, cm.creditoTotal, cm.cbsPagar, cm.saldoCredor, 1);
  [['deb', cm.debitoTotal], ['cred', cm.creditoTotal], ['cbs', credor ? cm.saldoCredor : cm.cbsPagar]]
    .forEach(([k, v]) => { O['b.' + k] = brl(v); W['b.' + k] = larg(v, maxCbs); });
  // de onde vem o crédito: a barra do crédito é empilhada por origem (sem mínimo de largura, para somar o total)
  const origens = [['compras', cm.creditoCompras, 'compras'], ['despesas', cm.creditoGeral, 'despesas'],
    ['outras', rf.creditos.reduce((a, r) => a + valorCbs(r), 0), 'outras linhas'], ['saldo', cm.saldoAnterior, 'saldo do mês anterior']];
  origens.forEach(([k, v]) => { W['cr.' + k] = (Math.max(0, v) / maxCbs * 100) + '%'; });
  O['cr.legenda'] = origens.filter(([, v]) => v > 0.004)
    .map(([, v, nome]) => `${nome} ${brl(v)} (${dec(cm.creditoTotal ? v / cm.creditoTotal * 100 : 0, 0, 0)}%)`).join(' · ');
  V['cr.temLegenda'] = O['cr.legenda'] !== '';

  // receita por tipo: faixa do Simples, DAS de cada tipo e conferência com o DAS declarado
  const sg = cm.seg, temTab = !!(sg && !sg.excluida);
  O['r.faixa'] = !ANEXOS[S.anexo] ? 'escolha o anexo para calcular o DAS de cada tipo'
    : !(+m.rbt12 > 0) ? 'informe a receita dos 12 meses para calcular o DAS de cada tipo'
    : sg.excluida ? 'acima de R$ 4,8 milhões: fora do Simples Nacional'
    : `${sg.faixa}ª faixa · efetiva ${dec(sg.total * 100, 2, 2)}%${sg.sexta ? ' · ICMS e ISS pela 5ª faixa' : ''}`;
  const difDas = temTab ? cm.simples - sg.das : 0;
  V['r.temTabela'] = temTab;
  // a conferência só aparece com DAS declarado: em mês em branco não há o que comparar
  V['r.temConf'] = temTab && cm.simples > 0.004;
  V['r.confere'] = V['r.temConf'] && Math.abs(difDas) < 1;
  V['r.naoConfere'] = V['r.temConf'] && !V['r.confere'];
  O['r.dasCalc'] = temTab ? brl(sg.das) : '—';
  O['r.dasDeclarado'] = brl(cm.simples);
  O['r.conferencia'] = !V['r.temConf'] ? '' : V['r.confere'] ? 'Confere com o DAS declarado no PGDAS.'
    : difDas < 0 ? `O DAS pela receita por tipo passa o declarado em ${brl(-difDas)}: separe as receitas com ICMS-ST, monofásico ou ISS retido.`
    : `O DAS pela receita por tipo fica ${brl(difDas)} abaixo do declarado: confira o anexo, a receita dos 12 meses e os tipos.`;
  // as duas CBS têm bases diferentes: a de dentro é uma fatia do DAS; a de fora incide sobre a receita
  O['r.cbsDentro'] = brl(cm.parcelaCbs);
  O['r.cbsBase'] = `${dec(cm.parcela * 100, 2, 2)}% do DAS${cm.semDeclarado ? ' calculado' : ''}`;
  O['r.cbsFora'] = brl(cm.cbsPagar);
  O['r.foraBase'] = cm.saldoCredor > 0.004 ? `os créditos passam o débito em ${brl(cm.saldoCredor)}`
    : cm.creditoTotal > 0.004 ? `débito de ${brl(cm.debitoTotal)} menos créditos de ${brl(cm.creditoTotal)}`
    : `${dec(cm.R > 0 ? cm.debitoTotal / cm.R * 100 : 0, 2, 2)}% da receita`;
  O['r.dasSemCbs'] = brl(cm.simplesSemCbs);
  O['r.totalHib'] = brl(cm.naTransicao);
  O['r.contraHoje'] = `contra ${brl(cm.dasBase)} com a CBS dentro`;
  O['r.decisao'] = Math.abs(cm.delta) < 0.005 ? 'Com a CBS por fora, o mês custa o mesmo'
    : cm.delta > 0 ? `Com a CBS por fora, o mês custa ${brl(cm.delta)} a mais`
    : `Com a CBS por fora, o mês custa ${brl(-cm.delta)} a menos`;
  V['r.manual'] = !cm.pelaTabela;

  // Convencional × Híbrido: números e uma barra empilhada por regime (DAS + CBS), medidas pelo maior total
  const maxTot = Math.max(cm.dasBase, cm.naTransicao, 1);
  Object.assign(O, {
    'k.dasConv': brl(cm.dasBase), 'k.cbsConv': brl(cm.parcelaCbs), 'k.totConv': brl(cm.dasBase), 'k.cbsConvInfo': 'dentro do DAS',
    'k.dasHib': brl(cm.simplesSemCbs), 'k.cbsHib': brl(cm.cbsPagar), 'k.totHib': brl(cm.naTransicao),
    'k.cbsHibInfo': credor ? `crédito de ${brl(cm.saldoCredor)} vai para o mês seguinte`
      : cm.ibs > 0.004 ? `+ IBS de ${brl(cm.ibs)} no total` : 'apurada por fora',
    'k.decisao': Math.abs(cm.delta) < 0.005 ? 'Os dois regimes empatam no mês'
      : cm.delta > 0 ? 'O convencional sai mais barato no mês' : 'O híbrido sai mais barato no mês',
    'k.dif': brl(Math.abs(cm.delta)),
    'k.equilibrio': textoEquilibrio(cm, true),
    // carga tributária do mês em cada regime: todas as despesas tributárias, trocando o DAS pelo par DAS sem CBS + CBS
    'k.cargaConv': `Tributos do mês: ${brl(cm.trib)} · ${P2(cm.trib, cm.R)} da receita`,
    'k.cargaHib': `Tributos do mês: ${brl(cm.trib + cm.delta)} · ${P2(cm.trib + cm.delta, cm.R)} da receita`,
    // alíquota efetiva de cada regime: o que ele custa sobre a receita do mês
    'k.efetConv': `alíquota efetiva ${P2(cm.dasBase, cm.R)}`,
    'k.efetHib': `alíquota efetiva ${P2(cm.naTransicao, cm.R)}`
  });
  const ppt = Math.abs(cm.delta) / (cm.R || 1) * 100;
  const pp = `${dec(ppt, 2, 2)} ${ppt < 2 ? 'ponto percentual' : 'pontos percentuais'}`;
  O['k.variacao'] = !(cm.R > 0.004 && cm.dasBase > 0.004) ? ''
    : Math.abs(cm.delta) < 0.005 ? `A alíquota efetiva do regime fica em ${P2(cm.dasBase, cm.R)} nos dois.`
    : `A alíquota efetiva do regime ${cm.delta > 0 ? 'sobe' : 'cai'} de ${P2(cm.dasBase, cm.R)} para ${P2(cm.naTransicao, cm.R)} — ${pp} a ${cm.delta > 0 ? 'mais' : 'menos'}.`;
  V['k.temVariacao'] = O['k.variacao'] !== '';
  [['k.convDas', cm.simplesSemCbs], ['k.convCbs', cm.parcelaCbs], ['k.hibDas', cm.simplesSemCbs], ['k.hibCbs', cm.cbsPagar + cm.ibs]]
    .forEach(([k, v]) => { W[k] = (maxTot > 0 ? Math.max(0, v) / maxTot * 100 : 0) + '%'; });
  V['k.hibrido'] = cm.delta < -0.004;
  V['k.temEquilibrio'] = O['k.equilibrio'] !== '';

  // resumo do cliente
  O['c.nRec'] = 'declarada no PGDAS'; O['c.nRes'] = 'margem de ' + P(cm.resultado, cm.R);
  O['c.nSim'] = 'regime atual';
  O['c.nCbs'] = credor ? 'vai para o mês seguinte' : 'simulação da reforma';
  O['c.obs'] = textoObservar(cm);
  O['c.obsCadeia'] = textoClientesCadeia();
  V['c.temObsCadeia'] = O['c.obsCadeia'] !== '';

  // ano
  Object.assign(O, {
    'a.receita': brl(ca.R), 'a.receitaP': pct(ca.R ? 100 : 0),
    'a.custos': brl(ca.custos), 'a.custosP': P(ca.custos, ca.R),
    'a.lucroBruto': brl(ca.lucroBruto), 'a.lucroBrutoP': P(ca.lucroBruto, ca.R),
    'a.gat': brl(ca.ga), 'a.gatP': P(ca.ga, ca.R), 'a.vendas': brl(ca.vendas), 'a.vendasP': P(ca.vendas, ca.R),
    'a.trib': brl(ca.trib), 'a.tribP': P(ca.trib, ca.R),
    'a.resultado': brl(ca.resultado), 'a.margem': P(ca.resultado, ca.R),
    'a.despesas': brl(ca.despesas), 'a.despesasP': P2(ca.despesas, ca.R),
    'a.simples': brl(ca.simples), 'a.simplesP': P2(ca.simples, ca.R)
  });
  itens(a.custos, 'a.cu', ca.R); itens(a.ga, 'a.ga', ca.R); itens(a.vendas, 'a.ve', ca.R); itens(a.tributarias, 'a.tr', ca.R);
  V['a.temDiff'] = Math.abs(ca.diff) >= 0.01;
  O['a.flag'] = `O resultado informado (${brl(ca.resultado)}) difere da soma das linhas (${brl(ca.calculado)}) em ${brl(Math.abs(ca.diff))}. Valor informado mantido — verificar lançamentos.`;
  // composição pela soma das linhas: fecha exatamente em 100% da receita
  [['custos', ca.custos], ['ga', ca.ga + ca.vendas], ['trib', ca.trib], ['res', ca.calculado]]
    .forEach(([k, v]) => { O['a.c.' + k] = P(v, ca.R); W['a.c.' + k] = parte(v, ca.R); });
  const cem = v => 'R$ ' + dec(ca.R ? v / ca.R * 100 : 0, 2, 2);
  O['a.leitura1'] = `De cada R$ 100,00 que entram pela venda, ${cem(ca.custos)} vão para a mercadoria, ${cem(ca.ga + ca.vendas)} para as despesas de funcionamento e ${cem(ca.trib)} para impostos e taxas. Sobram ${cem(ca.calculado)} de lucro — margem de ${P(ca.calculado, ca.R)}.`;
  O['a.leitura2'] = `No exercício, a empresa vendeu ${brl(ca.R)} e comprou ${brl(a.compraMercadoria || 0)} em mercadoria.`;
  // aba Anual: o ano somado pelas competências salvas no banco
  const ano = banco.ano;
  if(ano && ano.linhas && ano.linhas.length){
    const t = totaisAno(ano.linhas);
    ano.linhas.forEach((x, i) => {
      const q = x.resumo || {};
      O[`an.${i}.rec`] = brl(q.receita || 0); O[`an.${i}.das`] = brl(q.das || 0); O[`an.${i}.cbs`] = brl(q.cbs || 0);
      O[`an.${i}.res`] = brl(q.resultado || 0); O[`an.${i}.mar`] = P(q.resultado || 0, q.receita || 0);
    });
    O['an.rec'] = brl(t.rec); O['an.das'] = brl(t.das); O['an.cbs'] = brl(t.cbs);
    O['an.res'] = brl(t.res); O['an.mar'] = P(t.res, t.rec);
    const leituras = textoAno(t, ano.linhas);
    O['an.leitura'] = leituras[0];
    O['an.leitura2'] = leituras[1]; V['an.temLeitura2'] = !!leituras[1];
    const alerta = alertaLimite(t);
    V['an.temLimite'] = !!alerta; O['an.limite'] = alerta;
    const falta = mesesFaltando(ano.linhas, ano.ano);
    V['an.temFalta'] = falta.length > 0;
    O['an.falta'] = `Ainda sem competência salva em ${ano.ano}: ${falta.join(', ')}. O total soma apenas os meses salvos.`;
  }
  // cadeia de crédito: contadores do alternador, estado de cada linha e a visão aberta
  ['fornecedores', 'clientes'].forEach(g => {
    const lista = (S.cadeia && S.cadeia[g]) || [];
    O[`cad.${g}.qtd`] = String(lista.length);
    lista.forEach((r, i) => {
      V[`cad.${g}.${i}.inv`] = !!limpaCnpj(r[0]) && !cnpjValido(r[0]);
      ['sim', 'parcial', 'nao'].forEach(v => { V[`cad.${g}.${i}.${v}`] = r[3] === v; });
    });
  });
  const visao = ui.cadeia || 'fornecedores', lst = (S.cadeia && S.cadeia[visao]) || [];
  O['cad.resumo'] = resumoCadeia(lst, visao === 'fornecedores');
  const invalidos = lst.filter(r => limpaCnpj(r[0]) && !cnpjValido(r[0])).length;
  O['cad.alerta'] = invalidos === 1 ? '1 CNPJ não confere' : `${invalidos} CNPJs não conferem`;
  V['cad.temAlerta'] = invalidos > 0;
  H['cad.grafico'] = graficoCadeia(lst, visao === 'fornecedores');
  return {O, W, C, V, H};
}

/* ---------- montagem das telas (estrutura; os valores entram em refresh) ---------- */
const o = (k, cls) => `<span${cls ? ` class="${cls}"` : ''} data-o="${k}"></span>`;
function inp(path, f, label, cls, extra){
  return `<input class="in ${cls || ''}" data-b="${path}" data-f="${f}" aria-label="${esc(label)}"` +
    ` inputmode="${f === 'txt' || f === 'cnpj' ? 'text' : 'decimal'}" autocomplete="off" spellcheck="false"${ui.present ? ' readonly' : ''} ${extra || ''}>`;
}
const editavel = () => ui.editando && !ui.present;
const semTags = s => String(s).replace(/<[^>]+>/g, '');

function rTopo(){
  const abas = [['resultado', 'Resultado'],
    ['cliente', 'Resumo<span class="tl-long"> do cliente</span>'], ['anual', 'Anual']];
  const botoes = abas.map(([id, lbl]) => (id === 'anual' ? '<span class="rail-sep" aria-hidden="true"></span>' : '') +
    `<button class="tab" role="tab" id="tab-${id}" aria-selected="${ui.tab === id}" aria-controls="painel"` +
    ` tabindex="${ui.tab === id ? 0 : -1}" data-act="tab" data-id="${id}">${lbl}</button>`).join('');
  let ctl = '';
  if(!ui.client) ctl = ui.present
    ? `<button class="btn" data-act="present">Sair da apresentação</button>`
    : `<div class="menu-wrap"><button class="btn" data-act="menu" aria-haspopup="true" aria-expanded="${ui.menu}">Opções <span aria-hidden="true">▾</span></button>${ui.menu ? rMenu() : ''}</div>`;
  return `<header class="top">
    <div class="ident"><img class="logo" data-src="logo" alt="Logo do escritório">
      <div><div class="co" data-o="co"></div><div class="ctx" data-o="ctx"></div></div></div>
    <nav class="nav"><div class="rail" role="tablist" aria-label="Seções do painel">${botoes}</div>${ctl}</nav>
  </header>`;

    const parte = +r[2] || 0, igual = v => Math.abs(v - parte) < 1e-9, padrao = REGRAS.some(([v]) => igual(v));
    const opcoes = REGRAS.map(([v, l]) => `<option value="${v}"${igual(v) ? ' selected' : ''}>${l}</option>`).join('') +

function linhasCbs(g){

  return S.monthly.reforma[g].map((r, i) => {
    // só o crédito pode ser parte das compras do mês; receita é sempre valor digitado
    const vinc = cred && parteCompras(r) !== null;
    const chipVinc = cred ? `<button class="chip" data-act="vinc" data-g="${g}" data-i="${i}" title="${vinc ? 'Passar a digitar a base' : 'Calcular a base como parte das compras do mês'}">${vinc ? 'compras' : 'base fixa'}</button>` : '';
    const legenda = vinc ? `<span class="parte">${inp(`monthly.reforma.creditos.${i}.4`, 'pct0', r[0] + ' — parte das compras', 'mini')}<span>das compras do mês</span></span>` : '';
    const base = vinc ? `<span class="r m" data-o="m.cred.${i}.base"></span>` : inp(`monthly.reforma.${g}.${i}.1`, 'base', r[0] + ' — base');
    const tipo = TIPOS.some(([v]) => v === r[3]) ? r[3] : 'geral';
    const tipoSel = `<select class="chip-sel" data-tipo data-g="${g}" data-i="${i}" aria-label="Tipo de alíquota — ${esc(r[0])}" title="Tipo de alíquota">` +
      TIPOS.map(([v, l]) => `<option value="${v}"${v === tipo ? ' selected' : ''}>${l}</option>`).join('') + `</select>`;
    return `<div class="g4 cr">
    <span class="nmcol"><span class="nmwrap">${cred ? inp(`monthly.reforma.${g}.${i}.0`, 'txt', `Nome da linha ${i + 1}`, 'txt') : `<span class="nm">${NOME_RECEITA}</span>`}
      <span class="row-ctl">${tipoSel}${chipVinc}<button class="x" data-act="rm" data-g="${g}" data-i="${i}" aria-label="Remover ${esc(r[0])}" title="Remover linha">×</button></span></span>${legenda}</span>

  }).join('');

function refresh(){
  const root = document.documentElement.style;
  const brand = hex(S.brand) ? S.brand : '#B3122B', fill = hex(S.fill) ? S.fill : '#14161A';
  root.setProperty('--fill', fill); root.setProperty('--brand', brand);
  root.setProperty('--brand-dark', mix(brand, '#000000', .3)); root.setProperty('--brand-wash', mix(brand, '#ffffff', .95));
  const {O, W, C, V, H} = saidas();
  app.querySelectorAll('[data-h]').forEach(el => { const v = H[el.dataset.h]; if(v !== undefined && el._h !== v){ el._h = v; el.innerHTML = v; } });
  app.querySelectorAll('[data-o]').forEach(el => { const v = O[el.dataset.o]; if(v !== undefined && el.textContent !== v) el.textContent = v; });
  app.querySelectorAll('[data-w]').forEach(el => { if(W[el.dataset.w] !== undefined) el.style.width = W[el.dataset.w]; });
  app.querySelectorAll('[data-oc]').forEach(el => { el.style.color = C[el.dataset.oc] || ''; });
  app.querySelectorAll('[data-v]').forEach(el => { el.hidden = !V[el.dataset.v]; });
  app.querySelectorAll('[data-cls]').forEach(el => el.dataset.cls.split(' ').forEach(par => {   // "classe:chave classe2:chave2"
    const [cls, k] = par.split(':'); el.classList.toggle(cls, !!V[k]);
  }));
  app.querySelectorAll('input[data-b], select[data-b]').forEach(el => {
    if(el === document.activeElement) return;                 // não mexe no campo que está sendo digitado
    const s = FMT[el.dataset.f](getPath(el.dataset.b));
    if(el.value.toLowerCase() !== s.toLowerCase()) el.value = s;
  });
  const img = app.querySelector('[data-src="logo"]'), src = S.logo || LOGO_DEFAULT;
  if(img && img.getAttribute('src') !== src) img.setAttribute('src', src);
  document.title = 'DRE — ' + (S.co || 'Painel');
  atualizarBarra();
}

function zerarValores(base, manter){
  // zera valores; mantém categorias, % base, alíquotas, premissas, identidade visual e rótulos.
  // manter {estoque, fixas}: o que o mês novo repete do anterior em vez de zerar (ver herdarDoAnterior)
  manter = manter || {};
  const d = JSON.parse(JSON.stringify(base));
  const zera = arr => arr.forEach(r => { r[1] = 0; });
  const fixas = manter.fixas ? JSON.parse(JSON.stringify(d.monthly.ga)) : null;
  [d.annual, d.monthly].forEach(x => { x.receita = 0; x.compraMercadoria = 0; ['custos', 'ga', 'vendas', 'tributarias'].forEach(g => zera(x[g])); });
  d.annual.resultadoInformado = 0;
  zera(d.monthly.reforma.debitos); zera(d.monthly.reforma.creditos);
  if(!manter.estoque) zera(d.monthly.estoque || []);
  if(fixas) d.monthly.ga = fixas;                  // despesas gerais repetidas: o anual continua zerado
  d.monthly.reforma.saldoCredorAnterior = 0; d.monthly.ibs = 0; d.monthly.rbt12 = 0;
  return d;
}
function limparTudo(){
  const d = zerarValores(S);
  if(!banco.empresaId) d.co = '[Nome da empresa]';            // com empresa aberta, o nome é o da empresa
  d.cadeia = { fornecedores: [], clientes: [] };
  return d;
}
async function salvar(){

async function carregar(){

    else if(window.storage){ const r = await window.storage.get('dre_state', true); if(r && r.value) salvo = JSON.parse(r.value); }

function baixar(){
  const clone = document.documentElement.cloneNode(true);
  clone.removeAttribute('style');                               // cores aplicadas em tempo de execução
  clone.querySelector('body').removeAttribute('class');
  clone.querySelector('#app').innerHTML = '';
  const t = clone.querySelector('#toast'); t.className = 'toast'; t.textContent = '';
  const velho = clone.querySelector('#estado-salvo'); if(velho) velho.remove();
  // o arquivo baixado funciona sozinho, sem o banco: quem recebe não tem login
  clone.querySelectorAll('script:not([id])').forEach(s => { s.textContent = s.textContent.replace(/const SUPABASE = [^\n]*;/, 'const SUPABASE = null;'); });
  // o estado vai num <script> próprio no <head>, antes do script principal (inserido pelo DOM, sem busca em texto)
  const sc = document.createElement('script'); sc.id = 'estado-salvo';
  sc.textContent = 'window.__SAVED_STATE__=' + JSON.stringify(S).replace(/</g, '\\u003c') + ';';
  const head = clone.querySelector('head'); head.insertBefore(sc, head.querySelector('style'));
  const url = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], {type: 'text/html'}));
  const nome = String(S.co || 'empresa').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '');
  const a = document.createElement('a'); a.href = url; a.download = 'DRE_' + (nome || 'empresa') + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('HTML baixado');
}
