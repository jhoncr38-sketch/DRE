async function carregarAno(ano){
  let lista;
  try{
    lista = await sb('rpc/resumos', {metodo: 'POST', corpo: {p_empresa_id: banco.empresaId,
      p_de: `${ano}-01-01`, p_ate: `${ano}-12-01`}}) || [];
  }catch(e){
    // banco ainda sem a migração: explica na própria aba, sem alarde de erro
    if(e.status !== 404 && e.status !== 400) throw e;
    banco.ano = {ano, linhas: [], carregando: false, semFuncao: true}; render(); return;
  }
  // mês sem resumo, ou com resumo de antes do débito e crédito da CBS: recalcula pelo estado salvo. Só as partes que
  // a conta usa (a logo personalizada fica no estado e pode ser grande); ao salvar o mês de novo, o resumo se completa
  const faltam = lista.filter(x => !x.resumo || x.resumo.debito === undefined).map(x => x.periodo);
  if(faltam.length){
    const crus = await sb(`competencias?select=periodo,v:dados->v,anexo:dados->anexo,mesLabel:dados->mesLabel,monthly:dados->monthly` +
      `&empresa_id=eq.${banco.empresaId}&periodo=in.(${faltam.join(',')})`);
    const porPeriodo = {};
    (crus || []).forEach(c => { if(c.monthly) porPeriodo[c.periodo] = {v: c.v, anexo: c.anexo, mesLabel: c.mesLabel, monthly: c.monthly}; });
    lista.forEach(x => { if(porPeriodo[x.periodo]) x.resumo = resumoDe(prontoParaCalculo(porPeriodo[x.periodo])); });
  }
  banco.ano = {ano, linhas: lista, carregando: false};
  render();
  garantirPresumido();
}

/* ---------- Doze meses móveis: receita, imposto e folha ---------- */
// É a base dos dois gráficos da Visão geral — o de receita e imposto e o do Fator R. O ano civil continua
// existindo à parte (banco.ano), porque a aba Anual soma o exercício, não os doze meses que terminam no mês
// aberto.
// O corte é 28%: chegando lá, a empresa de serviço do Anexo V passa a ser tributada pelo III, bem mais barato.
// A conta é da LC 123 (art. 18, §24): folha de salários dos 12 meses (com pró-labore e encargos) ÷ receita dos
// 12 meses. Os encargos entram por um percentual à parte (padrão 8%, o FGTS), editável: o que vale é o que o
// escritório considera folha — o painel mostra a conta aberta em vez de decidir sozinho.
const FATOR_R_CORTE = 0.28;
// encargos que entram na folha do Fator R: as linhas de INSS e FGTS lançadas em despesas tributárias. Antes
// era um percentual sobre a folha (8%, o FGTS); o escritório preferiu somar o que está lançado de verdade.
const RE_ENCARGO = /inss|fgts/i;
const janelaMeses = (ate, n) => {                   // os n períodos que terminam em 'ate' (aaaa-mm-01)
  const [a, m] = ate.split('-').map(Number), fim = new Date(Date.UTC(a, m - 1, 1)), lista = [];
  for(let i = n - 1; i >= 0; i--){
    const d = new Date(Date.UTC(fim.getUTCFullYear(), fim.getUTCMonth() - i, 1));
    lista.push(`${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-01`);
  }
  return lista;
};
const doze = ate => janelaMeses(ate, 12);
// o gráfico do Fator R mostra doze pontos e cada ponto é uma janela de doze meses: 23 meses ao todo
const HIST_MESES = 23;
function garantirHist(recarregar){
  if(!banco.ativo || !banco.empresaId || !banco.periodo) return;
  const ate = banco.periodo;
  if(!recarregar && banco.hist && banco.hist.ate === ate && banco.hist.empresa === banco.empresaId) return;
  banco.hist = {ate, empresa: banco.empresaId, carregando: true, meses: []};
  comErro(() => carregarHist(ate));
}
async function carregarHist(ate){
  const periodos = janelaMeses(ate, HIST_MESES), alvo = banco.hist;
  let resumos = [];
  try{
    resumos = await sb('rpc/resumos', {metodo: 'POST', corpo: {p_empresa_id: banco.empresaId,
      p_de: periodos[0], p_ate: periodos[periodos.length - 1]}}) || [];
  }catch(e){
    if(e.status !== 404 && e.status !== 400) throw e;
    if(banco.hist === alvo){ banco.hist = {ate, empresa: banco.empresaId, semFuncao: true, meses: []}; render(); }
    return;
  }
  const folhas = await sb(`competencias?select=periodo,ga:dados->monthly->ga,trib:dados->monthly->tributarias` +
    `&empresa_id=eq.${banco.empresaId}&periodo=in.(${periodos.join(',')})`) || [];
  const porPeriodo = {};
  folhas.forEach(c => {
    const f = porPeriodo[c.periodo] = {folha: 0, prolabore: 0, encargos: 0};
    (Array.isArray(c.ga) ? c.ga : []).forEach(r => {
      const cat = categoriaFolha(String(r[0] || '').trim());
      if(cat) f[cat] += +r[1] || 0;
    });
    // encargos do Fator R: o que está lançado em despesas tributárias como INSS ou FGTS — nada de percentual
    (Array.isArray(c.trib) ? c.trib : []).forEach(r => {
      if(RE_ENCARGO.test(String(r[0] || ''))) f.encargos += +r[1] || 0;
    });
  });
  // a função só devolve mês salvo, e a receita já vem do resumo ou do próprio estado — mês antigo, sem
  // resumo gravado, também conta (aí o imposto fica desconhecido: só o resumo gravado traz DAS e CBS)
  const salvos = {};
  resumos.forEach(x => { salvos[x.periodo] = {receita: +x.receita || 0, resumo: x.resumo}; });
  const meses = periodos.map(per => {
    const f = porPeriodo[per], r = salvos[per];
    return {periodo: per, salvo: !!r, receita: r ? r.receita : 0,
      imposto: r && r.resumo ? (+r.resumo.das || 0) + (+r.resumo.cbs || 0) : null,
      folha: f ? f.folha : 0, prolabore: f ? f.prolabore : 0, encargos: f ? f.encargos : 0};
  });
  if(banco.hist !== alvo) return;                 // trocou de mês ou de empresa enquanto buscava
  banco.hist = {ate, empresa: banco.empresaId, carregando: false, meses};
  render();
}
// a conta: o valor de hoje é dos doze meses que terminam na competência aberta; cada ponto do gráfico é o
// Fator R da janela de doze meses que termina naquele mês — por isso os 23 meses buscados
function calcFatorR(){
  const fr = banco.hist;
  if(!fr || fr.carregando || fr.semFuncao || !fr.meses.length) return null;
  const todos = fr.meses.map(m => Object.assign({}, m,
    {folhaTotal: m.folha + m.prolabore + (m.encargos || 0)}));
  const meses = todos.slice(-12);                   // os doze que terminam na competência aberta
  const somaR = meses.reduce((a, x) => a + x.receita, 0);
  const somaF = meses.reduce((a, x) => a + x.folhaTotal, 0);
  const faltam = meses.filter(x => !x.salvo).length;
  const valor = somaR > 0.004 ? somaF / somaR : null;
  // um ponto por mês do último ano: a janela de doze que termina nele. Abaixo de três meses salvos na janela
  // a conta diz pouco e o ponto fica de fora — a linha começa onde o histórico começa.
  const pontos = meses.map((m, i) => {
    const fim = todos.length - 12 + i;              // índice do mês em 'todos'; a janela são os doze até ele
    const jan = todos.slice(fim - 11, fim + 1);
    const salvos = jan.filter(x => x.salvo).length;
    const r = jan.reduce((a, x) => a + x.receita, 0), f = jan.reduce((a, x) => a + x.folhaTotal, 0);
    return {periodo: m.periodo, valor: r > 0.004 && salvos >= 3 ? f / r : null, salvo: m.salvo};
  });
  const somaEnc = meses.reduce((a, x) => a + (x.encargos || 0), 0);
  const semEncargo = meses.filter(x => x.salvo && (x.folha + x.prolabore) > 0.004 && !(x.encargos > 0.004)).length;
  const alvo = somaR * FATOR_R_CORTE;               // quanto de folha faria chegar aos 28%
  return {valor, pontos, meses, somaR, somaF, somaEnc, faltam, semEncargo,
    faltaFolha: valor != null && valor < FATOR_R_CORTE ? alvo - somaF : 0};
}

/* ---------- Lucro Presumido: estimativa pelos meses salvos ---------- */
// IRPJ 15% e CSLL 9% sobre receita × presunção, apurados por TRIMESTRE — no mês a mês o adicional sai errado
// quando a receita oscila. Adicional do IRPJ: 10% sobre a base acima de R$ 20 mil por mês do trimestre.
// LC 224/2025: presunção 10% maior sobre a receita acima de R$ 5 milhões no ano, aplicada R$ 1,25 milhão por
// trimestre, acumulado, com ajuste nos seguintes (em disputa na Justiça, ADI 7920). Regras de 2027: PIS/Cofins
// viram a CBS por fora — débito menos crédito, a mesma do híbrido. IBS quase zero até 2028: fica de fora.
const LP = {irpj: .15, adicional: .10, limiteMes: 20000, csll: .09, limiteTri: 1250000, acrescimo: .10};
// presunção por atividade (Lei 9.249/1995, arts. 15 e 20): [id, nome, IRPJ, CSLL, ISS?, ICMS?]
const ATIVIDADES = [
  ['servicos', 'Serviços em geral (consultoria, profissões, administração, locação)', .32, .32, true, false],
  ['hospitalar', 'Serviços hospitalares e de auxílio diagnóstico', .08, .12, true, false],
  ['obraMaterial', 'Construção por empreitada com todos os materiais', .08, .12, true, false],
  ['obraMao', 'Construção só com mão de obra', .32, .32, true, false],
  ['cargas', 'Transporte de cargas', .08, .12, true, true],
  ['passageiros', 'Transporte de passageiros', .16, .12, true, true],
  ['comercio', 'Comércio e indústria', .08, .12, false, true],
  ['combustivel', 'Revenda de combustíveis', .016, .12, false, true],
  ['outra', 'Outra atividade — informar os percentuais', null, null, true, true],
];
const LP_CAMPOS = ['n', 'rec', 'compras', 'cbs', 'debCbs', 'credCbs', 'semCbs', 'folha', 'prolabore', 'baseInss', 'das', 'hib', 'acrescimo',
  'baseIrpj', 'baseCsll', 'irpj', 'adicional', 'csll', 'iss', 'icms', 'icmsDeb', 'icmsCred', 'inss', 'total', 'conv', 'hibr'];
const RE_FOLHA = /folha|sal[aá]rio|funcion[aá]rio|ordenado|pr[oó][\s-]*labore/i;
const RE_PROLABORE = /pr[oó][\s-]*labore/i;
// pró-labore paga 20% patronal, sem RAT nem terceiros; linha que mistura ("Folha e pró-labore") fica com a alíquota da folha
const categoriaFolha = nome => !RE_FOLHA.test(nome) ? '' : RE_PROLABORE.test(nome) && !/folha|sal[aá]rio|funcion[aá]rio|ordenado/i.test(nome) ? 'prolabore' : 'folha';
// atividade da empresa: a escolhida ou, sem escolha, a do anexo do Simples (I e II vendem mercadoria; III a V, serviço)
function atividadeLP(){
  const pr = S.presumido || {}, id = ATIVIDADES.some(x => x[0] === pr.atividade) ? pr.atividade
    : ['I', 'II'].includes(anexoEmpresa()) ? 'comercio' : 'servicos';
  const [, nome, irpj, csll, iss, icms] = ATIVIDADES.find(x => x[0] === id);
  return {id, nome, escolhida: id === pr.atividade, iss, icms,
    irpj: irpj === null ? +pr.irpjOutra || 0 : irpj, csll: csll === null ? +pr.csllOutra || 0 : csll};
}
function premissasLP(){
  const pr = S.presumido || {}, at = atividadeLP();
  return {irpj: at.irpj, csll: at.csll, iss: at.iss ? +pr.iss || 0 : 0, icms: at.icms ? +pr.icms || 0 : 0,
    icmsCompras: at.icms ? +pr.icmsCompras || 0 : 0, encargos: +pr.encargos || 0,
    encargosPro: pr.encargosProlabore == null ? 0.20 : +pr.encargosProlabore || 0};
}
// Colunas da tabela: trimestre (ou mês) com movimento. Coluna só de travessões ocupa a largura de quem tem
// número — some por padrão, e o botão "mostrar sem movimento" devolve todas
function colunasLP(linhas){
  const ms = (linhas || []).filter(x => x.resumo).sort((a, b) => a.periodo < b.periodo ? -1 : 1);
  const mov = r => (+r.receita || 0) > 0.004 || (+r.das || 0) > 0.004;
  if(ui.lpMes) return ms.filter(x => ui.lpVazias || mov(x.resumo)).map(x => x.periodo);
  return [0, 1, 2, 3].filter(i => ui.lpVazias ||
    ms.some(x => Math.floor((+x.periodo.slice(5, 7) - 1) / 3) === i && mov(x.resumo)));
}
// cenário do Simples em disputa: os dois (padrão), só o tradicional ou só o híbrido
const escondidasLP = linhas => {
  const antes = ui.lpVazias; ui.lpVazias = true;
  const total = colunasLP(linhas).length; ui.lpVazias = antes;
  return total - colunasLP(linhas).length;
};
const simplesDe = t => ui.lpCenario === 'conv' ? t.conv : ui.lpCenario === 'hibr' ? t.hibr : Math.min(t.conv, t.hibr);
const nomeSimples = () => ui.lpCenario === 'conv' ? 'Simples tradicional' : ui.lpCenario === 'hibr' ? 'Simples híbrido' : 'Simples';
function calcPresumido(linhas, folhas, prem, anexo){
  const q = [0, 1, 2, 3].map(() => Object.fromEntries(LP_CAMPOS.map(k => [k, 0])));
  (linhas || []).forEach(x => {
    const r = x.resumo; if(!r) return;
    const t = q[Math.floor((+x.periodo.slice(5, 7) - 1) / 3)];
    t.n++; t.rec += +r.receita || 0; t.das += +r.das || 0; t.compras += +r.compras || 0;
    // CBS pelo débito e crédito de cada mês, sem o transportado (ver totaisAno); o híbrido é o DAS sem a CBS mais ela
    const cb = cbsDoMes(r);
    t.debCbs += cb.deb; t.credCbs += cb.cred; t.semCbs += (+r.naTransicao || 0) - (+r.cbs || 0);
    const f = folhas[x.periodo];                     // número sozinho = só folha (forma antiga, usada nos testes)
    t.folha += typeof f === 'object' && f ? +f.folha || 0 : +f || 0;
    t.prolabore += typeof f === 'object' && f ? +f.prolabore || 0 : 0;
  });
  let acumulada = 0, excedenteAntes = 0;
  q.forEach((t, i) => {
    t.cbs = t.debCbs - t.credCbs;                    // trimestre com mais crédito que débito fica negativo
    t.hib = t.semCbs + t.cbs;
    acumulada += t.rec;
    const excedente = Math.max(0, acumulada - LP.limiteTri * (i + 1)), excTri = excedente - excedenteAntes;
    excedenteAntes = excedente;
    // o acréscimo da LC 224 vale para as duas presunções; negativo = ajuste de trimestre anterior
    t.acrescimo = excTri * prem.irpj * LP.acrescimo;
    t.baseIrpj = Math.max(0, t.rec * prem.irpj + t.acrescimo);
    t.baseCsll = Math.max(0, t.rec * prem.csll + excTri * prem.csll * LP.acrescimo);
    t.irpj = t.baseIrpj * LP.irpj;
    t.adicional = Math.max(0, t.baseIrpj - LP.limiteMes * t.n) * LP.adicional;   // limite pelos meses salvos do trimestre
    t.csll = t.baseCsll * LP.csll;
    t.iss = t.rec * prem.iss;
    // ICMS como a CBS: débito sobre a receita menos crédito das compras (quem é contribuinte credita o das compras).
    // Sem alíquota de compras informada, o crédito é zero e sobra só o débito, como era antes
    t.icmsDeb = t.rec * prem.icms; t.icmsCred = t.compras * (prem.icmsCompras || 0);
    t.icms = t.icmsDeb - t.icmsCred;
    t.baseInss = t.folha + t.prolabore;
    t.inss = t.folha * prem.encargos + t.prolabore * (prem.encargosPro == null ? prem.encargos : prem.encargosPro);
    t.total = t.irpj + t.adicional + t.csll + t.cbs + t.iss + t.icms + t.inss;
    // no Anexo IV a contribuição patronal já é paga fora do DAS: entra dos dois lados e não decide nada
    const fora = anexo === 'IV' ? t.inss : 0;
    t.conv = t.das + fora; t.hibr = t.hib + fora;
  });
  const ano = Object.fromEntries(LP_CAMPOS.map(k => [k, q.reduce((s, t) => s + t[k], 0)]));
  // no ano, débito menos crédito; sobrando crédito, a CBS do ano é zero e o saldo fica para o ano seguinte
  ano.credorCbs = Math.max(0, -ano.cbs);
  if(ano.credorCbs > 0){ ano.cbs = 0; ano.total += ano.credorCbs; ano.hib += ano.credorCbs; ano.hibr += ano.credorCbs; }
  // mesmo tratamento para o ICMS: sobrando crédito no ano, o imposto do ano é zero e o saldo vai para o ano seguinte.
  // O ICMS não entra no Simples (lá ele está dentro do DAS), então só o total do Presumido muda
  ano.credorIcms = Math.max(0, -ano.icms);
  if(ano.credorIcms > 0){ ano.icms = 0; ano.total += ano.credorIcms; }
  // Visão por mês: receita, CBS, ISS/ICMS, INSS e Simples são do próprio mês. IRPJ, adicional, CSLL e as bases são
  // apurados POR TRIMESTRE (é assim na lei), então aqui aparecem rateados pela receita do mês dentro do trimestre —
  // sem receita no trimestre, divididos igualmente. A tabela diz isso embaixo
  const meses = (linhas || []).filter(x => x.resumo).sort((a, b) => a.periodo < b.periodo ? -1 : 1).map(x => {
    const r = x.resumo, tri = q[Math.floor((+x.periodo.slice(5, 7) - 1) / 3)];
    const m = Object.fromEntries(LP_CAMPOS.map(k => [k, 0]));
    const cb = cbsDoMes(r), f = folhas[x.periodo];
    m.periodo = x.periodo; m.n = 1;
    m.rec = +r.receita || 0; m.das = +r.das || 0;
    m.debCbs = cb.deb; m.credCbs = cb.cred; m.cbs = cb.deb - cb.cred;
    m.semCbs = (+r.naTransicao || 0) - (+r.cbs || 0); m.hib = m.semCbs + m.cbs;
    m.folha = typeof f === 'object' && f ? +f.folha || 0 : +f || 0;
    m.prolabore = typeof f === 'object' && f ? +f.prolabore || 0 : 0;
    m.baseInss = m.folha + m.prolabore;
    m.inss = m.folha * prem.encargos + m.prolabore * (prem.encargosPro == null ? prem.encargos : prem.encargosPro);
    m.compras = +r.compras || 0;
    m.iss = m.rec * prem.iss;
    m.icmsDeb = m.rec * prem.icms; m.icmsCred = m.compras * (prem.icmsCompras || 0); m.icms = m.icmsDeb - m.icmsCred;
    const parte = tri.rec > 0.004 ? m.rec / tri.rec : (tri.n ? 1 / tri.n : 0);
    ['acrescimo', 'baseIrpj', 'baseCsll', 'irpj', 'adicional', 'csll'].forEach(k => { m[k] = tri[k] * parte; });
    m.total = m.irpj + m.adicional + m.csll + m.cbs + m.iss + m.icms + m.inss;
    const fora = anexo === 'IV' ? m.inss : 0;
    m.conv = m.das + fora; m.hibr = m.hib + fora;
    return m;
  });
  return {q, ano, meses};
}
// folha dos meses salvos: só as linhas de despesa de cada mês (dados->monthly->ga), não o estado inteiro
async function carregarFolhas(a){
  const periodos = a.linhas.map(x => x.periodo);
  const lista = await sb(`competencias?select=periodo,ga:dados->monthly->ga&empresa_id=eq.${banco.empresaId}&periodo=in.(${periodos.join(',')})`) || [];
  // folhas[periodo] = {folha, prolabore}; linhas = cada despesa que entrou, com o valor de cada mês — é o que a
  // base de cálculo do INSS mostra aberta, para conferir o que o nome da linha puxou (ou deixou de puxar)
  const folhas = {}, porNome = new Map();
  lista.forEach(c => {
    const f = folhas[c.periodo] = {folha: 0, prolabore: 0};
    (Array.isArray(c.ga) ? c.ga : []).forEach(r => {
      const nome = String(r[0] || '').trim(), cat = categoriaFolha(nome), v = +r[1] || 0;
      if(!cat) return;
      f[cat] += v;
      if(!porNome.has(nome)) porNome.set(nome, {nome, cat, valores: {}});
      const l = porNome.get(nome); l.valores[c.periodo] = (l.valores[c.periodo] || 0) + v;
    });
  });
  if(banco.ano !== a) return;                        // trocou de empresa ou de ano enquanto buscava
  // linha zerada o ano todo não entra na conta nem na nota
  const linhas = [...porNome.values()].filter(l => Object.values(l.valores).some(v => v > 0.004));
  banco.presumido = {de: a, folhas, linhas, nomes: linhas.map(l => l.nome), carregando: false};
  render();
}
function garantirPresumido(){
  const a = banco.ano;
  if(!a || a.carregando || a.semFuncao || !a.linhas.length) return;
  if(banco.presumido && banco.presumido.de === a) return;
  banco.presumido = {de: a, folhas: {}, nomes: [], carregando: true};
  comErro(async () => {
    try { await carregarFolhas(a); }
    catch(e){ if(banco.presumido && banco.presumido.de === a){ banco.presumido = {de: a, erro: true}; render(); } throw e; }
  });
}
function garantirAno(recarregar){
  if(!banco.ativo || !banco.empresaId) return;
  const ano = anoCompetencia();
  if(!recarregar && banco.ano && banco.ano.ano === ano) return garantirPresumido();
  banco.ano = {ano, linhas: [], carregando: true};
  render();
  comErro(() => carregarAno(ano));
}
// CBS de um mês salvo: débito e crédito do próprio mês. Resumo antigo sem os dois (se o recálculo não veio) fica com
// o que foi pago, que era a conta de antes
const cbsDoMes = r => r.debito !== undefined
  ? {deb: +r.debito || 0, cred: +r.credito || 0, transp: +r.saldoAnterior || 0}
  : {deb: +r.cbs || 0, cred: 0, transp: 0};
function totaisAno(linhas){
  const t = {rec: 0, das: 0, cbs: 0, res: 0, custos: 0, ga: 0, vendas: 0, trib: 0, nat: 0, compras: 0, n: 0,
             deb: 0, cred: 0, transp: 0, pago: 0, semCbs: 0};
  (linhas || []).forEach(x => {
    const r = x.resumo;
    if(!r) return;
    const c = cbsDoMes(r);
    t.n++; t.rec += +r.receita || 0; t.das += +r.das || 0; t.res += +r.resultado || 0;
    t.custos += +r.custos || 0; t.ga += +r.ga || 0; t.vendas += +r.vendas || 0; t.trib += +r.trib || 0;
    t.compras += +r.compras || 0;
    t.deb += c.deb; t.cred += c.cred; t.transp += c.transp; t.pago += +r.cbs || 0;
    t.semCbs += (+r.naTransicao || 0) - (+r.cbs || 0);          // o híbrido sem a CBS: DAS sem a CBS e o IBS informado
  });
  // CBS do ano = débito menos crédito dos meses. Sobrando crédito, o ano não paga CBS e o saldo fica para o ano seguinte
  t.cbsLiq = t.deb - t.cred;
  t.cbs = Math.max(0, t.cbsLiq);
  t.credor = Math.max(0, -t.cbsLiq);
  t.nat = t.semCbs + t.cbs;
  return t;
}
// meses do exercício que ainda não têm competência salva, até o mês aberto
function mesesFaltando(linhas, ano){
  const tem = new Set((linhas || []).map(x => +x.periodo.slice(5, 7)));
  const ate = anoCompetencia() === ano ? +(lerPeriodo(S.mesLabel) || '').slice(5, 7) || 12 : 12;
  const falta = [];
  for(let m = 1; m <= ate; m++) if(!tem.has(m)) falta.push(MESES[m - 1].slice(0, 3).toLowerCase());
  return falta;
}
// duas leituras do exercício: o tamanho do ano e o que ele mostra (regime, faixa, sazonalidade)
function textoAno(t, linhas){
  const cem = v => dec(t.rec ? v / t.rec * 100 : 0, 2, 2);
  const p1 = `${t.n} ${t.n === 1 ? 'mês somado' : 'meses somados'}: receita de ${brl(t.rec)} e DAS de ${brl(t.das)} — alíquota efetiva média de ${cem(t.das)}%. Com as demais despesas tributárias, os tributos do ano somam ${brl(t.trib)}, ou ${cem(t.trib)}% da receita.`;
  const p = [];
  if(t.nat > 0.004){
    const dif = t.nat - t.das;
    p.push(Math.abs(dif) < 0.005 ? 'No acumulado do ano, os dois regimes empatam.'
      : dif > 0 ? `No acumulado do ano, o tradicional sai ${brl(dif)} mais barato que apurar a CBS por fora.`
                : `No acumulado do ano, apurar a CBS por fora sai ${brl(-dif)} mais barato que o tradicional.`);
  }
  const faixas = [...new Set((linhas || []).map(x => x.resumo && x.resumo.faixa).filter(Boolean))].sort();
  if(faixas.length === 1) p.push(`A empresa ficou na ${faixas[0]}ª faixa do Simples o ano todo.`);
  else if(faixas.length > 1) p.push(`A faixa do Simples foi da ${faixas[0]}ª à ${faixas[faixas.length - 1]}ª ao longo do ano.`);
  const comReceita = (linhas || []).filter(x => x.resumo && (+x.resumo.receita || 0) > 0.004);
  if(comReceita.length > 1){
    const ord = comReceita.slice().sort((a, b) => b.resumo.receita - a.resumo.receita), ultimo = ord[ord.length - 1];
    p.push(`O melhor mês em receita foi ${mesCurto(ord[0].periodo)}, com ${brl(ord[0].resumo.receita)}; o menor, ${mesCurto(ultimo.periodo)}, com ${brl(ultimo.resumo.receita)}.`);
  }
  return [p1, p.join(' ')];
}
const SUBLIMITE = 3600000;
// a receita do exercício contra o sublimite e o limite do Simples, pelo ritmo dos meses somados
function alertaLimite(t){
  const proj = t.n ? t.rec / t.n * 12 : 0;
  if(t.rec > LIMITE_SN) return `A receita do ano já passou de ${brl(LIMITE_SN)}: acima do limite do Simples Nacional.`;
  if(t.rec > SUBLIMITE) return `A receita do ano já passou do sublimite de ${brl(SUBLIMITE)}: ICMS e ISS passam a ser recolhidos fora do DAS.`;
  if(t.n >= 3 && proj > LIMITE_SN) return `No ritmo destes ${t.n} meses, o ano fecharia em ${brl(proj)} — acima do limite de ${brl(LIMITE_SN)} do Simples Nacional.`;
  if(t.n >= 3 && proj > SUBLIMITE) return `No ritmo destes ${t.n} meses, o ano fecharia em ${brl(proj)} — acima do sublimite de ${brl(SUBLIMITE)}, que tira ICMS e ISS do DAS.`;
  return '';
}
async function abrirMes(empresaId, periodo, op){
  op = op || {};
  const r = await sb('rpc/carregar_painel', {metodo: 'POST', corpo: {p_empresa_id: empresaId, p_periodo: periodo}});
  const cadeia = {fornecedores: [], clientes: []};
  (r.parceiros || []).forEach(p => cadeia[p[0] === 'cliente' ? 'clientes' : 'fornecedores'].push([p[1] || '', p[2] || '', p[3] || '', p[4] || '']));
  const novo = !r.competencia;
  banco.heranca = null; banco.ano = null; banco.hist = null;   // refeitos ao entrar na Visão geral ou na Anual
  // o último mês salvo antes deste (pode não ser o mês de calendário anterior: a tela diz qual é).
  // Salvo antes da migração do resumo, vem com os dados e é recalculado aqui
  const ant = r.anterior;
  banco.anterior = ant ? {periodo: ant.periodo, resumo: ant.resumo || (ant.dados ? resumoDe(prontoParaCalculo(ant.dados)) : null)} : null;
  if(!novo){
    S = mesclar(defaults(), migrar(r.competencia.dados)); S.cadeia = cadeia; normalizarLinhas(S.monthly.reforma);
    banco.base = r.competencia.atualizado_em;
  } else {
    // mês ainda não salvo: a tela atual (primeira empresa) ou o mês salvo mais próximo, com os valores zerados
    if(!op.manterTela){
      const h = op.heranca || HERANCA;
      S = r.modelo ? zerarValores(mesclar(defaults(), migrar(r.modelo)), h) : modeloEmBranco();
      S.cadeia = cadeia; normalizarLinhas(S.monthly.reforma);
      if(!r.modelo) S.anexo = '';                  // empresa nova: o anexo do exemplo não vale para ela
      S.mesLabel = rotuloMes(periodo);             // a herança calcula pelo ano desta competência
      await herdarDoAnterior(empresaId, periodo, r.anterior, h);
    }
    S.co = (banco.empresas.find(e => e.id === empresaId) || {}).nome || S.co;
    banco.base = '-infinity';                      // no banco, "este mês ainda não pode existir"
  }
  // catálogo é da empresa, não do mês (como a cadeia). Lista vazia no banco não apaga o que veio no
  // estado: pode ser um mês salvo antes da migração, e ele grava o catálogo no próximo salvamento.
  if(Array.isArray(r.produtos) && r.produtos.length)
    S.produtos = r.produtos.map(p => [p[0] || '', p[1] || 'geral', p[2] || '', p[3] || '', p[4] || '', p[5] || '']);
  S.mesLabel = rotuloMes(periodo);
  // fornecedores, clientes e catálogo como estão no banco: se a tela chegar sem eles ao salvar, é com estes que se pergunta
  banco.listas = {cadeia: JSON.parse(JSON.stringify(cadeia)),
                  produtos: Array.isArray(r.produtos) ? r.produtos.map(x => [x[0] || '', x[1] || 'geral', x[2] || '', x[3] || '', x[4] || '', x[5] || '']) : null};
  Object.assign(banco, {empresaId, periodo, erro: '', salvoEm: null, instantaneo: novo ? null : instantaneo()});
  guarda.gravar('dre.ultimo', {empresaId, periodo});
  ui.menu = false;
  render();
  if(novo && !op.semSalvar) await salvarBanco();
}

// Excluir a competência aberta: apaga do banco para toda a equipe, sem desfazer. A cadeia de
// crédito é da empresa (não do mês) e não é tocada.
async function excluirMes(){
  if(!banco.empresaId || !banco.periodo || !(banco.meses || []).includes(banco.periodo)) return;
  const empresa = (banco.empresas.find(e => e.id === banco.empresaId) || {}).nome || S.co, alvo = banco.periodo;
  const r = await modal({
    titulo: 'Excluir este mês',
    texto: `${empresa} · ${mesCurto(alvo)} sai da lista de meses de toda a equipe e vai para a lixeira, onde fica 30 dias (Opções → Lixeira).`,
    botoes: [['cancelar', 'Cancelar', 'prim'], ['excluir', 'Excluir o mês']],
    padrao: 'cancelar'
  });
  if(r.botao !== 'excluir'){ render(); return; }
  await sb(`competencias?empresa_id=eq.${encodeURIComponent(banco.empresaId)}&periodo=eq.${alvo}`, {metodo: 'DELETE'});
  banco.meses = banco.meses.filter(p => p !== alvo);
  banco.instantaneo = null;                        // o que está na tela deixou de ser um mês salvo
  toast(`${mesCurto(alvo)} excluído`);
  // abre o mês salvo mais recente; se não sobrou nenhum, o mês atual, sem gravar
  if(banco.meses.length) return abrirMes(banco.empresaId, banco.meses[0]);
  return abrirMes(banco.empresaId, periodoAtual(), {semSalvar: true});
}

async function salvarBanco(forcar){
  if(!banco.ativo){ toast('Banco de dados não configurado — veja "Banco de dados" no README.'); return; }
  if(!banco.sessao){ banco.aposLogin = () => salvarBanco(forcar); render(); return; }
  if(!banco.empresaId) return comErro(novaEmpresa);
  if(banco.salvando) return;
  const enviado = instantaneo(), dados = JSON.parse(enviado);
  const cadeia = dados.cadeia || {fornecedores: [], clientes: []}; delete dados.cadeia;
  const linha = tipo => r => [tipo, limpaCnpj(r[0]), r[1] || '', r[2] || '', r[3] || ''];
  const parceiros = cadeia.fornecedores.map(linha('fornecedor')).concat(cadeia.clientes.map(linha('cliente')));
  // trava: a tela chegou sem fornecedores/clientes ou sem produtos que a empresa tem no banco. Salvar trocaria a lista da
  // empresa — de todos os meses — pela vazia. Pergunta antes; o banco também recusa sem confirmação (migração de 16/09/2026)
  const salvas = banco.listas || {cadeia: {fornecedores: [], clientes: []}, produtos: null};
  const nParc = salvas.cadeia.fornecedores.length + salvas.cadeia.clientes.length, nProd = (salvas.produtos || []).length;
  const faltaParc = !parceiros.length && nParc > 0, faltaProd = !(dados.produtos || []).length && nProd > 0;
  let apagarListas = false;
  if(faltaParc || faltaProd){
    const oQue = [faltaParc && `${nParc} ${nParc === 1 ? 'fornecedor ou cliente' : 'fornecedores e clientes'}`,
                  faltaProd && `${nProd} ${nProd === 1 ? 'produto' : 'produtos'}`].filter(Boolean).join(' e ');
    const r = await modal({
      titulo: 'Faltam cadastros na tela',
      texto: `A empresa tem ${oQue} salvos que não estão na tela. Salvar assim apaga essa lista da empresa, que vale para todos os meses.`,
      botoes: [['cancelar', 'Cancelar'], ['apagar', 'Apagar e salvar'], ['manter', 'Manter os salvos', 'prim']], padrao: 'manter'
    });
    if(r.botao === 'cancelar'){ render(); return; }
    if(r.botao === 'manter'){
      if(faltaParc) S.cadeia = JSON.parse(JSON.stringify(salvas.cadeia));
      if(faltaProd) S.produtos = JSON.parse(JSON.stringify(salvas.produtos));
      render(); return salvarBanco(forcar);
    }
    apagarListas = true;
  }
  banco.salvando = true; banco.erro = ''; atualizarBarra();
  try{
    // p_resumo: os números do mês, para a herança e para a aba Anual. Banco ainda sem a migração
    // recusa o parâmetro — nesse caso salva sem ele e não tenta de novo nesta sessão.
    const corpo = {p_empresa_id: banco.empresaId, p_periodo: banco.periodo, p_dados: dados,
                   p_parceiros: parceiros, p_base: forcar ? null : banco.base};
    // o catálogo vai para a tabela da empresa e continua no estado do mês, que é o que vale
    // enquanto o banco não tiver a migração
    if(!banco.semResumo){ corpo.p_resumo = resumoDe(S); corpo.p_produtos = dados.produtos || []; }
    if(apagarListas) corpo.p_apagar_listas = true;
    try { banco.base = await sb('rpc/salvar_painel', {metodo: 'POST', corpo}); }
    catch(err){
      // CONFLITO também é 400, e antes caía aqui: o painel achava que o banco era antigo e parava de enviar o catálogo
      // pelo resto da sessão. Conflito vai direto para a janela de conflito.
      if(err.message === 'CONFLITO' || !(err.status === 404 || err.status === 400)) throw err;
      if(corpo.p_apagar_listas){                     // banco sem a migração de 16/09/2026: lá a lista vazia já apaga
        delete corpo.p_apagar_listas;
        banco.base = await sb('rpc/salvar_painel', {metodo: 'POST', corpo});
      } else {
        if(banco.semResumo) throw err;
        banco.semResumo = true; delete corpo.p_resumo; delete corpo.p_produtos;
        banco.base = await sb('rpc/salvar_painel', {metodo: 'POST', corpo});
      }
    }
    banco.instantaneo = enviado; banco.salvoEm = new Date(); banco.salvando = false;
    banco.listas = {cadeia: JSON.parse(JSON.stringify(S.cadeia || {fornecedores: [], clientes: []})),
                    produtos: JSON.parse(JSON.stringify(S.produtos || []))};
    const mesNovo = !banco.meses.includes(banco.periodo);
    if(mesNovo) banco.meses = banco.meses.concat(banco.periodo).sort().reverse();
    const emp = banco.empresas.find(e => e.id === banco.empresaId), nome = String(S.co || '').trim();
    const renomeou = !!(emp && nome && emp.nome !== nome);
    if(renomeou){ emp.nome = nome; banco.empresas.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')); }
    if(mesNovo || renomeou){ const foco = document.activeElement && document.activeElement.id; render(); if(foco) focar('#' + foco); }
    else atualizarBarra();
    banco.hist = null; banco.ano = null; garantirAnoDaTela();          // o mês salvo muda o ano: o gráfico e o selo pedem os números de novo
    toast('Salvo no banco de dados');
  }catch(e){
    banco.salvando = false;
    if(e.message === 'CONFLITO'){ atualizarBarra(); return resolverConflito(); }
    if(e.status === 401){
      banco.aposLogin = () => salvarBanco(forcar);
      banco.msgLogin = 'Sua sessão expirou. Entre de novo — o que você preencheu continua aqui.';
      render(); return;
    }
    banco.erro = e.message; atualizarBarra();
    toast('Não foi possível salvar: ' + e.message);
  }
}

async function trocar(tipo, valor){
  if(valor === '__nova__'){ render(); return comErro(tipo === 'empresa' ? novaEmpresa : novoMes); }

  // sem isto a tela congela até o banco responder, e parece que o clique não pegou

function escolherArquivo(aceita){ return new Promise(resolve => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = aceita; inp.style.display = 'none';
  inp.onchange = () => { resolve(inp.files && inp.files[0]); inp.remove(); };
  document.body.appendChild(inp); inp.click();

const lerBase64 = arquivo => new Promise((resolve, reject) => {
  const fr = new FileReader();
  fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
  fr.onerror = () => reject(new Error('não foi possível ler o arquivo'));
  fr.readAsDataURL(arquivo);
});
async function pedirLeitura(acao, arquivo){
  const base64 = await lerBase64(arquivo);
  const r = await fetch('/api/claude', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + await tokenValido()},
    body: JSON.stringify({acao, arquivo: {nome: arquivo.name, base64}})
  });
  const d = await r.json().catch(() => null);
  if(!r.ok) throw new Error((d && d.erro) || 'a leitura falhou');
  return d.dados;
}
// Compara o que o PGDAS declara com o que está lançado no mês aberto. Diferença de até R$ 1 passa (centavo de
// arredondamento não é divergência).
// atividades declaradas que dão para virar linha de receita: precisam de valor e de nome
function atividadesPgdas(d){
  return (d.atividades || []).filter(a => a && +a.receita > 0.004).map(a => {
    const st = !!a.icms_st, mono = !!a.monofasico;
    const sit = st && mono ? 'stmono' : st ? 'st' : mono ? 'mono' : a.iss_retido ? 'iss' : '';
    return {descricao: String(a.descricao || 'Receita declarada').trim(),
            anexo: ANEXOS[a.anexo] ? a.anexo : '', receita: +a.receita, sit,
            sitNome: (SITUACOES.find(x => x[0] === sit) || ['', ''])[1]};
  });
}
// O que a declaração pode preencher no mês aberto. Devolve a lista de campos aplicáveis (cada um com o valor e
// o motivo, quando não dá) — o mesmo cálculo serve para desenhar as caixas e para aplicar depois.
function camposPgdas(d){
  const c = calcMes(), campos = [];
  const debitos = S.monthly.reforma.debitos || [];
  const ativs = atividadesPgdas(d);
  if(d.receita_bruta_pa != null){
    // a receita do mês é a soma das linhas: a linha escolhida absorve a diferença para o total bater com a
    // declaração. Com uma linha só, ela recebe o total — a conta é a mesma.
    const soma = debitos.reduce((a, r) => a + (+r[1] || 0), 0);
    const opcoes = debitos.map((r, i) => ({v: String(i), nome: r[0] || `linha ${i + 1}`, hoje: +r[1] || 0,
                                           fica: d.receita_bruta_pa - (soma - (+r[1] || 0))}));
    campos.push({k: 'receita', rot: 'Receita do período', valor: d.receita_bruta_pa, impede: '',
      // com atividades declaradas a receita entra segregada — uma linha por atividade, cada uma no seu anexo.
      // O seletor só sobra quando a declaração não separa nada e o mês tem mais de uma linha.
      segregar: ativs.length ? ativs : null,
      opcoes: !ativs.length && opcoes.length > 1 ? opcoes : null,
      padrao: ativs.length ? 'seg' : (opcoes[0] ? opcoes[0].v : '0')});
  }
  if(d.das_total != null) campos.push({k: 'das', rot: 'DAS', valor: d.das_total, impede: ''});
  if(d.rbt12 != null) campos.push({k: 'rbt12', rot: 'Receita dos últimos 12 meses', valor: d.rbt12, impede: ''});
  const anexos = [...new Set(ativs.map(a => a.anexo).filter(Boolean))];
  if(anexos.length === 1 && anexos[0] !== S.anexo)
    campos.push({k: 'anexo', rot: 'Anexo', valor: anexos[0], impede: '', texto: true});
  return campos;
}
// Aplica no estado da tela o que foi marcado. Não salva: o painel fica "com alterações não salvas" e a pessoa
// confere antes de gravar.
function aplicarPgdas(d, marcados, linhaReceita){
  const feitos = [];
  const campos = camposPgdas(d).filter(x => !x.impede && marcados.includes(x.k));
  campos.forEach(x => {
    if(x.k === 'receita'){
      const deb = S.monthly.reforma.debitos, destino = linhaReceita != null ? String(linhaReceita) : String(x.padrao);
      if(destino === 'seg'){
        // uma linha por atividade, com o anexo de cada uma. A alíquota e o tipo da CBS saem da primeira linha
        // que já existia, para não perder a premissa do mês
        const modelo = deb[0] || ['', 0, S.monthly.reforma.aliqGeral || 0, 'geral'];
        S.monthly.reforma.debitos = atividadesPgdas(d).map(a =>
          [a.descricao, a.receita, modelo[2] || 0, modelo[3] || 'geral', '', a.sit, a.anexo || '']);
        feitos.push('receita segregada por atividade'); sincronizarReceita();
        return;                                       // o rótulo já foi anotado
      }
      if(!deb.length) deb.push(['Receita PGDAS', 0, S.monthly.reforma.aliqGeral || 0, 'geral', 'pgdas']);
      const i = Math.min(Math.max(0, +destino || 0), deb.length - 1);
      const soma = deb.reduce((a, r) => a + (+r[1] || 0), 0);
      deb[i][1] = x.valor - (soma - (+deb[i][1] || 0));   // a linha escolhida fecha o total
      sincronizarReceita();
    }
    if(x.k === 'das'){
      const trib = S.monthly.tributarias, atual = linhaSimples(trib);
      if(atual) atual[1] = x.valor; else trib.push(['Simples Nacional', x.valor]);
    }
    if(x.k === 'rbt12') S.monthly.rbt12 = x.valor;
    if(x.k === 'anexo') S.anexo = x.valor;
    feitos.push(x.rot.toLowerCase());
  });
  if(feitos.length){ render(); toast(`Preenchido: ${feitos.join(', ')} — confira e salve`); }
  return feitos.length;
}
function rComparaPgdas(d){
  const c = calcMes(), emp = banco.empresas.find(e => e.id === banco.empresaId) || {};
  const perto = (a, b) => Math.abs((+a || 0) - (+b || 0)) <= 1;
  const mesDoc = d.competencia ? String(d.competencia).slice(0, 7) : null;
  const mesTela = (banco.periodo || '').slice(0, 7);
  const mesmoMes = !!mesDoc && mesDoc === mesTela;
  const mesmaEmpresa = !d.cnpj || !emp.cnpj || limpaCnpj(d.cnpj) === limpaCnpj(emp.cnpj);

  // competência e CNPJ não precisam de linha na tabela: viram o contexto do documento, com aviso quando divergem
  const contexto = [mesDoc ? rotuloMes(mesDoc + '-01') : 'sem competência', d.cnpj ? fmtCnpj(d.cnpj) : null]
    .filter(Boolean).join(' · ');
  const alerta = !mesmoMes ? `é de outro mês — a tela está em ${mesTela ? rotuloMes(mesTela + '-01') : '—'}`
    : !mesmaEmpresa ? 'é de outra empresa' : '';

  // --- a tabela: só o que tem número
  const linhas = [];
  const linha = (rot, doDoc, doPainel, ok, dif) => linhas.push({rot, doDoc, doPainel, ok, dif: dif || '—'});
  const okReceita = d.receita_bruta_pa != null && perto(d.receita_bruta_pa, c.R);
  linha('Receita', d.receita_bruta_pa != null ? brl(d.receita_bruta_pa) : '—', brl(c.R), okReceita,
        d.receita_bruta_pa == null ? 'não veio' : okReceita ? '' : brl(Math.abs(d.receita_bruta_pa - c.R)));
  const dasLancado = c.simplesDeclarado > 0.004 ? c.simplesDeclarado : c.dasCalculado;
  const okDas = d.das_total != null && perto(d.das_total, dasLancado);
  linha('DAS', d.das_total != null ? brl(d.das_total) : '—',
        `${brl(dasLancado)} <span class="pg-onde">${c.simplesDeclarado > 0.004 ? 'lançado' : 'calculado'}</span>`, okDas,
        d.das_total == null ? 'não veio' : okDas ? '' : brl(Math.abs(d.das_total - dasLancado)));
  const rbtTela = +S.monthly.rbt12 || 0;
  if(d.rbt12 != null || rbtTela){
    const okRbt = d.rbt12 != null && perto(d.rbt12, rbtTela);
    linha('Receita 12 meses', d.rbt12 != null ? brl(d.rbt12) : '—', brl(rbtTela), okRbt,
          d.rbt12 == null ? 'não veio' : okRbt ? '' : brl(Math.abs(d.rbt12 - rbtTela)));
  }
  const pendentes = linhas.filter(x => !x.ok).length + (alerta ? 1 : 0);
  const tabela = linhas.map(x => `<div class="pg-linha${x.ok ? '' : ' difere'}">
      <span class="pg-rot"><i class="pg-marca">${x.ok ? '✓' : '!'}</i>${x.rot}</span>
      <span class="pg-doc">${x.doDoc}</span>
      <span class="pg-painel">${x.doPainel}</span>
      <span class="pg-dif">${x.dif}</span>
    </div>`).join('');

  const ativs = (d.atividades || []).filter(a => a && (a.descricao || a.receita != null));
  const atividades = ativs.length ? `<div class="pg-bloco">
      <span class="cap">Atividades declaradas</span>
      ${ativs.map(a => `<div class="pg-ativ"><span>${esc(a.descricao || '—')}${a.anexo ? ` · Anexo ${esc(a.anexo)}` : ''}</span>` +
        `<span class="v">${a.receita != null ? brl(a.receita) : '—'}${a.aliquota_efetiva != null ? ` · ${dec(a.aliquota_efetiva, 2, 2)}%` : ''}</span></div>`).join('')}
    </div>` : '';

  // --- preencher: caixa, campo, valor. O destino só aparece quando há escolha a fazer (linha de receita).
  const campos = mesmoMes && mesmaEmpresa ? camposPgdas(d) : [];
  const itens = campos.map(campo => {
    const valor = campo.k === 'anexo' ? `Anexo ${esc(campo.valor)} (hoje ${esc(S.anexo || '—')})` : brl(campo.valor);
    const seletor = campo.segregar
      ? `<span class="pg-dest-txt">${campo.segregar.length === 1 ? 'em 1 linha' : `em ${campo.segregar.length} linhas`}: ` +
        campo.segregar.map(a => `${esc(a.descricao)}${a.anexo ? ` <b>${esc(a.anexo)}</b>` : ''}` +
          `${a.sit ? ` <b>${esc(a.sitNome)}</b>` : ''} ${brl(a.receita)}`).join(' · ') + `</span>`
      : campo.opcoes
      ? `<select class="pg-dest" name="pg_linha" aria-label="Onde entra a receita">${campo.opcoes.map(o =>
          `<option value="${o.v}"${o.fica < 0 ? ' disabled' : ''}${o.v === String(campo.padrao) ? ' selected' : ''}>` +
          `${esc(o.nome)}: ${brl(o.hoje)} → ${o.fica < 0 ? 'negativa' : brl(o.fica)}</option>`).join('')}</select>`
      : '';
    return `<label class="pg-item"><input type="checkbox" name="pg_${campo.k}" checked>
      <span class="pg-item-rot">${campo.rot}</span><span class="pg-item-v">${valor}</span>${seletor}</label>`;
  }).join('');
  const aplicar = campos.length ? `<div class="pg-bloco aplicar">
      <span class="cap">Preencher o mês <small>nada é gravado até você salvar</small></span>${itens}</div>` : '';

  return `<div class="pg">
    <p class="pg-ctx${alerta ? ' alerta' : ''}">${esc(contexto)}${alerta ? ` — ${esc(alerta)}` : ''}</p>
    <p class="sub">${pendentes ? `${pendentes} ${pendentes === 1 ? 'ponto não bate' : 'pontos não batem'} com o que está lançado.`
                               : 'Tudo o que dá para comparar bate com o que está lançado.'}</p>
    <div class="pg-cab"><span></span><span>Declaração</span><span>Painel</span><span>Diferença</span></div>
    ${tabela}
    ${atividades}
    ${aplicar}
    ${d.observacoes ? `<p class="nota">${esc(d.observacoes)}</p>` : ''}
  </div>`;
}
// o que o formulário da janela devolve: as caixas marcadas viram a lista de campos (pg_linha é o seletor)

async function conferirPgdas(){
  if(!leituraDisponivel()) return toast('A leitura de documentos só funciona no painel publicado, com sessão aberta.');
  const arquivo = await escolherArquivo('.pdf,.png,.jpg,.jpeg,.webp');
  if(!arquivo) { render(); return; }
  ocupado(true);
  let dados;
  try { dados = await pedirLeitura('pgdas', arquivo); }
  catch(e){ ocupado(false); render(); return toast('Não deu para ler: ' + e.message); }
  ocupado(false);
  const temCampos = () => {
    const mesDoc = dados.competencia ? String(dados.competencia).slice(0, 7) : null;
    const emp = banco.empresas.find(e => e.id === banco.empresaId) || {};
    const mesmaEmpresa = !dados.cnpj || !emp.cnpj || limpaCnpj(dados.cnpj) === limpaCnpj(emp.cnpj);
    return mesDoc === (banco.periodo || '').slice(0, 7) && mesmaEmpresa && camposPgdas(dados).some(x => !x.impede);
  };
  const r = await modal({titulo: 'PGDAS × o que está lançado', html: rComparaPgdas(dados),
    botoes: temCampos() ? [['fechar', 'Fechar'], ['preencher', 'Preencher o mês', 'prim']]
                        : [['fechar', 'Fechar', 'prim']],
    padrao: 'fechar'});
  if(r.botao === 'preencher'){
    if(!aplicarPgdas(dados, marcadosPgdas(r.valores), r.valores.pg_linha)) toast('Nada marcado para preencher');
    return;
  }
  render();
}
async function copiarEmpresa(){
  if(!banco.ativo || !banco.empresaId) return;
  if(!(await podeSair())){ render(); return; }     // o que se copia é o que está salvo
  const atual = banco.empresas.find(e => e.id === banco.empresaId) || {};
  const origem = atual.nome || S.co || 'Empresa', quantos = (banco.meses || []).length;
  let valores = {nome: `${origem} (cópia)`, cnpj: ''};
  let erro = '';
  for(;;){
    const r = await modal({
      titulo: 'Copiar esta empresa',
      texto: `A empresa nova começa igual a ${origem}: categorias, alíquotas, premissas, cadeia de crédito, ` +
        `produtos e ${quantos ? (quantos === 1 ? 'o mês salvo' : `os ${quantos} meses salvos`) : 'o mês que está na tela'}.`,
      campos: [['nome', 'Nome da empresa nova', valores.nome], ['cnpj', 'CNPJ (opcional)', valores.cnpj]],
      erro, botoes: [['cancelar', 'Cancelar'], ['copiar', 'Copiar empresa', 'prim']], padrao: 'copiar'
    });
    if(r.botao !== 'copiar'){ render(); return; }
    valores = r.valores;
    const nome = (valores.nome || '').trim(), cnpj = limpaCnpj(valores.cnpj);
    erro = !nome ? 'Informe o nome da empresa.'
      : cnpj && !cnpjValido(cnpj) ? 'CNPJ inválido — confira os números.' : '';
    if(erro) continue;
    let empresa;
    try{
      [empresa] = await sb('empresas?select=id,nome,cnpj', {metodo: 'POST', corpo: {nome, cnpj: cnpj || null}, prefer: 'return=representation'}) || [];
      if(!empresa || !empresa.id) throw new Error('o banco não devolveu a empresa criada');
    }catch(e){
      if(e.status === 401) throw e;
      erro = e.status === 409 ? 'Já existe uma empresa com esse CNPJ.' : 'Não foi possível copiar: ' + e.message;
      continue;
    }
    ocupado(true);
    try{
      // 1) o mês da tela, pelo caminho normal: é ele que grava a cadeia de crédito e o catálogo de produtos.
      // A cadeia vai em p_parceiros, no mesmo formato do salvamento de sempre (a tabela é por empresa).
      const dados = JSON.parse(JSON.stringify(S));
      dados.co = nome;
      const cadeia = dados.cadeia || {fornecedores: [], clientes: []}; delete dados.cadeia;
      const linha = tipo => r => [tipo, limpaCnpj(r[0]), r[1] || '', r[2] || '', r[3] || ''];
      const periodo = banco.periodo || periodoAtual();
      const corpo = {p_empresa_id: empresa.id, p_periodo: periodo, p_dados: dados, p_base: null,
                     p_parceiros: cadeia.fornecedores.map(linha('fornecedor')).concat(cadeia.clientes.map(linha('cliente')))};
      if(!banco.semResumo){ corpo.p_resumo = resumoDe(dados); corpo.p_produtos = dados.produtos || []; }
      try { await sb('rpc/salvar_painel', {metodo: 'POST', corpo}); }
      catch(err){
        if(!(err.status === 404 || err.status === 400)) throw err;
        delete corpo.p_resumo; delete corpo.p_produtos;
        await sb('rpc/salvar_painel', {metodo: 'POST', corpo});
      }
      // 2) os outros meses, copiados como estão no banco
      const outros = (await sb(`competencias?select=periodo,dados,resumo&empresa_id=eq.${encodeURIComponent(banco.empresaId)}` +
        `&periodo=neq.${periodo}`) || []);
      if(outros.length) await sb('competencias', {metodo: 'POST', corpo: outros.map(c => ({
        empresa_id: empresa.id, periodo: c.periodo,
        dados: Object.assign({}, c.dados, {co: nome}), resumo: c.resumo || null}))});
      banco.empresas = banco.empresas.concat(empresa).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      banco.meses = [];
      toast(`${nome} criada a partir de ${origem}`);
      return abrirEmpresa(empresa.id, periodo);
    } finally { ocupado(false); }
  }
}
// Excluir a empresa aberta: some para a equipe toda, com os cadastros. Os meses caem na lixeira pelo gatilho do
// banco e ficam 30 dias lá, mas só dá para restaurar depois de recriar a empresa — por isso a confirmação pede
// o nome digitado, e não um simples "ok".
async function excluirEmpresa(){
  if(!banco.ativo || !banco.empresaId) return;
  const emp = banco.empresas.find(e => e.id === banco.empresaId) || {};
  const nome = emp.nome || S.co || 'esta empresa', meses = (banco.meses || []).length;
  let erro = '';
  for(;;){
    const r = await modal({
      titulo: 'Excluir esta empresa',
      texto: `${nome} sai da lista de toda a equipe, com a cadeia de crédito e os produtos. ` +
        (meses ? `${meses} ${meses === 1 ? 'mês salvo vai' : 'meses salvos vão'} para a lixeira, onde ${meses === 1 ? 'fica' : 'ficam'} 30 dias. `
               : 'Nenhum mês está salvo. ') +
        'Para confirmar, digite o nome da empresa.',
      campos: [['nome', 'Nome da empresa', '']],
      erro, botoes: [['cancelar', 'Cancelar', 'prim'], ['excluir', 'Excluir empresa']], padrao: 'cancelar'
    });
    if(r.botao !== 'excluir'){ render(); return; }
    if((r.valores.nome || '').trim().toLowerCase() !== String(nome).trim().toLowerCase()){
      erro = 'O nome não confere — digite exatamente como está na lista.';
      continue;
    }
    await sb(`empresas?id=eq.${encodeURIComponent(banco.empresaId)}`, {metodo: 'DELETE'});
    banco.empresas = banco.empresas.filter(e => e.id !== banco.empresaId);
    banco.meses = []; banco.instantaneo = null; banco.hist = null; banco.ano = null;
    toast(`${nome} excluída`);
    if(!banco.empresas.length) return novaEmpresa();
    return abrirEmpresa(banco.empresas[0].id);
  }
}

// regra de crédito da despesa: "sem crédito" tira a linha das premissas; passar a ter crédito entra pela alíquota geral
async function aplicarRegra(i, valor, grupo){
  grupo = grupo || 'ga';                             // despesas gerais ou compras do mês
  const r = S.monthly[grupo][i];
  let parte = +valor;
  if(valor === 'outra'){
    const res = await modal({
      titulo: 'Outra regra de crédito', texto: `Quanto do valor de "${r[0]}" dá direito a crédito de CBS.`,
      campos: [['parte', 'Parte com crédito (%)', dec((+r[2] || 0) * 100, 0, 2)]],
      botoes: [['cancelar', 'Cancelar'], ['ok', 'Aplicar', 'prim']], padrao: 'ok'
    });
    if(res.botao !== 'ok'){ render(); focar(`select[data-regra="${grupo}"][data-i="${i}"]`); return; }
    parte = Math.max(0, Math.min(1, num(res.valores.parte) / 100));
  }
  r[2] = parte;
  if(parte === 0) r[3] = 0;
  else if(!((+r[3] || 0) > 0)) r[3] = grupo === 'compras' ? S.monthly.reforma.aliqCompras : S.monthly.reforma.aliqGeral;
  render(); focar(`select[data-regra="${grupo}"][data-i="${i}"]`);
}

// Imprimir / PDF: pergunta quanto sai no papel e abre (ou fecha) as seções só durante a impressão — a tela volta
// como estava. Ctrl+P imprime a tela do jeito que está, com a mesma folha e o mesmo rodapé
const IMPRESSAO = {
  resultado: ['Lançamento', 'DRE, Simples, estoque, CBS e o quadro dos dois regimes, sem abrir as linhas.',
    'Com as linhas de receita e despesas, as compras, a posição de estoque e a memória de cálculo da CBS.'],
  anual: ['Anual', 'O ano somado pelos meses salvos e os cartões do Lucro Presumido.',
    'Com a apuração do Lucro Presumido por trimestre, em resumo.',
    'A mesma apuração com uma coluna por mês salvo — em folha deitada, que é o que comporta doze colunas.'],
  cliente: ['Resumo do cliente', 'Os gráficos da cadeia de crédito e dos produtos.', 'Com as tabelas de cadastro de fornecedores (ou clientes) e de produtos.'],
};
async function imprimir(){
  ui.menu = false; ui.armado = false; render();
  const [aba, totais, completo, mensal] = IMPRESSAO[ui.tab];
  const aberto = ui.tab === 'cliente' ? ui.cadastro.cadeia || ui.cadastro.produtos
    : ui.detalhe || (ui.tab === 'resultado' && (ui.memoria || ui.estoque)) || (ui.tab === 'anual' && ui.presumido);
  // a aba Anual ganha a terceira escolha quando há tabela do Presumido para imprimir mês a mês
  const temMensal = !!mensal && ui.tab === 'anual' && !!(banco.presumido && banco.presumido.de === banco.ano);
  const {botao} = await modal({titulo: 'Imprimir ou salvar em PDF', texto: `Aba ${aba}. O que deve sair no papel?`,
    html: `<div class="imp-opcoes"><p><b>Só os totais</b>${esc(totais)}</p><p><b>Com o detalhamento</b>${esc(completo)}</p>` +
      (temMensal ? `<p><b>Mês a mês</b>${esc(mensal)}</p>` : '') + `</div>`,
    botoes: [['cancelar', 'Cancelar'], ['totais', 'Só os totais', aberto ? '' : 'prim'],
      ['completo', 'Com o detalhamento', aberto && !ui.lpMes ? 'prim' : '']]
      .concat(temMensal ? [['mensal', 'Mês a mês', aberto && ui.lpMes ? 'prim' : '']] : []),
    padrao: !aberto ? 'totais' : ui.lpMes && temMensal ? 'mensal' : 'completo'});
  if(botao !== 'totais' && botao !== 'completo' && botao !== 'mensal') return;
  // no papel a tabela do Presumido sai por trimestre e em resumo: doze colunas de mês não cabem em A4 e a
  // tabela saía cortada. Os dois cenários do Simples ficam, e as colunas sem movimento não voltam
  const antes = {detalhe: ui.detalhe, memoria: ui.memoria, estoque: ui.estoque, presumido: ui.presumido,
    lpCenario: ui.lpCenario, lpResumo: ui.lpResumo, lpVazias: ui.lpVazias, lpMes: ui.lpMes,
    papelDeitado: ui.papelDeitado, cadastro: {...ui.cadastro}};
  ui.lpCenario = 'ambos'; ui.lpResumo = true; ui.lpVazias = false; ui.lpMes = botao === 'mensal';
  ui.papelDeitado = botao === 'mensal';          // treze colunas só cabem em folha deitada (ver prepararFolha)
  const tudo = botao === 'completo' || botao === 'mensal';
  if(ui.tab === 'cliente') ui.cadastro = {cadeia: tudo, produtos: tudo};
  else {
    ui.detalhe = tudo;
    if(ui.tab === 'resultado'){ ui.memoria = tudo; ui.estoque = tudo; }
    if(ui.tab === 'anual') ui.presumido = tudo;
  }
  render();
  addEventListener('afterprint', () => { Object.assign(ui, antes); render(); }, {once: true});
  setTimeout(() => window.print(), 50);
}
// a folha: rodapé em toda página, data de emissão no cabeçalho e o título, que o Chrome usa como nome do PDF

    'emitido em ' + dataHora(Date.now()).replace(', ', ' às ')].join(' · ');
  const aspas = s => '"' + String(s || '').replace(/\s+/g, ' ').replace(/[\\"]/g, '\\$&') + '"';
  const caixa = 'font-family:"IBM Plex Mono",monospace; font-size:8pt; color:#8A8D94';
  let st = document.getElementById('estilo-folha');
  if(!st){ st = document.createElement('style'); st.id = 'estilo-folha'; document.head.appendChild(st); }

  // imprime quando "Cabeçalhos e rodapés" está ligado no diálogo
  st.textContent = `@page{size:A4 ${ui.papelDeitado ? 'landscape' : 'portrait'};
    @top-left{content:${aspas([S.co, rotulo].filter(Boolean).join(' · '))}; ${caixa}} @top-right{content:""}
    @bottom-left{content:${aspas(S.footer)}; ${caixa}}
    @bottom-right{content:"Página " counter(page) " de " counter(pages); ${caixa}}}
  @page:first{@top-left{content:""}}`;
  tituloAntesDeImprimir = document.title;
  document.title = [S.co, (ui.tab === 'cliente' ? 'Resumo do cliente ' : 'DRE ') + periodo].filter(Boolean).join(' — ').replace(/[\\/:*?"<>|]/g, '-');
}
// campo de texto não quebra linha e corta o nome comprido ("Manutenção, dedetização, equ"): durante a impressão
// cada nome ganha uma cópia em texto comum, que o CSS mostra no lugar do campo
function nomesNoPapel(sim){
  app.querySelectorAll('.in-papel').forEach(s => s.remove());
  app.querySelectorAll('input.in.txt').forEach(el => {
    el.classList.toggle('so-tela', sim);
    if(sim){ const s = document.createElement('span'); s.className = 'in-papel so-papel'; s.textContent = el.value; el.after(s); }
  });
}
// papel é claro: imprimir no modo noturno gastaria tinta e sairia ilegível. Volta ao escuro depois
let temaAntesDeImprimir = false, tituloAntesDeImprimir = '';
addEventListener('beforeprint', () => {
  if(temaEscuro()){ temaAntesDeImprimir = true; aplicarTema('claro'); refresh(); }
  prepararFolha();                                   // depois do refresh(), que escreveria o título da tela por cima
  nomesNoPapel(true);
});
addEventListener('afterprint', () => {
  nomesNoPapel(false);
  if(temaAntesDeImprimir){ temaAntesDeImprimir = false; aplicarTema('escuro'); refresh(); }
  if(tituloAntesDeImprimir){ document.title = tituloAntesDeImprimir; tituloAntesDeImprimir = ''; }
});
window.addEventListener('beforeunload', e => { if(sujo()){ e.preventDefault(); e.returnValue = ''; } });
// tela cheia pelo botão ou saindo pelo Esc: só o rótulo do botão muda, sem redesenhar a tela
document.addEventListener('fullscreenchange', () => {
  const b = app.querySelector('[data-act="tela-cheia"]');
  if(b) b.textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia';
});

/* ---------- início ---------- */
let S = defaults();
// cadastro: as tabelas da aba do cliente começam recolhidas — ali o gráfico é que conversa
const ui = {tab: 'visao', detalhe: false, estoque: false, memoria: false, cadeia: 'fornecedores', cadastro: {cadeia: false, produtos: false}, presumido: false, inssBase: false, cbsLP: false, icmsLP: false, latFina: false, latAberta: false, selo: false, termo: null, janela: 12, mesSel: null, lpCenario: 'ambos', lpResumo: true, lpVazias: false, lpMenu: false, papelDeitado: false, cbsAno: false, lpMes: false, editando: false, menu: false, personalizar: false, present: false, client: false, armado: false};
if(/cliente|apresentar/i.test(location.hash)){ ui.present = true; ui.client = true; ui.tab = 'cliente'; }
(async function(){
  await carregar();
  if(banco.ativo){ banco.sessao = guarda.ler('dre.sessao'); if(banco.sessao) return carregarDoBanco(); }
  render();
})();
</script>
